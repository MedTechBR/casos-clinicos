<script type="application/json" id="dados">{"caso": {"titulo": "Os passos de volta", "slug": "os-passos-de-volta", "cor": "#4338ca", "rodape": "Paciente ficcional · evolução simulada para ensino · versão de 27/10 18:17", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "Os passos de volta", "fundo": "cena.png", "kicker": "Caso interativo", "selo": "Paciente ficcional · fontes na última tela", "proc": ""}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Antônio, motorista aposentado de 61 anos, chega porque precisou parar duas vezes ao atravessar o estacionamento. Há quatro meses se cansa cada vez mais ao caminhar. Nas últimas duas semanas passou a sentir o coração acelerar durante o banho. Perdeu 4 kg, com pouco apetite, sem febre ou suor noturno.<\/p><p>A esposa percebeu palidez e olhos levemente amarelados. Ele nega fezes escuras, sangue nas fezes ou na urina, vômitos e dor torácica. Há dois meses sente os pés dormentes e tropeça no escuro. Atribuiu isso à coluna e deixou de fazer caminhadas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Antecedentes", "tt": "", "corpo": "<div class=\"tops\"><div><b>Doenças e procedimentos<\/b><p>Hipertensão controlada. Sem doença renal, cirurgia gástrica ou intestinal. Não há hemograma recente; o último, de três anos atrás, era normal.<\/p><\/div><div><b>Medicamentos<\/b><p>Losartana 50 mg/dia e omeprazol 20 mg/dia por conta própria há cinco anos. Não usa anticoagulante, quimioterápico ou suplemento vitamínico.<\/p><\/div><div><b>Alimentação e hábitos<\/b><p>Come carne, ovos e laticínios regularmente. Consome duas cervejas aos domingos. Nega outras drogas e exposição ocupacional recente.<\/p><\/div><div><b>Família<\/b><p>Irmã com tireoidite autoimune. Não há doença hematológica conhecida. Mora com a esposa e tem acesso a uma unidade básica de saúde.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div><b>36,7 °C<\/b><span>Temperatura<\/span><\/div><div><b>118/72 mmHg<\/b><span>Pressão arterial<\/span><\/div><div class=alt><b>108 bpm<\/b><span>Pulso<\/span><\/div><div><b>20 irpm<\/b><span>Frequência respiratória<\/span><\/div><div><b>98% em ar ambiente<\/b><span>SpO₂<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral e pele<\/b><p>Lúcido, palidez acentuada e discreta icterícia nas escleras. Sem petéquias ou sangramento ativo.<\/p><\/div><div><b>Cardiopulmonar<\/b><p>Ritmo regular e sopro sistólico suave. Pulmões sem estertores; sem edema ou turgência jugular.<\/p><\/div><div><b>Abdome e linfonodos<\/b><p>Sem dor, aumento palpável do fígado ou baço e sem linfonodos aumentados.<\/p><\/div><div><b>Neurológico<\/b><p>Força preservada. Sensibilidade vibratória reduzida nos pés; perde equilíbrio ao fechar os olhos. Não há confusão ou déficit focal.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "resultados", "k": "rotina", "kicker": "Na admissão", "tt": "Exames iniciais", "de": "", "fundo": "", "intro": "O laboratório solicita revisão da lâmina pela presença de fragmentos de hemácias. Não há hemograma anterior próximo para comparação.", "nota": "", "laminas": {}, "todos": ["Hemoglobina / hematócrito", "VCM", "Leucócitos / neutrófilos", "Plaquetas", "Creatinina / potássio", "Bilirrubina total / indireta", "INR / fibrinogênio"], "sobre": {"Hemoglobina / hematócrito": {"n": "Hemoglobina / hematócrito", "r": "5,1 g/dL / 15,3%", "ref": "13,5–17,5 g/dL / 40–52%", "a": 1}, "VCM": {"n": "VCM", "r": "101 fL", "ref": "80–100 fL", "a": 1}, "Leucócitos / neutrófilos": {"n": "Leucócitos / neutrófilos", "r": "1.900 / 1.050 por mm³", "ref": "4.000–11.000 / acima de 1.500", "a": 1}, "Plaquetas": {"n": "Plaquetas", "r": "41.000/mm³", "ref": "150.000–450.000/mm³", "a": 1}, "Creatinina / potássio": {"n": "Creatinina / potássio", "r": "0,9 mg/dL / 4,1 mmol/L", "ref": "0,7–1,3 / 3,5–5,0", "a": 0}, "Bilirrubina total / indireta": {"n": "Bilirrubina total / indireta", "r": "2,2 / 1,7 mg/dL", "ref": "até 1,2 / até 0,8", "a": 1}, "INR / fibrinogênio": {"n": "INR / fibrinogênio", "r": "1,1 / 320 mg/dL", "ref": "0,9–1,2 / 200–400", "a": 0}}, "rota": null}, {"t": "pagina", "k": "suporte", "kicker": "Primeiras medidas", "tt": "", "corpo": "<p>Antônio permanece internado. Recebe uma unidade de concentrado de hemácias, lentamente, com reavaliação de sintomas e de congestão. Depois, a equipe indica outra unidade porque mantém dispneia aos mínimos esforços. Não recebe plaquetas apenas pelo número, na ausência de sangramento.<\/p><p>Antes de qualquer plasma, são reservadas amostras para esclarecer a anemia. A hematologia é contatada ainda na avaliação inicial; transfusão e investigação ocorrem em paralelo.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q1", "kicker": "Pergunta 1", "enunciado": "Quais três exames mais ajudam a esclarecer o mecanismo da anemia?", "alts": [{"t": "Revisão do esfregaço periférico", "c": "", "ok": 1}, {"t": "LDH", "c": "", "ok": 1}, {"t": "Contagem de reticulócitos", "c": "", "ok": 1}, {"t": "Eletroforese de hemoglobina", "c": "", "ok": 0}, {"t": "Ferritina como único exame adicional", "c": "", "ok": 0}, {"t": "Sangue oculto nas fezes como primeira explicação", "c": "", "ok": 0}], "escolhas": 3, "fundo": "", "exp": [{"h": "Produção e destruição", "t": "Reticulócitos avaliam a resposta da medula; LDH integra a investigação de destruição celular, sem localizar onde ela ocorre. A lâmina pode mostrar fragmentação, alterações de maturação ou células anormais."}, {"h": "Comparar mecanismos", "t": "Sangramento e carência de ferro continuam possíveis em outros contextos, mas não explicam bem as três linhagens baixas e a icterícia. Eletroforese tem menor rendimento sem história compatível. Também foram solicitados bilirrubinas, haptoglobina e teste de antiglobulina."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "fragmentos", "kicker": "Discussão de imagem", "tt": "Esfregaço de sangue periférico", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:2\"><div class=\"vv-est-txt\"><p>A revisão inicial confirma hemácias de formas variadas. Descreva o campo antes de abrir os achados.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><li data-n=\"1\" style=\"--n:0\"><span class=\"vv-num\">1<\/span><div><p>Hemácia fragmentada, com contorno em <b>capacete<\/b>.<\/p><\/div><\/li><li data-n=\"2\" style=\"--n:1\"><span class=\"vv-num\">2<\/span><div><p>Outro fragmento irregular entre hemácias de tamanhos diferentes.<\/p><\/div><\/li><\/ol><div class=\"vv-laudo\" style=\"--q:2\"><b>Laudo<\/b><p>Há fragmentos de hemácias e variação de forma e tamanho.<\/p><p>Fragmentação pode acompanhar microangiopatia, mas não estabelece sua causa. A lâmina precisa ser integrada à resposta medular, às plaquetas e à evolução.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 818.2\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"esquizocitos.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"818.2\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><g class=\"sa\" data-n=\"1\" style=\"--i:0;--L:249\"><path class=\"fio halo\" d=\"M175.0 720.0 Q251.2 669.2 331.9 642.1\"/><path class=\"fio luz\" d=\"M175.0 720.0 Q251.2 669.2 331.9 642.1\"/><g transform=\"translate(331.9 642.1) rotate(-18.9)\"><path class=\"ponta\" d=\"M0 0 L-27 11 L-27 -11 Z\"/><\/g><circle class=\"bd\" cx=\"175.0\" cy=\"720.0\" r=\"25\"/><text class=\"rot\" x=\"175.0\" y=\"720.0\" text-anchor=\"middle\" dominant-baseline=\"central\">1<\/text><\/g><g class=\"sa\" data-n=\"2\" style=\"--i:1;--L:279\"><path class=\"fio halo\" d=\"M725.0 736.0 Q631.7 688.3 537.1 664.8\"/><path class=\"fio luz\" d=\"M725.0 736.0 Q631.7 688.3 537.1 664.8\"/><g transform=\"translate(537.1 664.8) rotate(-165.8)\"><path class=\"ponta\" d=\"M0 0 L-27 11 L-27 -11 Z\"/><\/g><circle class=\"bd\" cx=\"725.0\" cy=\"736.0\" r=\"25\"/><text class=\"rot\" x=\"725.0\" y=\"736.0\" text-anchor=\"middle\" dominant-baseline=\"central\">2<\/text><\/g><\/g><\/svg><figcaption>Morfologia das hemácias.<span class=\"cr\">Osaro Erhabor · Wikimedia Commons · CC0 · setas adicionadas<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "resultados", "k": "hemolise", "kicker": "Complementação", "tt": "Resultados da investigação", "de": "", "fundo": "", "intro": "Reticulócitos e marcadores foram colhidos antes das transfusões. Creatinina e exame neurológico focal permanecem sem alterações.", "nota": "", "laminas": {}, "todos": ["LDH", "Haptoglobina", "Reticulócitos", "Antiglobulina direta (Coombs)", "Esfregaço, avaliação inicial", "Hemoglobina após transfusão"], "sobre": {"LDH": {"n": "LDH", "r": "8.900 U/L", "ref": "120–250 U/L", "a": 1}, "Haptoglobina": {"n": "Haptoglobina", "r": "Abaixo de 10 mg/dL", "ref": "30–200 mg/dL", "a": 1}, "Reticulócitos": {"n": "Reticulócitos", "r": "0,6% · contagem absoluta 9.000/µL", "ref": "25.000–100.000/µL", "a": 1}, "Antiglobulina direta (Coombs)": {"n": "Antiglobulina direta (Coombs)", "r": "Negativa", "ref": "negativa", "a": 0}, "Esfregaço, avaliação inicial": {"n": "Esfregaço, avaliação inicial", "r": "Fragmentos presentes; sem blastos identificados", "ref": "—", "a": 0}, "Hemoglobina após transfusão": {"n": "Hemoglobina após transfusão", "r": "7,0 g/dL", "ref": "interpretar com sintomas", "a": 1}}, "rota": null}, {"t": "pergunta", "k": "q2", "kicker": "Pergunta 2", "enunciado": "Quais três hipóteses merecem investigação em paralelo?", "alts": [{"t": "Doença da medula óssea", "c": "", "ok": 1}, {"t": "Púrpura trombocitopênica trombótica", "c": "", "ok": 1}, {"t": "Deficiência de vitamina B12", "c": "", "ok": 1}, {"t": "Hemólise autoimune isolada", "c": "", "ok": 0}, {"t": "Sangramento digestivo isolado", "c": "", "ok": 0}, {"t": "Coagulação intravascular disseminada como hipótese principal", "c": "", "ok": 0}], "escolhas": 3, "fundo": "", "exp": [{"h": "Não perder uma urgência", "t": "Anemia com fragmentos e plaquetopenia exige avaliar microangiopatia, inclusive PTT. Isso não autoriza ignorar a baixa resposta de reticulócitos, a leucopenia e a história mais lenta."}, {"h": "Uma explicação alternativa", "t": "Falhas de maturação da medula podem destruir precursores antes que cheguem ao sangue. Deficiência de B12 e doenças medulares entram nesse mecanismo. Coombs negativo enfraquece hemólise autoimune; coagulação preservada e ausência de contexto séptico desfavorecem CIVD, sem excluí-la em qualquer situação."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "risco", "kicker": "Discussão com a hematologia", "tt": "", "corpo": "<p>A equipe calcula PLASMIC 5, probabilidade intermediária de deficiência grave de ADAMTS13: pontua hemólise, ausência de câncer e transplante, INR abaixo de 1,5 e creatinina abaixo de 2; não pontua plaquetas abaixo de 30.000 nem VCM abaixo de 90.<\/p><p>ADAMTS13 é uma enzima cuja atividade muito baixa, no contexto adequado, sustenta PTT. A amostra é encaminhada ao laboratório de referência. Vitamina B12 e folato são dosados no mesmo dia; não se espera o resultado da enzima para decidir a segurança da conduta.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_urgencia", "kicker": "Decisão", "tt": "Enquanto os resultados chegam", "enunciado": "Como você conduz a suspeita de microangiopatia?", "caminhos": [{"r": "Transferência para possível troca de plasma", "vai": "transferencia", "c": "Com a hematologia, o serviço de referência pode iniciar tratamento empírico conforme a probabilidade e o tempo de resposta. Colhe-se ADAMTS13 antes de plasma, quando possível.", "rc": ""}, {"r": "Investigação rápida em unidade monitorizada", "vai": "revisao_rapida", "c": "Pode ser considerada com a hematologia se a suspeita for intermediária e houver revisão e B12 disponíveis em horas. Exige transferência e tratamento imediato se a probabilidade aumentar; não é espera sem vigilância.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "transferencia", "kicker": "No serviço de referência", "tt": "", "corpo": "<p>Antônio é transferido. A hematologia decide iniciar uma sessão de troca de plasma e corticoide enquanto revê a lâmina e aguarda os exames rápidos. Não se inicia caplacizumabe antes de esclarecer ADAMTS13 neste cenário intermediário.<\/p><p>A dispneia melhora com a transfusão, mas a dormência dos pés persiste. A equipe revê também a contagem de reticulócitos e pede a leitura completa da lâmina.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "lamina_completa", "conforme": null, "rota": null}, {"t": "pagina", "k": "revisao_rapida", "kicker": "Reavaliação nas primeiras horas", "tt": "", "corpo": "<p>Antônio permanece estável após a transfusão, sem confusão, dor torácica ou perda de função renal. A hematologia acompanha no hospital com retaguarda de transferência e acesso à troca de plasma se a avaliação mudar.<\/p><p>A revisão da lâmina e a dosagem de B12 são liberadas no mesmo turno. A equipe mantém avaliações seriadas; um prazo indefinido para esses resultados mudaria a segurança deste percurso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "lamina_completa", "conforme": null, "rota": null}, {"t": "pagina", "k": "lamina_completa", "kicker": "Discussão de imagem", "tt": "Revisão da lâmina", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>Além dos fragmentos, a revisão chama atenção para a morfologia dos leucócitos. O que esse achado acrescenta?<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Neutrófilo com hipersegmentação nuclear, indicado pela seta vermelha original.<\/p><p>Esse padrão sugere alteração da maturação celular. Não identifica sozinho a deficiência responsável e precisa ser relacionado às dosagens e ao quadro clínico.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 792.5\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"neutrofilo_hipersegmentado.png\" x=\"0\" y=\"0\" width=\"1000\" height=\"792.5\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Morfologia do neutrófilo.<span class=\"cr\">Paul Weisz Carrington, M.D. · Veterans Affairs · Wikimedia Commons · domínio público<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q3", "kicker": "Pergunta 3", "enunciado": "Quais dois dados mais enfraquecem hemólise periférica isolada?", "alts": [{"t": "Haptoglobina muito baixa", "c": "", "ok": 0}, {"t": "Hipersegmentação com leucopenia", "c": "", "ok": 1}, {"t": "Bilirrubina indireta elevada", "c": "", "ok": 0}, {"t": "Reticulócitos absolutos baixos", "c": "", "ok": 1}, {"t": "Presença de esquizócitos", "c": "", "ok": 0}], "escolhas": 2, "fundo": "", "exp": [{"h": "Uma resposta que não veio", "t": "Na anemia hemolítica, espera-se aumento de reticulócitos se a medula puder responder. Nove mil por microlitro é uma resposta insuficiente para hemoglobina de 5,1 g/dL."}, {"h": "Não confundir sinal com mecanismo", "t": "LDH muito alto, haptoglobina baixa e fragmentos podem coexistir com produção ineficaz. Alterações de maturação e outras linhagens baixas pedem investigar a medula e causas reversíveis. Isso não exclui PTT sem a avaliação completa."}], "tr": "", "nota": "", "segue": ""}, {"t": "resultados", "k": "vitaminas", "kicker": "No mesmo dia", "tt": "Exames adicionais", "de": "", "fundo": "", "intro": "O laboratório confirma a dosagem baixa na amostra de admissão. A perda de sensibilidade nos pés continua presente.", "nota": "", "laminas": {}, "todos": ["Vitamina B12", "Folato sérico", "Ferritina / saturação de transferrina", "TSH", "ADAMTS13"], "sobre": {"Vitamina B12": {"n": "Vitamina B12", "r": "Abaixo de 60 pg/mL", "ref": "200–900 pg/mL", "a": 1}, "Folato sérico": {"n": "Folato sérico", "r": "9,8 ng/mL", "ref": "acima de 4 ng/mL", "a": 0}, "Ferritina / saturação de transferrina": {"n": "Ferritina / saturação de transferrina", "r": "180 ng/mL / 30%", "ref": "30–400 / 20–45%", "a": 0}, "TSH": {"n": "TSH", "r": "2,4 mUI/L", "ref": "0,4–4,0 mUI/L", "a": 0}, "ADAMTS13": {"n": "ADAMTS13", "r": "Ainda em processamento", "ref": "amostra colhida antes de plasma", "a": 0}}, "rota": null}, {"t": "bifurcacao", "k": "b_reposicao", "kicker": "Decisão", "tt": "Tratamento inicial", "enunciado": "Qual prescrição você faz neste momento?", "caminhos": [{"r": "Vitamina B12 por via intramuscular", "vai": "reposicao_im", "c": "Deficiência acentuada com sintomas neurológicos justifica reposição parenteral pronta, após a coleta. A investigação da causa continua.", "rc": ""}, {"r": "Ácido fólico isolado", "vai": "folato_isolado", "c": "Pode melhorar parte da alteração hematológica se houver deficiência, mas não trata a lesão neurológica por B12. Folato normal não sustenta essa escolha isolada.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "reposicao_im", "kicker": "Início da reposição", "tt": "", "corpo": "<p>São iniciados 1.000 µg de vitamina B12 intramuscular por dia na fase inicial, com ajuste posterior ao esquema e à formulação disponíveis. Potássio e hemograma são acompanhados. A equipe programa contagem de reticulócitos para documentar resposta.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "adamts", "conforme": null, "rota": null}, {"t": "pagina", "k": "folato_isolado", "kicker": "No dia seguinte", "tt": "", "corpo": "<p>A prescrição é revista na visita antes de manter o tratamento isolado. Antônio segue com perda de sensibilidade nos pés; não há deficiência de folato demonstrada. A equipe inicia B12 intramuscular e orienta por que a reposição de folato, sozinha, seria insuficiente.<\/p><p>A reposição correta é iniciada no dia seguinte. A equipe documenta força, sensibilidade e equilíbrio para acompanhar a evolução.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "adamts", "conforme": null, "rota": null}, {"t": "pagina", "k": "adamts", "kicker": "Resultado do laboratório de referência", "tt": "", "corpo": "<p>ADAMTS13 retorna com atividade de 62%, na amostra colhida antes de qualquer plasma. Não há deficiência grave da enzima. Com B12 muito baixa e sinais de maturação anormal, a equipe estabelece deficiência de B12 com produção ineficaz e destruição de precursores: uma apresentação que pode simular microangiopatia.<\/p><p>O plano para PTT é encerrado. Se houve tratamento empírico, troca de plasma e corticoide são suspensos após a revisão. A escolha inicial é julgada pela informação disponível naquele momento, não apenas pelo diagnóstico final.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q4", "kicker": "Pergunta 4", "enunciado": "Que exame você prioriza para esclarecer a causa da deficiência?", "alts": [{"t": "Repetição de B12 após a primeira injeção", "c": "", "ok": 0}, {"t": "Anticorpo contra o fator intrínseco", "c": "", "ok": 1}, {"t": "Pesquisa de sangue oculto como única investigação", "c": "", "ok": 0}, {"t": "Teste genético para transporte de cobalamina", "c": "", "ok": 0}], "escolhas": 1, "fundo": "", "exp": [{"h": "Causa muda o seguimento", "t": "Fator intrínseco é uma proteína do estômago necessária à absorção da B12. Anticorpo contra ela favorece gastrite autoimune. Um teste negativo não excluiria essa causa."}, {"h": "História antes de raridades", "t": "Dieta, medicamentos e cirurgias devem ser revistos. Ele consome alimentos de origem animal e não foi operado. Omeprazol pode contribuir, mas não encerra a investigação. Dosagem logo após a injeção não identifica por que a deficiência ocorreu."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "etiologia", "kicker": "Investigação da causa", "tt": "", "corpo": "<p>O anticorpo contra o fator intrínseco é positivo. Após estabilização, a endoscopia com biópsias mostra gastrite atrófica predominante no corpo gástrico, sem neoplasia. O conjunto sustenta gastrite autoimune com prejuízo de absorção.<\/p><p>A equipe explica que a alimentação não foi o único problema. Reavalia a indicação do omeprazol e planeja seguimento gástrico conforme histologia e risco, sem prometer que a reposição vitamínica resolva toda consequência da gastrite.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "resultados", "k": "resposta", "kicker": "Sétimo dia", "tt": "Resposta inicial", "de": "", "fundo": "", "intro": "Antônio caminha melhor por estar menos dispneico. Ainda percebe pouco a vibração nos pés e precisa de apoio para andar em locais escuros.", "nota": "", "laminas": {}, "todos": ["Hemoglobina", "Reticulócitos absolutos", "LDH", "Plaquetas", "Leucócitos", "Potássio"], "sobre": {"Hemoglobina": {"n": "Hemoglobina", "r": "7,8 g/dL", "ref": "13,5–17,5 g/dL", "a": 1}, "Reticulócitos absolutos": {"n": "Reticulócitos absolutos", "r": "145.000/µL", "ref": "25.000–100.000/µL", "a": 1}, "LDH": {"n": "LDH", "r": "1.100 U/L", "ref": "120–250 U/L", "a": 1}, "Plaquetas": {"n": "Plaquetas", "r": "105.000/mm³", "ref": "150.000–450.000/mm³", "a": 1}, "Leucócitos": {"n": "Leucócitos", "r": "3.600/mm³", "ref": "4.000–11.000/mm³", "a": 1}, "Potássio": {"n": "Potássio", "r": "4,0 mmol/L", "ref": "3,5–5,0 mmol/L", "a": 0}}, "rota": null}, {"t": "pergunta", "k": "q5", "kicker": "Pergunta 5", "enunciado": "Quais duas interpretações você faz desta evolução?", "alts": [{"t": "A melhora do hemograma pode preceder a neurológica", "c": "", "ok": 1}, {"t": "LDH ainda alto demonstra falha da reposição", "c": "", "ok": 0}, {"t": "A resposta dos reticulócitos favorece recuperação da produção", "c": "", "ok": 1}, {"t": "Plaquetas em recuperação confirmam retrospectivamente PTT", "c": "", "ok": 0}, {"t": "Persistência da dormência exige suspender B12", "c": "", "ok": 0}], "escolhas": 2, "fundo": "", "exp": [{"h": "Resposta em sequência", "t": "O aumento de reticulócitos e a queda da LDH são coerentes com recuperação após reposição. A hemoglobina inicial foi também influenciada pela transfusão; não atribua toda a subida à vitamina."}, {"h": "Recuperação incompleta", "t": "Alterações sensitivas podem demorar meses e nem sempre se resolvem integralmente. Persistência precoce pede acompanhamento, segurança na marcha e reavaliação se houver piora, não suspensão automática da reposição."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "alta", "kicker": "Preparação da alta", "tt": "", "corpo": "<p>O plano inclui completar a fase inicial de reposição, manutenção intramuscular conforme a formulação e seguimento na unidade de saúde. São entregues datas das aplicações, retorno com hemograma e orientação para prevenção de quedas.<\/p><p>Em seis semanas, hemoglobina chega a 12,2 g/dL, plaquetas a 198.000/mm³ e LDH a 230 U/L. A dormência diminui, mas ele ainda evita dirigir à noite. A família pergunta se as injeções podem terminar agora.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_manutencao", "kicker": "Decisão", "tt": "Seguimento", "enunciado": "Como você organiza a reposição a partir de agora?", "caminhos": [{"r": "Manter reposição de longo prazo", "vai": "seguimento_regular", "c": "A causa da má absorção permanece. Gastrite autoimune requer reposição contínua; o plano intramuscular e o acesso devem ser pactuados.", "rc": ""}, {"r": "Interromper e repetir o hemograma em seis meses", "vai": "interrupcao", "c": "Normalização do hemograma não corrige a má absorção. Uma pausa sem plano pode permitir recorrência, inclusive neurológica antes de anemia importante.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "seguimento_regular", "kicker": "Quatro meses depois", "tt": "", "corpo": "<p>Antônio mantém as aplicações na unidade de saúde. O hemograma normalizou e ele recuperou parte da sensibilidade. A fisioterapia acompanha equilíbrio e prevenção de quedas. Ainda há dificuldade com terreno irregular.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q6", "conforme": null, "rota": null}, {"t": "pagina", "k": "interrupcao", "kicker": "Oito meses depois", "tt": "", "corpo": "<p>As aplicações foram interrompidas. Antônio volta por piora da dormência e novas quedas; o hemograma ainda tem hemoglobina de 11,8 g/dL e VCM de 103 fL. A equipe revê o plano e reinicia reposição parenteral, sem esperar nova anemia grave.<\/p><p>O exame neurológico é repetido e são revistas outras causas de piora da marcha e de quedas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q6", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q6", "kicker": "Pergunta 6", "enunciado": "Quais duas medidas têm maior utilidade no seguimento?", "alts": [{"t": "Garantir acesso à manutenção prescrita", "c": "", "ok": 1}, {"t": "Usar B12 sérica logo após a injeção como principal alvo", "c": "", "ok": 0}, {"t": "Reavaliar marcha e sensibilidade", "c": "", "ok": 1}, {"t": "Liberar seguimento apenas porque o hemograma normalizou", "c": "", "ok": 0}, {"t": "Atribuir toda nova fraqueza à mesma deficiência sem reexame", "c": "", "ok": 0}], "escolhas": 2, "fundo": "", "exp": [{"h": "Desfecho que importa", "t": "Sintomas, função, hemograma e acesso ao tratamento orientam o acompanhamento. O nível sérico pode subir com a aplicação e não traduz, sozinho, recuperação neurológica."}, {"h": "Reabrir quando necessário", "t": "Déficit focal novo, piora rápida ou ausência de resposta pedem outra avaliação. A causa identificada não deve encerrar todo raciocínio futuro."}], "tr": "", "nota": "", "segue": "destino_final"}, {"t": "pagina", "k": "destino_final", "kicker": "Revisão do plano", "tt": "", "corpo": "<p>A unidade de saúde e o ambulatório recebem o esquema e os objetivos de acompanhamento.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b_manutencao", "para": ["fim_recuperacao", "fim_reabilitacao"]}, "rota": null}, {"t": "desfecho", "k": "fim_recuperacao", "kicker": "Desfecho", "tt": "Retorno progressivo às atividades", "corpo": "<p>Antônio retoma caminhadas curtas e segue em reabilitação do equilíbrio. Não teve nova queda e mantém reposição contínua. A sensibilidade melhora parcialmente ao longo dos meses.<\/p>", "q": "melhor", "porque": "A recuperação hematológica não foi confundida com cura da causa da deficiência.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "fim_reabilitacao", "kicker": "Desfecho", "tt": "Novo período de reabilitação", "corpo": "<p>Com a reposição retomada, a anemia melhora. A marcha permanece limitada e Antônio precisa de apoio por mais tempo. A equipe organiza aplicações supervisionadas e prevenção de quedas.<\/p>", "q": "medio", "porque": "A interrupção retirou o tratamento de uma causa persistente de má absorção. O percurso simula recorrência e maior perda funcional, sem atribuir prazo universal ou irreversibilidade obrigatória.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "retrospectiva", "kicker": "Pontos de ensino", "tt": "", "corpo": "<ol class=\"pontos\"><li data-n=\"1\"><p>Fragmentos de hemácias não definem sozinhos PTT.<\/p><\/li><li data-n=\"2\"><p>Reticulócitos absolutos ajudam a distinguir destruição periférica de produção ineficaz.<\/p><\/li><li data-n=\"3\"><p>Suspeita relevante de PTT exige hematologia e decisão urgente; ADAMTS13 não deve virar pretexto para esperar sem tratamento.<\/p><\/li><li data-n=\"4\"><p>B12 baixa com sinais neurológicos deve ser tratada prontamente.<\/p><\/li><li data-n=\"5\"><p>Investigar a causa determina a duração da reposição; hemograma normal não significa causa resolvida.<\/p><\/li><\/ol>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "referencias", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Paciente, valores e percursos autorais. A apresentação foi inspirada em relatos de deficiência de B12 simulando microangiopatia; não reproduz o paciente nem a sequência de um artigo.<\/p><p><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10637334/\">McKee, Salter e Mithoowani. CMAJ 2023;195:E1300–E1304<\/a>; <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6717731/\">Relato e revisão de pseudo-microangiopatia por B12, 2019<\/a>; <a href=\"https://www.nice.org.uk/guidance/ng239/chapter/recommendations\">NICE NG239: diagnóstico e manejo de deficiência de B12<\/a>; <a href=\"https://www.isth.org/page/ttpguidelines\">ISTH: diagnóstico e tratamento de PTT<\/a>.<\/p><p>A gastrite autoimune confirmada e os ramos de tratamento são adaptações didáticas. Imagens <script>
/* Paginação por blocos medidos. Nenhum bloco é descartado ou reduzido por zoom. */
let partesTela = [], parteTela = 0, areaTela = null;
const detalhesAbertos = new Set();
const temProximaParte = () => parteTela + 1 < partesTela.length;
function aplicarParte(){
  if (!areaTela) return;
  parteTela = Math.min(Math.max(parteTela, 0), Math.max(0, partesTela.length - 1));
  const ativos = new Set(partesTela[parteTela] || []);
  [...areaTela.children].forEach(el => el.toggleAttribute('data-fora', !ativos.has(el)));
  areaTela.scrollTop = 0; areaTela.scrollLeft = 0;
}
function virarParte(delta){
  parteTela += delta; aplicarParte(); pintarPe();
}
function montarFolhas(){
  partesTela = []; areaTela = null;
  const root = document.querySelector('#palco .plano,#palco .folha,#palco .fim .caixa');
  if (!root) return;
  const mobile = innerWidth <= 900;
  if (mobile && root.classList.contains('plano')){
    const figura = document.querySelector('#palco .lamina');
    if (figura) root.append(figura);
  }
  let area = root.querySelector(':scope > .qexp,:scope > .alts,:scope > .grupos,:scope > .res,:scope > .cams,:scope > .painel-lab,:scope > .par,:scope > .observacao-imagem');
  if (!area){
    root.classList.add('paginavel');
    area = document.createElement('div'); area.className = 'conteudo-paginado';
    const filhos = [...root.children];
    // Conserva o título como referência em todas as páginas de continuação.
    filhos.filter(el => !el.matches('.marca,h1,h2')).forEach(el => area.append(el));
    root.append(area);
  }
  if(area.classList.contains('cams')){const aviso=root.querySelector(':scope>.forca');if(aviso)area.append(aviso);}
  if(mobile)root.querySelectorAll('table').forEach(t=>{const nomes=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,n)=>td.dataset.col=nomes[n]||''));});
  area.classList.add('area-paginada'); areaTela = area;
  // Respostas e resultados permanecem inteiros: a densidade se adapta à tela.
  if(area.matches('.qexp,.alts,.res,.cams,.painel-lab,.par,.observacao-imagem')){
    root.classList.add('tela-unica');
    if(area.matches('.painel-lab,.observacao-imagem'))root.classList.add('paginavel');
    // Um quadro interno com overflow escondido (a tabela de exames, por
    // exemplo) pode cortar conteúdo sem que a área transborde: conta também.
    const cortado=()=>[...area.querySelectorAll('*')].some(el=>el.clientHeight>0&&el.scrollHeight>el.clientHeight+2&&!el.closest('.vv-est-fig')&&/hidden|auto|scroll|clip/.test(getComputedStyle(el).overflowY));
    const cabe=()=>area.scrollHeight<=area.clientHeight+1&&area.scrollWidth<=area.clientWidth+1&&!cortado();
    let fator=1;
    root.style.setProperty('--compacto',fator);
    while(!cabe()&&fator>0.25){fator=Math.max(0.25,fator-0.015);root.style.setProperty('--compacto',fator.toFixed(3));}
    partesTela=[[...area.children]];parteTela=0;aplicarParte();return;
  }

  // O flex precisa reservar espaço aos cabeçalhos e aos botões antes da medição.
  const capacidade = () => area.clientHeight;
  function grande(el){ const st=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0) > capacidade() - 3; }
  function dividir(el){
    if (!grande(el)) return false;
    if(mobile && el.matches('.grade,.bal,div:not([class])')){el.replaceWith(...el.children);return true;}
    let filhos = [], criar;
    if (el.matches('.gr')){
      filhos = [...el.querySelectorAll(':scope > .it')];
      criar = () => { const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c; };
    } else if (el.matches('.tops,.grade,.vit,.corpo .lg,aside,.cons,.rev,.bal,.painel-lab,.pontos')){
      filhos = [...el.children]; criar=()=>el.cloneNode(false);
    } else if (el.matches('.estudo-imagem') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('.corpo') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('table')){
      filhos=[...el.querySelectorAll('tbody tr')];
      criar=()=>{const c=el.cloneNode(false);if(el.tHead)c.append(el.tHead.cloneNode(true));c.append(document.createElement('tbody'));return c;};
    } else if (el.matches('details[open]')){
      filhos=[...el.children].filter(x=>x.tagName!=='SUMMARY');
      criar=()=>{const c=document.createElement('div');c.className='leitura continuacao-leitura';return c;};
    } else if (el.matches('.rc') && el.querySelector('figure')){
      filhos=[...el.children].filter(x=>x.tagName!=='B');
      criar=()=>{const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c;};
    }
    // Contêiner com um filho só: o que precisa partir é o filho.
    if (filhos.length === 1) return dividir(filhos[0]);
    if (filhos.length > 1){
      if(el.matches('.gr')){
        // Conserva o máximo de opções por grupo que a altura comporta.
        const blocos=[];let atual=criar();el.before(atual);
        for(const f of filhos){atual.append(f);if(grande(atual)&&atual.querySelectorAll('.it').length>1){f.remove();blocos.push(atual);atual=criar();el.before(atual);atual.append(f);}}
        el.remove();return true;
      }
      // Blocos inteiros, com cabeçalhos repetidos onde necessários.
      const novos=filhos.map(f=>{const c=criar();(c.tBodies?.[0]||c).append(f);return c;});
      el.replaceWith(...novos);return true;
    }
    if(el.matches('.cam') && el.querySelector('.c')?.textContent && !el.dataset.discussao){
      const comentario=el.querySelector('.c'),c=el.cloneNode(false);c.dataset.discussao='1';
      c.append(el.querySelector('.l').cloneNode(true));const rot=document.createElement('span');rot.className='r';rot.textContent='Discussão do caminho '+el.querySelector('.l').textContent;c.append(rot,comentario);el.after(c);return true;
    }
    const seletor=el.matches('p')?null:'.c,.cm,:scope>p';
    const alvo=seletor?el.querySelector(seletor):el;
    if(alvo && alvo.textContent.length>120){
      const walker=document.createTreeWalker(alvo,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      const txt=alvo.textContent,mid=txt.indexOf(' ',Math.floor(txt.length/2));
      if(mid<0)return false;
      let used=0,cut;
      for(const n of nodes){if(used+n.length>=mid){cut=[n,mid-used];break;}used+=n.length;}
      if(!cut)return false;
      const a=document.createRange();a.selectNodeContents(alvo);a.setEnd(...cut);
      const b=document.createRange();b.selectNodeContents(alvo);b.setStart(...cut);
      const left=el.cloneNode(true),right=el.cloneNode(true);
      (seletor?left.querySelector(seletor):left).replaceChildren(a.cloneContents());
      (seletor?right.querySelector(seletor):right).replaceChildren(b.cloneContents());
      el.replaceWith(left,right);return true;
    }
    return false;
  }
  // Une novamente apenas na próxima renderização; os originais continuam nos dados do caso.
  for(let pass=0;pass<8;pass++){
    let mudou=false;
    for(const el of [...area.children])if(dividir(el))mudou=true;
    if(!mudou)break;
  }
  const itens=[...area.children];
  itens.forEach(el=>el.setAttribute('data-fora',''));
  let folha=[];
  for(const el of itens){
    el.removeAttribute('data-fora');
    const excedeu = area.scrollHeight>area.clientHeight+2 || area.scrollWidth>area.clientWidth+2;
    if(excedeu && folha.length){
      partesTela.push(folha);folha.forEach(n=>n.setAttribute('data-fora',''));folha=[];
    }
    folha.push(el);
  }
  if(folha.length)partesTela.push(folha);
  aplicarParte();
}

/* ═══════════ o caso em etapas — página a página ═══════════

   Uma folha de cada vez. Nada rola: a página inteira é uma etapa, e passar de
   etapa é virar a folha. O que decide a folha seguinte é o que foi respondido
   na atual.

   Três coisas o motor guarda entre as etapas: os exames marcados em cada
   pedido, as respostas dadas, e o caminho escolhido em cada bifurcação. É com
   os exames marcados que a página de resultados sabe o que devolver — e é por
   isso que o que não foi pedido não aparece. */

const DADOS = JSON.parse(document.getElementById('dados').textContent);
const CASO = DADOS.caso, ETAPAS = DADOS.etapas, BANCO = DADOS.banco;
const REVISAO = DADOS.revisao;
/* As imagens viajam numa tabela à parte, uma vez cada: a etapa guarda
   só o nome do arquivo. */
const IMG = n => (DADOS.imgs || {})[n] || n || '';

const $ = s => document.querySelector(s);

/* ─────────────────────────── estado da sessão ─────────────────────────── */

let emRevisao = false;
let i = 0;                    // índice da etapa atual
const marcados = {};          // ident do pedido -> Set de nomes de exame
const respostas = {};         // ident da pergunta -> {marcadas:[], feita:bool}
const escolhas = {};          // ident da bifurcação -> índice do caminho
let historia = [0];           // pilha de etapas visitadas, para voltar
const laudos = new Set(); // laudos revelados por rodada de investigação

const porId = k => ETAPAS.findIndex(e => e.k === k);
/* Tudo o que já foi pedido em qualquer rodada, para os pré-requisitos e para
   as consequências do fim. */
function jaPedido(nome){
  return Object.values(marcados).some(c => c.has(nome));
}
const etapa = () => ETAPAS[i];

/* ─────────────────────────── navegação ─────────────────────────── */

function ir(n, empilhar){
  if (n < 0 || n >= ETAPAS.length) return;
  if (empilhar !== false) historia.push(n);
  i = n; parteTela = 0; emRevisao=false;
  pintar();
}

function irPara(k){
  const n = porId(k);
  if (n < 0){ console.warn('etapa inexistente:', k); return; }
  ir(n);
}

/* A folha seguinte é a vizinha, a menos que a etapa atual diga outra coisa —
   é assim que a bifurcação muda o rumo sem que a lista de etapas mude. */
function adiante(){
  if (temProximaParte()){ virarParte(1); return; }
  if(emRevisao){recomecar();return;}
  const e = etapa();
  if(e.comentado){
    const r=respostas[e.k];if(!r?.feita)return;
    const alts=e.alts.filter(a=>a.ok);
    marcados[e.k]=new Set(alts.flatMap(a=>a.exames));
    r.conducao='indicados';
  }
  if (e.t === 'bifurcacao'){
    const esc = escolhas[e.k];
    if (esc === undefined) return;
    irPara(e.caminhos[esc].vai);
    return;
  }
  if (e.t === 'desfecho'){
    if (e.fecho) irPara(e.fecho); else mostrarRevisao();
    return;
  }
  /* A rota é a ramificação de verdade: quem não pediu a prova não recebe a
     página que a discute. Sem isto, a peça perguntava "que exames você pede?" e
     depois seguia contando o resultado de exames que ninguém pediu — que é
     exatamente o vício que este formato existe para não ter. */
  if (e.rota){
    const pedidos = new Set();
    Object.values(marcados).forEach(c => c.forEach(n => pedidos.add(n)));
    const tem = e.rota.pediu.every(n => pedidos.has(n));
    irPara(tem ? e.rota.entao : e.rota.senao);
    return;
  }
  /* A evolução volta a se separar aqui: a página é a mesma para os três
     caminhos até o ponto em que o hemograma deixa de ser o mesmo. */
  if (e.conforme){
    const k = escolhas[e.conforme.de];
    irPara(e.conforme.para[k === undefined ? 0 : k]);
    return;
  }
  // `segue` deixa a ordem do arquivo de ser a única costura entre as páginas:
  // é o que permite três trilhas de tratamento convivendo na mesma lista
  if (e.segue){ irPara(e.segue); return; }
  if (i + 1 >= ETAPAS.length){ mostrarRevisao(); return; }
  ir(i + 1);
}

function atras(){
  if (parteTela > 0){ virarParte(-1); return; }
  if(emRevisao){emRevisao=false;parteTela=0;pintar();return;}
  const e = etapa();
  if (historia.length < 2) return;
  historia.pop();
  i = historia[historia.length - 1];
  pintar();
}

/* Quando se pode virar a folha. Pergunta sem resposta e pedido sem nenhum
   exame marcado seguram a página: o caso não anda por cima de uma decisão que
   não foi tomada. */
function podeAdiante(){
  if (emRevisao || temProximaParte()) return true;
  const e = etapa();
  if (e.t === 'pergunta' || e.t === 'pareamento')
    return !!(respostas[e.k] && respostas[e.k].feita);
  if (e.t === 'bifurcacao') return escolhas[e.k] !== undefined;
  if (e.t === 'pedido') return e.comentado ? !!respostas[e.k]?.feita : (marcados[e.k] || new Set()).size > 0;
  return true;
}

/* ─────────────────────────── o trilho ─────────────────────────── */

/* Desde que o caso ramifica, a lista de etapas deixou de ser o caminho: ela
   contém as páginas das DUAS rotas, e contar 27 num percurso de 19 é mentir
   para quem olha o trilho. Esta função percorre o caso a partir do estado
   atual e devolve só as páginas que este percurso vai ver. */
function rotaAtual(){
  const seq = [], visto = new Set();
  const pedidos = new Set();
  Object.values(marcados).forEach(c => c.forEach(x => pedidos.add(x)));
  let n = 0;
  while (n >= 0 && n < ETAPAS.length && !visto.has(n)){
    visto.add(n); seq.push(n);
    const e = ETAPAS[n];
    if (e.t === 'bifurcacao'){
      const esc = escolhas[e.k];
      n = porId(e.caminhos[esc === undefined ? 0 : esc].vai);
    } else if (e.t === 'desfecho'){
      n = e.fecho ? porId(e.fecho) : -1;
    } else if (e.rota){
      n = porId(e.rota.pediu.every(x => pedidos.has(x))
                ? e.rota.entao : e.rota.senao);
    } else if (e.conforme){
      const k = escolhas[e.conforme.de];
      n = porId(e.conforme.para[k === undefined ? 0 : k]);
    } else if (e.segue){
      n = porId(e.segue);
    } else n = n + 1;
  }
  return seq;
}

/* O trilho mostra as etapas do percurso, uma marca cada, colorida pelo tipo —
   e um contador explícito. É assim que o formato antigo do New England fazia,
   e a diferença é real: dá para ver quantas páginas faltam e onde estão as
   perguntas antes de chegar nelas. */
function pintarTrilho(){
  const seq = rotaAtual();
  const aqui = Math.max(seq.indexOf(i), 0);
  $('#trilho').innerHTML =
    '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>'
    + '<span class="cnt">' + (aqui + 1) + ' / ' + seq.length + '</span>'
    + '<span class="marcas">' + seq.map(n => ETAPAS[n]).map((e, k) =>
        // o título só aparece no que já foi percorrido: com o mouse parado
        // sobre uma marca à frente, o trilho entregava os desfechos — inclusive
        // qual deles é o ruim — antes de a bifurcação ser feita
        '<i class="m-' + e.t + (k < aqui ? ' feita' : k === aqui ? ' aqui' : '')
        + '" data-n="' + seq[k] + '"'
        + (k < aqui ? ' title="' + (e.tt || e.kicker || '').replace(/"/g, '') + '"' : '')
        + '></i>'
      ).join('') + '</span>';
  // andar para trás pelo trilho é livre; para a frente, não — o caso não pula
  // uma decisão que ainda não foi tomada
  const vistos = new Set(historia);
  $('#trilho').querySelectorAll('.marcas i').forEach(m => {
    const n = +m.dataset.n;
    if (vistos.has(n) && n !== i) m.onclick = () => ir(n);
  });
}

function pintarPe(){
  const e = etapa();
  const fim = e.t === 'desfecho';
  const corrigida=e.comentado && respostas[e.k]?.feita;
  $('#pe').innerHTML =
    '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav">'
    + (partesTela.length > 1 ? '<span class="pagina-indice">Página ' + (parteTela + 1) + ' de ' + partesTela.length + '</span>' : '')
    + '<button class="bt" id="voltar"' + (historia.length < 2 && parteTela === 0 ? ' disabled' : '') + '>Voltar</button>'
    + '<button class="bt forte" id="' + (emRevisao && !temProximaParte() ? 'reiniciar' : 'seguir') + '"' + (podeAdiante() ? '' : ' disabled') + '>'
    + (temProximaParte() ? 'Próxima página' : emRevisao ? 'Recomeçar' : e.t === 'capa' ? 'Começar o caso' : corrigida ? 'Realizar indicados' : fim ? 'Continuar' : 'Avançar') + '</button></span>';
  $('#voltar').onclick = atras;
  ($('#seguir') || $('#reiniciar')).onclick = adiante;
}

/* ─────────────────────────── desenho das etapas ─────────────────────────── */

const fundoDe = e => e.fundo
  ? '<div class="fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
  : '<div class="fundo" style="background:#0d1014"></div>';

const laminaDe = l => !l ? '' :
  '<figure class="lamina"><img src="' + IMG(l.img) + '" alt="' + l.tt + '">'
  + '<figcaption class="cap"><b>' + l.tt + '</b>' + l.lg
  + '<span class="cr">' + l.cr + '</span></figcaption></figure>';

/* Figura anotada e boneco vêm do caso como HTML pronto, montado antes de
   existir data: URI. Cada um deixa o nome do arquivo em `data-img` e o
   endereço é resolvido aqui, contra a mesma tabela de imagens. */
function resolverImagens(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = IMG(el.dataset.img);
    if (el.tagName.toLowerCase() === 'image') el.setAttribute('href', u);
    else el.setAttribute('src', u);
  });
}

/* ─────────────────────── a lupa ─────────────────────── */

/* Tomografia lida num cartão de 300 px é decoração. Qualquer figura da peça
   abre em tela cheia por clique, com a legenda embaixo, e fecha por clique,
   por Esc ou pelo botão. Enquanto a lupa está aberta as setas do teclado
   param de virar página: elas pertencem à figura, não ao caso. */
let lupaAberta = false;

function abrirLupa(figura){
  const clone = figura.cloneNode(true);
  clone.classList.remove('lamina');
  /* o tamanho ajustado à coluna não vale na lupa; e setas ainda não
     reveladas continuam ocultas quando a figura é ampliada */
  clone.style.width = '';
  clone.querySelectorAll('svg').forEach(s => { s.style.width = ''; s.style.height = ''; });
  if (document.querySelector('#palco .vv-est-rev:not([open])')) clone.querySelectorAll('.an').forEach(a => a.style.visibility = 'hidden');
  const cx = document.createElement('div');
  cx.className = 'lupa';
  cx.innerHTML = '<button class="fechar" title="Fechar (Esc)">Fechar ✕</button>';
  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  quadro.appendChild(clone);
  cx.appendChild(quadro);
  document.body.appendChild(cx);
  lupaAberta = true;
  /* figura anotada na lupa: do tamanho da imagem, sem faixas laterais */
  const sv = clone.querySelector('svg');
  if (sv && sv.viewBox && sv.viewBox.baseVal && sv.viewBox.baseVal.width){
    const r = sv.viewBox.baseVal.width / sv.viewBox.baseVal.height, cap = clone.querySelector('figcaption');
    const ajusta = w => { clone.style.width = w + 'px'; sv.style.width = w + 'px'; sv.style.height = (w / r) + 'px'; sv.style.maxHeight = 'none'; return cap ? cap.offsetHeight : 0; };
    const maxW = innerWidth * 0.92, maxH = innerHeight * 0.84;
    let w = Math.min(maxW, (maxH - ajusta(maxW)) * r);
    w = Math.min(maxW, (maxH - ajusta(w)) * r);
    ajusta(Math.max(w, 200));
    clone.classList.add('lupa-ajustada');
  }
  const fechar = () => {
    cx.remove(); lupaAberta = false;
    document.removeEventListener('keydown', porTecla, true);
  };
  const porTecla = ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); fechar(); }
  };
  document.addEventListener('keydown', porTecla, true);
  cx.onclick = ev => { if (!quadro.contains(ev.target) || ev.target.tagName === 'IMG') fechar(); };
  cx.querySelector('.fechar').onclick = fechar;
}

function ligarLupa(){
  document.querySelectorAll('#palco figure').forEach(f => {
    if (!f.querySelector('img,svg')) return;
    f.classList.add('amplia');
    f.title = 'Clique para ampliar';
    f.onclick = () => abrirLupa(f);
  });
}

function pintar(){
  const e = etapa();
  $('#palco').innerHTML = '<section class="tela on">' + DESENHO[e.t](e) + '</section>';
  resolverImagens();
  document.querySelectorAll('#palco details').forEach((d,n)=>{const key=etapa().k+'::'+n;d.dataset.detalhe=key;d.open=detalhesAbertos.has(key);});
  ligar(e);
  montarFolhas();
  document.querySelectorAll('#palco details').forEach(d=>{const summary=d.querySelector('summary');if(summary)summary.onclick=ev=>{ev.preventDefault();const key=d.dataset.detalhe;d.open?detalhesAbertos.delete(key):detalhesAbertos.add(key);parteTela=0;pintar();};});
  ligarLupa();
  acessibilidadeDaPagina();
  pintarTrilho();
  pintarPe();
}

/* A resposta no molde do //New England//: o gabarito numa frase e a
   explicação em seções com subtítulo, uma só para a pergunta inteira. */
function explicacaoDe(e){
  // no meio da frase, a alternativa perde a maiúscula inicial, mas não a
  // de siglas ("PCR", "HLA-B27")
  const minus = s => s.replace(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ])(?=[a-záéíóúâêôãõç]|\s+[a-záéíóúâêôãõç])/, c => c.toLowerCase());
  const certas = e.alts.filter(a => a.ok).map(a => '<b>' + minus(a.t) + '</b>');
  const lista = certas.length === 1 ? certas[0]
    : certas.slice(0, -1).join(', ') + ' e ' + certas[certas.length - 1];
  return '<div class="explica"><p class="gab">' + (certas.length === 1
      ? 'A resposta correta é ' : 'As respostas corretas são ') + lista + '.</p>'
    + e.exp.map(s => '<div class="ex-sec">' + (s.h ? '<h4>' + s.h + '</h4>' : '')
      + '<p>' + s.t + '</p></div>').join('') + '</div>';
}

const DESENHO = {

  /* Título e imagem. A imagem sobe do chão para a tela inteira, sem véu de
     leitura por cima dela senão o gradiente que segura o título. */
  capa: e =>
    '<div class="fundo capa-fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
    + '<div class="veu capa-veu"></div>'
    + '<div class="abertura">'
    + (e.kicker ? '<div class="marca"><i></i><span>' + e.kicker + '</span></div>' : '')
    + '<h1>' + e.tt + '</h1>'
    + (e.selo ? '<div class="selo">' + e.selo + '</div>' : '')
    + '</div>',

  /* Quando o rótulo é mais informativo que a manchete — "onde dava para ter
     chegado antes" contra "a retrospectiva" — quem sobe a título é o rótulo, e
     a manchete curta sai. O caso declara isso com `so_kicker`. */
  pagina: e =>
    fundoDe(e) + '<div class="veu ' + (e.lamina ? 'esq' : 'tudo') + '"></div>'
    + '<div class="plano' + (e.lamina ? '' : ' centro') + '">'
    + (e.so_kicker
        ? '<h2 class="do-kicker">' + e.kicker + '</h2>'
        : '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
          + '<h2>' + e.tt + '</h2>')
    + e.corpo + '</div>'
    + laminaDe(e.lamina),

  pedido: e => e.comentado ? DESENHO.pergunta(e) :
    fundoDe(e) + '<div class="veu tudo"></div>'
    + '<div class="folha pedido">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
    + '<div class="grupos">' + e.grupos.map(g =>
        '<div class="gr g-' + g.s + '"><b><i></i>' + g.n + '</b>'
        + g.o.map(o => {
            /* Um exame com pré-requisito continua VISÍVEL e fica travado, com
               o motivo escrito. Esconder ensinaria que ele não existe; o que
               se quer ensinar é que ele ainda não se justifica. */
            const falta = (o.ex || []).filter(x => !jaPedido(x));
            const trava = falta.length > 0;
            return '<label class="it' + (temMarcado(e.k, o.e) ? ' on' : '')
              + (trava ? ' trava' : '') + '" data-ex="' + esc(o.e) + '">'
              + '<span class="cx"></span><span class="n">' + o.e
              + (o.d ? '<span class="d">' + o.d + '</span>' : '')
              + (trava ? '<span class="d trv">' + o.pq + ' — falta: '
                  + falta.join(', ') + '</span>' : '')
              + '</span></label>';
          }).join('') + '</div>').join('')
    + '</div><div class="conta" id="conta"></div></div>',

  // Sem manchete: o rótulo já diz "o que voltou", e o primeiro cartão vira o
  // topo visual. Ganha noventa pixels e a tela começa no dado.
  resultados: e => {
    const todos = e.todos ? e.todos : [...(marcados[e.de] || [])];
    const origem=respostas[e.de]?.conducao;
    const resumo=origem==='indicados'?'Exames realizados pela equipe após a discussão.':'';
    const pedidos = todos;
    const sobre = e.sobre || (ETAPAS[porId(e.de)] || {}).sobre || {};
    const linhas = [], imagens = [];
    pedidos.forEach(n => {
      // o resultado que o caso declarou vence o do banco: o banco foi escrito
      // para um formato com relógio, e aqui não há relógio
      const x = sobre[n] || BANCO[n];
      if (!x) return '';
      const im = e.laminas[n];
      /* O laudo do sedimento tem cinco achados separados por ponto médio, e
         num parágrafo corrido o cilindro hemático — que é o achado — passava
         no meio da frase. Cada parte vira uma linha. */
      const partes = x.r.split(' · ');
      const valor = partes.length > 1
        ? partes.map(t => '<span class="ln">' + t + '</span>').join('')
        : x.r;
      /* Quando o exame tem imagem, a imagem vem SOZINHA e o laudo fica atrás
         de um botão. Colar o laudo na figura tira do grupo o passo que mais
         ensina em imagem, que é descrever antes de ler o que outro escreveu —
         e é invariante declarada do formato: laudo se revela, não se
         renderiza junto. */
      const laudo = '<div class="v">' + valor
        + (x.ref && x.ref !== '—' ? '<span class="rf">referência: ' + x.ref
            + '</span>' : '') + '</div>';
      if (!im) {
        linhas.push('<tr class="rc' + (x.a ? ' alt' : '') + '"><th scope="row"><b>' + n
          + '</b></th><td class="v">' + valor + '</td><td class="rf">'
          + (x.ref || '—') + '</td></tr>');
        return;
      }
      /* A legenda descritiva É o laudo. Deixá-la sob a figura enquanto um
         botão promete "ver o laudo" é entregar a leitura e cobrar o clique
         por nada: quem olhava a radiografia já lia "opacidades alveolares
         bilaterais predominando nos campos médios" antes de descrever coisa
         alguma. Sob a figura fica só o crédito; a descrição e o valor saem
         juntos, no clique. */
      const chaveLaudo = (e.de || e.k) + '::' + n;
      const aberto = laudos.has(chaveLaudo);
      imagens.push('<article class="rc resultado-imagem' + (x.a ? ' alt' : '') + '"><b>' + n + '</b>'
        + '<figure><img src="' + IMG(im.img) + '" alt="' + n + '">'
        + '<figcaption class="soc">' + im.cr + '</figcaption></figure>'
        + (aberto
            ? laudo + '<div class="leglaudo">' + im.lg + '</div>'
            : '<button class="verlaudo" data-laudo="' + esc(chaveLaudo) + '">'
              + 'Ver o laudo</button>')
        + '</article>');
    });
    const cartas = (linhas.length ? '<div class="laboratorio"><table class="exames-tabela"><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table></div>' : '')
      + (imagens.length ? '<div class="imagens-resultados" style="--figuras:' + imagens.length + '">' + imagens.join('') + '</div>' : '');
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca larga"><i></i><span>' + e.kicker
      + '</span>'
      + (resumo || e.intro ? '<b class="sub-in">' + resumo + ' ' + (e.intro || '').replace(/(?:De novo, só o que foi marcado\.|Só o que foi marcado\.)/g,'') + '</b>' : '') + '</div>'
      + '<div class="res resultados-editoriais' + (linhas.length && imagens.length ? ' misto' : '') + '">' + (cartas
          || '<div class="vazio">Você não pediu nenhum exame nesta etapa. O caso '
             + 'segue com o que se sabe do leito.</div>') + '</div></div>';
  },

  pergunta: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q' + (e.alts.length > 6 ? ' densa' : '') + '">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : (e.escolhas === 1 ? 'selecione uma'
             : 'selecione ' + e.escolhas + ' · marcadas ' + r.marcadas.length))
      + '</div>'
      + (e.exp ? '<div class="qexp' + (r.feita ? ' feita' : '') + '">' : '')
      + '<ul class="alts' + (r.feita ? ' feita' : '')
          + (e.alts.length > 6 ? ' muitas' : '') + (e.exp ? ' semcm' : '') + '">'
      + e.alts.map((a, k) =>
          '<li data-k="' + k + '" class="' + (a.ok ? 'certa' : 'errada')
          + (r.marcadas.includes(k) ? ' marcada' : '') + '">'
          + '<span class="k">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="tx">' + a.t + '</span>'
          + '<span class="cm">' + (r.feita ? '<span class="estado-resposta">' + (e.comentado ? a.situacao : (a.ok ? 'Correta' : 'Incorreta')) + (r.marcadas.includes(k) ? ' · sua seleção' : '') + '</span>' : '') + a.c + '</span></li>').join('')
      + '</ul>'
      + (e.exp ? (r.feita ? explicacaoDe(e) : '') + '</div>' : '')
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (r.marcadas.length >= e.escolhas ? '' : ' disabled') + '>'
          + 'Confirmar resposta</button>')
      + '</div>';
  },

  /* Pareamento: cada item tem a sua linha de letras. Marcar é atribuir uma
     letra ao item; a mesma letra pode servir a mais de um item, porque é
     assim na prova — e porque proibir a repetição entregaria a resposta por
     exclusão. */
  pareamento: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    const L = n => String.fromCharCode(65 + n);
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q par-folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : 'atribua uma letra a cada item · ' + r.marcadas.filter(x => x !== undefined && x !== null).length
            + ' de ' + e.itens.length) + '</div>'
      + '<div class="par' + (r.feita ? ' feita' : '') + '">'
      + '<div class="par-ops">' + e.ops.map((o, n) =>
          '<span class="po"><b>' + L(n) + '</b>' + o + '</span>').join('') + '</div>'
      + '<div class="par-itens">' + e.itens.map((it, n) => {
          const esc = r.marcadas[n];
          const certa = r.feita && esc === it.ok;
          return '<div class="pi' + (r.feita ? (certa ? ' certa' : ' errada') : '')
            + '" data-n="' + n + '">'
            + '<span class="pt">' + it.t + '</span>'
            + '<span class="pesc">' + e.ops.map((o, m) =>
                '<i class="pe' + (esc === m ? ' on' : '')
                + (r.feita && m === it.ok ? ' ok' : '') + '" data-m="' + m
                + '" title="' + esc2(o) + '">' + L(m) + '</i>').join('') + '</span>'
            + (r.feita ? '<span class="cm"><span class="estado-resposta">'
                + (certa ? 'Correta' : 'Incorreta · a resposta é ' + L(it.ok)
                    + (esc === undefined || esc === null ? '' : ' · você marcou ' + L(esc)))
                + '</span>' + it.c + '</span>' : '')
            + '</div>';
        }).join('') + '</div></div>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (e.itens.every((_, n) => r.marcadas[n] !== undefined && r.marcadas[n] !== null) ? '' : ' disabled')
          + '>Confirmar resposta</button>')
      + '</div>';
  },

  bifurcacao: e => {
    const esc = escolhas[e.k];
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
      + '<div class="cams' + (esc !== undefined ? ' feita' : '') + '">'
      + e.caminhos.map((c, k) =>
          '<div class="cam' + (esc === k ? ' escolhido' : '') + '" data-k="' + k + '">'
          + '<span class="l">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="r">' + c.r + '</span>'
          + '<span class="c">' + c.c + '</span></div>').join('')
      + '</div>'
      /* Sem isto, a ramificação era invisível: as três justificativas abriam,
         o caso seguia, e nada na tela dizia que o rumo tinha mudado. */
      + (esc !== undefined
          ? '<div class="forca">' + e.caminhos.map((c, k) =>
              '<i class="' + (esc === k ? 'on' : '') + '"></i>').join('')
            + '<span>Você escolheu o caminho '
            + String.fromCharCode(65 + esc) + '. O caso acompanha essa conduta. '
            + 'Você pode voltar para comparar os outros caminhos.</span></div>'
          : '')
      + '</div>';
  },

  /* O balanço: o que a condução custou, item a item, com o contrafactual ao
     lado. É a única tela do caso que só existe por causa do que VOCÊ fez. */
  balanco: e => {
    const bateu = q => {
      if (q.sem) return !q.sem.some(n => jaPedido(n));
      if (q.escolheu) return escolhas[q.escolheu[0]] === q.escolheu[1];
      if (q.escolheu_todos)
        return q.escolheu_todos.every(([k, v]) => escolhas[k] === v);
      return false;
    };
    const disparadas = e.cons.filter(c => bateu(c.q));
    const morreu = e.obito && bateu(e.obito);
    const dias = e.bd + disparadas.reduce((s, c) => s + c.d, 0);
    const tfg = e.bt - disparadas.reduce((s, c) => s + c.t, 0);
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2>' + e.corpo
      + '<div class="bal">'
      + (morreu
        ? '<div class="placar obito"><div class="cheio"><b>Óbito</b><span>'
          + e.obitotx + '</span></div></div>'
        : '<div class="placar">'
      +   '<div><b>' + dias + '</b><span>dias de internação</span></div>'
      +   '<div' + (tfg <= 15 ? ' class="grave"' : '') + '><b>' + tfg
      +     '</b><span>mL/min/1,73 m² na alta'
      +     (tfg <= 15 ? ' · saiu em diálise' : '') + '</span></div>'
      +   '<div class="ideal"><b>' + e.bd + ' · ' + e.bt + '</b>'
      +     '<span>o melhor percurso possível</span></div>'
      + '</div>')
      + (disparadas.length
          ? '<div class="cons">' + disparadas.map(c =>
              '<div class="cn"><b>' + c.tt + '</b>'
              + '<span class="pr">' + (c.d ? '+' + c.d + ' dias' : '')
              + (c.d && c.t ? ' · ' : '') + (c.t ? '−' + c.t + ' mL/min' : '')
              + '</span><p>' + c.pq + '</p></div>').join('') + '</div>'
          : '<div class="cons"><div class="cn limpo"><b>Nenhuma decisão desta '
            + 'condução cobrou preço.</b><p>Você chegou ao melhor percurso que '
            + 'este caso permite. É raro, e não é sorte: as decisões que '
            + 'custam caro aqui são todas das primeiras 72 horas.</p></div></div>')
      + '</div></div>';
  },

  desfecho: e =>
    fundoDe(e) + '<div class="veu tudo q-' + e.q + '"></div>'
    + '<div class="fim ' + e.q + '"><div class="caixa">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h1>' + e.tt + '</h1>' + e.corpo
    + '<div class="porque"><b>Por quê</b><p>' + e.porque + '</p></div>'
    + '</div></div>',
};

const esc = s => s.replace(/"/g, '&quot;');
const esc2 = s => String(s).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
const temMarcado = (k, n) => (marcados[k] || new Set()).has(n);

function ligar(e){
  if (e.t === 'pedido' && !e.comentado){
    const conj = marcados[e.k] || (marcados[e.k] = new Set());
    /* O teto é o que faz a pergunta ser uma pergunta. Sem ele, marcar tudo é
       sempre a jogada dominante — e um grupo que marca tudo não decidiu nada,
       além de encerrar a investigação na primeira tela. */
    const teto = e.limite || 0;
    const cheio = () => teto && conj.size >= teto;
    const contar = () => {
      const faltam = teto ? teto - conj.size : 0;
      $('#conta').innerHTML = '<b>' + conj.size
        + (teto ? ' de ' + teto : '') + '</b> '
        + (conj.size === 1 ? 'exame marcado' : 'exames marcados')
        + (teto
            ? (faltam > 0
                ? ' · ainda cabe' + (faltam === 1 ? ' 1' : 'm ' + faltam)
                : ' · o teto desta rodada está completo — desmarque para trocar')
            : ' · nada é obrigatório, e nada é sugerido');
      document.querySelectorAll('.it[data-ex]').forEach(l =>
        l.classList.toggle('bloq', cheio() && !conj.has(l.dataset.ex)));
      pintarPe();
    };
    document.querySelectorAll('.it[data-ex]').forEach(l => {
      l.onclick = () => {
        if (l.classList.contains('trava')) return;
        const n = l.dataset.ex;
        if (conj.has(n)) conj.delete(n);
        else if (cheio()) return;          // o teto não empurra: ele segura
        else conj.add(n);
        pintar();
        const atual=[...document.querySelectorAll('.it')].find(x=>x.dataset.ex===n);
        if(atual?.getClientRects().length)atual.focus({preventScroll:true});
      };
    });
    contar();
  }

  if (e.t === 'resultados'){
    document.querySelectorAll('.verlaudo').forEach(b => {
      b.onclick = () => {
        const nome=b.closest('.rc').querySelector('b').textContent;
        laudos.add(b.dataset.laudo);pintar();
        const cartao=[...document.querySelectorAll('.rc')].find(c=>c.querySelector('b')?.textContent===nome&&c.querySelector('.v'));
        const parte=partesTela.findIndex(p=>p.some(n=>n===cartao||n.contains(cartao)));
        if(parte>=0){parteTela=parte;aplicarParte();pintarPe();}
      };
    });
  }

  if (e.t === 'pergunta' || e.comentado){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.alts li').forEach(li => {
      li.onclick = () => {
        const k = +li.dataset.k;
        const j = r.marcadas.indexOf(k);
        // marcar e desmarcar até confirmar: a escolha não é irreversível
        // enquanto o grupo ainda está discutindo
        if (j >= 0) r.marcadas.splice(j, 1);
        else if (r.marcadas.length < e.escolhas) r.marcadas.push(k);
        else { r.marcadas.shift(); r.marcadas.push(k); }
        document.querySelectorAll('.alts li').forEach((x, n) =>
          x.classList.toggle('marcada', r.marcadas.includes(n)));
        const b = $('#conf');
        if (b) b.disabled = r.marcadas.length < e.escolhas;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if(r.marcadas.length!==e.escolhas)return;
      r.feita = true;
      if(e.comentado)marcados[e.k]=new Set(e.alts.filter(a=>a.ok).flatMap(a=>a.exames));
      parteTela=0; pintar();
    };
  }

  if (e.t === 'pareamento'){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.par .pe').forEach(ch => {
      ch.onclick = ev => {
        ev.stopPropagation();
        const n = +ch.closest('.pi').dataset.n, m = +ch.dataset.m;
        r.marcadas[n] = (r.marcadas[n] === m) ? undefined : m;
        const linha = ch.closest('.pi');
        linha.querySelectorAll('.pe').forEach(x => x.classList.toggle('on', +x.dataset.m === r.marcadas[n]));
        const completo = e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null);
        const b = $('#conf'); if (b) b.disabled = !completo;
        const d = document.querySelector('.qdica');
        if (d) d.textContent = 'atribua uma letra a cada item · '
          + e.itens.filter((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null).length
          + ' de ' + e.itens.length;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if (!e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null)) return;
      r.feita = true; parteTela = 0; pintar();
    };
  }

  if (e.t === 'bifurcacao'){
    if (escolhas[e.k] !== undefined) return;
    document.querySelectorAll('.cam').forEach(c => {
      c.onclick = () => { escolhas[e.k] = +c.dataset.k; parteTela=0; pintar(); };
    });
  }
}

/* O único lugar em que o caso comenta o que ficou de fora, e ele só fala
   quando não há mais nada a decidir. Durante a condução, apontar o que falta
   é decidir pelo grupo. */
function mostrarRevisao(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  /* `respostas[k]` nasce quando a página é PINTADA, não quando é respondida, e
     `[].every()` é `true`: uma pergunta só visitada entrava no total e no
     acerto. Dava para chegar à revisão com "4 de 4" tendo respondido três. */
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  const acertos = feitas.filter(([k, r]) => {
    const e = ETAPAS[porId(k)];
    if (!e) return false;
    if (e.t === 'pareamento')
      return e.itens.every((it, n) => r.marcadas[n] === it.ok);
    return r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok);
  }).length;
  const total = feitas.length;

  $('#palco').innerHTML = '<section class="tela on">'
    + '<div class="fundo" style="background:#0d1014"></div>'
    + '<div class="veu tudo"></div><div class="folha">'
    + '<div class="marca"><i></i><span>Revisão</span></div>'
    + '<h2>O que ficou para trás</h2>'
    + '<p class="sub">' + acertos + ' de ' + total + ' perguntas de escolha com '
    + 'a resposta inteiramente certa · '
    + (pediu.size ? Object.keys(marcados).length + ' rodadas de exames, ' + pediu.size + ' pedidos ao todo · ' : '')
    + Object.keys(escolhas).length + ' decisões de conduta.</p>'
    + '<div class="rev">' + (faltou.length
        ? faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>'
            + r.porque + '</p></div>').join('')
        : '<div class="ok">Nada essencial ficou de fora.</div>')
    + '</div></div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><button class="bt" onclick="recomecar()">'
    + 'Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao=true;parteTela=0;montarFolhas();pintarPe();
}

function recomecar(){
  i = 0; historia = [0]; emRevisao=false;
  Object.keys(marcados).forEach(k => delete marcados[k]);
  Object.keys(respostas).forEach(k => delete respostas[k]);
  Object.keys(escolhas).forEach(k => delete escolhas[k]);
  laudos.clear(); detalhesAbertos.clear(); parteTela=0;
  pintar();
}

function vvTipo(e){
  if (e.t === 'capa') return 'capa';
  if (e.t === 'pergunta' || e.t === 'pedido') return e.t === 'pedido' ? 'exames' : 'pergunta';
  if (e.t === 'pareamento') return 'pareamento';
  if (e.t === 'bifurcacao') return 'decisao';
  if (e.t === 'resultados') return 'exames';
  if (e.t === 'desfecho') return 'desfecho';
  if (e.t === 'balanco') return 'fecho';
  const s = ((e.kicker || '') + ' ' + (e.tt || '')).toLowerCase();
  if (/exame físico|pele, membros|pele e membros/.test(s)) return 'exame';
  if (/imagem|radiograf|tomograf|ultrass|biópsia|eletrocard|\becg\b|lâmina|corpúsculo|microfoto|visual|histolog|arquitetura/.test(s)) return 'imagem';
  if (/retrospectiva|lacuna|procedência|fontes|referênc|onde o caso|créditos|fecho|onde dava/.test(s)) return 'fecho';
  if (/discuss|interpreta|diferencial|mecanismo|fenótipo|laudo|resultado|laborat/.test(s)) return 'discussao';
  if (/dia|semana|evolu|reavalia|pronto|admiss|internação|depois|terapia|alta|seguimento|prescri|conduta|tratamento|retorno|plano|visita|horas/.test(s)) return 'evolucao';
  return 'historia';
}

/* ─────────── placar e progresso ─────────── */
function vvPlacar(){
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  let certas = 0;
  feitas.forEach(([k, r]) => {
    const e = ETAPAS[porId(k)]; if (!e) return;
    if (e.t === 'pareamento'){ if (e.itens.every((it, n) => r.marcadas[n] === it.ok)) certas++; }
    else if (e.alts && r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok)) certas++;
  });
  return {certas, feitas: feitas.length};
}
const VV_CHAVE = 'casos-clinicos:progresso';
function vvGuardar(extra){
  try {
    const todo = JSON.parse(localStorage.getItem(VV_CHAVE) || '{}');
    const slug = CASO.slug || document.title;
    const seq = rotaAtual(); const aqui = Math.max(seq.indexOf(i), 0);
    const velho = todo[slug] || {};
    const pl = vvPlacar();
    todo[slug] = Object.assign({}, velho, {
      pos: Math.max(velho.fim ? 0 : (velho.pos || 0), aqui + 1), total: seq.length,
      certas: pl.certas, feitas: pl.feitas, quando: Date.now()
    }, extra || {});
    localStorage.setItem(VV_CHAVE, JSON.stringify(todo));
  } catch (_) {}
}
