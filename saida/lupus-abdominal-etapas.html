<script type="application/json" id="dados">{"caso": {"titulo": "Entre uma refeição e outra", "slug": "entre-uma-refeicao-e-outra", "cor": "#0f766e", "rodape": "Paciente ficcional · evolução simulada para ensino · versão de 27/10 18:11", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "Entre uma refeição e outra", "fundo": "cena.png", "kicker": "Caso interativo", "selo": "Paciente ficcional · fontes na última tela", "proc": ""}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Marina, auxiliar administrativa de 34 anos, chega à emergência por distensão abdominal e vômitos. Há cinco semanas sente cólicas depois das refeições. Nos primeiros dias evacuava a cada dois ou três dias; há quatro dias não evacua e, desde ontem, não elimina gases. Nas últimas 24 horas vomitou quatro vezes, mesmo depois de beber água.<\/p><p>Perdeu 4 kg porque passou a comer menos. Teve temperatura de até 37,8 °C em algumas tardes. Numa unidade de pronto atendimento recebeu escopolamina e orientação para tratar constipação; a dor melhorava por algumas horas, mas o abdome continuava aumentando.<\/p><p>Nega diarreia, sangue nas fezes, disúria ou sangramento genital. A última menstruação ocorreu há duas semanas. Não relata lesões na pele, dor nas articulações ou feridas na boca.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Antecedentes", "tt": "", "corpo": "<div class=\"tops\"><div><b>Patológicos<\/b><p>Apendicectomia aos 18 anos, sem complicações. Nenhuma doença crônica conhecida; duas gestações sem intercorrências.<\/p><\/div><div><b>Medicamentos<\/b><p>Sulfato ferroso há um mês, prescrito por cansaço e anemia leve. Escopolamina por quatro dias; dipirona ocasional. Não usa opioides, imunossupressores ou suplementos para emagrecer.<\/p><\/div><div><b>Hábitos e exposições<\/b><p>Não fuma; álcool esporádico. Não viajou, não teve contato conhecido com tuberculose e não usa drogas. Trabalha sentada e mantém alimentação habitual com carne e vegetais.<\/p><\/div><div><b>Família<\/b><p>Mãe com hipotireoidismo. Sem câncer intestinal ou doença inflamatória intestinal conhecidos na família.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div><b>37,6 °C<\/b><span>Temperatura<\/span><\/div><div><b>110/70 mmHg<\/b><span>Pressão arterial<\/span><\/div><div class=alt><b>108 bpm<\/b><span>Frequência cardíaca<\/span><\/div><div><b>20 irpm<\/b><span>Frequência respiratória<\/span><\/div><div><b>98% em ar ambiente<\/b><span>SpO₂<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral<\/b><p>Lúcida, cansada, mucosas um pouco secas; sem icterícia.<\/p><\/div><div><b>Cardiopulmonar<\/b><p>Ritmo regular, sem sopros. Ausculta pulmonar sem alterações.<\/p><\/div><div><b>Abdome<\/b><p>Distendido, timpânico, ruídos pouco frequentes. Dor difusa à palpação profunda, sem defesa ou descompressão dolorosa. Sem hérnia palpável.<\/p><\/div><div><b>Pele e articulações<\/b><p>Sem exantema, sinovite ou edema. Cicatriz de apendicectomia.<\/p><\/div><div><b>Neurológico<\/b><p>Força e sensibilidade preservadas.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "resultados", "k": "rotina", "kicker": "Na admissão", "tt": "Exames iniciais", "de": "", "fundo": "", "intro": "Hemograma, eletrólitos e avaliação renal foram colhidos na chegada. Enzimas hepáticas e bilirrubinas não apresentam alterações.", "nota": "", "laminas": {}, "todos": ["Hemoglobina / VCM", "Leucócitos", "Plaquetas", "Sódio / potássio", "Creatinina / albumina", "Lipase / lactato", "Urina / teste de gravidez"], "sobre": {"Hemoglobina / VCM": {"n": "Hemoglobina / VCM", "r": "10,2 g/dL / 88 fL", "ref": "12–16 g/dL / 80–100 fL", "a": 1}, "Leucócitos": {"n": "Leucócitos", "r": "2.900/mm³ · neutrófilos 1.800 · linfócitos 700", "ref": "4.000–11.000/mm³", "a": 1}, "Plaquetas": {"n": "Plaquetas", "r": "142.000/mm³", "ref": "150.000–450.000/mm³", "a": 1}, "Sódio / potássio": {"n": "Sódio / potássio", "r": "133 / 2,9 mmol/L", "ref": "135–145 / 3,5–5,0 mmol/L", "a": 1}, "Creatinina / albumina": {"n": "Creatinina / albumina", "r": "0,8 mg/dL / 2,8 g/dL", "ref": "0,6–1,1 / 3,5–5,0", "a": 1}, "Lipase / lactato": {"n": "Lipase / lactato", "r": "32 U/L / 1,2 mmol/L", "ref": "até 60 / 0,5–2,0", "a": 0}, "Urina / teste de gravidez": {"n": "Urina / teste de gravidez", "r": "Sem proteinúria ou hematúria · β-hCG negativo", "ref": "—", "a": 0}}, "rota": null}, {"t": "pergunta", "k": "q1", "kicker": "Pergunta 1", "enunciado": "Quais três hipóteses você mantém inicialmente?", "alts": [{"t": "Gastroenterite viral", "c": "", "ok": 0}, {"t": "Íleo paralítico", "c": "", "ok": 1}, {"t": "Cólica biliar", "c": "", "ok": 0}, {"t": "Pancreatite aguda", "c": "", "ok": 0}, {"t": "Doença inflamatória intestinal", "c": "", "ok": 1}, {"t": "Obstrução por bridas", "c": "", "ok": 1}], "escolhas": 3, "fundo": "", "exp": [{"h": "Hipóteses de trabalho", "t": "Cirurgia prévia torna bridas plausíveis. Potássio baixo e anticolinérgico podem reduzir a motilidade; isso não prova que expliquem todo o quadro. Uma doença intestinal inflamatória também pode produzir perda de peso e obstrução."}, {"h": "O que ainda falta", "t": "A duração e a ausência de diarreia enfraquecem gastroenterite. Dor difusa, lipase normal e ausência de padrão biliar reduzem as demais opções. Exame seriado e imagem devem procurar obstrução, sofrimento de alça e causas sistêmicas."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "suporte_inicial", "kicker": "Primeiras medidas", "tt": "", "corpo": "<p>Marina permanece em jejum, recebe hidratação venosa com reavaliação e reposição de potássio e magnésio. Uma sonda nasogástrica drena 700 mL e reduz os vômitos. Escopolamina e ferro são suspensos. A cirurgia acompanha o exame abdominal; não há peritonite ou sinal clínico de isquemia.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "rx_inicial", "kicker": "Discussão de imagem", "tt": "Radiografia de abdome", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>O exame é obtido durante a descompressão inicial. Como você descreve a distribuição do gás?<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Alças de intestino delgado distendidas.<\/p><p>A radiografia não determina sozinha se existe um bloqueio mecânico. A avaliação clínica e, quando indicada, a TC esclarecem melhor a anatomia.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 915.4\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CRIGM2020-8873917.001.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"915.4\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Abdome em incidência frontal.<span class=\"cr\">Nyabera et al., 2020 · CC BY 4.0 · marcação vermelha original<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_imagem", "kicker": "Decisão", "tt": "Investigação inicial", "enunciado": "Qual exame você solicita agora?", "caminhos": [{"r": "Tomografia de abdome com contraste", "vai": "ct_precoce", "c": "Avalia ponto de transição, parede, mesentério e complicações. A função renal está preservada; suporte e exame seriado continuam.", "rc": ""}, {"r": "Trânsito intestinal contrastado", "vai": "transito", "c": "Pode estudar trânsito em situações selecionadas, mas vômitos e suspeita de obstrução exigem avaliar segurança e podem impedir completar o exame.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "ct_precoce", "kicker": "Tomografia solicitada", "tt": "", "corpo": "<p>Após a descompressão e a reposição inicial, Marina realiza TC. A cirurgia revê as imagens junto da clínica. Não se identificam alça fechada, pneumoperitônio ou lesão vascular.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tc", "conforme": null, "rota": null}, {"t": "pagina", "k": "transito", "kicker": "Durante o exame", "tt": "", "corpo": "<p>Marina recebe a primeira porção do contraste oral, mas volta a vomitar. O exame é interrompido e a sonda retorna à drenagem. Ela continua sem defesa abdominal; não há imagem conclusiva de uma estenose.<\/p><p>A equipe solicita TC para esclarecer a anatomia antes de insistir no contraste enteral. O episódio acrescenta perdas digestivas e reposição; não demonstra sozinho uma obstrução mecânica.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tc", "conforme": null, "rota": null}, {"t": "pagina", "k": "tc", "kicker": "Discussão de imagem", "tt": "Tomografia de abdome", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>A cirurgia e a clínica reveem a TC. Compare o intestino e os sistemas coletores antes de abrir o laudo.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>O estudo completo descreve distensão do delgado e espessamento de segmentos, ascite e dilatação bilateral dos sistemas coletores e ureteres.<\/p><p>Não se identifica ponto de transição ou massa obstrutiva no estudo completo. Esses achados não definem a causa. Ausência de cálculo e avaliação de isquemia dependem da série completa, não apenas destes dois painéis.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 425.7\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CRIGM2020-8873917.002.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"425.7\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Corte axial (a) e reconstrução coronal (b).<span class=\"cr\">Nyabera et al., 2020 · CC BY 4.0 · marcações vermelhas originais<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q2", "kicker": "Pergunta 2", "enunciado": "Quais duas conclusões são sustentadas pela avaliação até aqui?", "alts": [{"t": "A alteração do potássio pode contribuir sem explicar o quadro inteiro", "c": "", "ok": 1}, {"t": "A cirurgia prévia estabelece bridas como causa", "c": "", "ok": 0}, {"t": "A ausência de uma massa exclui neoplasia intestinal", "c": "", "ok": 0}, {"t": "O espessamento intestinal confirma doença de Crohn", "c": "", "ok": 0}, {"t": "Não há obstrução mecânica demonstrada", "c": "", "ok": 1}], "escolhas": 2, "fundo": "", "exp": [{"h": "Anatomia e função", "t": "Alças dilatadas sem transição definida favorecem uma alteração de motilidade, mas não dispensam reavaliação se surgir peritonite ou piora. A TC não confirma uma doença específica pela espessura da parede."}, {"h": "Integração", "t": "Hipocalemia e medicamentos são causas tratáveis. A perda de peso, a albumina baixa e as citopenias pedem acompanhamento além da retirada do anticolinérgico. Uma hipótese funcional intestinal primária ainda seria prematura."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "comparacao_mecanica", "kicker": "Discussão de imagem", "tt": "Comparação de padrões", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>Após discutir a TC, compare este padrão radiográfico de obstrução mecânica com a investigação de Marina. Qual informação a radiografia não fornece?<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Alças distendidas e níveis hidroaéreos no exemplo de obstrução mecânica.<\/p><p>Distensão e níveis podem ocorrer em mecanismos diferentes. A localização de uma transição, a evolução e os sinais de sofrimento intestinal ajudam a decidir a conduta; a aparência do gás não confirma a etiologia.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 1356.1\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"rx_obstrucao_comparacao.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"1356.1\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Radiografia para discussão do padrão de distensão.<span class=\"cr\">Acervo de Matheus Parente · Szejnfeld e Abdala, 2015 · cap. 66, p. 423 · marcações originais<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "evolucao", "kicker": "Terceiro dia", "tt": "", "corpo": "<p>O potássio chega a 4,0 mmol/L e o magnésio a 2,0 mg/dL. Marina está melhor hidratada, mas a sonda continua drenando cerca de 900 mL por dia. Uma tentativa de líquidos provoca distensão e náusea. A temperatura atinge 38,1 °C, sem instabilidade.<\/p><p>O hemograma mantém leucopenia e anemia. A perda de peso precedia o uso de escopolamina; a suspensão do medicamento e a correção dos eletrólitos não resolveram o problema. Hemoculturas foram colhidas; a equipe revisa exposições, infecção e doença sistêmica.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q3", "kicker": "Pergunta 3", "enunciado": "Quais três exames você acrescenta nesta reavaliação?", "alts": [{"t": "Complemento C3", "c": "", "ok": 1}, {"t": "CA-125", "c": "", "ok": 0}, {"t": "Cortisol sérico", "c": "", "ok": 0}, {"t": "Calprotectina fecal", "c": "", "ok": 0}, {"t": "FAN", "c": "", "ok": 1}, {"t": "ANCA", "c": "", "ok": 0}, {"t": "Relação proteína/creatinina urinária", "c": "", "ok": 1}], "escolhas": 3, "fundo": "", "exp": [{"h": "Investigar doença sistêmica", "t": "Citopenias persistentes e alterações em mais de um território justificam pesquisar autoimunidade e avaliar o rim, mesmo sem queixas urinárias. FAN é um teste de entrada; C3 e urina ajudam a interpretar o conjunto, não a confirmar isoladamente uma doença."}, {"h": "Prioridade relativa", "t": "CA-125 pode subir por irritação peritoneal e não resolveria a causa. Não há padrão de vasculite, crise adrenal ou diarreia inflamatória que dê maior prioridade às outras opções. Elas podem ganhar utilidade se surgirem novos dados."}], "tr": "", "nota": "", "segue": ""}, {"t": "resultados", "k": "painel_sistemico", "kicker": "Reavaliação", "tt": "Exames solicitados", "de": "", "fundo": "", "intro": "FAN, C3 e avaliação urinária foram feitos em paralelo à reavaliação do abdome. O laboratório complementa o painel conforme a suspeita clínica.", "nota": "", "laminas": {}, "todos": ["FAN", "C3", "Relação proteína/creatinina urinária", "Leucócitos / plaquetas", "Hemoculturas"], "sobre": {"FAN": {"n": "FAN", "r": "Reagente, 1:640, padrão nuclear pontilhado", "ref": "não reagente", "a": 1}, "C3": {"n": "C3", "r": "52 mg/dL", "ref": "90–180 mg/dL", "a": 1}, "Relação proteína/creatinina urinária": {"n": "Relação proteína/creatinina urinária", "r": "0,18 g/g", "ref": "abaixo de 0,2 g/g", "a": 0}, "Leucócitos / plaquetas": {"n": "Leucócitos / plaquetas", "r": "2.700 / 128.000 por mm³", "ref": "4.000–11.000 / 150.000–450.000", "a": 1}, "Hemoculturas": {"n": "Hemoculturas", "r": "Sem crescimento até o momento", "ref": "—", "a": 0}}, "rota": null}, {"t": "pergunta", "k": "q4", "kicker": "Pergunta 4", "enunciado": "Quais três hipóteses ainda precisam ser comparadas?", "alts": [{"t": "Linfoma com comprometimento abdominal", "c": "", "ok": 1}, {"t": "Tuberculose peritoneal", "c": "", "ok": 1}, {"t": "Íleo exclusivamente medicamentoso", "c": "", "ok": 0}, {"t": "Síndrome do intestino irritável", "c": "", "ok": 0}, {"t": "Esclerose sistêmica estabelecida", "c": "", "ok": 0}, {"t": "Lúpus eritematoso sistêmico", "c": "", "ok": 1}], "escolhas": 3, "fundo": "", "exp": [{"h": "O que o resultado muda", "t": "FAN e complemento baixo tornam lúpus uma hipótese relevante, sem fechar o diagnóstico. Infecção e neoplasia continuam no diferencial da febre, perda de peso e ascite. Investigar essas possibilidades influencia a segurança da imunossupressão."}, {"h": "O que não explica tudo", "t": "Não foram demonstrados os achados necessários para afirmar esclerose sistêmica. Um transtorno funcional ou efeito medicamentoso isolado integra mal as citopenias, a febre e a alteração do complemento. A atribuição final exige clínica, exames e evolução."}], "tr": "", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b_amostra", "kicker": "Decisão", "tt": "Complementar a investigação", "enunciado": "Qual amostra você prioriza entre as opções disponíveis?", "caminhos": [{"r": "Paracentese diagnóstica", "vai": "liquido", "c": "Há janela segura ao ultrassom; o líquido permite avaliar celularidade, proteínas, culturas e citologia.", "rc": ""}, {"r": "Biópsia endoscópica de mucosa intestinal", "vai": "mucosa", "c": "Pode investigar doença da mucosa e algumas infecções. Um resultado normal não avalia toda a parede nem exclui distúrbio de motilidade.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "liquido", "kicker": "Líquido ascítico", "tt": "", "corpo": "<p>A paracentese obtém líquido claro, com 280 células/mm³ e predomínio linfocitário. Não há neutrofilia que sustente peritonite bacteriana. Cultura bacteriana e citologia são negativas. A pesquisa inicial para micobactérias é negativa; a cultura permanece em processamento.<\/p><p>Nenhum desses resultados, isoladamente, exclui tuberculose ou neoplasia. A equipe reúne o baixo volume de ascite, a ausência de massa e a evolução dos demais órgãos.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "novo_exame", "conforme": null, "rota": null}, {"t": "pagina", "k": "mucosa", "kicker": "Endoscopia com biópsias", "tt": "", "corpo": "<p>Após descompressão, a endoscopia encontra mucosa duodenal sem ulceração. As biópsias não demonstram granulomas, neoplasia ou inflamação mucosa relevante. O procedimento não avalia de forma adequada o músculo e os nervos responsáveis pela motilidade.<\/p><p>As amostras não estabelecem a causa. A equipe mantém acompanhamento clínico, microbiologia e reavaliação das citopenias.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "novo_exame", "conforme": null, "rota": null}, {"t": "pagina", "k": "novo_exame", "kicker": "Quinto dia", "tt": "", "corpo": "<p>Marina passa a ter duas úlceras no palato e dor nas mãos. Ao reexame, há sinovite em articulações metacarpofalângicas, ausente na chegada. Ela continua sem tolerar alimentação, apesar de eletrólitos normais e da retirada dos medicamentos constipantes.<\/p><p>Anti-DNA nativo retorna reagente em título elevado e C4 é 6 mg/dL (referência: 10–40). A reumatologia revê os dados. Culturas bacterianas permanecem negativas e não se identificou foco que explique o conjunto.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q5", "kicker": "Pergunta 5", "enunciado": "Quais duas interpretações melhor integram a evolução?", "alts": [{"t": "Culturas iniciais negativas excluem toda infecção abdominal", "c": "", "ok": 0}, {"t": "A ausência de proteinúria importante exclui lúpus", "c": "", "ok": 0}, {"t": "Os novos achados tornam uma doença autoimune sistêmica a explicação mais consistente", "c": "", "ok": 1}, {"t": "O FAN positivo, sozinho, já estabelecia o diagnóstico na primeira coleta", "c": "", "ok": 0}, {"t": "O exame urinário pouco alterado não impede uma doença sistêmica", "c": "", "ok": 1}], "escolhas": 2, "fundo": "", "exp": [{"h": "Do resultado à doença", "t": "As manifestações surgiram em momentos diferentes. Citopenias, consumo de complemento, anticorpo específico, úlceras orais e sinovite passam a formar um conjunto coerente para lúpus; a interpretação não depende apenas do FAN."}, {"h": "Abdome", "t": "O quadro de pseudo-obstrução é atribuído à doença sistêmica após excluir razoavelmente obstrução mecânica e outras causas. Nem toda manifestação de lúpus exige nefrite, e a mucosa pode ser pouco alterada em distúrbios neuromusculares intestinais."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "discussao", "kicker": "Discussão anatomoclínica", "tt": "", "corpo": "<p>O diagnóstico de trabalho é lúpus eritematoso sistêmico com pseudo-obstrução intestinal. Não foi uma biópsia isolada que nomeou a doença: a evolução acrescentou manifestações clínicas e laboratoriais que não estavam presentes na primeira consulta.<\/p><p>A equipe mantém o exame abdominal seriado e acompanha culturas pendentes. Dor com defesa, elevação de lactato ou novos sinais de isquemia obrigariam a rever a hipótese e a urgência cirúrgica. A baixa tolerância alimentar exige suporte nutricional individualizado.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_tratamento", "kicker": "Decisão", "tt": "Tratamento inicial", "enunciado": "Qual via você escolhe para iniciar o glicocorticoide neste momento?", "caminhos": [{"r": "Intravenosa", "vai": "via_ev", "c": "Vômitos e trânsito muito reduzido tornam a exposição oral incerta; a via intravenosa garante a administração.", "rc": ""}, {"r": "Oral", "vai": "via_oral", "c": "É viável quando há absorção e tolerância. Nesta fase, vômitos e drenagem pela sonda exigem acompanhar se a dose é efetivamente recebida.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "via_ev", "kicker": "Após iniciar tratamento", "tt": "", "corpo": "<p>Após avaliação conjunta e revisão de infecção, Marina recebe metilprednisolona intravenosa, 500 mg/dia por três dias. Nas 48 horas seguintes a drenagem diminui, ela elimina gases e a dor das mãos cede. A dieta é retomada em pequenas porções.<\/p><p>A resposta apoia a interpretação clínica, mas não funciona como teste exclusivo para lúpus. A equipe faz transição para prednisona oral e planeja redução conforme atividade e tolerância.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q6", "conforme": null, "rota": null}, {"t": "pagina", "k": "via_oral", "kicker": "Após a primeira tentativa", "tt": "", "corpo": "<p>Marina vomita a dose oral e continua com drenagem elevada pela sonda. Não há exposição confiável ao medicamento. A equipe muda para metilprednisolona intravenosa e mantém suporte nutricional; a retomada alimentar será mais lenta neste percurso.<\/p><p>Vômitos não demonstram resistência imunológica. Antes de aumentar uma dose ou trocar de imunossupressor, é preciso distinguir falha de absorção de falha de efeito.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q6", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q6", "kicker": "Pergunta 6", "enunciado": "Quais duas medidas você inclui no plano após o controle inicial?", "alts": [{"t": "Manter a dose de pulso até normalizar o FAN", "c": "", "ok": 0}, {"t": "Definir atividade da doença apenas pelo título do FAN", "c": "", "ok": 0}, {"t": "Redução programada do glicocorticoide", "c": "", "ok": 1}, {"t": "Hidroxicloroquina conforme peso e avaliação clínica", "c": "", "ok": 1}, {"t": "Retomar anticolinérgico regularmente", "c": "", "ok": 0}], "escolhas": 2, "fundo": "", "exp": [{"h": "Controle sustentado", "t": "Hidroxicloroquina integra o manejo do lúpus quando não há contraindicação; dose, interações e seguimento ocular são revistos. Glicocorticoide deve ser reduzido conforme atividade, com objetivo de minimizar exposição."}, {"h": "O que acompanhar", "t": "Sintomas, exame, hemograma, função renal, urina e complemento têm utilidade clínica. O FAN não é um alvo para manter pulsos. A recuperação nutricional e do trânsito deve ser acompanhada, inclusive após melhora articular."}], "tr": "", "nota": "", "segue": "manutencao"}, {"t": "pagina", "k": "manutencao", "kicker": "Plano e seguimento", "tt": "", "corpo": "<p>Com 54 kg, o plano inclui hidroxicloroquina 200 mg/dia e seguimento reumatológico e oftalmológico. A prednisona oral é ajustada e reduzida de acordo com atividade; o objetivo é evitar dependência de dose alta. São revistos risco infeccioso, vacinação e prevenção de complicações do corticoide.<\/p><p>Hemograma, urina, creatinina, eletrólitos e recuperação alimentar são reavaliados. A dieta e o suporte são conduzidos em conjunto com nutrição. A resposta dos órgãos pode ocorrer em velocidades diferentes.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q7", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q7", "kicker": "Pergunta 7", "enunciado": "Quais duas mudanças no seguimento exigem reabrir a investigação abdominal?", "alts": [{"t": "Recuperação lenta do peso com ingestão progressivamente melhor", "c": "", "ok": 0}, {"t": "Recorrência de vômitos com perda de peso", "c": "", "ok": 1}, {"t": "Persistência de anticorpo isolado em paciente assintomática", "c": "", "ok": 0}, {"t": "FAN ainda reagente sem mudança clínica", "c": "", "ok": 0}, {"t": "Dor nova com defesa abdominal", "c": "", "ok": 1}], "escolhas": 2, "fundo": "", "exp": [{"h": "Reavaliar a síndrome", "t": "Uma pessoa com lúpus também pode ter obstrução, infecção e complicações vasculares. O diagnóstico anterior não deve explicar automaticamente todo novo sintoma. Defesa abdominal pede avaliação urgente; recorrência com perda de peso exige revisão de trânsito, nutrição, remédios e atividade."}, {"h": "Evitar exames sem pergunta", "t": "Anticorpos podem persistir após melhora. A conduta deve responder à mudança clínica e dos órgãos, sem tratar isoladamente a permanência do FAN."}], "tr": "", "nota": "", "segue": "encaminhamento_final"}, {"t": "pagina", "k": "encaminhamento_final", "kicker": "Fim da internação", "tt": "", "corpo": "<p>O plano é revisto com Marina e sua família, incluindo sinais para retorno, acesso aos medicamentos e consultas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b_tratamento", "para": ["alta_alimentacao", "suporte_nutricional"]}, "rota": null}, {"t": "desfecho", "k": "alta_alimentacao", "kicker": "Desfecho", "tt": "Seguimento ambulatorial", "corpo": "<p>Marina recebe alta após voltar a tolerar refeições. Em seis semanas, recupera 2 kg, não apresenta novos vômitos e mantém creatinina normal. A leucopenia melhora parcialmente. A dilatação urinária e as alterações intestinais diminuem no controle de imagem.<\/p>", "q": "melhor", "porque": "Neste percurso, houve exposição adequada ao tratamento e recuperação alimentar suficiente para seguimento ambulatorial.", "fundo": "", "fecho": "controle_imagem"}, {"t": "desfecho", "k": "suporte_nutricional", "kicker": "Desfecho", "tt": "Continuidade do suporte nutricional", "corpo": "<p>Após a troca para a via intravenosa, Marina melhora, mas permanece com intolerância alimentar por mais dias. Precisa de suporte nutricional prolongado e transição supervisionada antes da alta. O objetivo é recuperar ingestão e função, sem insistir em medicamento que não estava sendo absorvido.<\/p>", "q": "medio", "porque": "A diferença deste percurso é a exposição inicial incerta e a necessidade prolongada de suporte; não se afirma que toda tentativa oral tenha esse desfecho.", "fundo": "", "fecho": "controle_imagem"}, {"t": "pagina", "k": "controle_imagem", "kicker": "Discussão de imagem", "tt": "Controle de imagem", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>Depois da recuperação alimentar, o controle radiológico é comparado ao estudo inicial. A imagem acompanha a avaliação clínica, sem definir sozinha remissão.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Redução da distensão e da dilatação dos sistemas coletores descrita no controle.<\/p><p>A resposta em conjunto com manifestações sistêmicas e investigação de alternativas sustenta a interpretação clínica. Resposta ao corticoide isolada não confirma lúpus.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 803.4\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CRIGM2020-8873917.003.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"803.4\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Controle tomográfico após tratamento.<span class=\"cr\">Nyabera et al., 2020 · CC BY 4.0 · marcações vermelhas originais<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "retrospectiva", "conforme": null, "rota": null}, {"t": "pagina", "k": "retrospectiva", "kicker": "Pontos de ensino", "tt": "", "corpo": "<ol class=\"pontos\"><li data-n=\"1\"><p>Distinguir obstrução mecânica de alteração da motilidade exige clínica e imagem, sem ignorar sinais cirúrgicos.<\/p><\/li><li data-n=\"2\"><p>Hipocalemia e medicamentos podem contribuir sem explicar toda a evolução.<\/p><\/li><li data-n=\"3\"><p>FAN não confirma lúpus sozinho; as manifestações podem surgir em consultas diferentes.<\/p><\/li><li data-n=\"4\"><p>A investigação de infecção e neoplasia deve acompanhar a hipótese inflamatória.<\/p><\/li><li data-n=\"5\"><p>Uma via de administração inadequada pode parecer falha do tratamento.<\/p><\/li><\/ol>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "referencias", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Caso e percursos autorais, inspirados em relatos de pseudo-obstrução como apresentação do lúpus. Valores, cronologia e respostas simulados para ensino; não reproduzem um paciente real.<\/p><p><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC4479744/\">Oh et al., Intestinal Research 2015<\/a>; <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7683163/\">Nyabera et al., 2020, figuras abdominais, CC BY 4.0<\/a>; <a href=\"https://ard.bmj.com/content/early/2023/10/11/ard-2023-224762\">EULAR 2023, manejo de lúpus<\/a>. Capas: ilustração original de paciente ficcional. Material do atlas: acervo de Matheus Parente, com referência original junto à figura. As amostras invasivas e respostas dos ramos são construções didáticas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}], "banco": {}, "revisao": [], "imgs": {"cena.png": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAFeKADAAQAAAABAAADpQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgDpQV4AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1t   const ativos = new Set(partesTela[parteTela] || []);
  [...areaTela.children].forEach(el => el.toggleAttribute('data-fora', !ativos.has(el)));
  areaTela.scrollTop = 0; areaTela.scrollLeft = 0;
}
function virarParte(delta){
  parteTela += delta; aplicarParte(); pintarPe();
}
function montarFolhas(){
  partesTela = []; areaTela = null;
  const root = document.querySelector('#palco .plano,#palco .folha,#palco .fim .caixa');
  if (!root) return;
  const mobile = innerWidth <= 900;
  if (mobile && root.classList.contains('plano')){
    const figura = document.querySelector('#palco .lamina');
    if (figura) root.append(figura);
  }
  let area = root.querySelector(':scope > .qexp,:scope > .alts,:scope > .grupos,:scope > .res,:scope > .cams,:scope > .painel-lab,:scope > .par,:scope > .observacao-imagem');
  if (!area){
    root.classList.add('paginavel');
    area = document.createElement('div'); area.className = 'conteudo-paginado';
    const filhos = [...root.children];
    // Conserva o título como referência em todas as páginas de continuação.
    filhos.filter(el => !el.matches('.marca,h1,h2')).forEach(el => area.append(el));
    root.append(area);
  }
  if(area.classList.contains('cams')){const aviso=root.querySelector(':scope>.forca');if(aviso)area.append(aviso);}
  if(mobile)root.querySelectorAll('table').forEach(t=>{const nomes=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,n)=>td.dataset.col=nomes[n]||''));});
  area.classList.add('area-paginada'); areaTela = area;
  // Respostas e resultados permanecem inteiros: a densidade se adapta à tela.
  if(area.matches('.qexp,.alts,.res,.cams,.painel-lab,.par,.observacao-imagem')){
    root.classList.add('tela-unica');
    if(area.matches('.painel-lab,.observacao-imagem'))root.classList.add('paginavel');
    // Um quadro interno com overflow escondido (a tabela de exames, por
    // exemplo) pode cortar conteúdo sem que a área transborde: conta também.
    const cortado=()=>[...area.querySelectorAll('*')].some(el=>el.clientHeight>0&&el.scrollHeight>el.clientHeight+2&&!el.closest('.vv-est-fig')&&/hidden|auto|scroll|clip/.test(getComputedStyle(el).overflowY));
    const cabe=()=>area.scrollHeight<=area.clientHeight+1&&area.scrollWidth<=area.clientWidth+1&&!cortado();
    let fator=1;
    root.style.setProperty('--compacto',fator);
    while(!cabe()&&fator>0.25){fator=Math.max(0.25,fator-0.015);root.style.setProperty('--compacto',fator.toFixed(3));}
    partesTela=[[...area.children]];parteTela=0;aplicarParte();return;
  }

  // O flex precisa reservar espaço aos cabeçalhos e aos botões antes da medição.
  const capacidade = () => area.clientHeight;
  function grande(el){ const st=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0) > capacidade() - 3; }
  function dividir(el){
    if (!grande(el)) return false;
    if(mobile && el.matches('.grade,.bal,div:not([class])')){el.replaceWith(...el.children);return true;}
    let filhos = [], criar;
    if (el.matches('.gr')){
      filhos = [...el.querySelectorAll(':scope > .it')];
      criar = () => { const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c; };
    } else if (el.matches('.tops,.grade,.vit,.corpo .lg,aside,.cons,.rev,.bal,.painel-lab,.pontos')){
      filhos = [...el.children]; criar=()=>el.cloneNode(false);
    } else if (el.matches('.estudo-imagem') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('.corpo') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('table')){
      filhos=[...el.querySelectorAll('tbody tr')];
      criar=()=>{const c=el.cloneNode(false);if(el.tHead)c.append(el.tHead.cloneNode(true));c.append(document.createElement('tbody'));return c;};
    } else if (el.matches('details[open]')){
      filhos=[...el.children].filter(x=>x.tagName!=='SUMMARY');
      criar=()=>{const c=document.createElement('div');c.className='leitura continuacao-leitura';return c;};
    } else if (el.matches('.rc') && el.querySelector('figure')){
      filhos=[...el.children].filter(x=>x.tagName!=='B');
      criar=()=>{const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c;};
    }
    // Contêiner com um filho só: o que precisa partir é o filho.
    if (filhos.length === 1) return dividir(filhos[0]);
    if (filhos.length > 1){
      if(el.matches('.gr')){
        // Conserva o máximo de opções por grupo que a altura comporta.
        const blocos=[];let atual=criar();el.before(atual);
        for(const f of filhos){atual.append(f);if(grande(atual)&&atual.querySelectorAll('.it').length>1){f.remove();blocos.push(atual);atual=criar();el.before(atual);atual.append(f);}}
        el.remove();return true;
      }
      // Blocos inteiros, com cabeçalhos repetidos onde necessários.
      const novos=filhos.map(f=>{const c=criar();(c.tBodies?.[0]||c).append(f);return c;});
      el.replaceWith(...novos);return true;
    }
    if(el.matches('.cam') && el.querySelector('.c')?.textContent && !el.dataset.discussao){
      const comentario=el.querySelector('.c'),c=el.cloneNode(false);c.dataset.discussao='1';
      c.append(el.querySelector('.l').cloneNode(true));const rot=document.createElement('span');rot.className='r';rot.textContent='Discussão do caminho '+el.querySelector('.l').textContent;c.append(rot,comentario);el.after(c);return true;
    }
    const seletor=el.matches('p')?null:'.c,.cm,:scope>p';
    const alvo=seletor?el.querySelector(seletor):el;
    if(alvo && alvo.textContent.length>120){
      const walker=document.createTreeWalker(alvo,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      const txt=alvo.textContent,mid=txt.indexOf(' ',Math.floor(txt.length/2));
      if(mid<0)return false;
      let used=0,cut;
      for(const n of nodes){if(used+n.length>=mid){cut=[n,mid-used];break;}used+=n.length;}
      if(!cut)return false;
      const a=document.createRange();a.selectNodeContents(alvo);a.setEnd(...cut);
      const b=document.createRange();b.selectNodeContents(alvo);b.setStart(...cut);
      const left=el.cloneNode(true),right=el.cloneNode(true);
      (seletor?left.querySelector(seletor):left).replaceChildren(a.cloneContents());
      (seletor?right.querySelector(seletor):right).replaceChildren(b.cloneContents());
      el.replaceWith(left,right);return true;
    }
    return false;
  }
  // Une novamente apenas na próxima renderização; os originais continuam nos dados do caso.
  for(let pass=0;pass<8;pass++){
    let mudou=false;
    for(const el of [...area.children])if(dividir(el))mudou=true;
    if(!mudou)break;
  }
  const itens=[...area.children];
  itens.forEach(el=>el.setAttribute('data-fora',''));
  let folha=[];
  for(const el of itens){
    el.removeAttribute('data-fora');
    const excedeu = area.scrollHeight>area.clientHeight+2 || area.scrollWidth>area.clientWidth+2;
    if(excedeu && folha.length){
      partesTela.push(folha);folha.forEach(n=>n.setAttribute('data-fora',''));folha=[];
    }
    folha.push(el);
  }
  if(folha.length)partesTela.push(folha);
  aplicarParte();
}

/* ═══════════ o caso em etapas — página a página ═══════════

   Uma folha de cada vez. Nada rola: a página inteira é uma etapa, e passar de
   etapa é virar a folha. O que decide a folha seguinte é o que foi respondido
   na atual.

   Três coisas o motor guarda entre as etapas: os exames marcados em cada
   pedido, as respostas dadas, e o caminho escolhido em cada bifurcação. É com
   os exames marcados que a página de resultados sabe o que devolver — e é por
   isso que o que não foi pedido não aparece. */

const DADOS = JSON.parse(document.getElementById('dados').textContent);
const CASO = DADOS.caso, ETAPAS = DADOS.etapas, BANCO = DADOS.banco;
const REVISAO = DADOS.revisao;
/* As imagens viajam numa tabela à parte, uma vez cada: a etapa guarda
   só o nome do arquivo. */
const IMG = n => (DADOS.imgs || {})[n] || n || '';

const $ = s => document.querySelector(s);

/* ─────────────────────────── estado da sessão ─────────────────────────── */

let emRevisao = false;
let i = 0;                    // índice da etapa atual
const marcados = {};          // ident do pedido -> Set de nomes de exame
const respostas = {};         // ident da pergunta -> {marcadas:[], feita:bool}
const escolhas = {};          // ident da bifurcação -> índice do caminho
let historia = [0];           // pilha de etapas visitadas, para voltar
const laudos = new Set(); // laudos revelados por rodada de investigação

const porId = k => ETAPAS.findIndex(e => e.k === k);
/* Tudo o que já foi pedido em qualquer rodada, para os pré-requisitos e para
   as consequências do fim. */
function jaPedido(nome){
  return Object.values(marcados).some(c => c.has(nome));
}
const etapa = () => ETAPAS[i];

/* ─────────────────────────── navegação ─────────────────────────── */

function ir(n, empilhar){
  if (n < 0 || n >= ETAPAS.length) return;
  if (empilhar !== false) historia.push(n);
  i = n; parteTela = 0; emRevisao=false;
  pintar();
}

function irPara(k){
  const n = porId(k);
  if (n < 0){ console.warn('etapa inexistente:', k); return; }
  ir(n);
}

/* A folha seguinte é a vizinha, a menos que a etapa atual diga outra coisa —
   é assim que a bifurcação muda o rumo sem que a lista de etapas mude. */
function adiante(){
  if (temProximaParte()){ virarParte(1); return; }
  if(emRevisao){recomecar();return;}
  const e = etapa();
  if(e.comentado){
    const r=respostas[e.k];if(!r?.feita)return;
    const alts=e.alts.filter(a=>a.ok);
    marcados[e.k]=new Set(alts.flatMap(a=>a.exames));
    r.conducao='indicados';
  }
  if (e.t === 'bifurcacao'){
    const esc = escolhas[e.k];
    if (esc === undefined) return;
    irPara(e.caminhos[esc].vai);
    return;
  }
  if (e.t === 'desfecho'){
    if (e.fecho) irPara(e.fecho); else mostrarRevisao();
    return;
  }
  /* A rota é a ramificação de verdade: quem não pediu a prova não recebe a
     página que a discute. Sem isto, a peça perguntava "que exames você pede?" e
     depois seguia contando o resultado de exames que ninguém pediu — que é
     exatamente o vício que este formato existe para não ter. */
  if (e.rota){
    const pedidos = new Set();
    Object.values(marcados).forEach(c => c.forEach(n => pedidos.add(n)));
    const tem = e.rota.pediu.every(n => pedidos.has(n));
    irPara(tem ? e.rota.entao : e.rota.senao);
    return;
  }
  /* A evolução volta a se separar aqui: a página é a mesma para os três
     caminhos até o ponto em que o hemograma deixa de ser o mesmo. */
  if (e.conforme){
    const k = escolhas[e.conforme.de];
    irPara(e.conforme.para[k === undefined ? 0 : k]);
    return;
  }
  // `segue` deixa a ordem do arquivo de ser a única costura entre as páginas:
  // é o que permite três trilhas de tratamento convivendo na mesma lista
  if (e.segue){ irPara(e.segue); return; }
  if (i + 1 >= ETAPAS.length){ mostrarRevisao(); return; }
  ir(i + 1);
}

function atras(){
  if (parteTela > 0){ virarParte(-1); return; }
  if(emRevisao){emRevisao=false;parteTela=0;pintar();return;}
  const e = etapa();
  if (historia.length < 2) return;
  historia.pop();
  i = historia[historia.length - 1];
  pintar();
}

/* Quando se pode virar a folha. Pergunta sem resposta e pedido sem nenhum
   exame marcado seguram a página: o caso não anda por cima de uma decisão que
   não foi tomada. */
function podeAdiante(){
  if (emRevisao || temProximaParte()) return true;
  const e = etapa();
  if (e.t === 'pergunta' || e.t === 'pareamento')
    return !!(respostas[e.k] && respostas[e.k].feita);
  if (e.t === 'bifurcacao') return escolhas[e.k] !== undefined;
  if (e.t === 'pedido') return e.comentado ? !!respostas[e.k]?.feita : (marcados[e.k] || new Set()).size > 0;
  return true;
}

/* ─────────────────────────── o trilho ─────────────────────────── */

/* Desde que o caso ramifica, a lista de etapas deixou de ser o caminho: ela
   contém as páginas das DUAS rotas, e contar 27 num percurso de 19 é mentir
   para quem olha o trilho. Esta função percorre o caso a partir do estado
   atual e devolve só as páginas que este percurso vai ver. */
function rotaAtual(){
  const seq = [], visto = new Set();
  const pedidos = new Set();
  Object.values(marcados).forEach(c => c.forEach(x => pedidos.add(x)));
  let n = 0;
  while (n >= 0 && n < ETAPAS.length && !visto.has(n)){
    visto.add(n); seq.push(n);
    const e = ETAPAS[n];
    if (e.t === 'bifurcacao'){
      const esc = escolhas[e.k];
      n = porId(e.caminhos[esc === undefined ? 0 : esc].vai);
    } else if (e.t === 'desfecho'){
      n = e.fecho ? porId(e.fecho) : -1;
    } else if (e.rota){
      n = porId(e.rota.pediu.every(x => pedidos.has(x))
                ? e.rota.entao : e.rota.senao);
    } else if (e.conforme){
      const k = escolhas[e.conforme.de];
      n = porId(e.conforme.para[k === undefined ? 0 : k]);
    } else if (e.segue){
      n = porId(e.segue);
    } else n = n + 1;
  }
  return seq;
}

/* O trilho mostra as etapas do percurso, uma marca cada, colorida pelo tipo —
   e um contador explícito. É assim que o formato antigo do New England fazia,
   e a diferença é real: dá para ver quantas páginas faltam e onde estão as
   perguntas antes de chegar nelas. */
function pintarTrilho(){
  const seq = rotaAtual();
  const aqui = Math.max(seq.indexOf(i), 0);
  $('#trilho').innerHTML =
    '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>'
    + '<span class="cnt">' + (aqui + 1) + ' / ' + seq.length + '</span>'
    + '<span class="marcas">' + seq.map(n => ETAPAS[n]).map((e, k) =>
        // o título só aparece no que já foi percorrido: com o mouse parado
        // sobre uma marca à frente, o trilho entregava os desfechos — inclusive
        // qual deles é o ruim — antes de a bifurcação ser feita
        '<i class="m-' + e.t + (k < aqui ? ' feita' : k === aqui ? ' aqui' : '')
        + '" data-n="' + seq[k] + '"'
        + (k < aqui ? ' title="' + (e.tt || e.kicker || '').replace(/"/g, '') + '"' : '')
        + '></i>'
      ).join('') + '</span>';
  // andar para trás pelo trilho é livre; para a frente, não — o caso não pula
  // uma decisão que ainda não foi tomada
  const vistos = new Set(historia);
  $('#trilho').querySelectorAll('.marcas i').forEach(m => {
    const n = +m.dataset.n;
    if (vistos.has(n) && n !== i) m.onclick = () => ir(n);
  });
}

function pintarPe(){
  const e = etapa();
  const fim = e.t === 'desfecho';
  const corrigida=e.comentado && respostas[e.k]?.feita;
  $('#pe').innerHTML =
    '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav">'
    + (partesTela.length > 1 ? '<span class="pagina-indice">Página ' + (parteTela + 1) + ' de ' + partesTela.length + '</span>' : '')
    + '<button class="bt" id="voltar"' + (historia.length < 2 && parteTela === 0 ? ' disabled' : '') + '>Voltar</button>'
    + '<button class="bt forte" id="' + (emRevisao && !temProximaParte() ? 'reiniciar' : 'seguir') + '"' + (podeAdiante() ? '' : ' disabled') + '>'
    + (temProximaParte() ? 'Próxima página' : emRevisao ? 'Recomeçar' : e.t === 'capa' ? 'Começar o caso' : corrigida ? 'Realizar indicados' : fim ? 'Continuar' : 'Avançar') + '</button></span>';
  $('#voltar').onclick = atras;
  ($('#seguir') || $('#reiniciar')).onclick = adiante;
}

/* ─────────────────────────── desenho das etapas ─────────────────────────── */

const fundoDe = e => e.fundo
  ? '<div class="fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
  : '<div class="fundo" style="background:#0d1014"></div>';

const laminaDe = l => !l ? '' :
  '<figure class="lamina"><img src="' + IMG(l.img) + '" alt="' + l.tt + '">'
  + '<figcaption class="cap"><b>' + l.tt + '</b>' + l.lg
  + '<span class="cr">' + l.cr + '</span></figcaption></figure>';

/* Figura anotada e boneco vêm do caso como HTML pronto, montado antes de
   existir data: URI. Cada um deixa o nome do arquivo em `data-img` e o
   endereço é resolvido aqui, contra a mesma tabela de imagens. */
function resolverImagens(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = IMG(el.dataset.img);
    if (el.tagName.toLowerCase() === 'image') el.setAttribute('href', u);
    else el.setAttribute('src', u);
  });
}

/* ─────────────────────── a lupa ─────────────────────── */

/* Tomografia lida num cartão de 300 px é decoração. Qualquer figura da peça
   abre em tela cheia por clique, com a legenda embaixo, e fecha por clique,
   por Esc ou pelo botão. Enquanto a lupa está aberta as setas do teclado
   param de virar página: elas pertencem à figura, não ao caso. */
let lupaAberta = false;

function abrirLupa(figura){
  const clone = figura.cloneNode(true);
  clone.classList.remove('lamina');
  /* o tamanho ajustado à coluna não vale na lupa; e setas ainda não
     reveladas continuam ocultas quando a figura é ampliada */
  clone.style.width = '';
  clone.querySelectorAll('svg').forEach(s => { s.style.width = ''; s.style.height = ''; });
  if (document.querySelector('#palco .vv-est-rev:not([open])')) clone.querySelectorAll('.an').forEach(a => a.style.visibility = 'hidden');
  const cx = document.createElement('div');
  cx.className = 'lupa';
  cx.innerHTML = '<button class="fechar" title="Fechar (Esc)">Fechar ✕</button>';
  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  quadro.appendChild(clone);
  cx.appendChild(quadro);
  document.body.appendChild(cx);
  lupaAberta = true;
  /* figura anotada na lupa: do tamanho da imagem, sem faixas laterais */
  const sv = clone.querySelector('svg');
  if (sv && sv.viewBox && sv.viewBox.baseVal && sv.viewBox.baseVal.width){
    const r = sv.viewBox.baseVal.width / sv.viewBox.baseVal.height, cap = clone.querySelector('figcaption');
    const ajusta = w => { clone.style.width = w + 'px'; sv.style.width = w + 'px'; sv.style.height = (w / r) + 'px'; sv.style.maxHeight = 'none'; return cap ? cap.offsetHeight : 0; };
    const maxW = innerWidth * 0.92, maxH = innerHeight * 0.84;
    let w = Math.min(maxW, (maxH - ajusta(maxW)) * r);
    w = Math.min(maxW, (maxH - ajusta(w)) * r);
    ajusta(Math.max(w, 200));
    clone.classList.add('lupa-ajustada');
  }
  const fechar = () => {
    cx.remove(); lupaAberta = false;
    document.removeEventListener('keydown', porTecla, true);
  };
  const porTecla = ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); fechar(); }
  };
  document.addEventListener('keydown', porTecla, true);
  cx.onclick = ev => { if (!quadro.contains(ev.target) || ev.target.tagName === 'IMG') fechar(); };
  cx.querySelector('.fechar').onclick = fechar;
}

function ligarLupa(){
  document.querySelectorAll('#palco figure').forEach(f => {
    if (!f.querySelector('img,svg')) return;
    f.classList.add('amplia');
    f.title = 'Clique para ampliar';
    f.onclick = () => abrirLupa(f);
  });
}

function pintar(){
  const e = etapa();
  $('#palco').innerHTML = '<section class="tela on">' + DESENHO[e.t](e) + '</section>';
  resolverImagens();
  document.querySelectorAll('#palco details').forEach((d,n)=>{const key=etapa().k+'::'+n;d.dataset.detalhe=key;d.open=detalhesAbertos.has(key);});
  ligar(e);
  montarFolhas();
  document.querySelectorAll('#palco details').forEach(d=>{const summary=d.querySelector('summary');if(summary)summary.onclick=ev=>{ev.preventDefault();const key=d.dataset.detalhe;d.open?detalhesAbertos.delete(key):detalhesAbertos.add(key);parteTela=0;pintar();};});
  ligarLupa();
  acessibilidadeDaPagina();
  pintarTrilho();
  pintarPe();
}

/* A resposta no molde do //New England//: o gabarito numa frase e a
   explicação em seções com subtítulo, uma só para a pergunta inteira. */
function explicacaoDe(e){
  // no meio da frase, a alternativa perde a maiúscula inicial, mas não a
  // de siglas ("PCR", "HLA-B27")
  const minus = s => s.replace(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ])(?=[a-záéíóúâêôãõç]|\s+[a-záéíóúâêôãõç])/, c => c.toLowerCase());
  const certas = e.alts.filter(a => a.ok).map(a => '<b>' + minus(a.t) + '</b>');
  const lista = certas.length === 1 ? certas[0]
    : certas.slice(0, -1).join(', ') + ' e ' + certas[certas.length - 1];
  return '<div class="explica"><p class="gab">' + (certas.length === 1
      ? 'A resposta correta é ' : 'As respostas corretas são ') + lista + '.</p>'
    + e.exp.map(s => '<div class="ex-sec">' + (s.h ? '<h4>' + s.h + '</h4>' : '')
      + '<p>' + s.t + '</p></div>').join('') + '</div>';
}

const DESENHO = {

  /* Título e imagem. A imagem sobe do chão para a tela inteira, sem véu de
     leitura por cima dela senão o gradiente que segura o título. */
  capa: e =>
    '<div class="fundo capa-fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
    + '<div class="veu capa-veu"></div>'
    + '<div class="abertura">'
    + (e.kicker ? '<div class="marca"><i></i><span>' + e.kicker + '</span></div>' : '')
    + '<h1>' + e.tt + '</h1>'
    + (e.selo ? '<div class="selo">' + e.selo + '</div>' : '')
    + '</div>',

  /* Quando o rótulo é mais informativo que a manchete — "onde dava para ter
     chegado antes" contra "a retrospectiva" — quem sobe a título é o rótulo, e
     a manchete curta sai. O caso declara isso com `so_kicker`. */
  pagina: e =>
    fundoDe(e) + '<div class="veu ' + (e.lamina ? 'esq' : 'tudo') + '"></div>'
    + '<div class="plano' + (e.lamina ? '' : ' centro') + '">'
    + (e.so_kicker

    + e.corpo + '</div>'
    + laminaDe(e.lamina),

  pedido: e => e.comentado ? DESENHO.pergunta(e) :
    fundoDe(e) + '<div class="veu tudo"></div>'
    + '<div class="folha pedido">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
    + '<div class="grupos">' + e.grupos.map(g =>
        '<div class="gr g-' + g.s + '"><b><i></i>' + g.n + '</b>'
        + g.o.map(o => {
            /* Um exame com pré-requisito continua VISÍVEL e fica travado, com
               o motivo escrito. Esconder ensinaria que ele não existe; o que
               se quer ensinar é que ele ainda não se justifica. */
            const falta = (o.ex || []).filter(x => !jaPedido(x));
            const trava = falta.length > 0;
            return '<label class="it' + (temMarcado(e.k, o.e) ? ' on' : '')
              + (trava ? ' trava' : '') + '" data-ex="' + esc(o.e) + '">'

              + (o.d ? '<span class="d">' + o.d + '</span>' : '')
              + (trava ? '<span class="d trv">' + o.pq + ' — falta: '
                  + falta.join(', ') + '</span>' : '')
              + '</span></label>';
          }).join('') + '</div>').join('')
    + '</div><div class="conta" id="conta"></div></div>',

  // Sem manchete: o rótulo já diz "o que voltou", e o primeiro cartão vira o
  // topo visual. Ganha noventa pixels e a tela começa no dado.
  resultados: e => {
    const todos = e.todos ? e.todos : [...(marcados[e.de] || [])];
    const origem=respostas[e.de]?.conducao;
    const resumo=origem==='indicados'?'Exames realizados pela equipe após a discussão.':'';
    const pedidos = todos;
    const sobre = e.sobre || (ETAPAS[porId(e.de)] || {}).sobre || {};
    const linhas = [], imagens = [];
    pedidos.forEach(n => {
      // o resultado que o caso declarou vence o do banco: o banco foi escrito
      // para um formato com relógio, e aqui não há relógio
      const x = sobre[n] || BANCO[n];
      if (!x) return '';
      const im = e.laminas[n];
      /* O laudo do sedimento tem cinco achados separados por ponto médio, e
         num parágrafo corrido o cilindro hemático — que é o achado — passava
         no meio da frase. Cada parte vira uma linha. */
      const partes = x.r.split(' · ');
      const valor = partes.length > 1
        ? partes.map(t => '<span class="ln">' + t + '</span>').join('')
        : x.r;
      /* Quando o exame tem imagem, a imagem vem SOZINHA e o laudo fica atrás
         de um botão. Colar o laudo na figura tira do grupo o passo que mais
         ensina em imagem, que é descrever antes de ler o que outro escreveu —
         e é invariante declarada do formato: laudo se revela, não se
         renderiza junto. */
      const laudo = '<div class="v">' + valor
        + (x.ref && x.ref !== '—' ? '<span class="rf">referência: ' + x.ref
            + '</span>' : '') + '</div>';
      if (!im) {
        linhas.push('<tr class="rc' + (x.a ? ' alt' : '') + '"><th scope="row"><b>' + n
          + '</b></th><td class="v">' + valor + '</td><td class="rf">'
          + (x.ref || '—') + '</td></tr>');
        return;
      }
      /* A legenda descritiva É o laudo. Deixá-la sob a figura enquanto um
         botão promete "ver o laudo" é entregar a leitura e cobrar o clique
         por nada: quem olhava a radiografia já lia "opacidades alveolares
         bilaterais predominando nos campos médios" antes de descrever coisa
         alguma. Sob a figura fica só o crédito; a descrição e o valor saem
         juntos, no clique. */
      const chaveLaudo = (e.de || e.k) + '::' + n;
      const aberto = laudos.has(chaveLaudo);
      imagens.push('<article class="rc resultado-imagem' + (x.a ? ' alt' : '') + '"><b>' + n + '</b>'
        + '<figure><img src="' + IMG(im.img) + '" alt="' + n + '">'

    const cartas = (linhas.length ? '<div class="laboratorio"><table class="exames-tabela"><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table></div>' : '')
      + (imagens.length ? '<div class="imagens-resultados" style="--figuras:' + imagens.length + '">' + imagens.join('') + '</div>' : '');
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'

      + (resumo || e.intro ? '<b class="sub-in">' + resumo + ' ' + (e.intro || '').replace(/(?:De novo, só o que foi marcado\.|Só o que foi marcado\.)/g,'') + '</b>' : '') + '</div>'
      + '<div class="res resultados-editoriais' + (linhas.length && imagens.length ? ' misto' : '') + '">' + (cartas
          || '<div class="vazio">Você não pediu nenhum exame nesta etapa. O caso '
             + 'segue com o que se sabe do leito.</div>') + '</div></div>';
  },

  pergunta: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q' + (e.alts.length > 6 ? ' densa' : '') + '">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : (e.escolhas === 1 ? 'selecione uma'
             : 'selecione ' + e.escolhas + ' · marcadas ' + r.marcadas.length))
      + '</div>'
      + (e.exp ? '<div class="qexp' + (r.feita ? ' feita' : '') + '">' : '')
      + '<ul class="alts' + (r.feita ? ' feita' : '')
          + (e.alts.length > 6 ? ' muitas' : '') + (e.exp ? ' semcm' : '') + '">'
      + e.alts.map((a, k) =>
          '<li data-k="' + k + '" class="' + (a.ok ? 'certa' : 'errada')
          + (r.marcadas.includes(k) ? ' marcada' : '') + '">'
          + '<span class="k">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="tx">' + a.t + '</span>'
          + '<span class="cm">' + (r.feita ? '<span class="estado-resposta">' + (e.comentado ? a.situacao : (a.ok ? 'Correta' : 'Incorreta')) + (r.marcadas.includes(k) ? ' · sua seleção' : '') + '</span>' : '') + a.c + '</span></li>').join('')
      + '</ul>'
      + (e.exp ? (r.feita ? explicacaoDe(e) : '') + '</div>' : '')
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (r.marcadas.length >= e.escolhas ? '' : ' disabled') + '>'
          + 'Confirmar resposta</button>')
      + '</div>';
  },

  /* Pareamento: cada item tem a sua linha de letras. Marcar é atribuir uma
     letra ao item; a mesma letra pode servir a mais de um item, porque é
     assim na prova — e porque proibir a repetição entregaria a resposta por
     exclusão. */
  pareamento: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    const L = n => String.fromCharCode(65 + n);
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q par-folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : 'atribua uma letra a cada item · ' + r.marcadas.filter(x => x !== undefined && x !== null).length
            + ' de ' + e.itens.length) + '</div>'
      + '<div class="par' + (r.feita ? ' feita' : '') + '">'
      + '<div class="par-ops">' + e.ops.map((o, n) =>
          '<span class="po"><b>' + L(n) + '</b>' + o + '</span>').join('') + '</div>'
      + '<div class="par-itens">' + e.itens.map((it, n) => {
          const esc = r.marcadas[n];
          const certa = r.feita && esc === it.ok;
          return '<div class="pi' + (r.feita ? (certa ? ' certa' : ' errada') : '')
            + '" data-n="' + n + '">'
            + '<span class="pt">' + it.t + '</span>'
            + '<span class="pesc">' + e.ops.map((o, m) =>
                '<i class="pe' + (esc === m ? ' on' : '')
                + (r.feita && m === it.ok ? ' ok' : '') + '" data-m="' + m
                + '" title="' + esc2(o) + '">' + L(m) + '</i>').join('') + '</span>'
            + (r.feita ? '<span class="cm"><span class="estado-resposta">'
                + (certa ? 'Correta' : 'Incorreta · a resposta é ' + L(it.ok)
                    + (esc === undefined || esc === null ? '' : ' · você marcou ' + L(esc)))
                + '</span>' + it.c + '</span>' : '')
            + '</div>';
        }).join('') + '</div></div>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (e.itens.every((_, n) => r.marcadas[n] !== undefined && r.marcadas[n] !== null) ? '' : ' disabled')
          + '>Confirmar resposta</button>')
      + '</div>';
  },

  bifurcacao: e => {
    const esc = escolhas[e.k];
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
      + '<div class="cams' + (esc !== undefined ? ' feita' : '') + '">'
      + e.caminhos.map((c, k) =>
          '<div class="cam' + (esc === k ? ' escolhido' : '') + '" data-k="' + k + '">'
          + '<span class="l">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="r">' + c.r + '</span>'
          + '<span class="c">' + c.c + '</span></div>').join('')
      + '</div>'
      /* Sem isto, a ramificação era invisível: as três justificativas abriam,
         o caso seguia, e nada na tela dizia que o rumo tinha mudado. */
      + (esc !== undefined
          ? '<div class="forca">' + e.caminhos.map((c, k) =>
              '<i class="' + (esc === k ? 'on' : '') + '"></i>').join('')
            + '<span>Você escolheu o caminho '
            + String.fromCharCode(65 + esc) + '. O caso acompanha essa conduta. '
            + 'Você pode voltar para comparar os outros caminhos.</span></div>'
          : '')
      + '</div>';
  },

  /* O balanço: o que a condução custou, item a item, com o contrafactual ao
     lado. É a única tela do caso que só existe por causa do que VOCÊ fez. */
  balanco: e => {
    const bateu = q => {
      if (q.sem) return !q.sem.some(n => jaPedido(n));
      if (q.escolheu) return escolhas[q.escolheu[0]] === q.escolheu[1];
      if (q.escolheu_todos)
        return q.escolheu_todos.every(([k, v]) => escolhas[k] === v);
      return false;
    };
    const disparadas = e.cons.filter(c => bateu(c.q));
    const morreu = e.obito && bateu(e.obito);
    const dias = e.bd + disparadas.reduce((s, c) => s + c.d, 0);
    const tfg = e.bt - disparadas.reduce((s, c) => s + c.t, 0);
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2>' + e.corpo
      + '<div class="bal">'
      + (morreu
        ? '<div class="placar obito"><div class="cheio"><b>Óbito</b><span>'
          + e.obitotx + '</span></div></div>'
        : '<div class="placar">'
      +   '<div><b>' + dias + '</b><span>dias de internação</span></div>'
      +   '<div' + (tfg <= 15 ? ' class="grave"' : '') + '><b>' + tfg
      +     '</b><span>mL/min/1,73 m² na alta'
      +     (tfg <= 15 ? ' · saiu em diálise' : '') + '</span></div>'
      +   '<div class="ideal"><b>' + e.bd + ' · ' + e.bt + '</b>'
      +     '<span>o melhor percurso possível</span></div>'
      + '</div>')
      + (disparadas.length
          ? '<div class="cons">' + disparadas.map(c =>
              '<div class="cn"><b>' + c.tt + '</b>'
              + '<span class="pr">' + (c.d ? '+' + c.d + ' dias' : '')
              + (c.d && c.t ? ' · ' : '') + (c.t ? '−' + c.t + ' mL/min' : '')
              + '</span><p>' + c.pq + '</p></div>').join('') + '</div>'
          : '<div class="cons"><div class="cn limpo"><b>Nenhuma decisão desta '
            + 'condução cobrou preço.</b><p>Você chegou ao melhor percurso que '
            + 'este caso permite. É raro, e não é sorte: as decisões que '
            + 'custam caro aqui são todas das primeiras 72 horas.</p></div></div>')
      + '</div></div>';
  },

  desfecho: e =>
    fundoDe(e) + '<div class="veu tudo q-' + e.q + '"></div>'
    + '<div class="fim ' + e.q + '"><div class="caixa">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h1>' + e.tt + '</h1>' + e.corpo
    + '<div class="porque"><b>Por quê</b><p>' + e.porque + '</p></div>'
    + '</div></div>',
};

/* ─────────────────────────── interação ─────────────────────────── */

const esc = s => s.replace(/"/g, '&quot;');
const esc2 = s => String(s).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
const temMarcado = (k, n) => (marcados[k] || new Set()).has(n);

function ligar(e){
  if (e.t === 'pedido' && !e.comentado){
    const conj = marcados[e.k] || (marcados[e.k] = new Set());
    /* O teto é o que faz a pergunta ser uma pergunta. Sem ele, marcar tudo é
       sempre a jogada dominante — e um grupo que marca tudo não decidiu nada,
       além de encerrar a investigação na primeira tela. */
    const teto = e.limite || 0;
    const cheio = () => teto && conj.size >= teto;
    const contar = () => {
      const faltam = teto ? teto - conj.size : 0;
      $('#conta').innerHTML = '<b>' + conj.size
        + (teto ? ' de ' + teto : '') + '</b> '
        + (conj.size === 1 ? 'exame marcado' : 'exames marcados')
        + (teto
            ? (faltam > 0
                ? ' · ainda cabe' + (faltam === 1 ? ' 1' : 'm ' + faltam)
                : ' · o teto desta rodada está completo — desmarque para trocar')
            : ' · nada é obrigatório, e nada é sugerido');
      document.querySelectorAll('.it[data-ex]').forEach(l =>
        l.classList.toggle('bloq', cheio() && !conj.has(l.dataset.ex)));
      pintarPe();
    };
    document.querySelectorAll('.it[data-ex]').forEach(l => {
      l.onclick = () => {
        if (l.classList.contains('trava')) return;
        const n = l.dataset.ex;
        if (conj.has(n)) conj.delete(n);
        else if (cheio()) return;          // o teto não empurra: ele segura
        else conj.add(n);
        pintar();
        const atual=[...document.querySelectorAll('.it')].find(x=>x.dataset.ex===n);
        if(atual?.getClientRects().length)atual.focus({preventScroll:true});
      };
    });
    contar();
  }

  if (e.t === 'resultados'){
    document.querySelectorAll('.verlaudo').forEach(b => {
      b.onclick = () => {
        const nome=b.closest('.rc').querySelector('b').textContent;
        laudos.add(b.dataset.laudo);pintar();
        const cartao=[...document.querySelectorAll('.rc')].find(c=>c.querySelector('b')?.textContent===nome&&c.querySelector('.v'));
        const parte=partesTela.findIndex(p=>p.some(n=>n===cartao||n.contains(cartao)));
        if(parte>=0){parteTela=parte;aplicarParte();pintarPe();}
      };
    });
  }

  if (e.t === 'pergunta' || e.comentado){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.alts li').forEach(li => {
      li.onclick = () => {
        const k = +li.dataset.k;
        const j = r.marcadas.indexOf(k);
        // marcar e desmarcar até confirmar: a escolha não é irreversível
        // enquanto o grupo ainda está discutindo
        if (j >= 0) r.marcadas.splice(j, 1);
        else if (r.marcadas.length < e.escolhas) r.marcadas.push(k);
        else { r.marcadas.shift(); r.marcadas.push(k); }
        document.querySelectorAll('.alts li').forEach((x, n) =>
          x.classList.toggle('marcada', r.marcadas.includes(n)));
        const b = $('#conf');
        if (b) b.disabled = r.marcadas.length < e.escolhas;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if(r.marcadas.length!==e.escolhas)return;
      r.feita = true;
      if(e.comentado)marcados[e.k]=new Set(e.alts.filter(a=>a.ok).flatMap(a=>a.exames));
      parteTela=0; pintar();
    };
  }

  if (e.t === 'pareamento'){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.par .pe').forEach(ch => {
      ch.onclick = ev => {
        ev.stopPropagation();
        const n = +ch.closest('.pi').dataset.n, m = +ch.dataset.m;
        r.marcadas[n] = (r.marcadas[n] === m) ? undefined : m;
        const linha = ch.closest('.pi');
        linha.querySelectorAll('.pe').forEach(x => x.classList.toggle('on', +x.dataset.m === r.marcadas[n]));
        const completo = e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null);
        const b = $('#conf'); if (b) b.disabled = !completo;
        const d = document.querySelector('.qdica');
        if (d) d.textContent = 'atribua uma letra a cada item · '
          + e.itens.filter((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null).length
          + ' de ' + e.itens.length;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if (!e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null)) return;
      r.feita = true; parteTela = 0; pintar();
    };
  }

  if (e.t === 'bifurcacao'){
    if (escolhas[e.k] !== undefined) return;
    document.querySelectorAll('.cam').forEach(c => {
      c.onclick = () => { escolhas[e.k] = +c.dataset.k; parteTela=0; pintar(); };
    });
  }
}

/* ─────────────────────────── a revisão do fim ─────────────────────────── */

/* O único lugar em que o caso comenta o que ficou de fora, e ele só fala
   quando não há mais nada a decidir. Durante a condução, apontar o que falta
   é decidir pelo grupo. */
function mostrarRevisao(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  /* `respostas[k]` nasce quando a página é PINTADA, não quando é respondida, e
     `[].every()` é `true`: uma pergunta só visitada entrava no total e no
     acerto. Dava para chegar à revisão com "4 de 4" tendo respondido três. */
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  const acertos = feitas.filter(([k, r]) => {
    const e = ETAPAS[porId(k)];
    if (!e) return false;
    if (e.t === 'pareamento')
      return e.itens.every((it, n) => r.marcadas[n] === it.ok);
    return r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok);
  }).length;
  const total = feitas.length;

  $('#palco').innerHTML = '<section class="tela on">'
    + '<div class="fundo" style="background:#0d1014"></div>'
    + '<div class="veu tudo"></div><div class="folha">'
    + '<div class="marca"><i></i><span>Revisão</span></div>'
    + '<h2>O que ficou para trás</h2>'
    + '<p class="sub">' + acertos + ' de ' + total + ' perguntas de escolha com '
    + 'a resposta inteiramente certa · '
    + (pediu.size ? Object.keys(marcados).length + ' rodadas de exames, ' + pediu.size + ' pedidos ao todo · ' : '')
    + Object.keys(escolhas).length + ' decisões de conduta.</p>'
    + '<div class="rev">' + (faltou.length
        ? faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>'
            + r.porque + '</p></div>').join('')
        : '<div class="ok">Nada essencial ficou de fora.</div>')
    + '</div></div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><button class="bt" onclick="recomecar()">'
    + 'Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao=true;parteTela=0;montarFolhas();pintarPe();
}

function recomecar(){
  i = 0; historia = [0]; emRevisao=false;
  Object.keys(marcados).forEach(k => delete marcados[k]);
  Object.keys(respostas).forEach(k => delete respostas[k]);
  Object.keys(escolhas).forEach(k => delete escolhas[k]);
  laudos.clear(); detalhesAbertos.clear(); parteTela=0;
  pintar();
}
