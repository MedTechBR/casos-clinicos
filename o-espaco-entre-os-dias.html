<script type="application/json" id="dados">{"caso": {"titulo": "O espaço entre os dias", "slug": "o-espaco-entre-os-dias", "cor": "#b45309", "rodape": "Paciente ficcional · evolução simulada para ensino · versão de 28/10 02:14", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "O espaço entre os dias", "fundo": "cena.png", "kicker": "Caso interativo", "selo": "Paciente ficcional · fontes na última tela", "proc": ""}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Elisa, costureira de 46 anos, procura atendimento porque as roupas apertaram na cintura há seis semanas. O abdome aumenta, mas braços e pernas parecem mais finos. Tem saciedade precoce, cansaço e desconforto difuso, sem dor intensa. Perdeu cerca de 5 kg em três meses, apesar do aumento abdominal.<\/p><p>Há duas semanas mede temperatura de até 38 °C no fim da tarde. Nega vômitos, diarreia, sangue nas fezes, tosse, falta de ar ou sangramento vaginal. As menstruações tornaram-se irregulares no último ano. Não apresenta edema nas pernas.<\/p><p>Foi orientada a reduzir sal e usar furosemida 40 mg/dia há quatro dias. Urina mais por algumas horas, mas o abdome não diminuiu e passou a sentir tontura ao levantar.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Antecedentes", "tt": "", "corpo": "<div class=\"tops\"><div><b>Patológicos<\/b><p>Hipertensão leve, sem doença cardíaca ou renal conhecida. Colecistectomia há oito anos. Sem internação recente, câncer ou imunossupressão.<\/p><\/div><div><b>Medicamentos<\/b><p>Losartana 50 mg/dia; furosemida iniciada há quatro dias. Não usa anti-inflamatório regularmente.<\/p><\/div><div><b>Ginecológicos<\/b><p>Duas gestações, dois partos. Sem reposição hormonal. Exame preventivo há dois anos sem alteração informada.<\/p><\/div><div><b>Hábitos e exposições<\/b><p>Não fuma e bebe raramente. Mora em área urbana de Fortaleza; trabalhou muitos anos em uma confecção fechada e pouco ventilada. Não sabe informar contato conhecido com tuberculose.<\/p><\/div><div><b>Família<\/b><p>Uma tia materna tratada por câncer de mama aos 64 anos. Sem câncer de ovário conhecido.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div><b>37,8 °C<\/b><span>Temperatura<\/span><\/div><div><b>108/68 mmHg<\/b><span>Pressão arterial<\/span><\/div><div><b>96 bpm<\/b><span>Frequência cardíaca<\/span><\/div><div><b>18 irpm<\/b><span>Frequência respiratória<\/span><\/div><div><b>98% em ar ambiente<\/b><span>SpO₂<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral<\/b><p>Lúcida, discretamente emagrecida; sem icterícia.<\/p><\/div><div><b>Cardiopulmonar<\/b><p>Sem turgência jugular. Ritmo regular e ausculta pulmonar sem alterações.<\/p><\/div><div><b>Abdome<\/b><p>Globoso, com macicez móvel e desconforto leve difuso. Sem defesa, circulação colateral ou massa definida à palpação.<\/p><\/div><div><b>Pele e membros<\/b><p>Sem aranhas vasculares, eritema palmar ou edema.<\/p><\/div><div><b>Linfonodos<\/b><p>Nenhum linfonodo periférico aumentado palpável.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "resultados", "k": "rotina", "kicker": "Primeira avaliação", "tt": "Sangue e urina", "de": "", "fundo": "", "intro": "Exames de rotina na avaliação de ascite recente. A função hepática preservada não exclui toda causa hepática ou portal.", "nota": "", "laminas": {}, "todos": ["Hemoglobina / VCM", "Leucócitos / plaquetas", "Albumina / proteínas totais", "AST / ALT / bilirrubina", "INR / creatinina", "Sódio / potássio", "Proteína C reativa / urina"], "sobre": {"Hemoglobina / VCM": {"n": "Hemoglobina / VCM", "r": "10,6 g/dL / 84 fL", "ref": "12–16 / 80–100", "a": 1}, "Leucócitos / plaquetas": {"n": "Leucócitos / plaquetas", "r": "5.600 / 470.000 por mm³", "ref": "4.000–11.000 / 150.000–450.000", "a": 1}, "Albumina / proteínas totais": {"n": "Albumina / proteínas totais", "r": "3,2 / 7,8 g/dL", "ref": "3,5–5,0 / 6,0–8,0", "a": 1}, "AST / ALT / bilirrubina": {"n": "AST / ALT / bilirrubina", "r": "24 / 18 U/L / 0,6 mg/dL", "ref": "até 40 / 41 / 1,2", "a": 0}, "INR / creatinina": {"n": "INR / creatinina", "r": "1,1 / 0,8 mg/dL", "ref": "0,8–1,2 / 0,6–1,1", "a": 0}, "Sódio / potássio": {"n": "Sódio / potássio", "r": "134 / 3,6 mmol/L", "ref": "135–145 / 3,5–5,0", "a": 1}, "Proteína C reativa / urina": {"n": "Proteína C reativa / urina", "r": "61 mg/L · urina sem proteína ou sangue", "ref": "PCR até 5 mg/L", "a": 1}}, "rota": null}, {"t": "pergunta", "k": "q1", "kicker": "Pergunta 1", "enunciado": "Quais três mecanismos você considera inicialmente?", "alts": [{"t": "Retenção hídrica por hipotireoidismo", "c": "", "ok": 0}, {"t": "Comprometimento neoplásico do peritônio", "c": "", "ok": 1}, {"t": "Hipertensão portal", "c": "", "ok": 1}, {"t": "Insuficiência cardíaca direita", "c": "", "ok": 0}, {"t": "Síndrome nefrótica", "c": "", "ok": 0}, {"t": "Inflamação peritoneal infecciosa", "c": "", "ok": 1}], "escolhas": 3, "fundo": "", "exp": [{"h": "Começar pela síndrome", "t": "Ascite tem causas portais e não portais. Não se confirma cirrose só por encontrar líquido, nem se descarta hipertensão portal apenas por transaminases normais. Febre, emagrecimento e saciedade precoce tornam doença peritoneal relevante."}, {"h": "Hierarquia inicial", "t": "Urina sem proteína e albumina apenas discretamente reduzida enfraquecem síndrome nefrótica. Sem sinais de congestão sistêmica ou outras manifestações, insuficiência cardíaca direita e hipotireoidismo ficam abaixo das causas peritoneais. A análise do líquido é central para reorganizar o diferencial."}], "tr": "", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b_fluxo", "kicker": "Decisão", "tt": "Próxima investigação", "enunciado": "Qual procedimento você prioriza agora?", "caminhos": [{"r": "Paracentese diagnóstica", "vai": "paracentese_primeiro", "c": "Ascite nova precisa ser caracterizada. O ultrassom confirma uma janela segura; o procedimento fornece dados que a imagem isolada não oferece.", "rc": ""}, {"r": "Tomografia de abdome e pelve", "vai": "tc_primeiro", "c": "Avalia peritônio, órgãos e massas. Ainda será necessário estudar o líquido; uma imagem suspeita não define a causa.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "paracentese_primeiro", "kicker": "Coleta do líquido", "tt": "", "corpo": "<p>O ultrassom confirma líquido livre e uma janela segura. A paracentese retira uma amostra para contagem de células, albumina, proteínas, cultura e citologia. O volume restante não é drenado por completo; Elisa está confortável e sem comprometimento respiratório.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "us", "conforme": null, "rota": null}, {"t": "pagina", "k": "tc_primeiro", "kicker": "Investigação por imagem", "tt": "", "corpo": "<p>A TC identifica ascite, espessamento do peritônio e do omento e uma lesão cística anexial direita. Não há aspecto de cirrose, trombose esplâncnica ou lesão hepática suspeita descritos no exame completo.<\/p><p>O laudo sugere investigar doença peritoneal e origem ginecológica, sem estabelecer neoplasia. A equipe solicita paracentese diagnóstica e avaliação ginecológica antes de definir o tratamento.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "us", "conforme": null, "rota": null}, {"t": "pagina", "k": "us", "kicker": "Discussão de imagem", "tt": "Ultrassonografia de abdome", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:1\"><div class=\"vv-est-txt\"><p>Compare os dois painéis e localize o líquido livre antes de abrir os achados.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><li data-n=\"1\" style=\"--n:0\"><span class=\"vv-num\">1<\/span><div><p>No painel direito, uma <b>faixa anecoica<\/b> separa fígado e rim.<\/p><\/div><\/li><\/ol><div class=\"vv-laudo\" style=\"--q:1\"><b>Laudo<\/b><p>Há líquido livre no espaço hepatorrenal no painel direito.<\/p><p>A imagem demonstra líquido, sem definir sua natureza ou causa. A distinção entre ascite portal, inflamação e neoplasia depende da investigação.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 400.0\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"us_liquido_livre.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"400.0\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><g class=\"sa\" data-n=\"1\" style=\"--i:0;--L:300\"><path class=\"fio halo\" d=\"M910.0 75.0 Q831.2 156.7 743.6 215.5\"/><path class=\"fio luz\" d=\"M910.0 75.0 Q831.2 156.7 743.6 215.5\"/><g transform=\"translate(743.6 215.5) rotate(145.9)\"><path class=\"ponta\" d=\"M0 0 L-27 11 L-27 -11 Z\"/><\/g><circle class=\"bd\" cx=\"910.0\" cy=\"75.0\" r=\"25\"/><text class=\"rot\" x=\"910.0\" y=\"75.0\" text-anchor=\"middle\" dominant-baseline=\"central\">1<\/text><\/g><\/g><\/svg><figcaption>Região hepatorrenal: comparação de ausência e presença de líquido.<span class=\"cr\">Acervo de Matheus Parente · Apostila Vol. 6, Radiologia Fisiológica de Abdome, p. 42<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q2", "kicker": "Pergunta 2", "enunciado": "Quais três análises do líquido mais ajudam a orientar a investigação inicial?", "alts": [{"t": "Citologia para células neoplásicas", "c": "", "ok": 1}, {"t": "Albumina no líquido ascítico", "c": "", "ok": 1}, {"t": "Triglicérides no líquido", "c": "", "ok": 0}, {"t": "CA-125 no líquido", "c": "", "ok": 0}, {"t": "Amilase no líquido", "c": "", "ok": 0}, {"t": "Contagem de células com diferencial", "c": "", "ok": 1}], "escolhas": 3, "fundo": "", "exp": [{"h": "Perguntas diferentes", "t": "Albumina do líquido, comparada ao sangue colhido no mesmo período, ajuda a avaliar a participação portal. Celularidade testa inflamação e infecção; citologia pesquisa malignidade. Cultura bacteriana já foi reservada na coleta."}, {"h": "Exames dirigidos", "t": "Amilase pode ajudar se houver suspeita de ascite pancreática; triglicérides, se o aspecto for quiloso. CA-125 no líquido não distingue com segurança câncer de inflamação. A seleção não proíbe outros testes quando aparece uma pergunta clínica específica."}], "tr": "", "nota": "", "segue": ""}, {"t": "resultados", "k": "liquido", "kicker": "Após a paracentese", "tt": "Resultados da amostra", "de": "", "fundo": "", "intro": "As amostras foram analisadas independentemente da seleção de respostas. O líquido é amarelo-claro, sem aspecto leitoso.", "nota": "", "laminas": {}, "todos": ["Albumina do sangue / do líquido", "Proteína total do líquido", "Células nucleadas", "Neutrófilos absolutos", "Cultura bacteriana", "Citologia"], "sobre": {"Albumina do sangue / do líquido": {"n": "Albumina do sangue / do líquido", "r": "3,2 / 2,4 g/dL", "ref": "calcular gradiente na mesma ocasião", "a": 0}, "Proteína total do líquido": {"n": "Proteína total do líquido", "r": "4,5 g/dL", "ref": "interpretar com o gradiente", "a": 0}, "Células nucleadas": {"n": "Células nucleadas", "r": "840/mm³ · linfócitos 79% · neutrófilos 12%", "ref": "—", "a": 1}, "Neutrófilos absolutos": {"n": "Neutrófilos absolutos", "r": "101/mm³", "ref": "250/mm³ é um limiar para peritonite bacteriana na avaliação apropriada", "a": 0}, "Cultura bacteriana": {"n": "Cultura bacteriana", "r": "Sem crescimento", "ref": "—", "a": 0}, "Citologia": {"n": "Citologia", "r": "Sem células malignas identificadas nesta amostra", "ref": "não exclui neoplasia", "a": 0}}, "rota": null}, {"t": "pagina", "k": "imagem", "kicker": "Tomografia e avaliação ginecológica", "tt": "", "corpo": "<p>A TC mostra ascite e espessamento peritoneal e omental. O ultrassom transvaginal descreve um cisto anexial direito bilobado de 6,5 cm, sem componente sólido vascularizado. Não há massa ovariana definida como origem das alterações peritoneais.<\/p><p>A ginecologia solicita CA-125, que retorna em 980 U/mL (referência: até 35). O número preocupa Elisa: uma pessoa da família disse que esse exame era “do câncer”. A equipe discute a necessidade de caracterizar o peritônio, mantendo causas inflamatórias e neoplásicas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "tc_peritonio", "kicker": "Discussão de imagem", "tt": "Tomografia de abdome", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>Reveja o peritônio no corte disponível antes de interpretar o CA-125.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Espessamento de tecidos peritoneais e de alças no estudo publicado, com região alterada indicada pela seta original.<\/p><p>O aspecto exige correlação com o estudo completo e obtenção de material quando indicada. Não distingue sozinho inflamação de infiltração neoplásica.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 972.8\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CCR3-12-e8617-g001.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"972.8\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Corte axial de abdome.<span class=\"cr\">Oppong et al., Clinical Case Reports 2024;12:e8617 · CC BY 4.0 · seta azul original<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q3", "kicker": "Pergunta 3", "enunciado": "Quais duas interpretações são mais adequadas?", "alts": [{"t": "O aspecto cístico do anexo define o peritônio como metástase ovariana", "c": "", "ok": 0}, {"t": "Citologia negativa torna desnecessário obter tecido", "c": "", "ok": 0}, {"t": "A magnitude do CA-125 prioriza câncer independentemente do restante da investigação", "c": "", "ok": 0}, {"t": "CA-125 e citologia precisam ser interpretados com o conjunto", "c": "", "ok": 1}, {"t": "O gradiente de 0,8 g/dL favorece mecanismo não portal", "c": "", "ok": 1}], "escolhas": 2, "fundo": "", "exp": [{"h": "Gradiente", "t": "O cálculo é 3,2 menos 2,4: 0,8 g/dL. Esse padrão, com proteína alta, sugere doença peritoneal em vez de hipertensão portal como principal mecanismo. O resultado não identifica uma causa única."}, {"h": "Marcador e amostra", "t": "CA-125 pode subir em inflamação de superfícies serosas; não é específico de câncer. Uma citologia negativa pode falhar em detectar malignidade. A pergunta passa a ser qual tecido e quais estudos obter, sem tratar previamente o marcador."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "reavaliacao", "kicker": "Durante a internação", "tt": "", "corpo": "<p>A tontura melhora depois de suspender a furosemida e reavaliar a hidratação. O abdome volta a crescer, e Elisa mantém febre baixa. Alimenta-se em pequenas porções. Creatinina e enzimas hepáticas permanecem normais.<\/p><p>HIV de quarta geração é não reagente. A radiografia de tórax é revista com a radiologia. Não foram encontrados linfonodos periféricos para biópsia. A equipe revisa exposição, sintomas ginecológicos e digestivos; nenhuma nova informação define a causa.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "rx_torax", "kicker": "Discussão de imagem", "tt": "Radiografia de tórax", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:1\"><div class=\"vv-est-txt\"><p>A equipe pesquisa acometimento torácico durante a investigação. O que o exame acrescenta?<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><li data-n=\"1\" style=\"--n:0\"><span class=\"vv-num\">1<\/span><div><p>Discreto apagamento do <b>seio costofrênico esquerdo<\/b>.<\/p><\/div><\/li><\/ol><div class=\"vv-laudo\" style=\"--q:1\"><b>Laudo<\/b><p>Pequeno derrame pleural esquerdo, sem consolidação ou cavidade pulmonar evidente neste exame.<\/p><p>A ausência de lesão pulmonar evidente não determina a causa da doença peritoneal nem exclui infecção extrapulmonar.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 1033.3\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CCR3-12-e8617-g002.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"1033.3\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><g class=\"sa\" data-n=\"1\" style=\"--i:0;--L:276\"><path class=\"fio halo\" d=\"M728.0 573.0 Q771.8 666.8 831.5 742.3\"/><path class=\"fio luz\" d=\"M728.0 573.0 Q771.8 666.8 831.5 742.3\"/><g transform=\"translate(831.5 742.3) rotate(51.9)\"><path class=\"ponta\" d=\"M0 0 L-27 11 L-27 -11 Z\"/><\/g><circle class=\"bd\" cx=\"728.0\" cy=\"573.0\" r=\"25\"/><text class=\"rot\" x=\"728.0\" y=\"573.0\" text-anchor=\"middle\" dominant-baseline=\"central\">1<\/text><\/g><\/g><\/svg><figcaption>Incidência frontal do tórax.<span class=\"cr\">Oppong et al., Clinical Case Reports 2024;12:e8617 · CC BY 4.0<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q4", "kicker": "Pergunta 4", "enunciado": "Quais três diagnósticos você prioriza agora?", "alts": [{"t": "Cirrose descompensada", "c": "", "ok": 0}, {"t": "Tuberculose peritoneal", "c": "", "ok": 1}, {"t": "Insuficiência cardíaca congestiva", "c": "", "ok": 0}, {"t": "Linfoma com comprometimento abdominal", "c": "", "ok": 1}, {"t": "Carcinomatose peritoneal", "c": "", "ok": 1}, {"t": "Síndrome nefrótica", "c": "", "ok": 0}], "escolhas": 3, "fundo": "", "exp": [{"h": "Concorrentes reais", "t": "Ascite rica em proteína, predomínio linfocitário, emagrecimento e alteração do peritônio podem acompanhar infecção, neoplasia e algumas doenças inflamatórias. A ausência de doença pulmonar não exclui tuberculose extrapulmonar."}, {"h": "Próximo passo", "t": "A investigação precisa obter material representativo. Cirrose, síndrome nefrótica e congestão integram pior os dados disponíveis. Nenhum marcador isolado substitui histologia e microbiologia, e o objetivo não é exigir que as três hipóteses sejam equiprováveis."}], "tr": "", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b_amostra", "kicker": "Decisão", "tt": "Obtenção de tecido", "enunciado": "Há espessamento omental acessível. Qual procedimento você escolhe?", "caminhos": [{"r": "Biópsia percutânea guiada por imagem", "vai": "core", "c": "É menos invasiva e pode fornecer material adequado se houver alvo seguro. A amostra será distribuída para histologia e microbiologia.", "rc": ""}, {"r": "Laparoscopia com biópsias", "vai": "laparoscopia", "c": "Permite examinar o peritônio e coletar múltiplas áreas, com maior invasividade. Também exige planejar o envio de material para microbiologia.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "core", "kicker": "Biópsia guiada", "tt": "", "corpo": "<p>O procedimento obtém pequenos fragmentos. A primeira leitura descreve inflamação crônica e tecido fibroadiposo, sem material suficiente para caracterizar toda a lesão. Não foram vistas células neoplásicas; a amostra insuficiente não exclui câncer ou infecção.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "b_resgate", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_resgate", "kicker": "Reavaliação", "tt": "Amostra insuficiente", "enunciado": "Qual procedimento você programa agora?", "caminhos": [{"r": "Nova biópsia percutânea", "vai": "core_repetido", "c": "Pode ser útil após rever o alvo e a técnica com a radiologia. É necessário garantir que a nova coleta responda ao motivo da insuficiência.", "rc": ""}, {"r": "Laparoscopia", "vai": "laparoscopia", "c": "Amplia a inspeção e a quantidade de tecido quando o material percutâneo não resolve a investigação.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "core_repetido", "kicker": "Nova coleta", "tt": "", "corpo": "<p>A radiologia revê a área-alvo e obtém cilindros mais representativos de outro segmento espessado. Parte segue em formol e parte em recipiente apropriado para microbiologia. A nova amostra é considerada suficiente.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "histologia", "conforme": null, "rota": null}, {"t": "pagina", "k": "laparoscopia", "kicker": "Laparoscopia", "tt": "", "corpo": "<p>O procedimento identifica líquido e múltiplos pequenos nódulos no peritônio. São obtidas amostras de omento e peritônio, com material separado para microbiologia. A inspeção, sozinha, não distingue implantes tumorais de inflamação.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "imagem_laparoscopia", "conforme": null, "rota": null}, {"t": "pagina", "k": "imagem_laparoscopia", "kicker": "Discussão de imagem", "tt": "Aspecto do peritônio", "corpo": "<div class=\"observacao-imagem figura-discussao vv-estudo\" style=\"--q:0\"><div class=\"vv-est-txt\"><p>Durante a laparoscopia, a equipe registra as superfícies e colhe fragmentos. Descreva os painéis b e c.<\/p><details class=\"leitura-imagem vv-est-rev\"><summary>Mostrar os achados<\/summary><ol class=\"vv-achados\"><\/ol><div class=\"vv-laudo\" style=\"--q:0\"><b>Laudo<\/b><p>Múltiplos pequenos nódulos claros sobre superfícies peritoneais nos painéis b e c.<\/p><p>A inspeção pode sugerir implantes ou inflamação, mas não estabelece etiologia. O diagnóstico depende do material colhido.<\/p><\/div><\/details><\/div><div class=\"vv-est-fig\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 649.0\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"CRIOG2022-4687139.001.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"649.0\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Painel a: imagem usada no planejamento da biópsia; b e c: laparoscopia.<span class=\"cr\">Nissim et al., 2022 · CC BY 4.0<\/span><\/figcaption><\/figure><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "histologia", "conforme": null, "rota": null}, {"t": "pagina", "k": "histologia", "kicker": "Primeira leitura do tecido", "tt": "", "corpo": "<p>A histologia descreve granulomas, alguns com necrose. Nas áreas amostradas não foram identificadas células neoplásicas. A coloração inicial para bacilos álcool-ácido resistentes é negativa.<\/p><p>A equipe não encerra a investigação pela forma do granuloma. O laboratório informa que há material sem fixador reservado para exames complementares.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q5", "kicker": "Pergunta 5", "enunciado": "Quais três estudos você solicita no material disponível?", "alts": [{"t": "Pesquisa de fungos no tecido", "c": "", "ok": 1}, {"t": "Cultura de micobactérias", "c": "", "ok": 1}, {"t": "Repetição de CA-125", "c": "", "ok": 0}, {"t": "Nova citologia do líquido como substituta do tecido", "c": "", "ok": 0}, {"t": "Teste molecular para tuberculose no tecido", "c": "", "ok": 1}, {"t": "PET-CT antes de completar o estudo da amostra", "c": "", "ok": 0}], "escolhas": 3, "fundo": "", "exp": [{"h": "Granuloma não é etiologia", "t": "Tuberculose, micoses e outras inflamações podem produzir granulomas. Necrose aumenta algumas suspeitas, mas não identifica sozinha o agente. Teste molecular e cultura investigam micobactéria; colorações para fungos evitam atribuir automaticamente todo granuloma à mesma infecção."}, {"h": "Limites", "t": "BAAR negativo não exclui doença com poucos bacilos. Material em formol limita a cultura; por isso o planejamento da coleta importa. CA-125 repetido e PET-CT não respondem melhor que o estudo do tecido já obtido."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "confirmacao", "kicker": "Resultado complementar", "tt": "", "corpo": "<p>O teste molecular no tecido detecta Mycobacterium tuberculosis, sem resistência à rifampicina detectada pelo método. As colorações para fungos são negativas. A cultura permanece em processamento e posteriormente confirma o agente.<\/p><p>O conjunto estabelece tuberculose peritoneal neste caso simulado. O cisto anexial não foi demonstrado como causa da doença peritoneal. A avaliação respiratória e de possíveis outros sítios acompanha a investigação; não se presume transmissibilidade respiratória apenas pelo diagnóstico extrapulmonar.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "tratamento", "kicker": "Plano terapêutico", "tt": "", "corpo": "<p>Após revisão de interações, avaliação visual e exames de base, Elisa inicia rifampicina, isoniazida, pirazinamida e etambutol, com doses conforme peso e protocolo local. O plano inicial é dois meses de fase intensiva, seguidos de quatro meses com rifampicina e isoniazida, se a evolução e a sensibilidade permitirem.<\/p><p>A equipe combina retorno, sinais de toxicidade, apoio à adesão e cuidados nutricionais. O tratamento não é guiado apenas pelo CA-125. A monitorização deve reconhecer eventos adversos e revisar outros diagnósticos se a resposta for discordante.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q6", "kicker": "Pergunta 6", "enunciado": "Quais duas medidas são mais importantes para o seguimento inicial?", "alts": [{"t": "Interpretar qualquer espessamento residual como falha microbiológica", "c": "", "ok": 0}, {"t": "Revisar sintomas de toxicidade e adesão em cada retorno", "c": "", "ok": 1}, {"t": "Acompanhar peso, alimentação e evolução da ascite", "c": "", "ok": 1}, {"t": "Encerrar o tratamento quando o CA-125 normalizar", "c": "", "ok": 0}, {"t": "Manter diurético em dose crescente apesar da tontura", "c": "", "ok": 0}], "escolhas": 2, "fundo": "", "exp": [{"h": "Seguimento clínico", "t": "Febre, ingestão, peso, ascite e adesão ajudam a medir resposta. Náuseas persistentes, icterícia, alteração visual e outros eventos precisam ser avaliados prontamente; a informação deve ser combinada antes da alta."}, {"h": "Evitar automatismos", "t": "A recuperação anatômica pode ser lenta. Persistência ou piora clínica exige rever resistência, adesão, complicações e diagnóstico; um marcador ou uma imagem isolados não bastam. Diurético não corrige toda ascite e pode piorar depleção."}], "tr": "", "nota": "", "segue": ""}, {"t": "pagina", "k": "intercorrencia", "kicker": "Terceira semana", "tt": "", "corpo": "<p>Elisa volta antes da consulta porque perdeu o apetite, sente náusea contínua e percebeu urina mais escura. A febre havia desaparecido e o abdome está menor. Não tomou álcool, paracetamol ou outro medicamento novo.<\/p><p>ALT é 286 U/L (referência: até 41), AST 214 U/L, bilirrubina 2,1 mg/dL e INR 1,2. Não há dor biliar, hipotensão ou alteração de consciência. A equipe repete avaliação hepática e revê causas infecciosas, obstrutivas e medicamentosas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b_hepatico", "kicker": "Decisão", "tt": "Revisão do tratamento", "enunciado": "Qual conduta você adota nesta reavaliação?", "caminhos": [{"r": "Suspender temporariamente os fármacos potencialmente hepatotóxicos", "vai": "suspensao", "c": "Elevação importante de transaminases com sintomas exige interrupção dos agentes implicados e avaliação imediata. A estratégia provisória e a reintrodução serão conduzidas com a equipe de referência.", "rc": ""}, {"r": "Manter o esquema enquanto repete os exames", "vai": "continuacao", "c": "Não se deve interpretar náusea e elevação importante de enzimas como desconforto banal. A manutenção pode ampliar a lesão; um acompanhamento distante seria inadequado.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "suspensao", "kicker": "Reavaliação hepática", "tt": "", "corpo": "<p>Os fármacos potencialmente hepatotóxicos são interrompidos. A ultrassonografia não mostra obstrução biliar e a investigação não encontra outra causa mais consistente. A clínica acompanha enzimas, bilirrubina e coagulação em conjunto com a equipe de tuberculose.<\/p><p>Com melhora, o esquema é reconstruído e os agentes são reintroduzidos de forma supervisionada, conforme gravidade e protocolo. O tempo total e a composição podem precisar de ajuste; não se mantém etambutol sozinho como tratamento.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q7", "conforme": null, "rota": null}, {"t": "pagina", "k": "continuacao", "kicker": "Retorno por piora", "tt": "", "corpo": "<p>Neste percurso simulado, Elisa mantém as doses e volta com icterícia: bilirrubina 4,1 mg/dL, ALT 510 U/L e INR 1,4. O esquema é interrompido e ela é encaminhada à referência para acompanhamento e reconstrução do tratamento.<\/p><p>Não houve falência hepática estabelecida. A piora ilustra um custo possível de ignorar sinais de toxicidade, sem afirmar que a mesma decisão produziria esse desfecho em toda pessoa.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "q7", "conforme": null, "rota": null}, {"t": "pergunta", "k": "q7", "kicker": "Pergunta 7", "enunciado": "Quais duas informações ajudam a decidir segurança e reintrodução?", "alts": [{"t": "CA-125 como medida de lesão hepática", "c": "", "ok": 0}, {"t": "Desaparecimento da febre como prova de tolerância aos medicamentos", "c": "", "ok": 0}, {"t": "Nova ascite como requisito para suspender um agente tóxico", "c": "", "ok": 0}, {"t": "Tendência da bilirrubina e do INR", "c": "", "ok": 1}, {"t": "Evolução dos sintomas e das transaminases", "c": "", "ok": 1}], "escolhas": 2, "fundo": "", "exp": [{"h": "Gravidade e trajetória", "t": "Coagulação, bilirrubina, sintomas e enzimas ajudam a avaliar gravidade e recuperação. Não basta constatar que a infecção melhorou para manter uma exposição potencialmente lesiva."}, {"h": "Preservar tratamento eficaz", "t": "Interrupção e reintrodução precisam de acompanhamento próximo para tratar a doença sem monoterapia inadequada ou retomada insegura. A composição e a duração final dependem da gravidade e dos medicamentos tolerados."}], "tr": "", "nota": "", "segue": "revisao_final"}, {"t": "pagina", "k": "revisao_final", "kicker": "Retomada do seguimento", "tt": "", "corpo": "<p>O plano de tratamento é revisto com Elisa e com o serviço de referência. Mantêm-se cuidados nutricionais, apoio à adesão e acompanhamento clínico e hepático.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b_hepatico", "para": ["fim_controle", "fim_referencia"]}, "rota": null}, {"t": "desfecho", "k": "fim_controle", "kicker": "Desfecho", "tt": "Tratamento acompanhado", "corpo": "<p>Após reintrodução supervisionada e ajustes, Elisa segue o tratamento. A ascite diminui progressivamente, o apetite melhora e ela recupera peso. A duração final é definida com a equipe de referência, considerando a interrupção e os fármacos tolerados.<\/p>", "q": "melhor", "porque": "A identificação da toxicidade permitiu reorganizar o tratamento antes de agravamento maior.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "fim_referencia", "kicker": "Desfecho", "tt": "Seguimento na referência", "corpo": "<p>Elisa precisa de acompanhamento mais intensivo após a icterícia e de um plano individualizado para retomar terapia eficaz. A infecção permanece tratável, mas a intercorrência prolonga o cuidado e impede uma alta com o mesmo plano original.<\/p>", "q": "medio", "porque": "O percurso termina com tratamento em reorganização após um evento adverso; não transforma melhora da ascite em cura nem toxicidade em falha diagnóstica.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "retrospectiva", "kicker": "Pontos de ensino", "tt": "", "corpo": "<ol class=\"pontos\"><li data-n=\"1\"><p>Ascite recente exige caracterização, não um diagnóstico automático de cirrose.<\/p><\/li><li data-n=\"2\"><p>CA-125 pode refletir inflamação peritoneal; não substitui tecido.<\/p><\/li><li data-n=\"3\"><p>Citologia ou BAAR negativos não excluem, isoladamente, neoplasia ou tuberculose.<\/p><\/li><li data-n=\"4\"><p>A via de biópsia muda o material disponível e a necessidade de nova coleta.<\/p><\/li><li data-n=\"5\"><p>Melhora da infecção e toxicidade do tratamento podem ocorrer ao mesmo tempo.<\/p><\/li><\/ol>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "referencias", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Paciente, resultados e percursos são autorais e simulados. O relato-base de Nissim et al. teve diagnóstico clínico-histológico com testes microbiológicos negativos; nesta adaptação, a confirmação molecular e cultural é uma construção para ensino, apoiada em métodos utilizados na prática.<\/p><p><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9534663/\">Nissim et al., 2022, relato e figuras, CC BY<\/a>; <a href=\"https://www.canada.ca/en/public-health/services/diseases/tuberculosis/health-professionals/canadian-tuberculosis-standards/extra-pulmonary-tuberculosis.html\">Canadian TB Standards, doença extrapulmonar<\/a>; <a href=\"https://www.worldgastroenterology.org/guidelines/digestive-tract-tuberculosis/digestive-tract-tuberculosis-english\">WGO, tuberculose digestiva<\/a>. <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10923695/\">Oppong et al., 2024: tomografia e radiografia, CC BY 4.0<\/a>. Tratamento e hepatotoxicidade: <a href=\"https://bvsms.saude.gov.br/bvs/publicacoes/manual_recomendacoes_controle_tuberculose_brasil.pdf\">Ministério da Saúde, Manual de Recomendações para o Controle da Tuberculose no Brasil<\/a> e protocolo local vigente. Ilustração de abertura original; ultrassom do atlas de Matheus Parente com referência junto da figura.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}], "banco": {}, "revisao": [], "imgs": {"cena.png": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAFeKADAAQAAAABAAADpQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgDpQV4AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29 <script>
/* Paginação por blocos medidos. Nenhum bloco é descartado ou reduzido por zoom. */
let partesTela = [], parteTela = 0, areaTela = null;
const detalhesAbertos = new Set();
const temProximaParte = () => parteTela + 1 < partesTela.length;
function aplicarParte(){
  if (!areaTela) return;
  parteTela = Math.min(Math.max(parteTela, 0), Math.max(0, partesTela.length - 1));
  const ativos = new Set(partesTela[parteTela] || []);
  [...areaTela.children].forEach(el => el.toggleAttribute('data-fora', !ativos.has(el)));
  areaTela.scrollTop = 0; areaTela.scrollLeft = 0;
}
function virarParte(delta){
  parteTela += delta; aplicarParte(); pintarPe();
}
function montarFolhas(){
  partesTela = []; areaTela = null;
  const root = document.querySelector('#palco .plano,#palco .folha,#palco .fim .caixa');
  if (!root) return;
  const mobile = innerWidth <= 900;
  if (mobile && root.classList.contains('plano')){
    const figura = document.querySelector('#palco .lamina');
    if (figura) root.append(figura);
  }
  let area = root.querySelector(':scope > .qexp,:scope > .alts,:scope > .grupos,:scope > .res,:scope > .cams,:scope > .painel-lab,:scope > .par,:scope > .observacao-imagem');
  if (!area){
    root.classList.add('paginavel');
    area = document.createElement('div'); area.className = 'conteudo-paginado';
    const filhos = [...root.children];
    // Conserva o título como referência em todas as páginas de continuação.
    filhos.filter(el => !el.matches('.marca,h1,h2')).forEach(el => area.append(el));
    root.append(area);
  }
  if(area.classList.contains('cams')){const aviso=root.querySelector(':scope>.forca');if(aviso)area.append(aviso);}
  if(mobile)root.querySelectorAll('table').forEach(t=>{const nomes=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,n)=>td.dataset.col=nomes[n]||''));});
  area.classList.add('area-paginada'); areaTela = area;
  // Respostas e resultados permanecem inteiros: a densidade se adapta à tela.
  if(area.matches('.qexp,.alts,.res,.cams,.painel-lab,.par,.observacao-imagem')){
    root.classList.add('tela-unica');
    if(area.matches('.painel-lab,.observacao-imagem'))root.classList.add('paginavel');
    // Um quadro interno com overflow escondido (a tabela de exames, por
    // exemplo) pode cortar conteúdo sem que a área transborde: conta também.
    const cortado=()=>[...area.querySelectorAll('*')].some(el=>el.clientHeight>0&&el.scrollHeight>el.clientHeight+2&&!el.closest('.vv-est-fig')&&/hidden|auto|scroll|clip/.test(getComputedStyle(el).overflowY));
    const cabe=()=>area.scrollHeight<=area.clientHeight+1&&area.scrollWidth<=area.clientWidth+1&&!cortado();
    let fator=1;
    root.style.setProperty('--compacto',fator);
    while(!cabe()&&fator>0.25){fator=Math.max(0.25,fator-0.015);root.style.setProperty('--compacto',fator.toFixed(3));}
    partesTela=[[...area.children]];parteTela=0;aplicarParte();return;
  }

  // O flex precisa reservar espaço aos cabeçalhos e aos botões antes da medição.
  const capacidade = () => area.clientHeight;
  function grande(el){ const st=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0) > capacidade() - 3; }
  function dividir(el){
    if (!grande(el)) return false;
    if(mobile && el.matches('.grade,.bal,div:not([class])')){el.replaceWith(...el.children);return true;}
    let filhos = [], criar;
    if (el.matches('.gr')){
      filhos = [...el.querySelectorAll(':scope > .it')];
      criar = () => { const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c; };
    } else if (el.matches('.tops,.grade,.vit,.corpo .lg,aside,.cons,.rev,.bal,.painel-lab,.pontos')){
      filhos = [...el.children]; criar=()=>el.cloneNode(false);
    } else if (el.matches('.estudo-imagem') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('.corpo') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('table')){
      filhos=[...el.querySelectorAll('tbody tr')];
      criar=()=>{const c=el.cloneNode(false);if(el.tHead)c.append(el.tHead.cloneNode(true));c.append(document.createElement('tbody'));return c;};
    } else if (el.matches('details[open]')){
      filhos=[...el.children].filter(x=>x.tagName!=='SUMMARY');
      criar=()=>{const c=document.createElement('div');c.className='leitura continuacao-leitura';return c;};
    } else if (el.matches('.rc') && el.querySelector('figure')){
      filhos=[...el.children].filter(x=>x.tagName!=='B');
      criar=()=>{const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c;};
    }
    // Contêiner com um filho só: o que precisa partir é o filho.
    if (filhos.length === 1) return dividir(filhos[0]);
    if (filhos.length > 1){
      if(el.matches('.gr')){
        // Conserva o máximo de opções por grupo que a altura comporta.
        const blocos=[];let atual=criar();el.before(atual);
        for(const f of filhos){atual.append(f);if(grande(atual)&&atual.querySelectorAll('.it').length>1){f.remove();blocos.push(atual);atual=criar();el.before(atual);atual.append(f);}}
        el.remove();return true;
      }
      // Blocos inteiros, com cabeçalhos repetidos onde necessários.
      const novos=filhos.map(f=>{const c=criar();(c.tBodies?.[0]||c).append(f);return c;});
      el.replaceWith(...novos);return true;
    }
    if(el.matches('.cam') && el.querySelector('.c')?.textContent && !el.dataset.discussao){
      const comentario=el.querySelector('.c'),c=el.cloneNode(false);c.dataset.discussao='1';
      c.append(el.querySelector('.l').cloneNode(true));const rot=document.createElement('span');rot.className='r';rot.textContent='Discussão do caminho '+el.querySelector('.l').textContent;c.append(rot,comentario);el.after(c);return true;
    }
    const seletor=el.matches('p')?null:'.c,.cm,:scope>p';
    const alvo=seletor?el.querySelector(seletor):el;
    if(alvo && alvo.textContent.length>120){
      const walker=document.createTreeWalker(alvo,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      const txt=alvo.textContent,mid=txt.indexOf(' ',Math.floor(txt.length/2));
      if(mid<0)return false;
      let used=0,cut;
      for(const n of nodes){if(used+n.length>=mid){cut=[n,mid-used];break;}used+=n.length;}
      if(!cut)return false;
      const a=document.createRange();a.selectNodeContents(alvo);a.setEnd(...cut);
      const b=document.createRange();b.selectNodeContents(alvo);b.setStart(...cut);
      const left=el.cloneNode(true),right=el.cloneNode(true);
      (seletor?left.querySelector(seletor):left).replaceChildren(a.cloneContents());
      (seletor?right.querySelector(seletor):right).replaceChildren(b.cloneContents());
      el.replaceWith(left,right);return true;
    }
    return false;
  }
  // Une novamente apenas na próxima renderização; os originais continuam nos dados do caso.
  for(let pass=0;pass<8;pass++){
    let mudou=false;
    for(const el of [...area.children])if(dividir(el))mudou=true;
    if(!mudou)break;
  }
  const itens=[...area.children];
  itens.forEach(el=>el.setAttribute('data-fora',''));
  let folha=[];
  for(const el of itens){
    el.removeAttribute('data-fora');
    const excedeu = area.scrollHeight>area.clientHeight+2 || area.scrollWidth>area.clientWidth+2;
    if(excedeu && folha.length){
      partesTela.push(folha);folha.forEach(n=>n.setAttribute('data-fora',''));folha=[];
    }
    folha.push(el);
  }
  if(folha.length)partesTela.push(folha);
  aplicarParte();
}

/* ═══════════ o caso em etapas — página a página ═══════════

   Uma folha de cada vez. Nada rola: a página inteira é uma etapa, e passar de
   etapa é virar a folha. O que decide a folha seguinte é o que foi respondido
   na atual.

   Três coisas o motor guarda entre as etapas: os exames marcados em cada
   pedido, as respostas dadas, e o caminho escolhido em cada bifurcação. É com
   os exames marcados que a página de resultados sabe o que devolver — e é por
   isso que o que não foi pedido não aparece. */

const DADOS = JSON.parse(document.getElementById('dados').textContent);
const CASO = DADOS.caso, ETAPAS = DADOS.etapas, BANCO = DADOS.banco;
const REVISAO = DADOS.revisao;
/* As imagens viajam numa tabela à parte, uma vez cada: a etapa guarda
   só o nome do arquivo. */
const IMG = n => (DADOS.imgs || {})[n] || n || '';

const $ = s => document.querySelector(s);

/* ─────────────────────────── estado da sessão ─────────────────────────── */

let emRevisao = false;
let i = 0;                    // índice da etapa atual
const marcados = {};          // ident do pedido -> Set de nomes de exame
const respostas = {};         // ident da pergunta -> {marcadas:[], feita:bool}
const escolhas = {};          // ident da bifurcação -> índice do caminho
let historia = [0];           // pilha de etapas visitadas, para voltar
const laudos = new Set(); // laudos revelados por rodada de investigação

const porId = k => ETAPAS.findIndex(e => e.k === k);
/* Tudo o que já foi pedido em qualquer rodada, para os pré-requisitos e para
   as consequências do fim. */
function jaPedido(nome){
  return Object.values(marcados).some(c => c.has(nome));
}
const etapa = () => ETAPAS[i];

/* ─────────────────────────── navegação ─────────────────────────── */

function ir(n, empilhar){
  if (n < 0 || n >= ETAPAS.length) return;
  if (empilhar !== false) historia.push(n);
  i = n; parteTela = 0; emRevisao=false;
  pintar();
}

function irPara(k){
  const n = porId(k);
  if (n < 0){ console.warn('etapa inexistente:', k); return; }
  ir(n);
}

/* A folha seguinte é a vizinha, a menos que a etapa atual diga outra coisa —
   é assim que a bifurcação muda o rumo sem que a lista de etapas mude. */
function adiante(){
  if (temProximaParte()){ virarParte(1); return; }
  if(emRevisao){recomecar();return;}
  const e = etapa();
  if(e.comentado){
    const r=respostas[e.k];if(!r?.feita)return;
    const alts=e.alts.filter(a=>a.ok);
    marcados[e.k]=new Set(alts.flatMap(a=>a.exames));
    r.conducao='indicados';
  }
  if (e.t === 'bifurcacao'){
    const esc = escolhas[e.k];
    if (esc === undefined) return;
    irPara(e.caminhos[esc].vai);
    return;
  }
  if (e.t === 'desfecho'){
    if (e.fecho) irPara(e.fecho); else mostrarRevisao();
    return;
  }
  /* A rota é a ramificação de verdade: quem não pediu a prova não recebe a
     página que a discute. Sem isto, a peça perguntava "que exames você pede?" e
     depois seguia contando o resultado de exames que ninguém pediu — que é
     exatamente o vício que este formato existe para não ter. */
  if (e.rota){
    const pedidos = new Set();
    Object.values(marcados).forEach(c => c.forEach(n => pedidos.add(n)));
    const tem = e.rota.pediu.every(n => pedidos.has(n));
    irPara(tem ? e.rota.entao : e.rota.senao);
    return;
  }
  /* A evolução volta a se separar aqui: a página é a mesma para os três
     caminhos até o ponto em que o hemograma deixa de ser o mesmo. */
  if (e.conforme){
    const k = escolhas[e.conforme.de];
    irPara(e.conforme.para[k === undefined ? 0 : k]);
    return;
  }
  // `segue` deixa a ordem do arquivo de ser a única costura entre as páginas:
  // é o que permite três trilhas de tratamento convivendo na mesma lista
  if (e.segue){ irPara(e.segue); return; }
  if (i + 1 >= ETAPAS.length){ mostrarRevisao(); return; }
  ir(i + 1);
}

function atras(){
  if (parteTela > 0){ virarParte(-1); return; }
  if(emRevisao){emRevisao=false;parteTela=0;pintar();return;}
  const e = etapa();
  if (historia.length < 2) return;
  historia.pop();
  i = historia[historia.length - 1];
  pintar();
}

/* Quando se pode virar a folha. Pergunta sem resposta e pedido sem nenhum
   exame marcado seguram a página: o caso não anda por cima de uma decisão que
   não foi tomada. */
function podeAdiante(){
  if (emRevisao || temProximaParte()) return true;
  const e = etapa();
  if (e.t === 'pergunta' || e.t === 'pareamento')
    return !!(respostas[e.k] && respostas[e.k].feita);
  if (e.t === 'bifurcacao') return escolhas[e.k] !== undefined;
  if (e.t === 'pedido') return e.comentado ? !!respostas[e.k]?.feita : (marcados[e.k] || new Set()).size > 0;
  return true;
}

/* ─────────────────────────── o trilho ─────────────────────────── */

/* Desde que o caso ramifica, a lista de etapas deixou de ser o caminho: ela
   contém as páginas das DUAS rotas, e contar 27 num percurso de 19 é mentir
   para quem olha o trilho. Esta função percorre o caso a partir do estado
   atual e devolve só as páginas que este percurso vai ver. */
function rotaAtual(){
  const seq = [], visto = new Set();
  const pedidos = new Set();
  Object.values(marcados).forEach(c => c.forEach(x => pedidos.add(x)));
  let n = 0;
  while (n >= 0 && n < ETAPAS.length && !visto.has(n)){
    visto.add(n); seq.push(n);
    const e = ETAPAS[n];
    if (e.t === 'bifurcacao'){
      const esc = escolhas[e.k];
      n = porId(e.caminhos[esc === undefined ? 0 : esc].vai);
    } else if (e.t === 'desfecho'){
      n = e.fecho ? porId(e.fecho) : -1;
    } else if (e.rota){
      n = porId(e.rota.pediu.every(x => pedidos.has(x))
                ? e.rota.entao : e.rota.senao);
    } else if (e.conforme){
      const k = escolhas[e.conforme.de];
      n = porId(e.conforme.para[k === undefined ? 0 : k]);
    } else if (e.segue){
      n = porId(e.segue);
    } else n = n + 1;
  }
  return seq;
}

/* O trilho mostra as etapas do percurso, uma marca cada, colorida pelo tipo —
   e um contador explícito. É assim que o formato antigo do New England fazia,
   e a diferença é real: dá para ver quantas páginas faltam e onde estão as
   perguntas antes de chegar nelas. */
function pintarTrilho(){
  const seq = rotaAtual();
  const aqui = Math.max(seq.indexOf(i), 0);
  $('#trilho').innerHTML =
    '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>'
    + '<span class="cnt">' + (aqui + 1) + ' / ' + seq.length + '</span>'
    + '<span class="marcas">' + seq.map(n => ETAPAS[n]).map((e, k) =>
        // o título só aparece no que já foi percorrido: com o mouse parado
        // sobre uma marca à frente, o trilho entregava os desfechos — inclusive
        // qual deles é o ruim — antes de a bifurcação ser feita
        '<i class="m-' + e.t + (k < aqui ? ' feita' : k === aqui ? ' aqui' : '')
        + '" data-n="' + seq[k] + '"'
        + (k < aqui ? ' title="' + (e.tt || e.kicker || '').replace(/"/g, '') + '"' : '')
        + '></i>'
      ).join('') + '</span>';
  // andar para trás pelo trilho é livre; para a frente, não — o caso não pula
  // uma decisão que ainda não foi tomada
  const vistos = new Set(historia);
  $('#trilho').querySelectorAll('.marcas i').forEach(m => {
    const n = +m.dataset.n;
    if (vistos.has(n) && n !== i) m.onclick = () => ir(n);
  });
}

function pintarPe(){
  const e = etapa();
  const fim = e.t === 'desfecho';
  const corrigida=e.comentado && respostas[e.k]?.feita;
  $('#pe').innerHTML =
    '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav">'
    + (partesTela.length > 1 ? '<span class="pagina-indice">Página ' + (parteTela + 1) + ' de ' + partesTela.length + '</span>' : '')
    + '<button class="bt" id="voltar"' + (historia.length < 2 && parteTela === 0 ? ' disabled' : '') + '>Voltar</button>'
    + '<button class="bt forte" id="' + (emRevisao && !temProximaParte() ? 'reiniciar' : 'seguir') + '"' + (podeAdiante() ? '' : ' disabled') + '>'
    + (temProximaParte() ? 'Próxima página' : emRevisao ? 'Recomeçar' : e.t === 'capa' ? 'Começar o caso' : corrigida ? 'Realizar indicados' : fim ? 'Continuar' : 'Avançar') + '</button></span>';
  $('#voltar').onclick = atras;
  ($('#seguir') || $('#reiniciar')).onclick = adiante;
}

/* ─────────────────────────── desenho das etapas ─────────────────────────── */

const fundoDe = e => e.fundo
  ? '<div class="fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
  : '<div class="fundo" style="background:#0d1014"></div>';

const laminaDe = l => !l ? '' :
  '<figure class="lamina"><img src="' + IMG(l.img) + '" alt="' + l.tt + '">'
  + '<figcaption class="cap"><b>' + l.tt + '</b>' + l.lg
  + '<span class="cr">' + l.cr + '</span></figcaption></figure>';

/* Figura anotada e boneco vêm do caso como HTML pronto, montado antes de
   existir data: URI. Cada um deixa o nome do arquivo em `data-img` e o
   endereço é resolvido aqui, contra a mesma tabela de imagens. */
function resolverImagens(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = IMG(el.dataset.img);
    if (el.tagName.toLowerCase() === 'image') el.setAttribute('href', u);
    else el.setAttribute('src', u);
  });
}

/* ─────────────────────── a lupa ─────────────────────── */

/* Tomografia lida num cartão de 300 px é decoração. Qualquer figura da peça
   abre em tela cheia por clique, com a legenda embaixo, e fecha por clique,
   por Esc ou pelo botão. Enquanto a lupa está aberta as setas do teclado
   param de virar página: elas pertencem à figura, não ao caso. */
let lupaAberta = false;

function abrirLupa(figura){
  const clone = figura.cloneNode(true);
  clone.classList.remove('lamina');
  /* o tamanho ajustado à coluna não vale na lupa; e setas ainda não
     reveladas continuam ocultas quando a figura é ampliada */
  clone.style.width = '';
  clone.querySelectorAll('svg').forEach(s => { s.style.width = ''; s.style.height = ''; });
  if (document.querySelector('#palco .vv-est-rev:not([open])')) clone.querySelectorAll('.an').forEach(a => a.style.visibility = 'hidden');
  const cx = document.createElement('div');
  cx.className = 'lupa';
  cx.innerHTML = '<button class="fechar" title="Fechar (Esc)">Fechar ✕</button>';
  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  quadro.appendChild(clone);
  cx.appendChild(quadro);
  document.body.appendChild(cx);
  lupaAberta = true;
  /* figura anotada na lupa: do tamanho da imagem, sem faixas laterais */
  const sv = clone.querySelector('svg');
  if (sv && sv.viewBox && sv.viewBox.baseVal && sv.viewBox.baseVal.width){
    const r = sv.viewBox.baseVal.width / sv.viewBox.baseVal.height, cap = clone.querySelector('figcaption');
    const ajusta = w => { clone.style.width = w + 'px'; sv.style.width = w + 'px'; sv.style.height = (w / r) + 'px'; sv.style.maxHeight = 'none'; return cap ? cap.offsetHeight : 0; };
    const maxW = innerWidth * 0.92, maxH = innerHeight * 0.84;
    let w = Math.min(maxW, (maxH - ajusta(maxW)) * r);
    w = Math.min(maxW, (maxH - ajusta(w)) * r);
    ajusta(Math.max(w, 200));
    clone.classList.add('lupa-ajustada');
  }
  const fechar = () => {
    cx.remove(); lupaAberta = false;
    document.removeEventListener('keydown', porTecla, true);
  };
  const porTecla = ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); fechar(); }
  };
  document.addEventListener('keydown', porTecla, true);
  cx.onclick = ev => { if (!quadro.contains(ev.target) || ev.target.tagName === 'IMG') fechar(); };
  cx.querySelector('.fechar').onclick = fechar;
}

function ligarLupa(){
  document.querySelectorAll('#palco figure').forEach(f => {
    if (!f.querySelector('img,svg')) return;
    f.classList.add('amplia');
    f.title = 'Clique para ampliar';
    f.onclick = () => abrirLupa(f);
  });
}

function pintar(){
  const e = etapa();
  $('#palco').innerHTML = '<section class="tela on">' + DESENHO[e.t](e) + '</section>';
  resolverImagens();
  document.querySelectorAll('#palco details').forEach((d,n)=>{const key=etapa().k+'::'+n;d.dataset.detalhe=key;d.open=detalhesAbertos.has(key);});
  ligar(e);
  montarFolhas();
  document.querySelectorAll('#palco details').forEach(d=>{const summary=d.querySelector('summary');if(summary)summary.onclick=ev=>{ev.preventDefault();const key=d.dataset.detalhe;d.open?detalhesAbertos.delete(key):detalhesAbertos.add(key);parteTela=0;pintar();};});
  ligarLupa();
  acessibilidadeDaPagina();
  pintarTrilho();
  pintarPe();
}

/* A resposta no molde do //New England//: o gabarito numa frase e a
   explicação em seções com subtítulo, uma só para a pergunta inteira. */
function explicacaoDe(e){
  // no meio da frase, a alternativa perde a maiúscula inicial, mas não a
  // de siglas ("PCR", "HLA-B27")
  const minus = s => s.replace(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ])(?=[a-záéíóúâêôãõç]|\s+[a-záéíóúâêôãõç])/, c => c.toLowerCase());
  const certas = e.alts.filter(a => a.ok).map(a => '<b>' + minus(a.t) + '</b>');
  const lista = certas.length === 1 ? certas[0]
    : certas.slice(0, -1).join(', ') + ' e ' + certas[certas.length - 1];
  return '<div class="explica"><p class="gab">' + (certas.length === 1
      ? 'A resposta correta é ' : 'As respostas corretas são ') + lista + '.</p>'
    + e.exp.map(s => '<div class="ex-sec">' + (s.h ? '<h4>' + s.h + '</h4>' : '')
      + '<p>' + s.t + '</p></div>').join('') + '</div>';
}

const DESENHO = {

  /* Título e imagem. A imagem sobe do chão para a tela inteira, sem véu de
     leitura por cima dela senão o gradiente que segura o título. */
  capa: e =>
    '<div class="fundo capa-fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
    + '<div class="veu capa-veu"></div>'
    + '<div class="abertura">'
    + (e.kicker ? '<div class="marca"><i></i><span>' + e.kicker + '</span></div>' : '')
    + '<h1>' + e.tt + '</h1>'
    + (e.selo ? '<div class="selo">' + e.selo + '</div>' : '')
    + '</div>',

  /* Quando o rótulo é mais informativo que a manchete — "onde dava para ter
     chegado antes" contra "a retrospectiva" — quem sobe a título é o rótulo, e
     a manchete curta sai. O caso declara isso com `so_kicker`. */
  pagina: e =>
    fundoDe(e) + '<div class="veu ' + (e.lamina ? 'esq' : 'tudo') + '"></div>'
    + '<div class="plano' + (e.lamina ? '' : ' centro') + '">'
    + (e.so_kicker
        ? '<h2 class="do-kicker">' + e.kicker + '</h2>'
        : '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
          + '<h2>' + e.tt + '</h2>')
    + e.corpo + '</div>'
    + laminaDe(e.lamina),

  pedido: e => e.comentado ? DESENHO.pergunta(e) :
    fundoDe(e) + '<div class="veu tudo"></div>'
    + '<div class="folha pedido">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
    + '<div class="grupos">' + e.grupos.map(g =>
        '<div class="gr g-' + g.s + '"><b><i></i>' + g.n + '</b>'
        + g.o.map(o => {
            /* Um exame com pré-requisito continua VISÍVEL e fica travado, com
               o motivo escrito. Esconder ensinaria que ele não existe; o que
               se quer ensinar é que ele ainda não se justifica. */
            const falta = (o.ex || []).filter(x => !jaPedido(x));
            const trava = falta.length > 0;
            return '<label class="it' + (temMarcado(e.k, o.e) ? ' on' : '')
              + (trava ? ' trava' : '') + '" data-ex="' + esc(o.e) + '">'
              + '<span class="cx"></span><span class="n">' + o.e
              + (o.d ? '<span class="d">' + o.d + '</span>' : '')
              + (trava ? '<span class="d trv">' + o.pq + ' — falta: '
                  + falta.join(', ') + '</span>' : '')
              + '</span></label>';
          }).join('') + '</div>').join('')
    + '</div><div class="conta" id="conta"></div></div>',

  // Sem manchete: o rótulo já diz "o que voltou", e o primeiro cartão vira o
  // topo visual. Ganha noventa pixels e a tela começa no dado.
  resultados: e => {
    const todos = e.todos ? e.todos : [...(marcados[e.de] || [])];
    const origem=respostas[e.de]?.conducao;
    const resumo=origem==='indicados'?'Exames realizados pela equipe após a discussão.':'';
    const pedidos = todos;
    const sobre = e.sobre || (ETAPAS[porId(e.de)] || {}).sobre || {};
    const linhas = [], imagens = [];
    pedidos.forEach(n => {
      // o resultado que o caso declarou vence o do banco: o banco foi escrito
      // para um formato com relógio, e aqui não há relógio
      const x = sobre[n] || BANCO[n];
      if (!x) return '';
      const im = e.laminas[n];
      /* O laudo do sedimento tem cinco achados separados por ponto médio, e
         num parágrafo corrido o cilindro hemático — que é o achado — passava
         no meio da frase. Cada parte vira uma linha. */
      const partes = x.r.split(' · ');
      const valor = partes.length > 1
        ? partes.map(t => '<span class="ln">' + t + '</span>').join('')
        : x.r;
      /* Quando o exame tem imagem, a imagem vem SOZINHA e o laudo fica atrás
         de um botão. Colar o laudo na figura tira do grupo o passo que mais
         ensina em imagem, que é descrever antes de ler o que outro escreveu —
         e é invariante declarada do formato: laudo se revela, não se
         renderiza junto. */
      const laudo = '<div class="v">' + valor
        + (x.ref && x.ref !== '—' ? '<span class="rf">referência: ' + x.ref
            + '</span>' : '') + '</div>';
      if (!im) {
        linhas.push('<tr class="rc' + (x.a ? ' alt' : '') + '"><th scope="row"><b>' + n
          + '</b></th><td class="v">' + valor + '</td><td class="rf">'
          + (x.ref || '—') + '</td></tr>');
        return;
      }
      /* A legenda descritiva É o laudo. Deixá-la sob a figura enquanto um
         botão promete "ver o laudo" é entregar a leitura e cobrar o clique
         por nada: quem olhava a radiografia já lia "opacidades alveolares
         bilaterais predominando nos campos médios" antes de descrever coisa
         alguma. Sob a figura fica só o crédito; a descrição e o valor saem
         juntos, no clique. */
      const chaveLaudo = (e.de || e.k) + '::' + n;
      const aberto = laudos.has(chaveLaudo);
      imagens.push('<article class="rc resultado-imagem' + (x.a ? ' alt' : '') + '"><b>' + n + '</b>'
        + '<figure><img src="' + IMG(im.img) + '" alt="' + n + '">'
        + '<figcaption class="soc">' + im.cr + '</figcaption></figure>'
        + (aberto
            ? laudo + '<div class="leglaudo">' + im.lg + '</div>'
            : '<button class="verlaudo" data-laudo="' + esc(chaveLaudo) + '">'
              + 'Ver o laudo</button>')
        + '</article>');
    });
    const cartas = (linhas.length ? '<div class="laboratorio"><table class="exames-tabela"><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table></div>' : '')
      + (imagens.length ? '<div class="imagens-resultados" style="--figuras:' + imagens.length + '">' + imagens.join('') + '</div>' : '');
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca larga"><i></i><span>' + e.kicker
      + '</span>'
      + (resumo || e.intro ? '<b class="sub-in">' + resumo + ' ' + (e.intro || '').replace(/(?:De novo, só o que foi marcado\.|Só o que foi marcado\.)/g,'') + '</b>' : '') + '</div>'
      + '<div class="res resultados-editoriais' + (linhas.length && imagens.length ? ' misto' : '') + '">' + (cartas
          || '<div class="vazio">Você não pediu nenhum exame nesta etapa. O caso '
             + 'segue com o que se sabe do leito.</div>') + '</div></div>';
  },

  pergunta: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q' + (e.alts.length > 6 ? ' densa' : '') + '">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : (e.escolhas === 1 ? 'selecione uma'
             : 'selecione ' + e.escolhas + ' · marcadas ' + r.marcadas.length))
      + '</div>'
      + (e.exp ? '<div class="qexp' + (r.feita ? ' feita' : '') + '">' : '')
      + '<ul class="alts' + (r.feita ? ' feita' : '')
          + (e.alts.length > 6 ? ' muitas' : '') + (e.exp ? ' semcm' : '') + '">'
      + e.alts.map((a, k) =>
          '<li data-k="' + k + '" class="' + (a.ok ? 'certa' : 'errada')
          + (r.marcadas.includes(k) ? ' marcada' : '') + '">'
          + '<span class="k">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="tx">' + a.t + '</span>'
          + '<span class="cm">' + (r.feita ? '<span class="estado-resposta">' + (e.comentado ? a.situacao : (a.ok ? 'Correta' : 'Incorreta')) + (r.marcadas.includes(k) ? ' · sua seleção' : '') + '</span>' : '') + a.c + '</span></li>').join('')
      + '</ul>'
      + (e.exp ? (r.feita ? explicacaoDe(e) : '') + '</div>' : '')
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (r.marcadas.length >= e.escolhas ? '' : ' disabled') + '>'
          + 'Confirmar resposta</button>')
      + '</div>';
  },

  /* Pareamento: cada item tem a sua linha de letras. Marcar é atribuir uma
     letra ao item; a mesma letra pode servir a mais de um item, porque é
     assim na prova — e porque proibir a repetição entregaria a resposta por
     exclusão. */
  pareamento: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    const L = n => String.fromCharCode(65 + n);
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q par-folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : 'atribua uma letra a cada item · ' + r.marcadas.filter(x => x !== undefined && x !== null).length
            + ' de ' + e.itens.length) + '</div>'
      + '<div class="par' + (r.feita ? ' feita' : '') + '">'
      + '<div class="par-ops">' + e.ops.map((o, n) =>
          '<span class="po"><b>' + L(n) + '</b>' + o + '</span>').join('') + '</div>'
      + '<div class="par-itens">' + e.itens.map((it, n) => {
          const esc = r.marcadas[n];
          const certa = r.feita && esc === it.ok;
          return '<div class="pi' + (r.feita ? (certa ? ' certa' : ' errada') : '')
            + '" data-n="' + n + '">'
            + '<span class="pt">' + it.t + '</span>'
            + '<span class="pesc">' + e.ops.map((o, m) =>
                '<i class="pe' + (esc === m ? ' on' : '')
                + (r.feita && m === it.ok ? ' ok' : '') + '" data-m="' + m
                + '" title="' + esc2(o) + '">' + L(m) + '</i>').join('') + '</span>'
            + (r.feita ? '<span class="cm"><span class="estado-resposta">'
                + (certa ? 'Correta' : 'Incorreta · a resposta é ' + L(it.ok)
                    + (esc === undefined || esc === null ? '' : ' · você marcou ' + L(esc)))
                + '</span>' + it.c + '</span>' : '')
            + '</div>';
        }).join('') + '</div></div>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (e.itens.every((_, n) => r.marcadas[n] !== undefined && r.marcadas[n] !== null) ? '' : ' disabled')
          + '>Confirmar resposta</button>')
      + '</div>';
  },

  bifurcacao: e => {
    const esc = escolhas[e.k];
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
      + '<div class="cams' + (esc !== undefined ? ' feita' : '') + '">'
      + e.caminhos.map((c, k) =>
          '<div class="cam' + (esc === k ? ' escolhido' : '') + '" data-k="' + k + '">'
          + '<span class="l">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="r">' + c.r + '</span>'
          + '<span class="c">' + c.c + '</span></div>').join('')
      + '</div>'
      /* Sem isto, a ramificação era invisível: as três justificativas abriam,
         o caso seguia, e nada na tela dizia que o rumo tinha mudado. */
      + (esc !== undefined
          ? '<div class="forca">' + e.caminhos.map((c, k) =>
              '<i class="' + (esc === k ? 'on' : '') + '"></i>').join('')
            + '<span>Você escolheu o caminho '
            + String.fromCharCode(65 + esc) + '. O caso acompanha essa conduta. '
            + 'Você pode voltar para comparar os outros caminhos.</span></div>'
          : '')
      + '</div>';
  },

  /* O balanço: o que a condução custou, item a item, com o contrafactual ao
     lado. É a única tela do caso que só existe por causa do que VOCÊ fez. */
  balanco: e => {
    const bateu = q => {
      if (q.sem) return !q.sem.some(n => jaPedido(n));
      if (q.escolheu) return escolhas[q.escolheu[0]] === q.escolheu[1];
      if (q.escolheu_todos)
        return q.escolheu_todos.every(([k, v]) => escolhas[k] === v);
      return false;
    };
    const disparadas = e.cons.filter(c => bateu(c.q));
    const morreu = e.obito && bateu(e.obito);
    const dias = e.bd + disparadas.reduce((s, c) => s + c.d, 0);
    const tfg = e.bt - disparadas.reduce((s, c) => s + c.t, 0);
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2>' + e.corpo
      + '<div class="bal">'
      + (morreu
        ? '<div class="placar obito"><div class="cheio"><b>Óbito</b><span>'
          + e.obitotx + '</span></div></div>'
        : '<div class="placar">'
      +   '<div><b>' + dias + '</b><span>dias de internação</span></div>'
      +   '<div' + (tfg <= 15 ? ' class="grave"' : '') + '><b>' + tfg
      +     '</b><span>mL/min/1,73 m² na alta'
      +     (tfg <= 15 ? ' · saiu em diálise' : '') + '</span></div>'
      +   '<div class="ideal"><b>' + e.bd + ' · ' + e.bt + '</b>'
      +     '<span>o melhor percurso possível</span></div>'
      + '</div>')
      + (disparadas.length
          ? '<div class="cons">' + disparadas.map(c =>
              '<div class="cn"><b>' + c.tt + '</b>'
              + '<span class="pr">' + (c.d ? '+' + c.d + ' dias' : '')
              + (c.d && c.t ? ' · ' : '') + (c.t ? '−' + c.t + ' mL/min' : '')
              + '</span><p>' + c.pq + '</p></div>').join('') + '</div>'
          : '<div class="cons"><div class="cn limpo"><b>Nenhuma decisão desta '
            + 'condução cobrou preço.</b><p>Você chegou ao melhor percurso que '
            + 'este caso permite. É raro, e não é sorte: as decisões que '
            + 'custam caro aqui são todas das primeiras 72 horas.</p></div></div>')
      + '</div></div>';
  },

  desfecho: e =>
    fundoDe(e) + '<div class="veu tudo q-' + e.q + '"></div>'
    + '<div class="fim ' + e.q + '"><div class="caixa">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h1>' + e.tt + '</h1>' + e.corpo
    + '<div class="porque"><b>Por quê</b><p>' + e.porque + '</p></div>'
    + '</div></div>',
};

/* ─────────────────────────── interação ─────────────────────────── */

const esc = s => s.replace(/"/g, '&quot;');
const esc2 = s => String(s).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
const temMarcado = (k, n) => (marcados[k] || new Set()).has(n);

function ligar(e){
  if (e.t === 'pedido' && !e.comentado){
    const conj = marcados[e.k] || (marcados[e.k] = new Set());
    /* O teto é o que faz a pergunta ser uma pergunta. Sem ele, marcar tudo é
       sempre a jogada dominante — e um grupo que marca tudo não decidiu nada,
       além de encerrar a investigação na primeira tela. */
    const teto = e.limite || 0;
    const cheio = () => teto && conj.size >= teto;
    const contar = () => {
      const faltam = teto ? teto - conj.size : 0;
      $('#conta').innerHTML = '<b>' + conj.size
        + (teto ? ' de ' + teto : '') + '</b> '
        + (conj.size === 1 ? 'exame marcado' : 'exames marcados')
        + (teto
            ? (faltam > 0
                ? ' · ainda cabe' + (faltam === 1 ? ' 1' : 'm ' + faltam)
                : ' · o teto desta rodada está completo — desmarque para trocar')
            : ' · nada é obrigatório, e nada é sugerido');
      document.querySelectorAll('.it[data-ex]').forEach(l =>
        l.classList.toggle('bloq', cheio() && !conj.has(l.dataset.ex)));
      pintarPe();
    };
    document.querySelectorAll('.it[data-ex]').forEach(l => {
      l.onclick = () => {
        if (l.classList.contains('trava')) return;
        const n = l.dataset.ex;
        if (conj.has(n)) conj.delete(n);
        else if (cheio()) return;          // o teto não empurra: ele segura
        else conj.add(n);
        pintar();
        const atual=[...document.querySelectorAll('.it')].find(x=>x.dataset.ex===n);
        if(atual?.getClientRects().length)atual.focus({preventScroll:true});
      };
    });
    contar();
  }

  if (e.t === 'resultados'){
    document.querySelectorAll('.verlaudo').forEach(b => {
      b.onclick = () => {
        const nome=b.closest('.rc').querySelector('b').textContent;
        laudos.add(b.dataset.laudo);pintar();
        const cartao=[...document.querySelectorAll('.rc')].find(c=>c.querySelector('b')?.textContent===nome&&c.querySelector('.v'));
        const parte=partesTela.findIndex(p=>p.some(n=>n===cartao||n.contains(cartao)));
        if(parte>=0){parteTela=parte;aplicarParte();pintarPe();}
      };
    });
  }

  if (e.t === 'pergunta' || e.comentado){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.alts li').forEach(li => {
      li.onclick = () => {
        const k = +li.dataset.k;
        const j = r.marcadas.indexOf(k);
        // marcar e desmarcar até confirmar: a escolha não é irreversível
        // enquanto o grupo ainda está discutindo
        if (j >= 0) r.marcadas.splice(j, 1);
        else if (r.marcadas.length < e.escolhas) r.marcadas.push(k);
        else { r.marcadas.shift(); r.marcadas.push(k); }
        document.querySelectorAll('.alts li').forEach((x, n) =>
          x.classList.toggle('marcada', r.marcadas.includes(n)));
        const b = $('#conf');
        if (b) b.disabled = r.marcadas.length < e.escolhas;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if(r.marcadas.length!==e.escolhas)return;
      r.feita = true;
      if(e.comentado)marcados[e.k]=new Set(e.alts.filter(a=>a.ok).flatMap(a=>a.exames));
      parteTela=0; pintar();
    };
  }

  if (e.t === 'pareamento'){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.par .pe').forEach(ch => {
      ch.onclick = ev => {
        ev.stopPropagation();
        const n = +ch.closest('.pi').dataset.n, m = +ch.dataset.m;
        r.marcadas[n] = (r.marcadas[n] === m) ? undefined : m;
        const linha = ch.closest('.pi');
        linha.querySelectorAll('.pe').forEach(x => x.classList.toggle('on', +x.dataset.m === r.marcadas[n]));
        const completo = e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null);
        const b = $('#conf'); if (b) b.disabled = !completo;
        const d = document.querySelector('.qdica');
        if (d) d.textContent = 'atribua uma letra a cada item · '
          + e.itens.filter((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null).length
          + ' de ' + e.itens.length;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if (!e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null)) return;
      r.feita = true; parteTela = 0; pintar();
    };
  }

  if (e.t === 'bifurcacao'){
    if (escolhas[e.k] !== undefined) return;
    document.querySelectorAll('.cam').forEach(c => {
      c.onclick = () => { escolhas[e.k] = +c.dataset.k; parteTela=0; pintar(); };
    });
  }
}

/* ─────────────────────────── a revisão do fim ─────────────────────────── */

/* O único lugar em que o caso comenta o que ficou de fora, e ele só fala
   quando não há mais nada a decidir. Durante a condução, apontar o que falta
   é decidir pelo grupo. */
function mostrarRevisao(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  /* `respostas[k]` nasce quando a página é PINTADA, não quando é respondida, e
     `[].every()` é `true`: uma pergunta só visitada entrava no total e no
     acerto. Dava para chegar à revisão com "4 de 4" tendo respondido três. */
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  const acertos = feitas.filter(([k, r]) => {
    const e = ETAPAS[porId(k)];
    if (!e) return false;
    if (e.t === 'pareamento')
      return e.itens.every((it, n) => r.marcadas[n] === it.ok);
    return r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok);
  }).length;
  const total = feitas.length;

  $('#palco').innerHTML = '<section class="tela on">'
    + '<div class="fundo" style="background:#0d1014"></div>'
    + '<div class="veu tudo"></div><div class="folha">'
    + '<div class="marca"><i></i><span>Revisão</span></div>'
    + '<h2>O que ficou para trás</h2>'
    + '<p class="sub">' + acertos + ' de ' + total + ' perguntas de escolha com '
    + 'a resposta inteiramente certa · '
    + (pediu.size ? Object.keys(marcados).length + ' rodadas de exames, ' + pediu.size + ' pedidos ao todo · ' : '')
    + Object.keys(escolhas).length + ' decisões de conduta.</p>'
    + '<div class="rev">' + (faltou.length
        ? faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>'
            + r.porque + '</p></div>').join('')
        : '<div class="ok">Nada essencial ficou de fora.</div>')
    + '</div></div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><button class="bt" onclick="recomecar()">'
    + 'Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao=true;parteTela=0;montarFolhas();pintarPe();
}

function recomecar(){
  i = 0; historia = [0]; emRevisao=false;
  Object.keys(marcados).forEach(k => delete marcados[k]);
  Object.keys(respostas).forEach(k => delete respostas[k]);
  Object.keys(escolhas).forEach(k => delete escolhas[k]);
  laudos.clear(); detalhesAbertos.clear(); parteTela=0;
  pintar();
}

/* ─────────────────────────── teclado ─────────────────────────── */

addEventListener('keydown', ev => {
  if (lupaAberta) return;              // as setas são da figura enquanto ela está aberta
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown'){
    if (podeAdiante()) adiante();
    ev.preventDefault();
  } else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){
    atras(); ev.preventDefault();
  }
});

let resizeTela;
addEventListener("resize",()=>{clearTimeout(resizeTela);resizeTela=setTimeout(()=>{if(!lupaAberta){if(emRevisao)mostrarRevisao();else pintar();}},120);});
pintar();

function acessibilidadeDaPagina(){
  document.querySelectorAll('.it,.cam,.alts li,figure.amplia,.par .pe').forEach(el=>{
    el.tabIndex=0;el.setAttribute('role',el.classList.contains('it')?'checkbox':'button');
    if(el.classList.contains('it'))el.setAttribute('aria-checked',el.classList.contains('on')?'true':'false');
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();el.click();}});
  });
}
