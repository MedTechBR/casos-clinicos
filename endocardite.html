<script type="application/json" id="dados">{"caso": {"titulo": "Pequenos sinais", "slug": "endocardite", "cor": "#db2777", "rodape": "Paciente ficcional · evoluções simuladas para ensino · versão de 24/09 00:35", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "Pequenos sinais", "fundo": "", "kicker": "Caso interativo", "selo": "Paciente ficcional · procedência e créditos na última tela", "proc": ""}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Lúcia, 59 anos, costureira em Sobral, procura o ambulatório de clínica médica por cinco semanas de febre baixa no fim do dia, cansaço e sudorese à noite. Perdeu 5 kg. \"Não tenho mais força nem para a máquina de costura.\"<\/p><p>Na terceira semana, a unidade básica tratou como infecção urinária com ciprofloxacino por sete dias: a febre sumiu e voltou quatro dias depois. Na quarta semana recebeu amoxicilina por cinco dias por \"sinusite\". Nada mudou.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "hda", "kicker": "História da doença atual", "tt": "", "corpo": "<p>A febre fica entre 37,8 e 38,3 °C. Há dores nas costas e nos joelhos, sem inchaço. Nos últimos dias notou \"umas manchinhas vermelhas\" nas plantas dos pés, que não doem, e dois caroços doloridos na ponta dos dedos, que sumiram em dois dias.<\/p><p>Nega tosse, disúria e diarreia. Nos últimos três meses, as fezes às vezes vêm \"mais escuras\", e ela atribuiu ao sulfato ferroso que tomou por anemia.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Antecedentes", "tt": "", "corpo": "<p>Teve <b>febre reumática na infância<\/b>, com \"sopro no coração\" acompanhado no posto. Um ecocardiograma de três anos atrás mostrou insuficiência mitral moderada. Hipertensa, usa losartana.<\/p><p>Não fez procedimentos dentários recentes. Não usa drogas injetáveis, não tem cateter nem prótese. Anemia ferropriva tratada há seis meses, sem investigação da causa.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div class=alt><b>38,1 °C<\/b><span>Temperatura<\/span><\/div><div><b>132/70<\/b><span>Pressão arterial<\/span><\/div><div><b>98<\/b><span>Frequência cardíaca<\/span><\/div><div><b>18<\/b><span>Frequência respiratória<\/span><\/div><div><b>96%<\/b><span>SpO₂ em ar ambiente<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral<\/b><p><b>Palidez<\/b> moderada, emagrecida.<\/p><\/div><div><b>Cardiovascular<\/b><p><b>Sopro holossistólico mitral 3+/6<\/b> irradiado para a axila. Sem terceira bulha.<\/p><\/div><div><b>Olhos<\/b><p>Duas <b>petéquias na conjuntiva<\/b> palpebral inferior esquerda.<\/p><\/div><div><b>Mãos e pés<\/b><p><b>Hemorragias em estilha<\/b> em três unhas. Máculas eritematosas indolores nas plantas. Um nódulo doloroso na polpa do quarto dedo direito.<\/p><\/div><div><b>Abdome<\/b><p><b>Baço palpável<\/b> a 2 cm do rebordo.<\/p><\/div><div><b>Neurológico<\/b><p>Sem déficit focal.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p1", "kicker": "Pergunta 1", "enunciado": "Febre baixa por cinco semanas, perda de peso e sopro mitral numa mulher com cardiopatia reumática, depois de dois antibióticos curtos. <b>Quais quatro<\/b> diagnósticos precisam ser considerados?", "alts": [{"t": "Febre reumática aguda recorrente", "c": "Rara depois dos 40, sem artrite migratória verdadeira, sem coreia, sem cardite nova.", "ok": 0}, {"t": "Sinusite bacteriana", "c": "Não faz cinco semanas de febre com esplenomegalia.", "ok": 0}, {"t": "Endocardite infecciosa", "c": "Valvopatia prévia, febre prolongada que cede e volta com antibiótico curto, esplenomegalia: é a hipótese principal.", "ok": 1}, {"t": "Mixoma atrial", "c": "Febre, sopro e fenômenos embólicos também são mixoma. O ecocardiograma separa.", "ok": 1}, {"t": "Pielonefrite crônica", "c": "Explicaria febre, não o sopro, o baço e as lesões de pele.", "ok": 0}, {"t": "Tuberculose extrapulmonar", "c": "Febre vespertina e emagrecimento no Brasil. Hemocultura e imagem ajudam a separar.", "ok": 1}, {"t": "Hipertireoidismo", "c": "Perda de peso e taquicardia, sim; febre persistente e petéquias, não.", "ok": 0}, {"t": "Linfoma", "c": "Febre, sudorese, perda de peso e baço palpável: não se fecha febre prolongada sem pensar nele.", "ok": 1}, {"t": "Doença de Still do adulto", "c": "Febre em picos acima de 39 °C, exantema que acompanha a febre e artrite: não é o padrão dela.", "ok": 0}], "escolhas": 4, "fundo": "", "tr": "Febre que volta sempre que o antibiótico acaba", "nota": "", "segue": ""}, {"t": "pareamento", "k": "p2", "kicker": "Pergunta 2", "enunciado": "Os sinais periféricos da endocardite entram como critérios menores de Duke. Associe cada achado ao tipo de fenômeno.", "itens": [{"t": "Nódulo de Osler: doloroso, na polpa digital", "ok": 2, "c": "Vasculite por imunocomplexo. Dói porque é inflamação, não microabscesso."}, {"t": "Lesão de Janeway: mácula indolor, na palma ou na planta", "ok": 3, "c": "Microêmbolo séptico com microabscesso na derme. Não dói."}, {"t": "Mancha de Roth: hemorragia retiniana com centro pálido", "ok": 2, "c": "Vasculite retiniana por imunocomplexo, no mesmo grupo de Osler."}, {"t": "Hemorragia conjuntival em paciente com vegetação", "ok": 3, "c": "Êmbolo em capilar conjuntival. Soma com Janeway e infartos."}, {"t": "Glomerulonefrite com hematúria e fator reumatoide positivo", "ok": 2, "c": "Imunocomplexo circulante: o rim e o fator reumatoide contam como critério imunológico."}, {"t": "Regurgitação nova por perfuração de folheto no ecocardiograma", "ok": 0, "c": "Não é critério menor: é evidência direta de lesão endocárdica."}], "ops": ["Destruição valvar (critério maior de imagem)", "Reação ao antibiótico", "Fenômeno imunológico", "Fenômeno vascular"], "fundo": "", "tr": "Dói é imunológico; não dói é embólico", "nota": "A opção que sobrou, reação ao antibiótico, não explica nenhum desses achados.", "segue": ""}, {"t": "pergunta", "k": "ex1", "kicker": "Pergunta 3", "enunciado": "Suspeita de endocardite. <b>Quais quatro<\/b> condutas diagnósticas são as mais apropriadas agora?", "alts": [{"t": "Sorologias para Bartonella e Coxiella já na chegada", "c": "Entram na endocardite com cultura negativa, que ainda não é o caso.", "ok": 0}, {"t": "Tomografia de crânio sem sintoma neurológico", "c": "Rastreio de êmbolo cerebral assintomático não é rotina antes do diagnóstico.", "ok": 0}, {"t": "Iniciar antibiótico empírico antes de colher, pela febre", "c": "Ela está estável. Na endocardite subaguda, colher antes vale mais que ganhar horas.", "ok": 0}, {"t": "PET-CT como exame inicial", "c": "Tem papel na endocardite de prótese e em focos a distância. Não substitui o ecocardiograma na valva nativa.", "ok": 0}, {"t": "Procalcitonina para decidir se trata", "c": "Não confirma nem exclui endocardite.", "ok": 0}, {"t": "Eletrocardiograma", "c": "Um PR que se alarga no seguimento é abscesso perivalvar até prova em contrário. O basal é a referência.", "ok": 1}, {"t": "Ecocardiograma transtorácico, seguido de transesofágico", "c": "O transtorácico vê vegetações grandes; o transesofágico vê as pequenas e as complicações perivalvares.", "ok": 1}, {"t": "Hemograma, função renal e urina com sedimento", "c": "Anemia, lesão renal e hematúria de glomerulonefrite entram na gravidade e nos critérios.", "ok": 1}, {"t": "Três pares de hemoculturas de punções diferentes, antes do antibiótico", "c": "Bacteremia contínua é a marca da endocardite. Três pares separados, antes de qualquer dose, dão o agente e a persistência.", "ok": 1}], "escolhas": 4, "fundo": "", "tr": "Colher antes, olhar a valva, medir o estrago", "nota": "", "segue": ""}, {"t": "resultados", "k": "res1", "kicker": "Resultados", "tt": "O que a equipe pediu", "de": "", "fundo": "", "intro": "Hemoculturas colhidas em três punções, com uma hora de intervalo, antes de qualquer antibiótico.", "nota": "", "laminas": {}, "todos": ["Hemoculturas", "Hemoglobina", "Ferritina", "Leucócitos / plaquetas", "VHS / proteína C reativa", "Creatinina", "Urina", "Fator reumatoide", "Eletrocardiograma", "Ecocardiograma transtorácico"], "sobre": {"Hemoculturas": {"n": "Hemoculturas", "r": "<b>3 de 3 pares positivos<\/b> para <i>Streptococcus gallolyticus<\/i> (antigo <i>S. bovis<\/i> biotipo I) · sensível à penicilina, CIM 0,06 µg/mL", "ref": "negativas", "a": 1}, "Hemoglobina": {"n": "Hemoglobina", "r": "9,8 g/dL · VCM 76 fL", "ref": "12–16 g/dL", "a": 1}, "Ferritina": {"n": "Ferritina", "r": "18 ng/mL", "ref": "15–150 ng/mL", "a": 1}, "Leucócitos / plaquetas": {"n": "Leucócitos / plaquetas", "r": "11.200 / 180.000 por mm³", "ref": "—", "a": 0}, "VHS / proteína C reativa": {"n": "VHS / proteína C reativa", "r": "86 mm/h / 74 mg/L", "ref": "até 20 / 5", "a": 1}, "Creatinina": {"n": "Creatinina", "r": "1,3 mg/dL", "ref": "0,6–1,1 mg/dL", "a": 1}, "Urina": {"n": "Urina", "r": "Hematúria de 15 por campo, proteinúria 1+", "ref": "normal", "a": 1}, "Fator reumatoide": {"n": "Fator reumatoide", "r": "Reagente, 64 UI/mL", "ref": "até 14 UI/mL", "a": 1}, "Eletrocardiograma": {"n": "Eletrocardiograma", "r": "Ritmo sinusal, 98 bpm · PR 180 ms", "ref": "—", "a": 0}, "Ecocardiograma transtorácico": {"n": "Ecocardiograma transtorácico", "r": "<b>Vegetação de 12 mm<\/b> no folheto anterior mitral · insuficiência mitral importante · fração de ejeção 62%", "ref": "—", "a": 1}}, "rota": null}, {"t": "pergunta", "k": "p4", "kicker": "Pergunta 4", "enunciado": "Três hemoculturas com <i>S. gallolyticus<\/i> e vegetação de 12 mm na mitral. Pelos critérios de Duke-ISCVID de 2023, qual a classificação?", "alts": [{"t": "Endocardite possível, até o ecocardiograma transesofágico", "c": "O transesofágico vai detalhar complicações, mas o diagnóstico já está fechado pelo transtorácico.", "ok": 0}, {"t": "Endocardite possível, porque falta o critério patológico", "c": "Patologia só existe quando se opera ou na necropsia. A classificação clínica não depende dela.", "ok": 0}, {"t": "Endocardite rejeitada, porque ela recebeu antibiótico antes", "c": "O antibiótico prévio reduz a positividade das culturas; aqui elas vieram positivas assim mesmo.", "ok": 0}, {"t": "Endocardite definida", "c": "Dois critérios maiores: microrganismo típico em hemoculturas repetidas e evidência de imagem de vegetação. Os menores só reforçam.", "ok": 1}, {"t": "Bacteremia sem endocardite, por ser um estreptococo", "c": "O <i>S. gallolyticus<\/i> está entre os agentes típicos de endocardite nos critérios.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "Dois maiores fecham", "nota": "", "segue": ""}, {"t": "pergunta", "k": "p5", "kicker": "Pergunta 5", "enunciado": "O agente é <i>Streptococcus gallolyticus<\/i>. Que investigação adicional é <b>obrigatória<\/b>?", "alts": [{"t": "Colonoscopia", "c": "O <i>S. gallolyticus<\/i> tem associação forte com adenoma e adenocarcinoma colorretal. A anemia ferropriva não investigada e as fezes escuras dela ganham outro sentido.", "ok": 1}, {"t": "Tomografia de crânio", "c": "Sem sintoma neurológico, não é a investigação que o agente pede.", "ok": 0}, {"t": "Pesquisa de sangue oculto nas fezes, e colonoscopia só se positiva", "c": "Um resultado negativo não afasta a lesão. O agente já é a indicação.", "ok": 0}, {"t": "Biópsia de medula óssea", "c": "A anemia é ferropriva, com ferritina de 18.", "ok": 0}, {"t": "Endoscopia digestiva alta, e só ela", "c": "Pode entrar, mas a associação do agente é com o cólon.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "O agente manda olhar o cólon", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b1", "kicker": "Decisão", "tt": "O antibiótico", "enunciado": "Endocardite definida por estreptococo sensível à penicilina, em valva nativa. Como tratar?", "caminhos": [{"r": "Penicilina cristalina ou ceftriaxona endovenosa por quatro semanas, com transesofágico e avaliação da cirurgia cardíaca", "vai": "tratamento", "c": "É o esquema da valva nativa por estreptococo sensível, com a equipe de endocardite desde o início.", "rc": ""}, {"r": "Amoxicilina oral por duas semanas, em casa", "vai": "oral", "c": "Duas semanas de oral não é esquema de endocardite, e a vegetação é grande.", "rc": ""}, {"r": "Vancomicina e gentamicina empíricas até o transesofágico", "vai": "vanco", "c": "O agente e a sensibilidade já são conhecidos. Vancomicina é inferior aos betalactâmicos para estreptococo sensível, e a gentamicina lesa o rim.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "oral", "kicker": "Dez dias depois", "tt": "", "corpo": "<p>Lúcia volta com febre de 38,6 °C e falta de ar ao deitar. As hemoculturas voltam a crescer <i>S. gallolyticus<\/i>. É internada para antibiótico endovenoso, com dez dias perdidos.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tratamento", "conforme": null, "rota": null}, {"t": "pagina", "k": "vanco", "kicker": "Quatro dias depois", "tt": "", "corpo": "<p>A febre cede devagar, mas a creatinina sobe de 1,3 para 2,4 mg/dL. A infectologia troca para ceftriaxona e suspende a gentamicina.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tratamento", "conforme": null, "rota": null}, {"t": "pagina", "k": "tratamento", "kicker": "Primeira semana de antibiótico", "tt": "", "corpo": "<p>Ceftriaxona 2 g ao dia. A febre some no quarto dia, e as hemoculturas de controle do terceiro dia são negativas.<\/p><p>O transesofágico confirma a c": "Quem já teve, tem risco alto de ter de novo.", "ok": 1}, {"t": "Cardiopatia congênita cianótica não corrigida", "c": "Está entre as condições de risco mais alto.", "ok": 1}, {"t": "Portador de prótese valvar ou de material protético em reparo valvar", "c": "Maior risco de endocardite e de desfecho grave. Lúcia, agora com remendo ou prótese, entra aqui.", "ok": 1}, {"t": "Portador de marca-passo definitivo", "c": "Não há indicação para procedimento dentário.", "ok": 0}], "escolhas": 3, "fundo": "", "tr": "Prótese, endocardite prévia e congênita cianótica", "nota": "", "segue": ""}, {"t": "pergunta", "k": "p8", "kicker": "Pergunta 8", "enunciado": "Sobre o tratamento de Lúcia, <b>quais três<\/b> afirmações estão corretas?", "alts": [{"t": "A duração conta a partir da primeira hemocultura negativa", "c": "E, se a cultura da valva operada for positiva, recomeça da cirurgia.", "ok": 1}, {"t": "Avaliação odontológica completa antes da alta", "c": "Tratar focos dentários reduz o risco de nova endocardite.", "ok": 1}, {"t": "A gentamicina deve ser associada em todo esquema de estreptococo", "c": "Estreptococo sensível em valva nativa trata-se com betalactâmico isolado por quatro semanas.", "ok": 0}, {"t": "Hemoculturas diárias até o fim do tratamento", "c": "Colhe-se até a primeira negativa, e de novo se voltar a febre.", "ok": 0}, {"t": "Paciente estável, com culturas negativas, pode completar com antibiótico oral ou em casa", "c": "O ensaio POET mostrou que a passagem para via oral, em pacientes estáveis, não foi inferior.", "ok": 1}, {"t": "Ácido acetilsalicílico para prevenir embolia", "c": "Sem benefício e com mais sangramento.", "ok": 0}, {"t": "Anticoagulação plena reduz a embolia da vegetação", "c": "Não reduz, e aumenta o sangramento, inclusive cerebral.", "ok": 0}], "escolhas": 3, "fundo": "", "tr": "Contar certo, completar em casa quando der, e cuidar dos dentes", "nota": "", "segue": ""}, {"t": "pagina", "k": "alta", "kicker": "Preparando a alta", "tt": "", "corpo": "<p>Lúcia completa o antibiótico com culturas negativas. O ecocardiograma de controle mostra a valva funcionando.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b2", "para": ["alta_cedo", "f2"]}, "rota": null}, {"t": "pagina", "k": "alta_cedo", "kicker": "Última semana", "tt": "", "corpo": "<p>Ela já sobe um lance de escada sem parar e voltou a costurar no quarto do hospital.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b1", "para": ["f1", "f2", "f2"]}, "rota": null}, {"t": "desfecho", "k": "f1", "kicker": "Desfecho", "tt": "Alta com a valva preservada", "corpo": "<p>Plástica mitral funcionando, sem regurgitação significativa, fração de ejeção preservada. Seguimento da cardiologia e colonoscopia de vigilância em um ano.<\/p>", "q": "melhor", "porque": "O antibiótico certo desde o início, a cirurgia no primeiro sinal de insuficiência cardíaca e o cólon investigado pelo agente: as três decisões contaram.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "f2", "kicker": "Desfecho", "tt": "Alta depois de um percurso mais longo", "corpo": "<p>Lúcia sai viva, com a infecção controlada, mas com mais dias de internação, função renal pior que a basal ou uma prótese no lugar da valva que poderia ter sido reparada.<\/p>", "q": "medio", "porque": "Esquema inadequado ou cirurgia adiada acrescentaram dano. A valva perfurada não espera o fim do antibiótico.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "f_obito", "kicker": "Desfecho", "tt": "Óbito no décimo primeiro dia", "corpo": "<p>Lúcia morre em choque cardiogênico refratário, com a infecção já controlada pelo antibiótico.<\/p>", "q": "pior", "porque": "A insuficiência mitral aguda por perfuração valvar é indicação de cirurgia de urgência. Esperar estabilizar um choque que só a cirurgia corrige foi a decisão fatal.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "retrospectiva", "kicker": "Retrospectiva", "tt": "", "corpo": "<table class=\"tb\"><thead><tr><th>Momento<\/th><th>O dado<\/th><th>O que decidiu<\/th><\/tr><\/thead><tbody><tr><td>Unidade básica<\/td><td>Febre que voltava depois de cada antibiótico curto<\/td><td>Valvopata com febre prolongada colhe hemocultura antes de tratar<\/td><\/tr><tr><td>Exame<\/td><td>Estilhas, Janeway, Osler, baço<\/td><td>Os pequenos sinais do título<\/td><\/tr><tr><td>Hemoculturas<\/td><td><i>S. gallolyticus<\/i><\/td><td>O agente manda olhar o cólon<\/td><\/tr><tr><td>Sexto dia<\/td><td>Edema pulmonar com folheto perfurado<\/td><td>Cirurgia precoce, sem esperar o fim do antibiótico<\/td><\/tr><tr><td>Alta<\/td><td>Endocardite prévia e material protético<\/td><td>Agora ela tem indicação de profilaxia<\/td><\/tr><\/tbody><\/table>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Paciente, valores e percursos são ficcionais.<\/p><p>Fowler e cols. The 2023 Duke-ISCVID Criteria for Infective Endocarditis, Clin Infect Dis 2023. Delgado e cols. ESC Guidelines for the management of endocarditis, 2023. Iversen e cols. POET, N Engl J Med 2019. Wilson e cols. Prevention of Viridans Group Streptococcal Infective Endocarditis, AHA 2021.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}], "banco": {}, "revisao": [], "imgs": {}}</script>
<script>
/* Paginação por blocos medidos. Nenhum bloco é descartado ou reduzido por zoom. */
let partesTela = [], parteTela = 0, areaTela = null;
const detalhesAbertos = new Set();
const temProximaParte = () => parteTela + 1 < partesTela.length;
function aplicarParte(){
  if (!areaTela) return;
  parteTela = Math.min(Math.max(parteTela, 0), Math.max(0, partesTela.length - 1));
  const ativos = new Set(partesTela[parteTela] || []);
  [...areaTela.children].forEach(el => el.toggleAttribute('data-fora', !ativos.has(el)));
  areaTela.scrollTop = 0; areaTela.scrollLeft = 0;
}
function virarParte(delta){
  parteTela += delta; aplicarParte(); pintarPe();
}
function montarFolhas(){
  partesTela = []; areaTela = null;
  const root = document.querySelector('#palco .plano,#palco .folha,#palco .fim .caixa');
  if (!root) return;
  const mobile = innerWidth <= 900;
  if (mobile && root.classList.contains('plano')){
    const figura = document.querySelector('#palco .lamina');
    if (figura) root.append(figura);
  }
  let area = root.querySelector(':scope > .alts,:scope > .grupos,:scope > .res,:scope > .cams,:scope > .painel-lab,:scope > .par,:scope > .observacao-imagem');
  if (!area){
    root.classList.add('paginavel');
    area = document.createElement('div'); area.className = 'conteudo-paginado';
    const filhos = [...root.children];
    // Conserva o título como referência em todas as páginas de continuação.
    filhos.filter(el => !el.matches('.marca,h1,h2')).forEach(el => area.append(el));
    root.append(area);
  }
  if(area.classList.contains('cams')){const aviso=root.querySelector(':scope>.forca');if(aviso)area.append(aviso);}
  if(mobile)root.querySelectorAll('table').forEach(t=>{const nomes=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,n)=>td.dataset.col=nomes[n]||''));});
  area.classList.add('area-paginada'); areaTela = area;
  // Respostas e resultados permanecem inteiros: a densidade se adapta à tela.
  if(area.matches('.alts,.res,.cams,.painel-lab,.par,.observacao-imagem')){
    root.classList.add('tela-unica');
    if(area.matches('.painel-lab,.observacao-imagem'))root.classList.add('paginavel');
    const cabe=()=>area.scrollHeight<=area.clientHeight+1&&area.scrollWidth<=area.clientWidth+1;
    let fator=1;
    root.style.setProperty('--compacto',fator);
    while(!cabe()&&fator>0.25){fator=Math.max(0.25,fator-0.015);root.style.setProperty('--compacto',fator.toFixed(3));}
    partesTela=[[...area.children]];parteTela=0;aplicarParte();return;
  }

  // O flex precisa reservar espaço aos cabeçalhos e aos botões antes da medição.
  const capacidade = () => area.clientHeight;
  function grande(el){ const st=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0) > capacidade() - 3; }
  function dividir(el){
    if (!grande(el)) return false;
    if(mobile && el.matches('.grade,.bal,div:not([class])')){el.replaceWith(...el.children);return true;}
    let filhos = [], criar;
    if (el.matches('.gr')){
      filhos = [...el.querySelectorAll(':scope > .it')];
      criar = () => { const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c; };
    } else if (el.matches('.tops,.grade,.vit,.corpo .lg,aside,.cons,.rev,.bal,.painel-lab')){
      filhos = [...el.children]; criar=()=>el.cloneNode(false);
    } else if (el.matches('.estudo-imagem') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('.corpo') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('table')){
      filhos=[...el.querySelectorAll('tbody tr')];
      criar=()=>{const c=el.cloneNode(false);if(el.tHead)c.append(el.tHead.cloneNode(true));c.append(document.createElement('tbody'));return c;};
    } else if (el.matches('details[open]')){
      filhos=[...el.children].filter(x=>x.tagName!=='SUMMARY');
      criar=()=>{const c=document.createElement('div');c.className='leitura continuacao-leitura';return c;};
    } else if (el.matches('.rc') && el.querySelector('figure')){
      filhos=[...el.children].filter(x=>x.tagName!=='B');
      criar=()=>{const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c;};
    }
    // Contêiner com um filho só: o que precisa partir é o filho.
    if (filhos.length === 1) return dividir(filhos[0]);
    if (filhos.length > 1){
      if(el.matches('.gr')){
        // Conserva o máximo de opções por grupo que a altura comporta.
        const blocos=[];let atual=criar();el.before(atual);
        for(const f of filhos){atual.append(f);if(grande(atual)&&atual.querySelectorAll('.it').length>1){f.remove();blocos.push(atual);atual=criar();el.before(atual);atual.append(f);}}
        el.remove();return true;
      }
      // Blocos inteiros, com cabeçalhos repetidos onde necessários.
      const novos=filhos.map(f=>{const c=criar();(c.tBodies?.[0]||c).append(f);return c;});
      el.replaceWith(...novos);return true;
    }
    if(el.matches('.cam') && el.querySelector('.c')?.textContent && !el.dataset.discussao){
      const comentario=el.querySelector('.c'),c=el.cloneNode(false);c.dataset.discussao='1';
      c.append(el.querySelector('.l').cloneNode(true));const rot=document.createElement('span');rot.className='r';rot.textContent='Discussão do caminho '+el.querySelector('.l').textContent;c.append(rot,comentario);el.after(c);return true;
    }
    const seletor=el.matches('p')?null:'.c,.cm,:scope>p';
    const alvo=seletor?el.querySelector(seletor):el;
    if(alvo && alvo.textContent.length>120){
      const walker=document.createTreeWalker(alvo,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      const txt=alvo.textContent,mid=txt.indexOf(' ',Math.floor(txt.length/2));
      if(mid<0)return false;
      let used=0,cut;
      for(const n of nodes){if(used+n.length>=mid){cut=[n,mid-used];break;}used+=n.length;}
      if(!cut)return false;
      const a=document.createRange();a.selectNodeContents(alvo);a.setEnd(...cut);
      const b=document.createRange();b.selectNodeContents(alvo);b.setStart(...cut);
      const left=el.cloneNode(true),right=el.cloneNode(true);
      (seletor?left.querySelector(seletor):left).replaceChildren(a.cloneContents());
      (seletor?right.querySelector(seletor):right).replaceChildren(b.cloneContents());
      el.replaceWith(left,right);return true;
    }
    return false;
  }
  // Une novamente apenas na próxima renderização; os originais continuam nos dados do caso.
  for(let pass=0;pass<8;pass++){
    let mudou=false;
    for(const el of [...area.children])if(dividir(el))mudou=true;
    if(!mudou)break;
  }
  const itens=[...area.children];
  itens.forEach(el=>el.setAttribute('data-fora',''));
  let folha=[];
  for(const el of itens){
    el.removeAttribute('data-fora');
    const excedeu = area.scrollHeight>area.clientHeight+2 || area.scrollWidth>area.clientWidth+2;
    if(excedeu && folha.length){
      partesTela.push(folha);folha.forEach(n=>n.setAttribute('data-fora',''));folha=[];
    }
    folha.push(el);
  }
  if(folha.length)partesTela.push(folha);
  aplicarParte();
}

/* ═══════════ o caso em etapas — página a página ═══════════

   Uma folha de cada vez. Nada rola: a página inteira é uma etapa, e passar de
   etapa é virar a folha. O que decide a folha seguinte é o que foi respondido
   na atual.

   Três coisas o motor guarda entre as etapas: os exames marcados em cada
   pedido, as respostas dadas, e o caminho escolhido em cada bifurcação. É com
   os exames marcados que a página de resultados sabe o que devolver — e é por
   isso que o que não foi pedido não aparece. */

const DADOS = JSON.parse(document.getElementById('dados').textContent);
const CASO = DADOS.caso, ETAPAS = DADOS.etapas, BANCO = DADOS.banco;
const REVISAO = DADOS.revisao;
/* As imagens viajam numa tabela à parte, uma vez cada: a etapa guarda
   só o nome do arquivo. */
const IMG = n => (DADOS.imgs || {})[n] || n || '';

const $ = s => document.querySelector(s);

/* ─────────────────────────── estado da sessão ─────────────────────────── */

let emRevisao = false;
let i = 0;                    // índice da etapa atual
const marcados = {};          // ident do pedido -> Set de nomes de exame
const respostas = {};         // ident da pergunta -> {marcadas:[], feita:bool}
const escolhas = {};          // ident da bifurcação -> índice do caminho
let historia = [0];           // pilha de etapas visitadas, para voltar
const laudos = new Set(); // laudos revelados por rodada de investigação

const porId = k => ETAPAS.findIndex(e => e.k === k);
/* Tudo o que já foi pedido em qualquer rodada, para os pré-requisitos e para
   as consequências do fim. */
function jaPedido(nome){
  return Object.values(marcados).some(c => c.has(nome));
}
const etapa = () => ETAPAS[i];

/* ─────────────────────────── navegação ─────────────────────────── */

function ir(n, empilhar){
  if (n < 0 || n >= ETAPAS.length) return;
  if (empilhar !== false) historia.push(n);
  i = n; parteTela = 0; emRevisao=false;
  pintar();
}

function irPara(k){
  const n = porId(k);
  if (n < 0){ console.warn('etapa inexistente:', k); return; }
  ir(n);
}

/* A folha seguinte é a vizinha, a menos que a etapa atual diga outra coisa —
   é assim que a bifurcação muda o rumo sem que a lista de etapas mude. */
function adiante(){
  if (temProximaParte()){ virarParte(1); return; }
  if(emRevisao){recomecar();return;}
  const e = etapa();
  if(e.comentado){
    const r=respostas[e.k];if(!r?.feita)return;
    const alts=e.alts.filter(a=>a.ok);
    marcados[e.k]=new Set(alts.flatMap(a=>a.exames));
    r.conducao='indicados';
  }
  if (e.t === 'bifurcacao'){
    const esc = escolhas[e.k];
    if (esc === undefined) return;
    irPara(e.caminhos[esc].vai);
    return;
  }
  if (e.t === 'desfecho'){
    if (e.fecho) irPara(e.fecho); else mostrarRevisao();
    return;
  }
  /* A rota é a ramificação de verdade: quem não pediu a prova não recebe a
     página que a discute. Sem isto, a peça perguntava "que exames você pede?" e
     depois seguia contando o resultado de exames que ninguém pediu — que é
     exatamente o vício que este formato existe para não ter. */
  if (e.rota){
    const pedidos = new Set();
    Object.values(marcados).forEach(c => c.forEach(n => pedidos.add(n)));
    const tem = e.rota.pediu.every(n => pedidos.has(n));
    irPara(tem ? e.rota.entao : e.rota.senao);
    return;
  }
  /* A evolução volta a se separar aqui: a página é a mesma para os três
     caminhos até o ponto em que o hemograma deixa de ser o mesmo. */
  if (e.conforme){
    const k = escolhas[e.conforme.de];
    irPara(e.conforme.para[k === undefined ? 0 : k]);
    return;
  }
  // `segue` deixa a ordem do arquivo de ser a única costura entre as páginas:
  // é o que permite três trilhas de tratamento convivendo na mesma lista
  if (e.segue){ irPara(e.segue); return; }
  if (i + 1 >= ETAPAS.length){ mostrarRevisao(); return; }
  ir(i + 1);
}

function atras(){
  if (parteTela > 0){ virarParte(-1); return; }
  if(emRevisao){emRevisao=false;parteTela=0;pintar();return;}
  const e = etapa();
  if (historia.length < 2) return;
  historia.pop();
  i = historia[historia.length - 1];
  pintar();
}

/* Quando se pode virar a folha. Pergunta sem resposta e pedido sem nenhum
   exame marcado seguram a página: o caso não anda por cima de uma decisão que
   não foi tomada. */
function podeAdiante(){
  if (emRevisao || temProximaParte()) return true;
  const e = etapa();
  if (e.t === 'pergunta' || e.t === 'pareamento')
    return !!(respostas[e.k] && respostas[e.k].feita);
  if (e.t === 'bifurcacao') return escolhas[e.k] !== undefined;
  if (e.t === 'pedido') return e.comentado ? !!respostas[e.k]?.feita : (marcados[e.k] || new Set()).size > 0;
  return true;
}

/* ─────────────────────────── o trilho ─────────────────────────── */

/* Desde que o caso ramifica, a lista de etapas deixou de ser o caminho: ela
   contém as páginas das DUAS rotas, e contar 27 num percurso de 19 é mentir
   para quem olha o trilho. Esta função percorre o caso a partir do estado
   atual e devolve só as páginas que este percurso vai ver. */
function rotaAtual(){
  const seq = [], visto = new Set();
  const pedidos = new Set();
  Object.values(marcados).forEach(c => c.forEach(x => pedidos.add(x)));
  let n = 0;
  while (n >= 0 && n < ETAPAS.length && !visto.has(n)){
    visto.add(n); seq.push(n);
    const e = ETAPAS[n];
    if (e.t === 'bifurcacao'){
      const esc = escolhas[e.k];
      n = porId(e.caminhos[esc === undefined ? 0 : esc].vai);
    } else if (e.t === 'desfecho'){
      n = e.fecho ? porId(e.fecho) : -1;
    } else if (e.rota){
      n = porId(e.rota.pediu.every(x => pedidos.has(x))
                ? e.rota.entao : e.rota.senao);
    } else if (e.conforme){
      const k = escolhas[e.conforme.de];
      n = porId(e.conforme.para[k === undefined ? 0 : k]);
    } else if (e.segue){
      n = porId(e.segue);
    } else n = n + 1;
  }
  return seq;
}

/* O trilho mostra as etapas do percurso, uma marca cada, colorida pelo tipo —
   e um contador explícito. É assim que o formato antigo do New England fazia,
   e a diferença é real: dá para ver quantas páginas faltam e onde estão as
   perguntas antes de chegar nelas. */
function pintarTrilho(){
  const seq = rotaAtual();
  const aqui = Math.max(seq.indexOf(i), 0);
  $('#trilho').innerHTML =
    '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>'
    + '<span class="cnt">' + (aqui + 1) + ' / ' + seq.length + '</span>'
    + '<span class="marcas">' + seq.map(n => ETAPAS[n]).map((e, k) =>
        // o título só aparece no que já foi percorrido: com o mouse parado
        // sobre uma marca à frente, o trilho entregava os desfechos — inclusive
        // qual deles é o ruim — antes de a bifurcação ser feita
        '<i class="m-' + e.t + (k < aqui ? ' feita' : k === aqui ? ' aqui' : '')
        + '" data-n="' + seq[k] + '"'
        + (k < aqui ? ' title="' + (e.tt || e.kicker || '').replace(/"/g, '') + '"' : '')
        + '></i>'
      ).join('') + '</span>';
  // andar para trás pelo trilho é livre; para a frente, não — o caso não pula
  // uma decisão que ainda não foi tomada
  const vistos = new Set(historia);
  $('#trilho').querySelectorAll('.marcas i').forEach(m => {
    const n = +m.dataset.n;
    if (vistos.has(n) && n !== i) m.onclick = () => ir(n);
  });
}

function pintarPe(){
  const e = etapa();
  const fim = e.t === 'desfecho';
  const corrigida=e.comentado && respostas[e.k]?.feita;
  $('#pe').innerHTML =
    '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav">'
    + (partesTela.length > 1 ? '<span class="pagina-indice">Página ' + (parteTela + 1) + ' de ' + partesTela.length + '</span>' : '')
    + '<button class="bt" id="voltar"' + (historia.length < 2 && parteTela === 0 ? ' disabled' : '') + '>Voltar</button>'
    + '<button class="bt forte" id="' + (emRevisao && !temProximaParte() ? 'reiniciar' : 'seguir') + '"' + (podeAdiante() ? '' : ' disabled') + '>'
    + (temProximaParte() ? 'Próxima página' : emRevisao ? 'Recomeçar' : e.t === 'capa' ? 'Começar o caso' : corrigida ? 'Realizar indicados' : fim ? 'Continuar' : 'Avançar') + '</button></span>';
  $('#voltar').onclick = atras;
  ($('#seguir') || $('#reiniciar')).onclick = adiante;
}

/* ─────────────────────────── desenho das etapas ─────────────────────────── */

const fundoDe = e => e.fundo
  ? '<div class="fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
  : '<div class="fundo" style="background:#0d1014"></div>';

const laminaDe = l => !l ? '' :
  '<figure class="lamina"><img src="' + IMG(l.img) + '" alt="' + l.tt + '">'
  + '<figcaption class="cap"><b>' + l.tt + '</b>' + l.lg
  + '<span class="cr">' + l.cr + '</span></figcaption></figure>';

/* Figura anotada e boneco vêm do caso como HTML pronto, montado antes de
   existir data: URI. Cada um deixa o nome do arquivo em `data-img` e o
   endereço é resolvido aqui, contra a mesma tabela de imagens. */
function resolverImagens(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = IMG(el.dataset.img);
    if (el.tagName.toLowerCase() === 'image') el.setAttribute('href', u);
    else el.setAttribute('src', u);
  });
}

/* ─────────────────────── a lupa ─────────────────────── */

/* Tomografia lida num cartão de 300 px é decoração. Qualquer figura da peça
   abre em tela cheia por clique, com a legenda embaixo, e fecha por clique,
   por Esc ou pelo botão. Enquanto a lupa está aberta as setas do teclado
   param de virar página: elas pertencem à figura, não ao caso. */
let lupaAberta = false;

function abrirLupa(figura){
  const clone = figura.cloneNode(true);
  clone.classList.remove('lamina');
  const cx = document.createElement('div');
  cx.className = 'lupa';
  cx.innerHTML = '<button class="fechar" title="Fechar (Esc)">Fechar ✕</button>';
  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  quadro.appendChild(clone);
  cx.appendChild(quadro);
  document.body.appendChild(cx);
  lupaAberta = true;
  const fechar = () => {
    cx.remove(); lupaAberta = false;
    document.removeEventListener('keydown', porTecla, true);
  };
  const porTecla = ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); fechar(); }
  };
  document.addEventListener('keydown', porTecla, true);
  cx.onclick = ev => { if (!quadro.contains(ev.target) || ev.target.tagName === 'IMG') fechar(); };
  cx.querySelector('.fechar').onclick = fechar;
}

function ligarLupa(){
  document.querySelectorAll('#palco figure').forEach(f => {
    if (!f.querySelector('img,svg')) return;
    f.classList.add('amplia');
    f.title = 'Clique para ampliar';
    f.onclick = () => abrirLupa(f);
  });
}

function pintar(){
  const e = etapa();
  $('#palco').innerHTML = '<section class="tela on">' + DESENHO[e.t](e) + '</section>';
  resolverImagens();
  document.querySelectorAll('#palco details').forEach((d,n)=>{const key=etapa().k+'::'+n;d.dataset.detalhe=key;d.open=detalhesAbertos.has(key);});
  ligar(e);
  montarFolhas();
  document.querySelectorAll('#palco details').forEach(d=>{const summary=d.querySelector('summary');if(summary)summary.onclick=ev=>{ev.preventDefault();const key=d.dataset.detalhe;d.open?detalhesAbertos.delete(key):detalhesAbertos.add(key);parteTela=0;pintar();};});
  ligarLupa();
  acessibilidadeDaPagina();
  pintarTrilho();
  pintarPe();
}

const DESENHO = {

  /* Título e imagem. A imagem sobe do chão para a tela inteira, sem véu de
     leitura por cima dela senão o gradiente que segura o título. */
  capa: e =>
    '<div class="fundo capa-fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
    + '<div class="veu capa-veu"></div>'
    + '<div class="abertura">'
    + (e.kicker ? '<div class="marca"><i></i><span>' + e.kicker + '</span></div>' : '')
    + '<h1>' + e.tt + '</h1>'
    + (e.selo ? '<div class="selo">' + e.selo + '</div>' : '')
    + '</div>',

  /* Quando o rótulo é mais informativo que a manchete — "onde dava para ter
     chegado antes" contra "a retrospectiva" — quem sobe a título é o rótulo, e
     a manchete curta sai. O caso declara isso com `so_kicker`. */
  pagina: e =>
    fundoDe(e) + '<div class="veu ' + (e.lamina ? 'esq' : 'tudo') + '"></div>'
    + '<div class="plano' + (e.lamina ? '' : ' centro') + '">'
    + (e.so_kicker
        ? '<h2 class="do-kicker">' + e.kicker + '</h2>'
        : '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
          + '<h2>' + e.tt + '</h2>')
    + e.corpo + '</div>'
    + laminaDe(e.lamina),

  pedido: e => e.comentado ? DESENHO.pergunta(e) :
    fundoDe(e) + '<div class="veu tudo"></div>'
    + '<div class="folha pedido">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
    + '<div class="grupos">' + e.grupos.map(g =>
        '<div class="gr g-' + g.s + '"><b><i></i>' + g.n + '</b>'
        + g.o.map(o => {
            /* Um exame com pré-requisito continua VISÍVEL e fica travado, com
               o motivo escrito. Esconder ensinaria que ele não existe; o que
               se quer ensinar é que ele ainda não se justifica. */
            const falta = (o.ex || []).filter(x => !jaPedido(x));
            const trava = falta.length > 0;
            return '<label class="it' + (temMarcado(e.k, o.e) ? ' on' : '')
              + (trava ? ' trava' : '') + '" data-ex="' + esc(o.e) + '">'
              + '<span class="cx"></span><span class="n">' + o.e
              + (o.d ? '<span class="d">' + o.d + '</span>' : '')
              + (trava ? '<span class="d trv">' + o.pq + ' — falta: '
                  + falta.join(', ') + '</span>' : '')
              + '</span></label>';
          }).join('') + '</div>').join('')
    + '</div><div class="conta" id="conta"></div></div>',

  // Sem manchete: o rótulo já diz "o que voltou", e o primeiro cartão vira o
  // topo visual. Ganha noventa pixels e a tela começa no dado.
  resultados: e => {
    const todos = e.todos ? e.todos : [...(marcados[e.de] || [])];
    const origem=respostas[e.de]?.conducao;
    const resumo=origem==='indicados'?'Exames realizados pela equipe após a discussão.':'';
    const pedidos = todos;
    const sobre = e.sobre || (ETAPAS[porId(e.de)] || {}).sobre || {};
    const linhas = [], imagens = [];
    pedidos.forEach(n => {
      // o resultado que o caso declarou vence o do banco: o banco foi escrito
      // para um formato com relógio, e aqui não há relógio
      const x = sobre[n] || BANCO[n];
      if (!x) return '';
      const im = e.laminas[n];
      /* O laudo do sedimento tem cinco achados separados por ponto médio, e
         num parágrafo corrido o cilindro hemático — que é o achado — passava
         no meio da frase. Cada parte vira uma linha. */
      const partes = x.r.split(' · ');
      const valor = partes.length > 1
        ? partes.map(t => '<span class="ln">' + t + '</span>').join('')
        : x.r;
      /* Quando o exame tem imagem, a imagem vem SOZINHA e o laudo fica atrás
         de um botão. Colar o laudo na figura tira do grupo o passo que mais
         ensina em imagem, que é descrever antes de ler o que outro escreveu —
         e é invariante declarada do formato: laudo se revela, não se
         renderiza junto. */
      const laudo = '<div class="v">' + valor
        + (x.ref && x.ref !== '—' ? '<span class="rf">referência: ' + x.ref
            + '</span>' : '') + '</div>';
      if (!im) {
        linhas.push('<tr class="rc' + (x.a ? ' alt' : '') + '"><th scope="row"><b>' + n
          + '</b></th><td class="v">' + valor + '</td><td class="rf">'
          + (x.ref || '—') + '</td></tr>');
        return;
      }
      /* A legenda descritiva É o laudo. Deixá-la sob a figura enquanto um
         botão promete "ver o laudo" é entregar a leitura e cobrar o clique
         por nada: quem olhava a radiografia já lia "opacidades alveolares
         bilaterais predominando nos campos médios" antes de descrever coisa
         alguma. Sob a figura fica só o crédito; a descrição e o valor saem
         juntos, no clique. */
      const chaveLaudo = (e.de || e.k) + '::' + n;
      const aberto = laudos.has(chaveLaudo);
      imagens.push('<article class="rc resultado-imagem' + (x.a ? ' alt' : '') + '"><b>' + n + '</b>'
        + '<figure><img src="' + IMG(im.img) + '" alt="' + n + '">'
        + '<figcaption class="soc">' + im.cr + '</figcaption></figure>'
        + (aberto
            ? laudo + '<div class="leglaudo">' + im.lg + '</div>'
            : '<button class="verlaudo" data-laudo="' + esc(chaveLaudo) + '">'
              + 'Ver o laudo</button>')
        + '</article>');
    });
    const cartas = (linhas.length ? '<div class="laboratorio"><table class="exames-tabela"><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table></div>' : '')
      + (imagens.length ? '<div class="imagens-resultados" style="--figuras:' + imagens.length + '">' + imagens.join('') + '</div>' : '');
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca larga"><i></i><span>' + e.kicker
      + '</span>'
      + (resumo || e.intro ? '<b class="sub-in">' + resumo + ' ' + (e.intro || '').replace(/(?:De novo, só o que foi marcado\.|Só o que foi marcado\.)/g,'') + '</b>' : '') + '</div>'
      + '<div class="res resultados-editoriais' + (linhas.length && imagens.length ? ' misto' : '') + '">' + (cartas
          || '<div class="vazio">Você não pediu nenhum exame nesta etapa. O caso '
             + 'segue com o que se sabe do leito.</div>') + '</div></div>';
  },

  pergunta: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q' + (e.alts.length > 6 ? ' densa' : '') + '">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : (e.escolhas === 1 ? 'selecione uma'
             : 'selecione ' + e.escolhas + ' · marcadas ' + r.marcadas.length))
      + '</div>'
      + '<ul class="alts' + (r.feita ? ' feita' : '')
          + (e.alts.length > 6 ? ' muitas' : '') + '">'
      + e.alts.map((a, k) =>
          '<li data-k="' + k + '" class="' + (a.ok ? 'certa' : 'errada')
          + (r.marcadas.includes(k) ? ' marcada' : '') + '">'
          + '<span class="k">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="tx">' + a.t + '</span>'
          + '<span class="cm">' + (r.feita ? '<span class="estado-resposta">' + (e.comentado ? a.situacao : (a.ok ? 'Correta' : 'Incorreta')) + (r.marcadas.includes(k) ? ' · sua seleção' : '') + '</span>' : '') + a.c + '</span></li>').join('')
      + '</ul>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (r.marcadas.length >= e.escolhas ? '' : ' disabled') + '>'
          + 'Confirmar resposta</button>')
      + '</div>';
  },

  /* Pareamento: cada item tem a sua linha de letras. Marcar é atribuir uma
     letra ao item; a mesma letra pode servir a mais de um item, porque é
     assim na prova — e porque proibir a repetição entregaria a resposta por
     exclusão. */
  pareamento: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    const L = n => String.fromCharCode(65 + n);
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q par-folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : 'atribua uma letra a cada item · ' + r.marcadas.filter(x => x !== undefined && x !== null).length
            + ' de ' + e.itens.length) + '</div>'
      + '<div class="par' + (r.feita ? ' feita' : '') + '">'
      + '<div class="par-ops">' + e.ops.map((o, n) =>
          '<span class="po"><b>' + L(n) + '</b>' + o + '</span>').join('') + '</div>'
      + '<div class="par-itens">' + e.itens.map((it, n) => {
          const esc = r.marcadas[n];
          const certa = r.feita && esc === it.ok;
          return '<div class="pi' + (r.feita ? (certa ? ' certa' : ' errada') : '')
            + '" data-n="' + n + '">'
            + '<span class="pt">' + it.t + '</span>'
            + '<span class="pesc">' + e.ops.map((o, m) =>
                '<i class="pe' + (esc === m ? ' on' : '')
                + (r.feita && m === it.ok ? ' ok' : '') + '" data-m="' + m
                + '" title="' + esc2(o) + '">' + L(m) + '</i>').join('') + '</span>'
            + (r.feita ? '<span class="cm"><span class="estado-resposta">'
                + (certa ? 'Correta' : 'Incorreta · a resposta é ' + L(it.ok)
                    + (esc === undefined || esc === null ? '' : ' · você marcou ' + L(esc)))
                + '</span>' + it.c + '</span>' : '')
            + '</div>';
        }).join('') + '</div></div>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (e.itens.every((_, n) => r.marcadas[n] !== undefined && r.marcadas[n] !== null) ? '' : ' disabled')
          + '>Confirmar resposta</button>')
      + '</div>';
  },

  bifurcacao: e => {
    const esc = escolhas[e.k];
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
      + '<div class="cams' + (esc !== undefined ? ' feita' : '') + '">'
      + e.caminhos.map((c, k) =>
          '<div class="cam' + (esc === k ? ' escolhido' : '') + '" data-k="' + k + '">'
          + '<span class="l">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="r">' + c.r + '</span>'
          + '<span class="c">' + c.c + '</span></div>').join('')
      + '</div>'
      /* Sem isto, a ramificação era invisível: as três justificativas abriam,
         o caso seguia, e nada na tela dizia que o rumo tinha mudado. */
      + (esc !== undefined
          ? '<div class="forca">' + e.caminhos.map((c, k) =>
              '<i class="' + (esc === k ? 'on' : '') + '"></i>').join('')
            + '<span>Daqui em diante o caso segue pelo caminho '
            + String.fromCharCode(65 + esc) + '. As próximas páginas — '
            + 'a prescrição, a evolução e o desfecho — são as dele, e são '
            + 'outras nos outros dois.</span></div>'
          : '')
      + '</div>';
  },

  /* O balanço: o que a condução custou, item a item, com o contrafactual ao
     lado. É a única tela do caso que só existe por causa do que VOCÊ fez. */
  balanco: e => {
    const bateu = q => {
      if (q.sem) return !q.sem.some(n => jaPedido(n));
      if (q.escolheu) return escolhas[q.escolheu[0]] === q.escolheu[1];
      if (q.escolheu_todos)
        return q.escolheu_todos.every(([k, v]) => escolhas[k] === v);
      return false;
    };
    const disparadas = e.cons.filter(c => bateu(c.q));
    const morreu = e.obito && bateu(e.obito);
    const dias = e.bd + disparadas.reduce((s, c) => s + c.d, 0);
    const tfg = e.bt - disparadas.reduce((s, c) => s + c.t, 0);
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2>' + e.corpo
      + '<div class="bal">'
      + (morreu
        ? '<div class="placar obito"><div class="cheio"><b>Óbito</b><span>'
          + e.obitotx + '</span></div></div>'
        : '<div class="placar">'
      +   '<div><b>' + dias + '</b><span>dias de internação</span></div>'
      +   '<div' + (tfg <= 15 ? ' class="grave"' : '') + '><b>' + tfg
      +     '</b><span>mL/min/1,73 m² na alta'
      +     (tfg <= 15 ? ' · saiu em diálise' : '') + '</span></div>'
      +   '<div class="ideal"><b>' + e.bd + ' · ' + e.bt + '</b>'
      +     '<span>o melhor percurso possível</span></div>'
      + '</div>')
      + (disparadas.length
          ? '<div class="cons">' + disparadas.map(c =>
              '<div class="cn"><b>' + c.tt + '</b>'
              + '<span class="pr">' + (c.d ? '+' + c.d + ' dias' : '')
              + (c.d && c.t ? ' · ' : '') + (c.t ? '−' + c.t + ' mL/min' : '')
              + '</span><p>' + c.pq + '</p></div>').join('') + '</div>'
          : '<div class="cons"><div class="cn limpo"><b>Nenhuma decisão desta '
            + 'condução cobrou preço.</b><p>Você chegou ao melhor percurso que '
            + 'este caso permite. É raro, e não é sorte: as decisões que '
            + 'custam caro aqui são todas das primeiras 72 horas.</p></div></div>')
      + '</div></div>';
  },

  desfecho: e =>
    fundoDe(e) + '<div class="veu tudo q-' + e.q + '"></div>'
    + '<div class="fim ' + e.q + '"><div class="caixa">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h1>' + e.tt + '</h1>' + e.corpo
    + '<div class="porque"><b>Por quê</b><p>' + e.porque + '</p></div>'
    + '</div></div>',
};

/* ─────────────────────────── interação ─────────────────────────── */

const esc = s => s.replace(/"/g, '&quot;');
const esc2 = s => String(s).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
const temMarcado = (k, n) => (marcados[k] || new Set()).has(n);

function ligar(e){
  if (e.t === 'pedido' && !e.comentado){
    const conj = marcados[e.k] || (marcados[e.k] = new Set());
    /* O teto é o que faz a pergunta ser uma pergunta. Sem ele, marcar tudo é
       sempre a jogada dominante — e um grupo que marca tudo não decidiu nada,
       além de encerrar a investigação na primeira tela. */
    const teto = e.limite || 0;
    const cheio = () => teto && conj.size >= teto;
    const contar = () => {
      const faltam = teto ? teto - conj.size : 0;
      $('#conta').innerHTML = '<b>' + conj.size
        + (teto ? ' de ' + teto : '') + '</b> '
        + (conj.size === 1 ? 'exame marcado' : 'exames marcados')
        + (teto
            ? (faltam > 0
                ? ' · ainda cabe' + (faltam === 1 ? ' 1' : 'm ' + faltam)
                : ' · o teto desta rodada está completo — desmarque para trocar')
            : ' · nada é obrigatório, e nada é sugerido');
      document.querySelectorAll('.it[data-ex]').forEach(l =>
        l.classList.toggle('bloq', cheio() && !conj.has(l.dataset.ex)));
      pintarPe();
    };
    document.querySelectorAll('.it[data-ex]').forEach(l => {
      l.onclick = () => {
        if (l.classList.contains('trava')) return;
        const n = l.dataset.ex;
        if (conj.has(n)) conj.delete(n);
        else if (cheio()) return;          // o teto não empurra: ele segura
        else conj.add(n);
        pintar();
        const atual=[...document.querySelectorAll('.it')].find(x=>x.dataset.ex===n);
        if(atual?.getClientRects().length)atual.focus({preventScroll:true});
      };
    });
    contar();
  }

  if (e.t === 'resultados'){
    document.querySelectorAll('.verlaudo').forEach(b => {
      b.onclick = () => {
        const nome=b.closest('.rc').querySelector('b').textContent;
        laudos.add(b.dataset.laudo);pintar();
        const cartao=[...document.querySelectorAll('.rc')].find(c=>c.querySelector('b')?.textContent===nome&&c.querySelector('.v'));
        const parte=partesTela.findIndex(p=>p.some(n=>n===cartao||n.contains(cartao)));
        if(parte>=0){parteTela=parte;aplicarParte();pintarPe();}
      };
    });
  }

  if (e.t === 'pergunta' || e.comentado){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.alts li').forEach(li => {
      li.onclick = () => {
        const k = +li.dataset.k;
        const j = r.marcadas.indexOf(k);
        // marcar e desmarcar até confirmar: a escolha não é irreversível
        // enquanto o grupo ainda está discutindo
        if (j >= 0) r.marcadas.splice(j, 1);
        else if (r.marcadas.length < e.escolhas) r.marcadas.push(k);
        else { r.marcadas.shift(); r.marcadas.push(k); }
        document.querySelectorAll('.alts li').forEach((x, n) =>
          x.classList.toggle('marcada', r.marcadas.includes(n)));
        const b = $('#conf');
        if (b) b.disabled = r.marcadas.length < e.escolhas;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if(r.marcadas.length!==e.escolhas)return;
      r.feita = true;
      if(e.comentado)marcados[e.k]=new Set(e.alts.filter(a=>a.ok).flatMap(a=>a.exames));
      parteTela=0; pintar();
    };
  }

  if (e.t === 'pareamento'){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.par .pe').forEach(ch => {
      ch.onclick = ev => {
        ev.stopPropagation();
        const n = +ch.closest('.pi').dataset.n, m = +ch.dataset.m;
        r.marcadas[n] = (r.marcadas[n] === m) ? undefined : m;
        const linha = ch.closest('.pi');
        linha.querySelectorAll('.pe').forEach(x => x.classList.toggle('on', +x.dataset.m === r.marcadas[n]));
        const completo = e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null);
        const b = $('#conf'); if (b) b.disabled = !completo;
        const d = document.querySelector('.qdica');
        if (d) d.textContent = 'atribua uma letra a cada item · '
          + e.itens.filter((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null).length
          + ' de ' + e.itens.length;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if (!e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null)) return;
      r.feita = true; parteTela = 0; pintar();
    };
  }

  if (e.t === 'bifurcacao'){
    if (escolhas[e.k] !== undefined) return;
    document.querySelectorAll('.cam').forEach(c => {
      c.onclick = () => { escolhas[e.k] = +c.dataset.k; parteTela=0; pintar(); };
    });
  }
}

/* ─────────────────────────── a revisão do fim ─────────────────────────── */

/* O único lugar em que o caso comenta o que ficou de fora, e ele só fala
   quando não há mais nada a decidir. Durante a condução, apontar o que falta
   é decidir pelo grupo. */
function mostrarRevisao(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  /* `respostas[k]` nasce quando a página é PINTADA, não quando é respondida, e
     `[].every()` é `true`: uma pergunta só visitada entrava no total e no
     acerto. Dava para chegar à revisão com "4 de 4" tendo respondido três. */
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  const acertos = feitas.filter(([k, r]) => {
    const e = ETAPAS[porId(k)];
    if (!e) return false;
    if (e.t === 'pareamento')
      return e.itens.every((it, n) => r.marcadas[n] === it.ok);
    return r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok);
  }).length;
  const total = feitas.length;

  $('#palco').innerHTML = '<section class="tela on">'
    + '<div class="fundo" style="background:#0d1014"></div>'
    + '<div class="veu tudo"></div><div class="folha">'
    + '<div class="marca"><i></i><span>Revisão</span></div>'
    + '<h2>O que ficou para trás</h2>'
    + '<p class="sub">' + acertos + ' de ' + total + ' perguntas de escolha com '
    + 'a resposta inteiramente certa · '
    + (pediu.size ? Object.keys(marcados).length + ' rodadas de exames, ' + pediu.size + ' pedidos ao todo · ' : '')
    + Object.keys(escolhas).length + ' decisões de conduta.</p>'
    + '<div class="rev">' + (faltou.length
        ? faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>'
            + r.porque + '</p></div>').join('')
        : '<div class="ok">Nada essencial ficou de fora.</div>')
    + '</div></div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><button class="bt" onclick="recomecar()">'
    + 'Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao=true;parteTela=0;montarFolhas();pintarPe();
}

function recomecar(){
  i = 0; historia = [0]; emRevisao=false;
  Object.keys(marcados).forEach(k => delete marcados[k]);
  Object.keys(respostas).forEach(k => delete respostas[k]);
  Object.keys(escolhas).forEach(k => delete escolhas[k]);
  laudos.clear(); detalhesAbertos.clear(); parteTela=0;
  pintar();
}

/* ─────────────────────────── teclado ─────────────────────────── */

addEventListener('keydown', ev => {
  if (lupaAberta) return;              // as setas são da figura enquanto ela está aberta
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown'){
    if (podeAdiante()) adiante();
    ev.preventDefault();
  } else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){
    atras(); ev.preventDefault();
  }
});

let resizeTela;
addEventListener("resize",()=>{clearTimeout(resizeTela);resizeTela=setTimeout(()=>{if(!lupaAberta){if(emRevisao)mostrarRevisao();else pintar();}},120);});
pintar();

function acessibilidadeDaPagina(){
  document.querySelectorAll('.it,.cam,.alts li,figure.amplia,.par .pe').forEach(el=>{
    el.tabIndex=0;el.setAttribute('role',el.classList.contains('it')?'checkbox':'button');
    if(el.classList.contains('it'))el.setAttribute('aria-checked',el.classList.contains('on')?'true':'false');
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();el.click();}});
  });
}

const vvIc = (n, cls) => '<svg class="vv-ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (VV_IC[n] || VV_IC.pergunta) + '</svg>';
const vvBola = n => '<span class="vv-bola">' + vvIc(n) + '</span>';

function vvTipo(e){
  if (e.t === 'capa') return 'capa';
  if (e.t === 'pergunta' || e.t === 'pedido') return e.t === 'pedido' ? 'exames' : 'pergunta';
  if (e.t === 'pareamento') return 'pareamento';
  if (e.t === 'bifurcacao') return 'decisao';
  if (e.t === 'resultados') return 'exames';
  if (e.t === 'desfecho') return 'desfecho';
  if (e.t === 'balanco') return 'fecho';
  const s = ((e.kicker || '') + ' ' + (e.tt || '')).toLowerCase();
  if (/exame físico|pele, membros|pele e membros/.test(s)) return 'exame';
  if (/imagem|radiograf|tomograf|ultrass|biópsia|eletrocard|\becg\b|lâmina|corpúsculo|microfoto|visual|histolog|arquitetura/.test(s)) return 'imagem';
  if (/retrospectiva|lacuna|procedência|fontes|referênc|onde o caso|créditos|fecho|onde dava/.test(s)) return 'fecho';
  if (/discuss|interpreta|diferencial|mecanismo|fenótipo|laudo|resultado|laborat/.test(s)) return 'discussao';
  if (/dia|semana|evolu|reavalia|pronto|admiss|internação|depois|terapia|alta|seguimento|prescri|conduta|tratamento|retorno|plano|visita|horas/.test(s)) return 'evolucao';
  return 'historia';
}

/* ─────────── placar e progresso ─────────── */
function vvPlacar(){
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  let certas = 0;
  feitas.forEach(([k, r]) => {
    const e = ETAPAS[porId(k)]; if (!e) return;
    if (e.t === 'pareamento'){ if (e.itens.every((it, n) => r.marcadas[n] === it.ok)) certas++; }
    else if (e.alts && r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok)) certas++;
  });
  return {certas, feitas: feitas.length};
}
const VV_CHAVE = 'casos-clinicos:progresso';
function vvGuardar(extra){
  try {
    const todo = JSON.parse(localStorage.getItem(VV_CHAVE) || '{}');
    const slug = CASO.slug || document.title;
    const seq = rotaAtual(); const aqui = Math.max(seq.indexOf(i), 0);
    const velho = todo[slug] || {};
    const pl = vvPlacar();
    todo[slug] = Object.assign({}, velho, {
      pos: Math.max(velho.fim ? 0 : (velho.pos || 0), aqui + 1), total: seq.length,
      certas: pl.certas, feitas: pl.feitas, quando: Date.now()
    }, extra || {});
    localStorage.setItem(VV_CHAVE, JSON.stringify(todo));
  } catch (_) {}
}

let vvUltimo = '', vvPlacarAntes = -1;
function vvAntes(){
  if (emRevisao) return;
  const e = etapa();
  const tipo = vvTipo(e);
  document.body.dataset.tipo = tipo;
  // selo com ícone
  document.querySelectorAll('#palco .marca').forEach(m => {
    if (!m.querySelector('.vv-bola')) m.insertAdjacentHTML('afterbegin', vvBola(tipo));
  });
  const dk = document.querySelector('#palco h2.do-kicker');
  if (dk && !dk.querySelector('.vv-bola')) dk.insertAdjacentHTML('afterbegin', vvBola(tipo));
  if (e.t === 'desfecho'){
    const h = document.querySelector('#palco .fim h1');
    if (h && !h.querySelector('.vv-bola')) h.insertAdjacentHTML('afterbegin', vvBola(e.q === 'melhor' ? 'check' : e.q === 'pior' ? 'x' : 'desfecho'));
  }
  // vitais e aparelhos
  document.querySelectorAll('#palco .vit>div').forEach(d => {
    if (d.querySelector('.vv-ic')) return;
    const r = (d.querySelector('span') || {}).textContent || '';
    const n = /temp/i.test(r) ? 'termo' : /press|^pa$/i.test(r) ? 'pressao' : /card|^fc$/i.test(r) ? 'coracao'
      : /resp|^fr$/i.test(r) ? 'vento' : /spo|satura/i.test(r) ? 'gota' : /peso/i.test(r) ? 'balanca'
      : /altura/i.test(r) ? 'regua' : 'pulso';
    d.insertAdjacentHTML('beforeend', vvIc(n));
  });
  document.querySelectorAll('#palco .tops>div>b').forEach(b => {
    if (b.querySelector('.vv-ic')) return;
    const r = b.textContent;
    const n = /geral/i.test(r) ? 'pessoa' : /cabeça|pescoço/i.test(r) ? 'pessoa' : /cardio/i.test(r) ? 'coracao'
      : /respir|pulm/i.test(r) ? 'vento' : /pele/i.test(r) ? 'camadas' : /neuro/i.test(r) ? 'raio'
      : /olho|ocular/i.test(r) ? 'olho' : 'pulso';
    b.insertAdjacentHTML('afterbegin', vvIc(n));
  });
  // resultado da pergunta
  const r = respostas[e.k];
  if ((e.t === 'pergunta' || e.t === 'pareamento') && r && r.feita){
    let ok, tot;
    if (e.t === 'pareamento'){ tot = e.itens.length; ok = e.itens.filter((it, n) => r.marcadas[n] === it.ok).length; }
    else { tot = e.escolhas; ok = r.marcadas.filter(x => e.alts[x].ok).length; }
    const cls = ok === tot ? 'bom' : ok ? 'parcial' : 'ruim';
    const txt = ok === tot ? (tot === 1 ? 'Resposta certa' : 'Acertou todas') : ok ? 'Acertou ' + ok + ' de ' + tot : (tot === 1 ? 'Resposta incorreta' : 'Nenhuma certa');
    const dica = document.querySelector('#palco .qdica');
    // a frase de efeito do autor sai: o resultado fala por si
    if (dica && !dica.querySelector('.vv-nota')) dica.textContent = '';
    if (dica && !dica.querySelector('.vv-nota'))
      dica.insertAdjacentHTML('afterbegin', '<span class="vv-nota ' + cls + '">' + vvIc(ok === tot ? 'check' : ok ? 'meio' : 'x') + txt + '</span>');
    document.querySelectorAll('#palco .alts li, #palco .pi').forEach((li, n) => li.style.setProperty('--i', n));
  }
  // capa sem ilustração: um mosaico com os ícones do que o caso tem
  if (e.t === 'capa' && !e.fundo && !document.querySelector('#palco .vv-mosaico')){
    const tipos = [['historia','#4f46e5'],['exame','#0d9488'],['exames','#2563eb'],['imagem','#7c3aed'],
                   ['pergunta','#ea580c'],['pareamento','#db2777'],['decisao','#c026d3'],['evolucao','#0891b2'],['desfecho','#16a34a']];
    const tela = document.querySelector('#palco .tela');
    if (tela) tela.insertAdjacentHTML('beforeend', '<div class="vv-mosaico">' + tipos.map(([n, c], k) =>
      '<span style="--c:' + c + ';--i:' + k + '">' + vvIc(n) + '</span>').join('') + '</div>');
  }
  // capa: o que o caso tem
  if (e.t === 'capa'){
    const ab = document.querySelector('#palco .abertura');
    const ks = ab && ab.querySelector('.marca span:not(.vv-bola)'); if (ks) ks.textContent = 'Caso interativo';
    if (ab && !ab.querySelector('.vv-chips')){
      const seq = rotaAtual().map(n => ETAPAS[n]);
      const perg = seq.filter(x => x.t === 'pergunta' || x.t === 'pareamento').length;
      const dec = seq.filter(x => x.t === 'bifurcacao').length;
      const fins = ETAPAS.filter(x => x.t === 'desfecho').length;
      const imgs = Math.max(0, Object.keys(DADOS.imgs || {}).length - 1);
      ab.insertAdjacentHTML('beforeend', '<div class="vv-chips">'
        + '<span style="--c:#ea580c">' + vvIc('pergunta') + perg + ' perguntas</span>'
        + '<span style="--c:#c026d3">' + vvIc('decisao') + dec + ' decisões</span>'
        + '<span style="--c:#16a34a">' + vvIc('desfecho') + fins + ' desfechos</span>'
        + (imgs ? '<span style="--c:#7c3aed">' + vvIc('foto') + imgs + ' imagens</span>' : '') + '</div>');
    }
  }
}

function vvDecorar(){
  const e = etapa();
  const tipo = vvTipo(e);
  document.body.dataset.tipo = tipo;
  if (CASO.cor) document.documentElement.style.setProperty('--caso', CASO.cor);
  // contador com ícone e placar
  const cnt = document.querySelector('#trilho .cnt');
  if (cnt && !cnt.querySelector('.vv-ic')) cnt.insertAdjacentHTML('afterbegin', vvIc(tipo));
  const pl = vvPlacar();
  if (cnt && pl.feitas){
    cnt.insertAdjacentHTML('afterend', '<span class="vv-placar' + (vvPlacarAntes >= 0 && pl.certas > vvPlacarAntes ? ' sobe' : '')
      + '" title="Perguntas com a resposta inteiramente certa">' + vvIc('check') + pl.certas + ' de ' + pl.feitas + '</span>');
  }
  vvPlacarAntes = pl.certas;
  // entrada escalonada, só quando a folha muda
  const chave = e.k + '::' + parteTela;
  if (chave !== vvUltimo){
    let n = 0;
    document.querySelectorAll('#palco .abertura>*, #palco .plano>*:not(.conteudo-paginado), #palco .conteudo-paginado>*, #palco .folha>.marca, #palco .folha>h2, #palco .folha>.sub, #palco .folha>.enun, #palco .alts:not(.feita) li, #palco .cams:not(.feita) .cam, #palco .par:not(.feita) .pi, #palco .laboratorio, #palco .imagens-resultados>*, #palco .vit>div, #palco .tops>div, #palco .fim .caixa>*').forEach(el => {
      if (el.hasAttribute('data-fora') || el.classList.contains('area-paginada')) return;
      el.style.setProperty('--i', Math.min(n++, 14)); el.classList.add('vv-entra');
    });
  }
  vvUltimo = chave;
  vvGuardar();
}

const vvMontarOriginal = montarFolhas;
montarFolhas = function(){ try { vvAntes(); } catch (err) { console.warn(err); } return vvMontarOriginal.apply(this, arguments); };
const vvPintarOriginal = pintar;
pintar = function(){ vvPintarOriginal.apply(this, arguments); try { vvDecorar(); } catch (err) { console.warn(err); } };

/* ─────────── revisão final: anel, números e confete ─────────── */
function vvConfete(){
  const cx = document.createElement('div'); cx.className = 'vv-confete';
  const cores = ['#4f46e5', '#ea580c', '#16a34a', '#db2777', '#0891b2', '#ca8a04', '#7c3aed'];
  for (let k = 0; k < 90; k++){
    const i2 = document.createElement('i');
    i2.style.left = (Math.random() * 100) + 'vw';
    i2.style.background = cores[k % cores.length];
    i2.style.setProperty('--dx', (Math.random() * 30 - 15) + 'vw');
    i2.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    i2.style.animationDelay = (Math.random() * .5) + 's';
    cx.appendChild(i2);
  }
  document.body.appendChild(cx); setTimeout(() => cx.remove(), 2800);
}
mostrarRevisao = function(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  const pl = vvPlacar();
  const pct = pl.feitas ? Math.round(100 * pl.certas / pl.feitas) : 0;
  const dec = Object.keys(escolhas).length;
  const R = 54, C = 2 * Math.PI * R;
  document.body.dataset.tipo = 'desfecho';
  $('#palco').innerHTML = '<section class="tela on"><div class="folha">'
    + '<div class="marca">' + vvBola('desfecho') + '<span>Revisão</span></div>'
    + '<h2>' + (pct >= 70 ? 'Caso concluído com boa condução' : 'Caso concluído') + '</h2>'
    + '<div class="vv-fim"><div class="vv-anel"><svg viewBox="0 0 132 132"><circle class="fundo-anel" cx="66" cy="66" r="' + R + '"/>'
    + '<circle class="cheio" cx="66" cy="66" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg><b data-conta="' + pct + '">0%</b></div>'
    + '<div class="vv-cards"><div style="--c:#16a34a"><b data-conta="' + pl.certas + '">0</b><span>perguntas inteiramente certas</span></div>'
    + '<div style="--c:#ea580c"><b data-conta="' + pl.feitas + '">0</b><span>perguntas respondidas</span></div>'
    + '<div style="--c:#c026d3"><b data-conta="' + dec + '">0</b><span>decisões de conduta</span></div></div></div>'
    + (faltou.length ? '<div class="rev">' + faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>' + r.porque + '</p></div>').join('') + '</div>' : '')
    + '</div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><a class="bt" href="index.html">Biblioteca</a><button class="bt forte" id="reiniciar" onclick="recomecar()">Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao = true; parteTela = 0; montarFolhas(); 
  document.querySelectorAll('#palco .vv-fim, #palco .rev .li').forEach((el, n) => { el.style.setProperty('--i', n); el.classList.add('vv-entra'); });
  requestAnimationFrame(() => {
    const cheio = document.querySelector('.vv-anel .cheio');
    if (cheio) cheio.style.strokeDashoffset = C * (1 - pct / 100);
    document.querySelectorAll('[data-conta]').forEach(el => {
      const alvo = +el.dataset.conta, pc = el.closest('.vv-anel'), t0 = performance.now();
      const passo = t => { const f = Math.min(1, (t - t0) / 900); el.textContent = Math.round(alvo * (1 - Math.pow(1 - f, 3))) + (pc ? '%' : ''); if (f < 1) requestAnimationFrame(passo); };
      requestAnimationFrame(passo);
    });
  });
  vvGuardar({fim: true});
  if (pl.feitas && pct >= 70 && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(vvConfete, 450);
};

pintar();

</script>
