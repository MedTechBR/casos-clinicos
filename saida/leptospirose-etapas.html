<script type="application/json" id="dados">{"caso": {"titulo": "Febre de abril", "slug": "leptospirose", "cor": "#0891b2", "rodape": "Paciente ficcional · evoluções simuladas para ensino · versão de 24/09 00:35", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "Febre de abril", "fundo": "", "kicker": "Caso interativo", "selo": "Paciente ficcional · procedência e créditos na última tela", "proc": ""}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Joaquim, 38 anos, agente de limpeza urbana em Fortaleza, chega à emergência trazido pelo irmão no sexto dia de uma febre que começou de repente, com calafrios, dor de cabeça e uma dor muscular que ele descreve como \"a pior da vida\", sobretudo nas batatas das pernas.<\/p><p>No segundo dia foi a uma unidade de pronto atendimento, onde disseram que era dengue: soro oral, paracetamol e repouso. Há dois dias está amarelo, e desde a noite passada tosse com raias de sangue e fica sem ar para ir ao banheiro.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "hda", "kicker": "História da doença atual", "tt": "", "corpo": "<p>A febre chegou a 39,8 °C nos três primeiros dias, cedeu um pouco no quarto e voltou. A urina está \"cor de guaraná\". Urinou pouco hoje. Teve dois episódios de vômito, sem sangue. Nega dor abdominal forte, diarreia e manchas no corpo antes da febre.<\/p><p>Os olhos ficaram vermelhos no terceiro dia, \"sem remela\". O irmão acha que ele está mais sonolento desde a tarde.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Antecedentes e exposições", "tt": "", "corpo": "<p>Sem doenças conhecidas, sem medicações de uso contínuo. Bebe cerveja nos fins de semana, sem excesso diário. Não fuma. Vacinado contra febre amarela há seis anos. Não saiu do Ceará no último ano.<\/p><p>Doze dias antes da febre, depois de três dias de chuva forte, trabalhou na desobstrução de um canal alagado no bairro. A bota estava furada e ele tinha um corte no pé. Os colegas comentaram que havia muitos ratos no depósito da equipe.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div class=alt><b>38,4 °C<\/b><span>Temperatura<\/span><\/div><div class=alt><b>94/56<\/b><span>Pressão arterial<\/span><\/div><div class=alt><b>116<\/b><span>Frequência cardíaca<\/span><\/div><div class=alt><b>28<\/b><span>Frequência respiratória<\/span><\/div><div class=alt><b>90%<\/b><span>SpO₂ em ar ambiente<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral<\/b><p>Prostrado, sonolento mas orientado. <b>Icterícia intensa, de tom alaranjado.<\/b><\/p><\/div><div><b>Olhos<\/b><p><b>Sufusão conjuntival bilateral<\/b>, sem secreção.<\/p><\/div><div><b>Respiratório<\/b><p>Crepitações nas bases dos dois pulmões.<\/p><\/div><div><b>Abdome<\/b><p>Fígado a 2 cm do rebordo, doloroso. Baço não palpável.<\/p><\/div><div><b>Membros<\/b><p><b>Dor intensa à compressão das panturrilhas.<\/b> Petéquias nas pernas. Corte cicatrizado na planta do pé direito.<\/p><\/div><div><b>Neurológico<\/b><p>Sem rigidez de nuca, sem déficit focal.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p1", "kicker": "Pergunta 1", "enunciado": "Febre aguda com icterícia, sufusão conjuntival, mialgia intensa e hemoptise, em abril, em Fortaleza. <b>Quais quatro<\/b> diagnósticos precisam ser considerados?", "alts": [{"t": "Malária", "c": "Ele nunca saiu do Ceará. Malária autóctone no Nordeste é excepcional; sem viagem à Amazônia, sai da lista.", "ok": 0}, {"t": "Dengue grave", "c": "O diagnóstico que a UPA fez. Plaquetopenia, sangramento e choque cabem nela — e ela coexiste com leptospirose na mesma estação.", "ok": 1}, {"t": "Hepatite viral aguda", "c": "Icterícia com febre obriga a pensar em A e E, ainda que a mialgia e o rim falem contra.", "ok": 1}, {"t": "Leptospirose", "c": "Exposição a água de enchente com ferida no pé, sufusão conjuntival e dor na panturrilha: é a hipótese principal.", "ok": 1}, {"t": "Febre amarela", "c": "Ele é vacinado e não entrou em área de mata.", "ok": 0}, {"t": "Sepse bacteriana com colangite ou pneumonia", "c": "Febre, icterícia e hipotensão também são sepse de foco biliar ou pulmonar. Hemocultura e ultrassom a separam.", "ok": 1}, {"t": "Hepatite alcoólica", "c": "Exigiria consumo pesado e diário por anos. Cerveja de fim de semana não chega lá.", "ok": 0}, {"t": "Mononucleose infecciosa", "c": "Faz febre e hepatite leve, mas não insuficiência renal com hemoptise.", "ok": 0}, {"t": "Síndrome de Gilbert", "c": "Bilirrubina indireta que sobe no jejum, sem febre, sem doença.", "ok": 0}], "escolhas": 4, "fundo": "", "tr": "Água de enchente, olho vermelho e panturrilha dolorosa", "nota": "", "segue": ""}, {"t": "pergunta", "k": "ex1", "kicker": "Pergunta 2", "enunciado": "Na emergência, <b>quais cinco<\/b> exames são os mais apropriados?", "alts": [{"t": "ELISA IgM para leptospira, com hemocultura em meio específico", "c": "Sorologia no sexto dia e cultura antes do antibiótico. Nenhum dos dois deve atrasar o tratamento.", "ok": 1}, {"t": "Hemograma com plaquetas", "c": "Plaquetopenia e neutrofilia são comuns na leptospirose; hemoconcentração puxa para dengue.", "ok": 1}, {"t": "Antiestreptolisina O", "c": "Não explica nada do quadro.", "ok": 0}, {"t": "Sorologia para hantavírus", "c": "A hantavirose das Américas é cardiopulmonar e de área rural do Sul e Centro-Oeste.", "ok": 0}, {"t": "Creatinina, ureia e potássio", "c": "A lesão renal da leptospirose é frequentemente não oligúrica e com hipocalemia. Os três números decidem diálise e reposição.", "ok": 1}, {"t": "Tomografia de crânio", "c": "Sem déficit focal, a sonolência é metabólica. Não é prioridade.", "ok": 0}, {"t": "Bilirrubinas, transaminases e creatinoquinase", "c": "Bilirrubina muito alta com transaminases modestas e CK elevada é o padrão que separa leptospirose de hepatite.", "ok": 1}, {"t": "Biópsia hepática", "c": "Não tem indicação na icterícia febril aguda.", "ok": 0}, {"t": "Radiografia de tórax", "c": "Hemoptise e hipoxemia: o pulmão é o órgão que mata na leptospirose grave.", "ok": 1}, {"t": "Gota espessa", "c": "Sem viagem à região amazônica, o exame não tem lugar.", "ok": 0}], "escolhas": 5, "fundo": "", "tr": "A equipe pede os cinco, mais dengue, hepatites e gasometria", "nota": "", "segue": ""}, {"t": "resultados", "k": "res1", "kicker": "Na emergência", "tt": "O que a equipe pediu", "de": "", "fundo": "", "intro": "Hemoculturas e cultura para leptospira foram colhidas antes de qualquer antibiótico.", "nota": "", "laminas": {"Radiografia de tórax": {"img": "rx_torax_alveolar.jpg", "tt": "Radiografia de tórax", "lg": "Imagem ilustrativa de outro paciente; o padrão alveolar não distingue sangue de água ou de pus.", "cr": "Samir · Wikimedia Commons · CC BY-SA 3.0"}}, "todos": ["Hemoglobina / hematócrito", "Leucócitos", "Plaquetas", "Creatinina / ureia", "Potássio / sódio", "Bilirrubina total / direta", "AST / ALT", "Creatinoquinase", "INR", "Gasometria arterial", "Dengue: NS1 e IgM", "Hepatites: anti-HAV IgM, HBsAg, anti-HEV IgM", "ELISA IgM para leptospira", "Radiografia de tórax"], "sobre": {"Hemoglobina / hematócrito": {"n": "Hemoglobina / hematócrito", "r": "11,6 g/dL / 34%", "ref": "Hb 13,5–17,5 g/dL", "a": 1}, "Leucócitos": {"n": "Leucócitos", "r": "14.800/mm³ · neutrófilos 88%", "ref": "4.000–11.000/mm³", "a": 1}, "Plaquetas": {"n": "Plaquetas", "r": "52.000/mm³ <span class=\"mut\">(145.000 na UPA)<\/span>", "ref": "150.000–450.000/mm³", "a": 1}, "Creatinina / ureia": {"n": "Creatinina / ureia", "r": "3,9 / 148 mg/dL <span class=\"mut\">(creatinina 1,0 na UPA)<\/span>", "ref": "até 1,3 / 45 mg/dL", "a": 1}, "Potássio / sódio": {"n": "Potássio / sódio", "r": "3,1 / 133 mmol/L", "ref": "K 3,5–5,0 · Na 135–145", "a": 1}, "Bilirrubina total / direta": {"n": "Bilirrubina total / direta", "r": "17,8 / 15,2 mg/dL", "ref": "até 1,2 / 0,3 mg/dL", "a": 1}, "AST / ALT": {"n": "AST / ALT", "r": "112 / 84 U/L", "ref": "até 40 / 41 U/L", "a": 1}, "Creatinoquinase": {"n": "Creatinoquinase", "r": "4.260 U/L", "ref": "até 190 U/L", "a": 1}, "INR": {"n": "INR", "r": "1,3", "ref": "até 1,2", "a": 1}, "Gasometria arterial": {"n": "Gasometria arterial", "r": "pH 7,33 · pCO₂ 30 · HCO₃ 16 · pO₂ 58 mmHg", "ref": "—", "a": 1}, "Dengue: NS1 e IgM": {"n": "Dengue: NS1 e IgM", "r": "Não reagentes", "ref": "não reagentes", "a": 0}, "Hepatites: anti-HAV IgM, HBsAg, anti-HEV IgM": {"n": "Hepatites: anti-HAV IgM, HBsAg, anti-HEV IgM", "r": "Não reagentes", "ref": "não reagentes", "a": 0}, "ELISA IgM para leptospira": {"n": "ELISA IgM para leptospira", "r": "Não reagente", "ref": "não reagente", "a": 0}, "Radiografia de tórax": {"n": "Radiografia de tórax", "r": "Infiltrado alveolar bilateral, predominando em bases e periferia", "ref": "—", "a": 1}}, "rota": null}, {"t": "pergunta", "k": "p3", "kicker": "Pergunta 3", "enunciado": "Bilirrubina de 17,8 com AST de 112, CK de 4.260, potássio de 3,1 e creatinina de 3,9. <b>Quais três<\/b> afirmações estão corretas?", "alts": [{"t": "A desproporção entre bilirrubina e transaminases fala contra hepatite viral", "c": "Na hepatite aguda as transaminases passam de mil. Na leptospirose a icterícia é de colestase com lesão hepatocelular discreta.", "ok": 1}, {"t": "A plaquetopenia exclui leptospirose e confirma dengue", "c": "Plaquetopenia é comum na leptospirose grave e associa-se a pior prognóstico.", "ok": 0}, {"t": "A hipocalemia exclui lesão renal aguda grave", "c": "A leptospirose lesa o túbulo proximal e perde potássio: lesão renal com hipocalemia é a assinatura dela.", "ok": 0}, {"t": "A CK alta traduz a miosite que dói na panturrilha", "c": "A rabdomiólise contribui para a lesão renal e é um dado a favor do diagnóstico.", "ok": 1}, {"t": "Transaminases acima de 1.000 são esperadas na leptospirose", "c": "É o contrário: raramente passam de 200 a 300.", "ok": 0}, {"t": "A icterícia é hemolítica, de bilirrubina indireta", "c": "A bilirrubina é quase toda direta: colestase, não hemólise.", "ok": 0}, {"t": "A lesão renal costuma ser não oligúrica e hipocalêmica no início", "c": "Nefrite tubulointersticial com defeito de reabsorção de sódio e potássio. A oligúria é sinal de gravidade.", "ok": 1}], "escolhas": 3, "fundo": "", "tr": "Bilirrubina alta, transaminase baixa, CK alta e potássio baixo", "nota": "", "segue": ""}, {"t": "pergunta", "k": "p4", "kicker": "Pergunta 4", "enunciado": "ELISA IgM para leptospira <b>não reagente no sexto dia<\/b>. Qual a conduta?", "alts": [{"t": "Esperar a microaglutinação antes de qualquer antibiótico", "c": "O resultado leva dias. Na síndrome de Weil, cada dia sem antibiótico pesa na mortalidade.", "ok": 0}, {"t": "Repetir o mesmo ELISA amanhã e decidir pelo resultado", "c": "Um dia não muda a cinética dos anticorpos, e a conduta já está indicada.", "ok": 0}, {"t": "Solicitar biópsia renal para confirmar nefrite", "c": "A clínica e a epidemiologia bastam para tratar. Biópsia não tem papel aqui.", "ok": 0}, {"t": "Tratar presuntivamente e repetir a sorologia em uma a duas semanas", "c": "Na suspeita clínico-epidemiológica, a forma grave é tratada sem confirmação. A segunda amostra e a microaglutinação pareada confirmam depois.", "ok": 1}, {"t": "Afastar leptospirose e tratar como dengue grave", "c": "NS1 e IgM de dengue foram negativos, e o IgM da leptospira só se torna positivo depois do quinto ao sétimo dia.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "Sorologia negativa cedo não afasta, e a forma grave não espera", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b1", "kicker": "Decisão", "tt": "O antibiótico", "enunciado": "Joaquim está hipotenso, ictérico e hipoxêmico. Como você trata?", "caminhos": [{"r": "Internar em leito monitorizado e iniciar penicilina cristalina endovenosa agora", "vai": "tratado", "c": "Penicilina cristalina 1,5 milhão de UI de 6/6 horas (ou ceftriaxona 1 a 2 g/dia) é o esquema da forma grave.", "rc": ""}, {"r": "Doxiciclina oral e retorno em 48 horas", "vai": "doxi", "c": "É o esquema da forma leve, ambulatorial. Joaquim não tem forma leve.", "rc": ""}, {"r": "Hidratar e aguardar a segunda sorologia para iniciar antibiótico", "vai": "espera", "c": "A confirmação é importante para a vigilância, não para a decisão de tratar.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "doxi", "kicker": "Na manhã seguinte", "tt": "", "corpo": "<p>Joaquim volta à emergência carregado pelo irmão, doze horas depois: saturação de 84%, hemoptise de 100 mL e urina \"quase nada\". É internado, e a penicilina cristalina começa com um dia de atraso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tratado", "conforme": null, "rota": null}, {"t": "pagina", "k": "espera", "kicker": "Dezoito horas depois", "tt": "", "corpo": "<p>Sob soro e oxigênio, a saturação cai para 85% e a urina para 20 mL por hora. A plantonista inicia penicilina cristalina com dezoito horas de atraso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "tratado", "conforme": null, "rota": null}, {"t": "pagina", "k": "tratado", "kicker": "Primeiras horas de antibiótico", "tt": "", "corpo": "<p>Duas horas depois da primeira dose, Joaquim tem calafrios, febre de 40 °C e piora da pressão por algumas horas. A equipe reconhece uma <b>reação de Jarisch-Herxheimer<\/b>, trata com volume e antitérmico e mantém a penicilina.<\/p><p>Na madrugada, a tosse fica úmida. Ele expectora sangue vivo.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "hemorragia", "kicker": "Segundo dia de internação", "tt": "", "corpo": "<p>Saturação de 83% com máscara com reservatório, frequência respiratória de 36, hemoptise de 150 mL em seis horas. Diurese de 280 mL em 24 horas. Creatinina 5,8 mg/dL, potássio 3,4. A hemoglobina caiu de 11,6 para 9,1 g/dL.<\/p><p>A nova radiografia mostra opacidades alveolares confluentes nos dois pulmões.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "rx_hemorragia", "kicker": "Discussão de exame", "tt": "Discussão de imagem", "corpo": "<div class=\"observacao-imagem figura-discussao\"><p>Radiografia ilustrativa de outro paciente, com o padrão descrito no laudo de Joaquim. Descreva a distribuição antes de propor o mecanismo.<\/p><div class=\"estudo-imagem\"><figure class=\"anot\"><svg viewBox=\"0 0 1000 773.0\" xmlns=\"http://www.w3.org/2000/svg\"><image data-img=\"rx_torax_alveolar.jpg\" x=\"0\" y=\"0\" width=\"1000\" height=\"773.0\" preserveAspectRatio=\"xMidYMid slice\"/><g class=\"an\"><\/g><\/svg><figcaption>Radiografia de outro paciente · comparação didática.<span class=\"cr\">Samir · Wikimedia Commons · CC BY-SA 3.0<\/span><\/figcaption><\/figure><\/div><details class=\"leitura-imagem\"><summary>Revelar leitura e marcações<\/summary><p>Opacidades alveolares bilaterais, em mancha e confluentes, sem cardiomegalia e sem derrame.<\/p><p>Na leptospirose, hipoxemia com hemoptise e queda de hemoglobina é hemorragia pulmonar: a vasculite capilar difusa que faz a mortalidade da forma grave passar de 50%.<\/p><\/details><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 0, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p5", "kicker": "Pergunta 5", "enunciado": "Hemorragia pulmonar, oligúria e sonolência. <b>Quais três<\/b> fatores associam-se a maior mortalidade na leptospirose grave?", "alts": [{"t": "Sufusão conjuntival", "c": "Sinal diagnóstico, não prognóstico.", "ok": 0}, {"t": "Acometimento pulmonar com hemorragia", "c": "O preditor mais forte de morte nas séries brasileiras.", "ok": 1}, {"t": "Alteração do nível de consciência", "c": "Sonolência ou confusão na admissão multiplica o risco.", "ok": 1}, {"t": "Creatinoquinase acima de 1.000 U/L", "c": "Ajuda o diagnóstico; não é preditor independente.", "ok": 0}, {"t": "Oligúria", "c": "A lesão renal oligúrica pesa mais que a não oligúrica.", "ok": 1}, {"t": "Icterícia intensa", "c": "É frequente e dramática, mas não prediz morte de forma independente.", "ok": 0}, {"t": "Febre acima de 39 °C", "c": "Comum a quase todos, sem valor prognóstico.", "ok": 0}], "escolhas": 3, "fundo": "", "tr": "Pulmão, rim e cérebro", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b2", "kicker": "Decisão", "tt": "O pulmão que sangra", "enunciado": "Saturação de 83% com máscara, hemoptise e oligúria. O que você faz?", "caminhos": [{"r": "UTI: intubação precoce com ventilação protetora e diálise precoce e diária", "vai": "uti", "c": "Proteger o pulmão com volumes baixos e tirar o excesso de volume e as toxinas urêmicas cedo reduz a mortalidade.", "rc": ""}, {"r": "Ventilação não invasiva e furosemida em dose alta", "vai": "vni", "c": "A máscara não protege uma via aérea que sangra, e diurético não converte a lesão renal nem reduz a mortalidade.", "rc": ""}, {"r": "Pulso de metilprednisolona e observação na enfermaria", "vai": "pulso", "c": "O corticoide na hemorragia pulmonar é controverso e não substitui suporte intensivo.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "pulso", "kicker": "Seis horas depois", "tt": "", "corpo": "<p>Na enfermaria, sob corticoide, a saturação cai para 78%. O time de resposta rápida é chamado.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "vni", "conforme": null, "rota": null}, {"t": "pagina", "k": "vni", "kicker": "Na sala de emergência", "tt": "", "corpo": "<p>Com ventilação não invasiva, Joaquim enche a máscara de sangue e não consegue manter a saturação acima de 80%. Está agitado e confuso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "b3", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b3", "kicker": "Decisão", "tt": "A máscara falhou", "enunciado": "Qual a próxima conduta?", "caminhos": [{"r": "Intubar agora, ventilação protetora e UTI com diálise", "vai": "uti_tardia", "c": "A falha da ventilação não invasiva é a indicação.", "rc": ""}, {"r": "Manter a máscara e aumentar a fração inspirada de oxigênio", "vai": "parada", "c": "Insistir num suporte que já falhou.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "parada", "kicker": "Vinte minutos depois", "tt": "", "corpo": "<p>Joaquim para em atividade elétrica sem pulso, hipoxêmico. É intubado durante a reanimação, com sangue saindo pelo tubo. O retorno da circulação acontece depois de 18 minutos.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "f_obito", "conforme": null, "rota": null}, {"t": "pagina", "k": "uti_tardia", "kicker": "Na UTI", "tt": "", "corpo": "<p>Intubado em emergência, com ventilação protetora, pressão expiratória alta e sedação profunda. A hemodiálise começa no mesmo dia. A hipoxemia grave dura quatro dias.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "f2", "conforme": null, "rota": null}, {"t": "pagina", "k": "uti", "kicker": "Na UTI", "tt": "", "corpo": "<p>Intubação planejada, ventilação com volume corrente de 6 mL/kg de peso predito e pressão expiratória elevada. Hemodiálise no mesmo dia, depois diária. Potássio reposto conforme os controles.<\/p><p>A hemoptise para no terceiro dia. Joaquim é extubado no sexto.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pareamento", "k": "p6", "kicker": "Pergunta 6", "enunciado": "As febres ictéricas e hemorrágicas do Nordeste se sobrepõem. Associe cada quadro à doença que ele sugere.", "itens": [{"t": "Sufusão conjuntival, dor na panturrilha e contato com enchente", "ok": 0, "c": "A tríade epidemiológica e clínica de Joaquim. A sufusão é congestão sem secreção."}, {"t": "Dor abdominal, vômitos e hematócrito subindo na defervescência", "ok": 4, "c": "O extravasamento plasmático começa quando a febre cai: são os sinais de alarme."}, {"t": "Febre, icterícia e pulso lento para a febre, sem vacina, após mata", "ok": 3, "c": "O sinal de Faget e a hepatite com transaminases de milhares. A vacina previne."}, {"t": "Febre em picos, anemia e esplenomegalia depois de viagem ao Pará", "ok": 2, "c": "A gota espessa decide. No Nordeste, quase sempre importada."}, {"t": "Icterícia com transaminases acima de 1.000 e pouca febre", "ok": 1, "c": "Hepatite hepatocelular pura, sem rim nem pulmão."}], "ops": ["Leptospirose", "Hepatite A aguda", "Malária por Plasmodium vivax", "Febre amarela", "Dengue grave", "Hantavirose"], "fundo": "", "tr": "O detalhe da história decide mais que o laboratório", "nota": "A opção que sobrou, hantavirose, é cardiopulmonar, rural, do Sul e do Centro-Oeste, e sem icterícia.", "segue": ""}, {"t": "pergunta", "k": "p7", "kicker": "Pergunta 7", "enunciado": "Sobre o tratamento da leptospirose grave, <b>quais três<\/b> afirmações estão corretas?", "alts": [{"t": "Furosemida converte a oligúria e evita diálise", "c": "Não muda a necessidade de diálise nem a mortalidade.", "ok": 0}, {"t": "O antibiótico só tem benefício nos primeiros quatro dias", "c": "Recomenda-se tratar em qualquer fase da doença.", "ok": 0}, {"t": "A reação de Jarisch-Herxheimer obriga a suspender a penicilina", "c": "É liberação de toxinas das espiroquetas mortas: trata-se o sintoma e mantém-se o antibiótico.", "ok": 0}, {"t": "O potássio deve ser reposto conforme os controles", "c": "A perda tubular de potássio continua na fase poliúrica.", "ok": 1}, {"t": "Penicilina cristalina ou ceftriaxona endovenosa por sete dias", "c": "Os dois esquemas têm eficácia semelhante; a doxiciclina oral é da forma leve.", "ok": 1}, {"t": "Diálise precoce e diária reduz a mortalidade", "c": "Comparada à diálise em dias alternados, reduziu a mortalidade num ensaio brasileiro.", "ok": 1}, {"t": "Corticoide é tratamento de rotina da forma grave", "c": "Não há evidência para uso rotineiro.", "ok": 0}], "escolhas": 3, "fundo": "", "tr": "Antibiótico em qualquer fase, diálise cedo, potássio sempre", "nota": "", "segue": ""}, {"t": "pagina", "k": "recuperacao", "kicker": "Segunda semana", "tt": "", "corpo": "<p>A diurese volta com poliúria de 4 litros por dia, e o potássio precisa de reposição. A icterícia regride devagar. A segunda sorologia, no 14.º dia, é <b>ELISA IgM reagente<\/b>, e a microaglutinação mostra soroconversão para o sorovar Icterohaemorrhagiae.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p8", "kicker": "Pergunta 8", "enunciado": "Na alta, <b>quais três<\/b> medidas estão corretas?", "alts": [{"t": "Antibiótico profilático por três meses", "c": "Não há indicação depois de tratada a infecção.", "ok": 0}, {"t": "Vacina humana para os colegas", "c": "Não há vacina humana disponível no Brasil.", "ok": 0}, {"t": "Notificar o caso à vigilância epidemiológica", "c": "Leptospirose é de notificação compulsória. A vigilância investiga o local e os colegas expostos.", "ok": 1}, {"t": "Isolamento de contato em casa", "c": "Não há transmissão entre pessoas. O risco está na água e nos roedores.", "ok": 0}, {"t": "Investigar o local de trabalho e orientar equipamento de proteção", "c": "Botas íntegras e luvas na limpeza de canais. Controle de roedores no depósito.", "ok": 1}, {"t": "Repetir a microaglutinação todo mês", "c": "A soroconversão já confirmou. Repetir não muda nada.", "ok": 0}, {"t": "Acompanhar creatinina e potássio nas semanas seguintes", "c": "A função renal costuma recuperar, mas em semanas, e a fase poliúrica perde potássio.", "ok": 1}], "escolhas": 3, "fundo": "", "tr": "Notificar, proteger quem trabalha na água e acompanhar o rim", "nota": "", "segue": ""}, {"t": "pagina", "k": "alta", "kicker": "Preparando a alta", "tt": "", "corpo": "<p>A equipe revê com Joaquim e o irmão o que aconteceu: a exposição, a doença, as sessões de diálise e o que esperar do rim e dos músculos nas próximas semanas.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b2", "para": ["alta_cedo", "f2", "f2"]}, "rota": null}, {"t": "pagina", "k": "alta_cedo", "kicker": "Última visita", "tt": "", "corpo": "<p>A diálise foi suspensa no nono dia e a creatinina cai todos os dias. Ele já caminha pelo corredor sem oxigênio.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": {"de": "b1", "para": ["f1", "f2", "f2"]}, "rota": null}, {"t": "desfecho", "k": "f1", "kicker": "Desfecho", "tt": "Alta sem diálise", "corpo": "<p>Joaquim sai no 16.º dia, sem diálise desde o 9.º, com creatinina de 1,6 mg/dL e bilirrubina em queda. Retoma o trabalho em seis semanas.<\/p>", "q": "melhor", "porque": "Antibiótico no primeiro contato, UTI antes da falência e diálise precoce: as três decisões que mudam a mortalidade da síndrome de Weil.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "f2", "kicker": "Desfecho", "tt": "Alta depois de internação prolongada", "corpo": "<p>Joaquim sai no 27.º dia, com creatinina de 2,1 mg/dL e fraqueza muscular que leva dois meses para passar.<\/p>", "q": "medio", "porque": "O atraso do antibiótico ou do suporte intensivo acrescentou dias de hipoxemia e de diálise. Ele sobreviveu à forma que mata metade.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "f_obito", "kicker": "Desfecho", "tt": "Óbito no terceiro dia", "corpo": "<p>Depois da parada, Joaquim evolui com choque refratário e hemorragia pulmonar maciça. Morre no terceiro dia de internação.<\/p>", "q": "pior", "porque": "A ventilação não invasiva numa via aérea que sangra, mantida depois de falhar, levou à parada hipóxica. A hemorragia pulmonar da leptospirose pede intubação precoce.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "retrospectiva", "kicker": "Retrospectiva", "tt": "", "corpo": "<table class=\"tb\"><thead><tr><th>Momento<\/th><th>O dado<\/th><th>O que decidiu<\/th><\/tr><\/thead><tbody><tr><td>Na UPA, segundo dia<\/td><td>Febre súbita, mialgia de panturrilha, enchente dez dias antes<\/td><td>Perguntar pela água muda o diagnóstico de dengue para leptospirose<\/td><\/tr><tr><td>Na emergência<\/td><td>Bilirrubina 17,8 com AST 112, CK alta, potássio baixo<\/td><td>O padrão laboratorial da síndrome de Weil<\/td><\/tr><tr><td>Sorologia<\/td><td>IgM não reagente no sexto dia<\/td><td>Tratar sem esperar: o anticorpo vem depois<\/td><\/tr><tr><td>Segundo dia<\/td><td>Hemoptise, hipoxemia, oligúria<\/td><td>UTI, intubação protetora e diálise precoce<\/td><\/tr><tr><td>Alta<\/td><td>Soroconversão na microaglutinação<\/td><td>Notificar e proteger quem trabalha na água<\/td><\/tr><\/tbody><\/table>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Paciente, valores e percursos são ficcionais.<\/p><p>Ministério da Saúde. Guia de Vigilância em Saúde, capítulo de leptospirose, e Leptospirose: diagnóstico e manejo clínico. Andrade e cols., Clin J Am Soc Nephrol 2007 (diálise diária). Spichler e cols., Am J Trop Med Hyg 2008 (preditores de mortalidade). Radiografia: Samir, Wikimedia Commons, CC BY-SA 3.0 — outro paciente.<\/p>", "f <script>
/* Paginação por blocos medidos. Nenhum bloco é descartado ou reduzido por zoom. */
let partesTela = [], parteTela = 0, areaTela = null;
const detalhesAbertos = new Set();
const temProximaParte = () => parteTela + 1 < partesTela.length;
function aplicarParte(){
  if (!areaTela) return;
  parteTela = Math.min(Math.max(parteTela, 0), Math.max(0, partesTela.length - 1));
  const ativos = new Set(partesTela[parteTela] || []);
  [...areaTela.children].forEach(el => el.toggleAttribute('data-fora', !ativos.has(el)));
  areaTela.scrollTop = 0; areaTela.scrollLeft = 0;
}
function virarParte(delta){
  parteTela += delta; aplicarParte(); pintarPe();
}
function montarFolhas(){
  partesTela = []; areaTela = null;
  const root = document.querySelector('#palco .plano,#palco .folha,#palco .fim .caixa');
  if (!root) return;
  const mobile = innerWidth <= 900;
  if (mobile && root.classList.contains('plano')){
    const figura = document.querySelector('#palco .lamina');
    if (figura) root.append(figura);
  }
  let area = root.querySelector(':scope > .alts,:scope > .grupos,:scope > .res,:scope > .cams,:scope > .painel-lab,:scope > .par,:scope > .observacao-imagem');
  if (!area){
    root.classList.add('paginavel');
    area = document.createElement('div'); area.className = 'conteudo-paginado';
    const filhos = [...root.children];
    // Conserva o título como referência em todas as páginas de continuação.
    filhos.filter(el => !el.matches('.marca,h1,h2')).forEach(el => area.append(el));
    root.append(area);
  }
  if(area.classList.contains('cams')){const aviso=root.querySelector(':scope>.forca');if(aviso)area.append(aviso);}
  if(mobile)root.querySelectorAll('table').forEach(t=>{const nomes=[...t.querySelectorAll('thead th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,n)=>td.dataset.col=nomes[n]||''));});
  area.classList.add('area-paginada'); areaTela = area;
  // Respostas e resultados permanecem inteiros: a densidade se adapta à tela.
  if(area.matches('.alts,.res,.cams,.painel-lab,.par,.observacao-imagem')){
    root.classList.add('tela-unica');
    if(area.matches('.painel-lab,.observacao-imagem'))root.classList.add('paginavel');
    const cabe=()=>area.scrollHeight<=area.clientHeight+1&&area.scrollWidth<=area.clientWidth+1;
    let fator=1;
    root.style.setProperty('--compacto',fator);
    while(!cabe()&&fator>0.25){fator=Math.max(0.25,fator-0.015);root.style.setProperty('--compacto',fator.toFixed(3));}
    partesTela=[[...area.children]];parteTela=0;aplicarParte();return;
  }

  // O flex precisa reservar espaço aos cabeçalhos e aos botões antes da medição.
  const capacidade = () => area.clientHeight;
  function grande(el){ const st=getComputedStyle(el);return el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0) > capacidade() - 3; }
  function dividir(el){
    if (!grande(el)) return false;
    if(mobile && el.matches('.grade,.bal,div:not([class])')){el.replaceWith(...el.children);return true;}
    let filhos = [], criar;
    if (el.matches('.gr')){
      filhos = [...el.querySelectorAll(':scope > .it')];
      criar = () => { const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c; };
    } else if (el.matches('.tops,.grade,.vit,.corpo .lg,aside,.cons,.rev,.bal,.painel-lab')){
      filhos = [...el.children]; criar=()=>el.cloneNode(false);
    } else if (el.matches('.estudo-imagem') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('.corpo') && mobile){
      filhos=[...el.children];criar=()=>el.cloneNode(false);
    } else if (el.matches('table')){
      filhos=[...el.querySelectorAll('tbody tr')];
      criar=()=>{const c=el.cloneNode(false);if(el.tHead)c.append(el.tHead.cloneNode(true));c.append(document.createElement('tbody'));return c;};
    } else if (el.matches('details[open]')){
      filhos=[...el.children].filter(x=>x.tagName!=='SUMMARY');
      criar=()=>{const c=document.createElement('div');c.className='leitura continuacao-leitura';return c;};
    } else if (el.matches('.rc') && el.querySelector('figure')){
      filhos=[...el.children].filter(x=>x.tagName!=='B');
      criar=()=>{const c=el.cloneNode(false);c.append(el.querySelector('b').cloneNode(true));return c;};
    }
    // Contêiner com um filho só: o que precisa partir é o filho.
    if (filhos.length === 1) return dividir(filhos[0]);
    if (filhos.length > 1){
      if(el.matches('.gr')){
        // Conserva o máximo de opções por grupo que a altura comporta.
        const blocos=[];let atual=criar();el.before(atual);
        for(const f of filhos){atual.append(f);if(grande(atual)&&atual.querySelectorAll('.it').length>1){f.remove();blocos.push(atual);atual=criar();el.before(atual);atual.append(f);}}
        el.remove();return true;
      }
      // Blocos inteiros, com cabeçalhos repetidos onde necessários.
      const novos=filhos.map(f=>{const c=criar();(c.tBodies?.[0]||c).append(f);return c;});
      el.replaceWith(...novos);return true;
    }
    if(el.matches('.cam') && el.querySelector('.c')?.textContent && !el.dataset.discussao){
      const comentario=el.querySelector('.c'),c=el.cloneNode(false);c.dataset.discussao='1';
      c.append(el.querySelector('.l').cloneNode(true));const rot=document.createElement('span');rot.className='r';rot.textContent='Discussão do caminho '+el.querySelector('.l').textContent;c.append(rot,comentario);el.after(c);return true;
    }
    const seletor=el.matches('p')?null:'.c,.cm,:scope>p';
    const alvo=seletor?el.querySelector(seletor):el;
    if(alvo && alvo.textContent.length>120){
      const walker=document.createTreeWalker(alvo,NodeFilter.SHOW_TEXT),nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      const txt=alvo.textContent,mid=txt.indexOf(' ',Math.floor(txt.length/2));
      if(mid<0)return false;
      let used=0,cut;
      for(const n of nodes){if(used+n.length>=mid){cut=[n,mid-used];break;}used+=n.length;}
      if(!cut)return false;
      const a=document.createRange();a.selectNodeContents(alvo);a.setEnd(...cut);
      const b=document.createRange();b.selectNodeContents(alvo);b.setStart(...cut);
      const left=el.cloneNode(true),right=el.cloneNode(true);
      (seletor?left.querySelector(seletor):left).replaceChildren(a.cloneContents());
      (seletor?right.querySelector(seletor):right).replaceChildren(b.cloneContents());
      el.replaceWith(left,right);return true;
    }
    return false;
  }
  // Une novamente apenas na próxima renderização; os originais continuam nos dados do caso.
  for(let pass=0;pass<8;pass++){
    let mudou=false;
    for(const el of [...area.children])if(dividir(el))mudou=true;
    if(!mudou)break;
  }
  const itens=[...area.children];
  itens.forEach(el=>el.setAttribute('data-fora',''));
  let folha=[];
  for(const el of itens){
    el.removeAttribute('data-fora');
    const excedeu = area.scrollHeight>area.clientHeight+2 || area.scrollWidth>area.clientWidth+2;
    if(excedeu && folha.length){
      partesTela.push(folha);folha.forEach(n=>n.setAttribute('data-fora',''));folha=[];
    }
    folha.push(el);
  }
  if(folha.length)partesTela.push(folha);
  aplicarParte();
}

/* ═══════════ o caso em etapas — página a página ═══════════

   Uma folha de cada vez. Nada rola: a página inteira é uma etapa, e passar de
   etapa é virar a folha. O que decide a folha seguinte é o que foi respondido
   na atual.

   Três coisas o motor guarda entre as etapas: os exames marcados em cada
   pedido, as respostas dadas, e o caminho escolhido em cada bifurcação. É com
   os exames marcados que a página de resultados sabe o que devolver — e é por
   isso que o que não foi pedido não aparece. */

const DADOS = JSON.parse(document.getElementById('dados').textContent);
const CASO = DADOS.caso, ETAPAS = DADOS.etapas, BANCO = DADOS.banco;
const REVISAO = DADOS.revisao;
/* As imagens viajam numa tabela à parte, uma vez cada: a etapa guarda
   só o nome do arquivo. */
const IMG = n => (DADOS.imgs || {})[n] || n || '';

const $ = s => document.querySelector(s);

/* ─────────────────────────── estado da sessão ─────────────────────────── */

let emRevisao = false;
let i = 0;                    // índice da etapa atual
const marcados = {};          // ident do pedido -> Set de nomes de exame
const respostas = {};         // ident da pergunta -> {marcadas:[], feita:bool}
const escolhas = {};          // ident da bifurcação -> índice do caminho
let historia = [0];           // pilha de etapas visitadas, para voltar
const laudos = new Set(); // laudos revelados por rodada de investigação

const porId = k => ETAPAS.findIndex(e => e.k === k);
/* Tudo o que já foi pedido em qualquer rodada, para os pré-requisitos e para
   as consequências do fim. */
function jaPedido(nome){
  return Object.values(marcados).some(c => c.has(nome));
}
const etapa = () => ETAPAS[i];

/* ─────────────────────────── navegação ─────────────────────────── */

function ir(n, empilhar){
  if (n < 0 || n >= ETAPAS.length) return;
  if (empilhar !== false) historia.push(n);
  i = n; parteTela = 0; emRevisao=false;
  pintar();
}

function irPara(k){
  const n = porId(k);
  if (n < 0){ console.warn('etapa inexistente:', k); return; }
  ir(n);
}

/* A folha seguinte é a vizinha, a menos que a etapa atual diga outra coisa —
   é assim que a bifurcação muda o rumo sem que a lista de etapas mude. */
function adiante(){
  if (temProximaParte()){ virarParte(1); return; }
  if(emRevisao){recomecar();return;}
  const e = etapa();
  if(e.comentado){
    const r=respostas[e.k];if(!r?.feita)return;
    const alts=e.alts.filter(a=>a.ok);
    marcados[e.k]=new Set(alts.flatMap(a=>a.exames));
    r.conducao='indicados';
  }
  if (e.t === 'bifurcacao'){
    const esc = escolhas[e.k];
    if (esc === undefined) return;
    irPara(e.caminhos[esc].vai);
    return;
  }
  if (e.t === 'desfecho'){
    if (e.fecho) irPara(e.fecho); else mostrarRevisao();
    return;
  }
  /* A rota é a ramificação de verdade: quem não pediu a prova não recebe a
     página que a discute. Sem isto, a peça perguntava "que exames você pede?" e
     depois seguia contando o resultado de exames que ninguém pediu — que é
     exatamente o vício que este formato existe para não ter. */
  if (e.rota){
    const pedidos = new Set();
    Object.values(marcados).forEach(c => c.forEach(n => pedidos.add(n)));
    const tem = e.rota.pediu.every(n => pedidos.has(n));
    irPara(tem ? e.rota.entao : e.rota.senao);
    return;
  }
  /* A evolução volta a se separar aqui: a página é a mesma para os três
     caminhos até o ponto em que o hemograma deixa de ser o mesmo. */
  if (e.conforme){
    const k = escolhas[e.conforme.de];
    irPara(e.conforme.para[k === undefined ? 0 : k]);
    return;
  }
  // `segue` deixa a ordem do arquivo de ser a única costura entre as páginas:
  // é o que permite três trilhas de tratamento convivendo na mesma lista
  if (e.segue){ irPara(e.segue); return; }
  if (i + 1 >= ETAPAS.length){ mostrarRevisao(); return; }
  ir(i + 1);
}

function atras(){
  if (parteTela > 0){ virarParte(-1); return; }
  if(emRevisao){emRevisao=false;parteTela=0;pintar();return;}
  const e = etapa();
  if (historia.length < 2) return;
  historia.pop();
  i = historia[historia.length - 1];
  pintar();
}

/* Quando se pode virar a folha. Pergunta sem resposta e pedido sem nenhum
   exame marcado seguram a página: o caso não anda por cima de uma decisão que
   não foi tomada. */
function podeAdiante(){
  if (emRevisao || temProximaParte()) return true;
  const e = etapa();
  if (e.t === 'pergunta' || e.t === 'pareamento')
    return !!(respostas[e.k] && respostas[e.k].feita);
  if (e.t === 'bifurcacao') return escolhas[e.k] !== undefined;
  if (e.t === 'pedido') return e.comentado ? !!respostas[e.k]?.feita : (marcados[e.k] || new Set()).size > 0;
  return true;
}

/* ─────────────────────────── o trilho ─────────────────────────── */

/* Desde que o caso ramifica, a lista de etapas deixou de ser o caminho: ela
   contém as páginas das DUAS rotas, e contar 27 num percurso de 19 é mentir
   para quem olha o trilho. Esta função percorre o caso a partir do estado
   atual e devolve só as páginas que este percurso vai ver. */
function rotaAtual(){
  const seq = [], visto = new Set();
  const pedidos = new Set();
  Object.values(marcados).forEach(c => c.forEach(x => pedidos.add(x)));
  let n = 0;
  while (n >= 0 && n < ETAPAS.length && !visto.has(n)){
    visto.add(n); seq.push(n);
    const e = ETAPAS[n];
    if (e.t === 'bifurcacao'){
      const esc = escolhas[e.k];
      n = porId(e.caminhos[esc === undefined ? 0 : esc].vai);
    } else if (e.t === 'desfecho'){
      n = e.fecho ? porId(e.fecho) : -1;
    } else if (e.rota){
      n = porId(e.rota.pediu.every(x => pedidos.has(x))
                ? e.rota.entao : e.rota.senao);
    } else if (e.conforme){
      const k = escolhas[e.conforme.de];
      n = porId(e.conforme.para[k === undefined ? 0 : k]);
    } else if (e.segue){
      n = porId(e.segue);
    } else n = n + 1;
  }
  return seq;
}

/* O trilho mostra as etapas do percurso, uma marca cada, colorida pelo tipo —
   e um contador explícito. É assim que o formato antigo do New England fazia,
   e a diferença é real: dá para ver quantas páginas faltam e onde estão as
   perguntas antes de chegar nelas. */
function pintarTrilho(){
  const seq = rotaAtual();
  const aqui = Math.max(seq.indexOf(i), 0);
  $('#trilho').innerHTML =
    '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>'
    + '<span class="cnt">' + (aqui + 1) + ' / ' + seq.length + '</span>'
    + '<span class="marcas">' + seq.map(n => ETAPAS[n]).map((e, k) =>
        // o título só aparece no que já foi percorrido: com o mouse parado
        // sobre uma marca à frente, o trilho entregava os desfechos — inclusive
        // qual deles é o ruim — antes de a bifurcação ser feita
        '<i class="m-' + e.t + (k < aqui ? ' feita' : k === aqui ? ' aqui' : '')
        + '" data-n="' + seq[k] + '"'
        + (k < aqui ? ' title="' + (e.tt || e.kicker || '').replace(/"/g, '') + '"' : '')
        + '></i>'
      ).join('') + '</span>';
  // andar para trás pelo trilho é livre; para a frente, não — o caso não pula
  // uma decisão que ainda não foi tomada
  const vistos = new Set(historia);
  $('#trilho').querySelectorAll('.marcas i').forEach(m => {
    const n = +m.dataset.n;
    if (vistos.has(n) && n !== i) m.onclick = () => ir(n);
  });
}

function pintarPe(){
  const e = etapa();
  const fim = e.t === 'desfecho';
  const corrigida=e.comentado && respostas[e.k]?.feita;
  $('#pe').innerHTML =
    '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav">'
    + (partesTela.length > 1 ? '<span class="pagina-indice">Página ' + (parteTela + 1) + ' de ' + partesTela.length + '</span>' : '')
    + '<button class="bt" id="voltar"' + (historia.length < 2 && parteTela === 0 ? ' disabled' : '') + '>Voltar</button>'
    + '<button class="bt forte" id="' + (emRevisao && !temProximaParte() ? 'reiniciar' : 'seguir') + '"' + (podeAdiante() ? '' : ' disabled') + '>'
    + (temProximaParte() ? 'Próxima página' : emRevisao ? 'Recomeçar' : e.t === 'capa' ? 'Começar o caso' : corrigida ? 'Realizar indicados' : fim ? 'Continuar' : 'Avançar') + '</button></span>';
  $('#voltar').onclick = atras;
  ($('#seguir') || $('#reiniciar')).onclick = adiante;
}

/* ─────────────────────────── desenho das etapas ─────────────────────────── */

const fundoDe = e => e.fundo
  ? '<div class="fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
  : '<div class="fundo" style="background:#0d1014"></div>';

const laminaDe = l => !l ? '' :
  '<figure class="lamina"><img src="' + IMG(l.img) + '" alt="' + l.tt + '">'
  + '<figcaption class="cap"><b>' + l.tt + '</b>' + l.lg
  + '<span class="cr">' + l.cr + '</span></figcaption></figure>';

/* Figura anotada e boneco vêm do caso como HTML pronto, montado antes de
   existir data: URI. Cada um deixa o nome do arquivo em `data-img` e o
   endereço é resolvido aqui, contra a mesma tabela de imagens. */
function resolverImagens(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = IMG(el.dataset.img);
    if (el.tagName.toLowerCase() === 'image') el.setAttribute('href', u);
    else el.setAttribute('src', u);
  });
}

/* ─────────────────────── a lupa ─────────────────────── */

/* Tomografia lida num cartão de 300 px é decoração. Qualquer figura da peça
   abre em tela cheia por clique, com a legenda embaixo, e fecha por clique,
   por Esc ou pelo botão. Enquanto a lupa está aberta as setas do teclado
   param de virar página: elas pertencem à figura, não ao caso. */
let lupaAberta = false;

function abrirLupa(figura){
  const clone = figura.cloneNode(true);
  clone.classList.remove('lamina');
  const cx = document.createElement('div');
  cx.className = 'lupa';
  cx.innerHTML = '<button class="fechar" title="Fechar (Esc)">Fechar ✕</button>';
  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  quadro.appendChild(clone);
  cx.appendChild(quadro);
  document.body.appendChild(cx);
  lupaAberta = true;
  const fechar = () => {
    cx.remove(); lupaAberta = false;
    document.removeEventListener('keydown', porTecla, true);
  };
  const porTecla = ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); fechar(); }
  };
  document.addEventListener('keydown', porTecla, true);
  cx.onclick = ev => { if (!quadro.contains(ev.target) || ev.target.tagName === 'IMG') fechar(); };
  cx.querySelector('.fechar').onclick = fechar;
}

function ligarLupa(){
  document.querySelectorAll('#palco figure').forEach(f => {
    if (!f.querySelector('img,svg')) return;
    f.classList.add('amplia');
    f.title = 'Clique para ampliar';
    f.onclick = () => abrirLupa(f);
  });
}

function pintar(){
  const e = etapa();
  $('#palco').innerHTML = '<section class="tela on">' + DESENHO[e.t](e) + '</section>';
  resolverImagens();
  document.querySelectorAll('#palco details').forEach((d,n)=>{const key=etapa().k+'::'+n;d.dataset.detalhe=key;d.open=detalhesAbertos.has(key);});
  ligar(e);
  montarFolhas();
  document.querySelectorAll('#palco details').forEach(d=>{const summary=d.querySelector('summary');if(summary)summary.onclick=ev=>{ev.preventDefault();const key=d.dataset.detalhe;d.open?detalhesAbertos.delete(key):detalhesAbertos.add(key);parteTela=0;pintar();};});
  ligarLupa();
  acessibilidadeDaPagina();
  pintarTrilho();
  pintarPe();
}

const DESENHO = {

  /* Título e imagem. A imagem sobe do chão para a tela inteira, sem véu de
     leitura por cima dela senão o gradiente que segura o título. */
  capa: e =>
    '<div class="fundo capa-fundo" style="background-image:url(' + IMG(e.fundo) + ')"></div>'
    + '<div class="veu capa-veu"></div>'
    + '<div class="abertura">'
    + (e.kicker ? '<div class="marca"><i></i><span>' + e.kicker + '</span></div>' : '')
    + '<h1>' + e.tt + '</h1>'
    + (e.selo ? '<div class="selo">' + e.selo + '</div>' : '')
    + '</div>',

  /* Quando o rótulo é mais informativo que a manchete — "onde dava para ter
     chegado antes" contra "a retrospectiva" — quem sobe a título é o rótulo, e
     a manchete curta sai. O caso declara isso com `so_kicker`. */
  pagina: e =>
    fundoDe(e) + '<div class="veu ' + (e.lamina ? 'esq' : 'tudo') + '"></div>'
    + '<div class="plano' + (e.lamina ? '' : ' centro') + '">'
    + (e.so_kicker
        ? '<h2 class="do-kicker">' + e.kicker + '</h2>'
        : '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
          + '<h2>' + e.tt + '</h2>')
    + e.corpo + '</div>'
    + laminaDe(e.lamina),

  pedido: e => e.comentado ? DESENHO.pergunta(e) :
    fundoDe(e) + '<div class="veu tudo"></div>'
    + '<div class="folha pedido">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
    + '<div class="grupos">' + e.grupos.map(g =>
        '<div class="gr g-' + g.s + '"><b><i></i>' + g.n + '</b>'
        + g.o.map(o => {
            /* Um exame com pré-requisito continua VISÍVEL e fica travado, com
               o motivo escrito. Esconder ensinaria que ele não existe; o que
               se quer ensinar é que ele ainda não se justifica. */
            const falta = (o.ex || []).filter(x => !jaPedido(x));
            const trava = falta.length > 0;
            return '<label class="it' + (temMarcado(e.k, o.e) ? ' on' : '')
              + (trava ? ' trava' : '') + '" data-ex="' + esc(o.e) + '">'
              + '<span class="cx"></span><span class="n">' + o.e
              + (o.d ? '<span class="d">' + o.d + '</span>' : '')
              + (trava ? '<span class="d trv">' + o.pq + ' — falta: '
                  + falta.join(', ') + '</span>' : '')
              + '</span></label>';
          }).join('') + '</div>').join('')
    + '</div><div class="conta" id="conta"></div></div>',

  // Sem manchete: o rótulo já diz "o que voltou", e o primeiro cartão vira o
  // topo visual. Ganha noventa pixels e a tela começa no dado.
  resultados: e => {
    const todos = e.todos ? e.todos : [...(marcados[e.de] || [])];
    const origem=respostas[e.de]?.conducao;
    const resumo=origem==='indicados'?'Exames realizados pela equipe após a discussão.':'';
    const pedidos = todos;
    const sobre = e.sobre || (ETAPAS[porId(e.de)] || {}).sobre || {};
    const linhas = [], imagens = [];
    pedidos.forEach(n => {
      // o resultado que o caso declarou vence o do banco: o banco foi escrito
      // para um formato com relógio, e aqui não há relógio
      const x = sobre[n] || BANCO[n];
      if (!x) return '';
      const im = e.laminas[n];
      /* O laudo do sedimento tem cinco achados separados por ponto médio, e
         num parágrafo corrido o cilindro hemático — que é o achado — passava
         no meio da frase. Cada parte vira uma linha. */
      const partes = x.r.split(' · ');
      const valor = partes.length > 1
        ? partes.map(t => '<span class="ln">' + t + '</span>').join('')
        : x.r;
      /* Quando o exame tem imagem, a imagem vem SOZINHA e o laudo fica atrás
         de um botão. Colar o laudo na figura tira do grupo o passo que mais
         ensina em imagem, que é descrever antes de ler o que outro escreveu —
         e é invariante declarada do formato: laudo se revela, não se
         renderiza junto. */
      const laudo = '<div class="v">' + valor
        + (x.ref && x.ref !== '—' ? '<span class="rf">referência: ' + x.ref
            + '</span>' : '') + '</div>';
      if (!im) {
        linhas.push('<tr class="rc' + (x.a ? ' alt' : '') + '"><th scope="row"><b>' + n
          + '</b></th><td class="v">' + valor + '</td><td class="rf">'
          + (x.ref || '—') + '</td></tr>');
        return;
      }
      /* A legenda descritiva É o laudo. Deixá-la sob a figura enquanto um
         botão promete "ver o laudo" é entregar a leitura e cobrar o clique
         por nada: quem olhava a radiografia já lia "opacidades alveolares
         bilaterais predominando nos campos médios" antes de descrever coisa
         alguma. Sob a figura fica só o crédito; a descrição e o valor saem
         juntos, no clique. */
      const chaveLaudo = (e.de || e.k) + '::' + n;
      const aberto = laudos.has(chaveLaudo);
      imagens.push('<article class="rc resultado-imagem' + (x.a ? ' alt' : '') + '"><b>' + n + '</b>'
        + '<figure><img src="' + IMG(im.img) + '" alt="' + n + '">'
        + '<figcaption class="soc">' + im.cr + '</figcaption></figure>'
        + (aberto
            ? laudo + '<div class="leglaudo">' + im.lg + '</div>'
            : '<button class="verlaudo" data-laudo="' + esc(chaveLaudo) + '">'
              + 'Ver o laudo</button>')
        + '</article>');
    });
    const cartas = (linhas.length ? '<div class="laboratorio"><table class="exames-tabela"><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>' + linhas.join('') + '</tbody></table></div>' : '')
      + (imagens.length ? '<div class="imagens-resultados" style="--figuras:' + imagens.length + '">' + imagens.join('') + '</div>' : '');
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca larga"><i></i><span>' + e.kicker
      + '</span>'
      + (resumo || e.intro ? '<b class="sub-in">' + resumo + ' ' + (e.intro || '').replace(/(?:De novo, só o que foi marcado\.|Só o que foi marcado\.)/g,'') + '</b>' : '') + '</div>'
      + '<div class="res resultados-editoriais' + (linhas.length && imagens.length ? ' misto' : '') + '">' + (cartas
          || '<div class="vazio">Você não pediu nenhum exame nesta etapa. O caso '
             + 'segue com o que se sabe do leito.</div>') + '</div></div>';
  },

  pergunta: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q' + (e.alts.length > 6 ? ' densa' : '') + '">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : (e.escolhas === 1 ? 'selecione uma'
             : 'selecione ' + e.escolhas + ' · marcadas ' + r.marcadas.length))
      + '</div>'
      + '<ul class="alts' + (r.feita ? ' feita' : '')
          + (e.alts.length > 6 ? ' muitas' : '') + '">'
      + e.alts.map((a, k) =>
          '<li data-k="' + k + '" class="' + (a.ok ? 'certa' : 'errada')
          + (r.marcadas.includes(k) ? ' marcada' : '') + '">'
          + '<span class="k">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="tx">' + a.t + '</span>'
          + '<span class="cm">' + (r.feita ? '<span class="estado-resposta">' + (e.comentado ? a.situacao : (a.ok ? 'Correta' : 'Incorreta')) + (r.marcadas.includes(k) ? ' · sua seleção' : '') + '</span>' : '') + a.c + '</span></li>').join('')
      + '</ul>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (r.marcadas.length >= e.escolhas ? '' : ' disabled') + '>'
          + 'Confirmar resposta</button>')
      + '</div>';
  },

  /* Pareamento: cada item tem a sua linha de letras. Marcar é atribuir uma
     letra ao item; a mesma letra pode servir a mais de um item, porque é
     assim na prova — e porque proibir a repetição entregaria a resposta por
     exclusão. */
  pareamento: e => {
    const r = respostas[e.k] || {marcadas: [], feita: false};
    const L = n => String.fromCharCode(65 + n);
    return fundoDe(e) + '<div class="veu tudo"></div>'
      + '<div class="folha q par-folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<p class="enun">' + e.enunciado + '</p>'
      + '<div class="qdica">' + (r.feita ? e.tr
          : 'atribua uma letra a cada item · ' + r.marcadas.filter(x => x !== undefined && x !== null).length
            + ' de ' + e.itens.length) + '</div>'
      + '<div class="par' + (r.feita ? ' feita' : '') + '">'
      + '<div class="par-ops">' + e.ops.map((o, n) =>
          '<span class="po"><b>' + L(n) + '</b>' + o + '</span>').join('') + '</div>'
      + '<div class="par-itens">' + e.itens.map((it, n) => {
          const esc = r.marcadas[n];
          const certa = r.feita && esc === it.ok;
          return '<div class="pi' + (r.feita ? (certa ? ' certa' : ' errada') : '')
            + '" data-n="' + n + '">'
            + '<span class="pt">' + it.t + '</span>'
            + '<span class="pesc">' + e.ops.map((o, m) =>
                '<i class="pe' + (esc === m ? ' on' : '')
                + (r.feita && m === it.ok ? ' ok' : '') + '" data-m="' + m
                + '" title="' + esc2(o) + '">' + L(m) + '</i>').join('') + '</span>'
            + (r.feita ? '<span class="cm"><span class="estado-resposta">'
                + (certa ? 'Correta' : 'Incorreta · a resposta é ' + L(it.ok)
                    + (esc === undefined || esc === null ? '' : ' · você marcou ' + L(esc)))
                + '</span>' + it.c + '</span>' : '')
            + '</div>';
        }).join('') + '</div></div>'
      + (r.feita ? '' : '<button class="conf" id="conf"'
          + (e.itens.every((_, n) => r.marcadas[n] !== undefined && r.marcadas[n] !== null) ? '' : ' disabled')
          + '>Confirmar resposta</button>')
      + '</div>';
  },

  bifurcacao: e => {
    const esc = escolhas[e.k];
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2><p class="sub">' + e.enunciado + '</p>'
      + '<div class="cams' + (esc !== undefined ? ' feita' : '') + '">'
      + e.caminhos.map((c, k) =>
          '<div class="cam' + (esc === k ? ' escolhido' : '') + '" data-k="' + k + '">'
          + '<span class="l">' + String.fromCharCode(65 + k) + '</span>'
          + '<span class="r">' + c.r + '</span>'
          + '<span class="c">' + c.c + '</span></div>').join('')
      + '</div>'
      /* Sem isto, a ramificação era invisível: as três justificativas abriam,
         o caso seguia, e nada na tela dizia que o rumo tinha mudado. */
      + (esc !== undefined
          ? '<div class="forca">' + e.caminhos.map((c, k) =>
              '<i class="' + (esc === k ? 'on' : '') + '"></i>').join('')
            + '<span>Daqui em diante o caso segue pelo caminho '
            + String.fromCharCode(65 + esc) + '. As próximas páginas — '
            + 'a prescrição, a evolução e o desfecho — são as dele, e são '
            + 'outras nos outros dois.</span></div>'
          : '')
      + '</div>';
  },

  /* O balanço: o que a condução custou, item a item, com o contrafactual ao
     lado. É a única tela do caso que só existe por causa do que VOCÊ fez. */
  balanco: e => {
    const bateu = q => {
      if (q.sem) return !q.sem.some(n => jaPedido(n));
      if (q.escolheu) return escolhas[q.escolheu[0]] === q.escolheu[1];
      if (q.escolheu_todos)
        return q.escolheu_todos.every(([k, v]) => escolhas[k] === v);
      return false;
    };
    const disparadas = e.cons.filter(c => bateu(c.q));
    const morreu = e.obito && bateu(e.obito);
    const dias = e.bd + disparadas.reduce((s, c) => s + c.d, 0);
    const tfg = e.bt - disparadas.reduce((s, c) => s + c.t, 0);
    return fundoDe(e) + '<div class="veu tudo"></div><div class="folha">'
      + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
      + '<h2>' + e.tt + '</h2>' + e.corpo
      + '<div class="bal">'
      + (morreu
        ? '<div class="placar obito"><div class="cheio"><b>Óbito</b><span>'
          + e.obitotx + '</span></div></div>'
        : '<div class="placar">'
      +   '<div><b>' + dias + '</b><span>dias de internação</span></div>'
      +   '<div' + (tfg <= 15 ? ' class="grave"' : '') + '><b>' + tfg
      +     '</b><span>mL/min/1,73 m² na alta'
      +     (tfg <= 15 ? ' · saiu em diálise' : '') + '</span></div>'
      +   '<div class="ideal"><b>' + e.bd + ' · ' + e.bt + '</b>'
      +     '<span>o melhor percurso possível</span></div>'
      + '</div>')
      + (disparadas.length
          ? '<div class="cons">' + disparadas.map(c =>
              '<div class="cn"><b>' + c.tt + '</b>'
              + '<span class="pr">' + (c.d ? '+' + c.d + ' dias' : '')
              + (c.d && c.t ? ' · ' : '') + (c.t ? '−' + c.t + ' mL/min' : '')
              + '</span><p>' + c.pq + '</p></div>').join('') + '</div>'
          : '<div class="cons"><div class="cn limpo"><b>Nenhuma decisão desta '
            + 'condução cobrou preço.</b><p>Você chegou ao melhor percurso que '
            + 'este caso permite. É raro, e não é sorte: as decisões que '
            + 'custam caro aqui são todas das primeiras 72 horas.</p></div></div>')
      + '</div></div>';
  },

  desfecho: e =>
    fundoDe(e) + '<div class="veu tudo q-' + e.q + '"></div>'
    + '<div class="fim ' + e.q + '"><div class="caixa">'
    + '<div class="marca"><i></i><span>' + e.kicker + '</span></div>'
    + '<h1>' + e.tt + '</h1>' + e.corpo
    + '<div class="porque"><b>Por quê</b><p>' + e.porque + '</p></div>'
    + '</div></div>',
};

/* ─────────────────────────── interação ─────────────────────────── */

const esc = s => s.replace(/"/g, '&quot;');
const esc2 = s => String(s).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
const temMarcado = (k, n) => (marcados[k] || new Set()).has(n);

function ligar(e){
  if (e.t === 'pedido' && !e.comentado){
    const conj = marcados[e.k] || (marcados[e.k] = new Set());
    /* O teto é o que faz a pergunta ser uma pergunta. Sem ele, marcar tudo é
       sempre a jogada dominante — e um grupo que marca tudo não decidiu nada,
       além de encerrar a investigação na primeira tela. */
    const teto = e.limite || 0;
    const cheio = () => teto && conj.size >= teto;
    const contar = () => {
      const faltam = teto ? teto - conj.size : 0;
      $('#conta').innerHTML = '<b>' + conj.size
        + (teto ? ' de ' + teto : '') + '</b> '
        + (conj.size === 1 ? 'exame marcado' : 'exames marcados')
        + (teto
            ? (faltam > 0
                ? ' · ainda cabe' + (faltam === 1 ? ' 1' : 'm ' + faltam)
                : ' · o teto desta rodada está completo — desmarque para trocar')
            : ' · nada é obrigatório, e nada é sugerido');
      document.querySelectorAll('.it[data-ex]').forEach(l =>
        l.classList.toggle('bloq', cheio() && !conj.has(l.dataset.ex)));
      pintarPe();
    };
    document.querySelectorAll('.it[data-ex]').forEach(l => {
      l.onclick = () => {
        if (l.classList.contains('trava')) return;
        const n = l.dataset.ex;
        if (conj.has(n)) conj.delete(n);
        else if (cheio()) return;          // o teto não empurra: ele segura
        else conj.add(n);
        pintar();
        const atual=[...document.querySelectorAll('.it')].find(x=>x.dataset.ex===n);
        if(atual?.getClientRects().length)atual.focus({preventScroll:true});
      };
    });
    contar();
  }

  if (e.t === 'resultados'){
    document.querySelectorAll('.verlaudo').forEach(b => {
      b.onclick = () => {
        const nome=b.closest('.rc').querySelector('b').textContent;
        laudos.add(b.dataset.laudo);pintar();
        const cartao=[...document.querySelectorAll('.rc')].find(c=>c.querySelector('b')?.textContent===nome&&c.querySelector('.v'));
        const parte=partesTela.findIndex(p=>p.some(n=>n===cartao||n.contains(cartao)));
        if(parte>=0){parteTela=parte;aplicarParte();pintarPe();}
      };
    });
  }

  if (e.t === 'pergunta' || e.comentado){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.alts li').forEach(li => {
      li.onclick = () => {
        const k = +li.dataset.k;
        const j = r.marcadas.indexOf(k);
        // marcar e desmarcar até confirmar: a escolha não é irreversível
        // enquanto o grupo ainda está discutindo
        if (j >= 0) r.marcadas.splice(j, 1);
        else if (r.marcadas.length < e.escolhas) r.marcadas.push(k);
        else { r.marcadas.shift(); r.marcadas.push(k); }
        document.querySelectorAll('.alts li').forEach((x, n) =>
          x.classList.toggle('marcada', r.marcadas.includes(n)));
        const b = $('#conf');
        if (b) b.disabled = r.marcadas.length < e.escolhas;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if(r.marcadas.length!==e.escolhas)return;
      r.feita = true;
      if(e.comentado)marcados[e.k]=new Set(e.alts.filter(a=>a.ok).flatMap(a=>a.exames));
      parteTela=0; pintar();
    };
  }

  if (e.t === 'pareamento'){
    const r = respostas[e.k] || (respostas[e.k] = {marcadas: [], feita: false});
    if (r.feita) return;
    document.querySelectorAll('.par .pe').forEach(ch => {
      ch.onclick = ev => {
        ev.stopPropagation();
        const n = +ch.closest('.pi').dataset.n, m = +ch.dataset.m;
        r.marcadas[n] = (r.marcadas[n] === m) ? undefined : m;
        const linha = ch.closest('.pi');
        linha.querySelectorAll('.pe').forEach(x => x.classList.toggle('on', +x.dataset.m === r.marcadas[n]));
        const completo = e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null);
        const b = $('#conf'); if (b) b.disabled = !completo;
        const d = document.querySelector('.qdica');
        if (d) d.textContent = 'atribua uma letra a cada item · '
          + e.itens.filter((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null).length
          + ' de ' + e.itens.length;
      };
    });
    const conf = $('#conf');
    if (conf) conf.onclick = () => {
      if (!e.itens.every((_, k) => r.marcadas[k] !== undefined && r.marcadas[k] !== null)) return;
      r.feita = true; parteTela = 0; pintar();
    };
  }

  if (e.t === 'bifurcacao'){
    if (escolhas[e.k] !== undefined) return;
    document.querySelectorAll('.cam').forEach(c => {
      c.onclick = () => { escolhas[e.k] = +c.dataset.k; parteTela=0; pintar(); };
    });
  }
}

/* ─────────────────────────── a revisão do fim ─────────────────────────── */

/* O único lugar em que o caso comenta o que ficou de fora, e ele só fala
   quando não há mais nada a decidir. Durante a condução, apontar o que falta
   é decidir pelo grupo. */
function mostrarRevisao(){
  const pediu = new Set();
  Object.values(marcados).forEach(s => s.forEach(n => pediu.add(n)));
  const faltou = REVISAO.filter(r => !pediu.has(r.chave));
  /* `respostas[k]` nasce quando a página é PINTADA, não quando é respondida, e
     `[].every()` é `true`: uma pergunta só visitada entrava no total e no
     acerto. Dava para chegar à revisão com "4 de 4" tendo respondido três. */
  const feitas = Object.entries(respostas).filter(([, r]) => r.feita);
  const acertos = feitas.filter(([k, r]) => {
    const e = ETAPAS[porId(k)];
    if (!e) return false;
    if (e.t === 'pareamento')
      return e.itens.every((it, n) => r.marcadas[n] === it.ok);
    return r.marcadas.length === e.escolhas && r.marcadas.every(x => e.alts[x].ok);
  }).length;
  const total = feitas.length;

  $('#palco').innerHTML = '<section class="tela on">'
    + '<div class="fundo" style="background:#0d1014"></div>'
    + '<div class="veu tudo"></div><div class="folha">'
    + '<div class="marca"><i></i><span>Revisão</span></div>'
    + '<h2>O que ficou para trás</h2>'
    + '<p class="sub">' + acertos + ' de ' + total + ' perguntas de escolha com '
    + 'a resposta inteiramente certa · '
    + (pediu.size ? Object.keys(marcados).length + ' rodadas de exames, ' + pediu.size + ' pedidos ao todo · ' : '')
    + Object.keys(escolhas).length + ' decisões de conduta.</p>'
    + '<div class="rev">' + (faltou.length
        ? faltou.map(r => '<div class="li"><b>' + r.rotulo + '</b><p>'
            + r.porque + '</p></div>').join('')
        : '<div class="ok">Nada essencial ficou de fora.</div>')
    + '</div></div></section>';
  $('#pe').innerHTML = '<span class="rod">' + CASO.rodape + '</span>'
    + '<span class="nav"><button class="bt" onclick="recomecar()">'
    + 'Conduzir de novo</button></span>';
  $('#trilho').innerHTML = '<a class="voltar-biblioteca" href="index.html" aria-label="Voltar à biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Biblioteca</span></a><span class="tt">' + CASO.titulo + '</span>';
  emRevisao=true;parteTela=0;montarFolhas();pintarPe();
}

function recomecar(){
  i = 0; historia = [0]; emRevisao=false;
  Object.keys(marcados).forEach(k => delete marcados[k]);
  Object.keys(respostas).forEach(k => delete respostas[k]);
  Object.keys(escolhas).forEach(k => delete escolhas[k]);
  laudos.clear(); detalhesAbertos.clear(); parteTela=0;
  pintar();
}
