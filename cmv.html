<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depois da travessia</title>
<style>
/* ATLAS — a linguagem visual do caso em etapas.

   Três decisões governam tudo o que vem abaixo:

   1. A imagem médica é o chão da tela, não um selo no canto. Ela ocupa a tela
      inteira, recuada no eixo Z, escurecida e dessaturada até virar textura.
      O conteúdo flutua acima dela, num plano à frente.

   2. Cor é sistema, não enfeite. Cada território tem a sua, e ela reaparece em
      todo lugar onde aquele território é citado — no marcador, na borda do
      grupo de exames, no número do painel, na barra do desfecho. Quem aprende
      a cor lê a tela mais rápido.

   3. Profundidade é informação. O que está à frente é o que se decide agora; o
      que está atrás é contexto. Perspectiva de verdade, não sombra difusa. */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --eixo:88px;
  /* Uma só altura de topo e uma só de rodapé, para toda a peça. */
  --teto:clamp(78px,10vh,102px);
  --rodape:clamp(88px,11vh,104px);
  --preto:#08090b; --carvao:#0f1216; --grafite:#171b21; --linha:#414a57;
  --linha2:#5b6672;
  --gelo:#eef2f6; --nevoa:#a8b2be; --fumaca:#8d97a4; --sombra:#737d8a;

  /* Vermelho é a cor da marca — do filete do kicker, do botão de avançar, da
   marca do trilho em que se está agora. Nenhum território o reivindica.

   O comentário anterior prometia ΔE ≥ 25 entre territórios e a medição
   devolveu 23,9 (pulmão × geral) — e, pior, ΔE 7,0 entre `--pele` e
   `--atencao`, que são a cor de um território e a cor de um desfecho: o mesmo
   amarelo dizendo duas coisas. Territórios e estados agora vivem em famílias
   separadas, e os estados saíram do arco quente dos territórios. */
  --via:#4fb3a6; --pulmao:#3f9fc4; --rim:#e08a3c; --pele:#d9c04a;
  --nervo:#8878d6; --sangue:#c25fa8; --geral:#8d9aa8;
  --marca:#c2455e;

  --alerta:#e0574d; --certo:#5aa8d8; --atencao:#b98a2e;

  /* Uma sombra, em duas intensidades. Havia cinco, todas do mesmo desenho
     genérico (sem deslocamento horizontal, sem spread), para a mesma ideia. */
  --fundo1:0 18px 34px rgba(0,0,0,.44);
  --fundo2:0 30px 58px rgba(0,0,0,.55);

  --serifa:"Iowan Old Style",Charter,"Palatino Linotype",Palatino,
           "Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",
         Arial,sans-serif;
}

html,body{height:100%}
body{background:var(--preto);color:var(--gelo);font-family:var(--sans);
  overflow:hidden;perspective:1600px;perspective-origin:50% 46%}

/* ───────────────────────── o trilho de etapas ───────────────────────── */

#trilho{position:fixed;top:0;left:0;right:0;height:64px;z-index:30;
  display:flex;align-items:center;gap:22px;padding:0 40px;
  background:linear-gradient(var(--preto) 40%,transparent)}
#trilho .tt{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--fumaca);font-weight:700;white-space:nowrap}
#trilho .cnt{font-family:var(--sans);font-size:11.5px;font-weight:700;
  color:var(--nevoa);font-variant-numeric:tabular-nums;letter-spacing:.5px;
  margin-left:auto;white-space:nowrap}
#trilho .marcas{display:flex;gap:3px}
/* Uma marca por etapa, colorida pelo tipo: dá para ver quantas páginas faltam
   e onde caem as perguntas antes de chegar nelas. */
#trilho .marcas i{width:15px;height:4px;background:var(--linha);display:block;
  transition:background .25s,transform .25s}
#trilho .marcas i.m-pedido,#trilho .marcas i.m-pergunta,#trilho .marcas i.m-pareamento{background:#3b4552}
#trilho .marcas i.m-bifurcacao{background:#4d3a44}
#trilho .marcas i.m-desfecho{background:#4a3b34}
#trilho .marcas i.feita{background:var(--linha2);cursor:pointer}
#trilho .marcas i.feita.m-pedido,#trilho .marcas i.feita.m-pergunta,#trilho .marcas i.feita.m-pareamento{
  background:var(--pulmao);opacity:.55}
#trilho .marcas i.feita:hover{transform:scaleY(2)}
#trilho .marcas i.aqui{background:var(--marca);transform:scaleY(2)}

/* ───────────────────────── o pé ───────────────────────── */

#pe{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:30;
  display:flex;align-items:center;gap:18px;padding:0 40px;
  background:linear-gradient(transparent,var(--preto) 55%)}
#pe .rod{font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--sombra)}
#pe .nav{margin-left:auto;display:flex;gap:10px;align-items:center}
.bt{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;border:1px solid var(--linha2);background:none;
  color:var(--nevoa);padding:13px 22px;cursor:pointer;transition:.2s}
.bt:hover{color:var(--gelo);border-color:var(--nevoa)}
.bt.forte{background:var(--marca);border-color:var(--marca);color:#fff}
.bt.forte:hover{background:#d4506c;border-color:#d4506c}
.bt[disabled]{opacity:.28;cursor:default}
.bt[disabled]:hover{color:var(--nevoa);border-color:var(--linha2)}

/* ───────────────────────── a tela ───────────────────────── */

#palco{position:absolute;inset:0;transform-style:preserve-3d}
.tela{position:absolute;inset:0;transform-style:preserve-3d;
  opacity:0;pointer-events:none;transition:opacity .34s ease}
.tela.on{opacity:1;pointer-events:auto}

/* o chão: a imagem médica, recuada e escurecida até virar textura */
.fundo{position:absolute;inset:-5%;background-size:cover;background-position:center;
  filter:saturate(.5) contrast(1.2) brightness(.6);
  transform:translateZ(-340px) scale(1.28)}
.veu{position:absolute;inset:0}
.veu.esq{background:linear-gradient(95deg,rgba(8,9,11,.97) 0%,rgba(8,9,11,.93) 30%,
  rgba(8,9,11,.55) 52%,rgba(8,9,11,.18) 78%,rgba(8,9,11,.5) 100%)}
.veu.tudo{background:linear-gradient(rgba(8,9,11,.9),rgba(8,9,11,.94)),
  radial-gradient(90% 70% at 50% 40%,rgba(63,159,196,.1),transparent 65%)}
.veu.tudo.q-melhor{background:linear-gradient(rgba(8,9,11,.9),rgba(8,9,11,.95)),
  radial-gradient(90% 70% at 50% 40%,rgba(67,181,133,.14),transparent 65%)}
.veu.tudo.q-pior{background:linear-gradient(rgba(8,9,11,.9),rgba(8,9,11,.95)),
  radial-gradient(90% 70% at 50% 40%,rgba(224,87,77,.14),transparent 65%)}

/* ───────────────────────── plano de conteúdo ───────────────────────── */

/* Sem translateZ no que carrega texto: a perspectiva ampliava o plano por
   1,0458 e a mesma font-size saía em corpos diferentes conforme a tela. A
   profundidade fica para o fundo e para os cartões, que não têm prosa. */
/* O teto do plano é o espaço real entre o trilho (64 px) e o pé (76 px), com
   uma folga de respiro — e não uma fração da tela escolhida no olho. Era por
   isso que a capa rolava 14 px em tela baixa e não rolava em tela alta. */
/* `ch` deriva do font-size da raiz, que nunca muda: acima de ~1064 px de
   viewport o `76ch` sempre vencia e a peça parava de crescer — 766 px de
   coluna numa tela de 2560. Agora a coluna cresce com a tela e o teto é de
   medida de linha, não de pixel. */
/* `.plano` era centrado verticalmente e `.folha` ancorada no topo: o primeiro
   elemento de cada página caía em quinze alturas diferentes, com salto médio
   de 63 px e máximo de 131 px ao virar a folha. Numa peça folha-a-folha o
   título dançava na projeção a cada avanço. Agora as duas começam na mesma
   linha. */
.plano{position:absolute;left:var(--eixo);top:var(--teto);
  width:clamp(34ch,42vw,64ch);
  max-height:calc(100vh - var(--teto) - var(--rodape));
  overflow:auto;padding-right:10px}
.plano.centro{left:var(--eixo);width:clamp(48ch,64vw,88ch)}
/* três colunas não cabem em 76ch: a página da prescrição pede a tela toda */
.plano.centro:has(.grade.c3){width:min(120ch,calc(100vw - 2 * var(--eixo)))}
.plano::-webkit-scrollbar{width:3px}
.plano::-webkit-scrollbar-thumb{background:var(--linha2)}

.marca{display:flex;align-items:center;gap:11px;
  margin-bottom:clamp(11px,2vh,20px)}
.marca.larga{margin-bottom:clamp(12px,2.2vh,22px);flex-wrap:wrap}
.marca .sub-in{font-family:var(--sans);font-size:13.5px;font-weight:400;
  color:var(--nevoa);letter-spacing:0;text-transform:none;flex-basis:100%;
  margin-top:8px;max-width:78ch;line-height:1.5}
/* o rótulo promovido a título: mantém a marca vermelha e o corpo do h2 */
/* O filete sobe para cima do título, em vez de empurrá-lo 38 px para dentro:
   era a única página do caso cujo título não começava no eixo. */
h2.do-kicker{position:relative;padding-top:16px;
  margin-bottom:clamp(10px,1.7vh,16px)}
h2.do-kicker::before{content:"";position:absolute;left:0;top:0;width:26px;
  height:2px;background:var(--marca)}
.marca i{width:26px;height:2px;display:block;background:var(--marca)}
.marca span{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--nevoa);font-weight:700}

h1{font-family:var(--serifa);font-size:clamp(29px,1.7vw + 2vh,52px);
  line-height:1.05;font-weight:600;letter-spacing:-.6px;
  margin-bottom:clamp(11px,1.9vh,18px)}
h1 em{font-style:normal;color:var(--marca)}
h2{font-family:var(--serifa);font-size:clamp(23px,1.3vw + 1.5vh,38px);
  line-height:1.12;font-weight:600;letter-spacing:-.3px;
  margin-bottom:clamp(10px,1.7vh,16px)}
h3{font-family:var(--sans);font-size:11px;letter-spacing:1.9px;
  text-transform:uppercase;color:var(--nevoa);font-weight:800;
  margin:22px 0 10px}

p{font-family:var(--serifa);font-size:clamp(18.5px,.46vw + 1.58vh,24px);
  line-height:1.52;color:#c8d1da;margin-bottom:clamp(9px,1.4vh,15px)}
p:last-child{margin-bottom:0}
p.lede{font-size:clamp(21px,.55vw + 1.78vh,27px);line-height:1.45;color:#dbe2e9}
b,strong{color:var(--gelo);font-weight:600}
em,i{font-style:italic}
ul,ol{margin:0 0 14px 20px;font-family:var(--serifa);font-size:17.5px;
  line-height:1.5;color:#c3ccd6}
li{margin-bottom:7px}

/* números grandes, na cor do sistema */
.nums{display:flex;gap:0;border-top:1px solid var(--linha);
  border-bottom:1px solid var(--linha);margin:22px 0}
.nums div{padding:clamp(9px,1.6vh,15px) 26px clamp(9px,1.6vh,15px) 0;margin-right:26px;
  border-right:1px solid var(--linha)}
.nums div:last-child{border-right:none;margin-right:0}
.nums b{display:block;font-size:clamp(21px,2.9vh,27px);font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:12px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--fumaca);margin-top:6px}
.n-via b{color:var(--via)} .n-pulmao b{color:var(--pulmao)}
.n-rim b{color:var(--rim)} .n-pele b{color:var(--pele)}
.n-nervo b{color:var(--nervo)} .n-sangue b{color:var(--sangue)}
.n-geral b{color:var(--gelo)}

/* territórios */
.terrs{display:grid;gap:0 26px;margin-top:6px;
  font-size:clamp(13px,1.55vh,15px)}
.terrs.c1{grid-template-columns:1fr}
.terrs.c2{grid-template-columns:1fr 1fr}
.terr{display:grid;grid-template-columns:11px 1fr;gap:12px;
  padding:clamp(6px,1.2vh,11px) 0;border-top:1px solid var(--linha);
  align-items:start;
  transition:transform .2s}
.terr:hover{transform:translateZ(16px) translateX(3px)}
.terr i{width:9px;height:9px;border-radius:50%;margin-top:6px}
.terr b{display:block;font-family:var(--sans);font-size:10px;
  letter-spacing:1.7px;text-transform:uppercase;font-weight:800;margin-bottom:4px}
.terr span{display:block;font-family:var(--serifa);
  font-size:clamp(13px,1.6vh,15.5px);line-height:1.36;color:#b6c0cb}
.t-via i{background:var(--via)} .t-via b{color:var(--via)}
.t-pulmao i{background:var(--pulmao)} .t-pulmao b{color:var(--pulmao)}
.t-rim i{background:var(--rim)} .t-rim b{color:var(--rim)}
.t-pele i{background:var(--pele)} .t-pele b{color:var(--pele)}
.t-nervo i{background:var(--nervo)} .t-nervo b{color:var(--nervo)}
.t-sangue i{background:var(--sangue)} .t-sangue b{color:var(--sangue)}
.t-geral i{background:var(--geral)} .t-geral b{color:var(--geral)}

/* quadro */
.qd{border-left:3px solid var(--geral);
  padding:clamp(9px,1.4vh,14px) 0 clamp(9px,1.4vh,14px) 18px;
  margin:clamp(11px,1.8vh,18px) 0;
  background:linear-gradient(90deg,rgba(255,255,255,.04),transparent 70%)}
.qd>b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:1.8px;
  text-transform:uppercase;font-weight:800;margin-bottom:8px;color:var(--nevoa)}
.qd p{font-size:clamp(17px,.42vw + 1.4vh,21px);line-height:1.5}
.q-via{border-left-color:var(--via)} .q-via>b{color:var(--via)}
.q-pulmao{border-left-color:var(--pulmao)} .q-pulmao>b{color:var(--pulmao)}
.q-rim{border-left-color:var(--rim)} .q-rim>b{color:var(--rim)}
.q-pele{border-left-color:var(--pele)} .q-pele>b{color:var(--pele)}
.q-nervo{border-left-color:var(--nervo)} .q-nervo>b{color:var(--nervo)}
.q-sangue{border-left-color:var(--sangue)} .q-sangue>b{color:var(--sangue)}

/* tabela */
.tb{width:100%;border-collapse:collapse;margin:clamp(10px,1.6vh,16px) 0;
  font-family:var(--sans);
  font-size:13.5px}
.tb th{text-align:left;font-size:12px;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--fumaca);font-weight:800;
  padding:0 14px 8px 0;border-bottom:1px solid var(--linha2)}
.tb td{font-size:clamp(15px,1.85vh,18px);
  padding:clamp(7px,1.25vh,12px) 16px clamp(7px,1.25vh,12px) 0;
  border-bottom:1px solid var(--linha);
  color:#b6c0cb;line-height:1.42;vertical-align:top}

/* ───────────────────────── a lâmina ───────────────────────── */

.lamina{position:absolute;right:5.5vw;top:50%;width:31vw;height:60vh;
  transform:translateY(-50%) rotateY(-11deg) translateZ(30px);
  box-shadow:var(--fundo2),0 0 0 1px var(--linha);
  overflow:hidden;background:#000}
.lamina img{width:100%;height:100%;object-fit:cover;opacity:.94}
.lamina .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;
  background:linear-gradient(transparent,rgba(8,9,11,.95) 52%);
  font-size:11.5px;line-height:1.5;color:var(--nevoa)}
.lamina .cap b{display:block;color:var(--gelo);font-size:13.5px;
  margin-bottom:4px;letter-spacing:.3px;font-family:var(--sans);font-weight:700}
.lamina .cap .cr{display:block;color:var(--sombra);font-size:10.5px;margin-top:4px}

/* ───────────────────────── pedido de exames ───────────────────────── */

.folha{position:absolute;inset:0;
  padding:var(--teto) var(--eixo) var(--rodape);display:flex;
  flex-direction:column;transform-style:preserve-3d}
.folha h2{max-width:24ch;margin-bottom:8px}
.folha .sub{font-family:var(--sans);font-size:clamp(15.5px,2vh,18.5px);
  color:var(--nevoa);margin-bottom:clamp(13px,2.6vh,26px);max-width:70ch;
  line-height:1.5}

/* Catálogo de 30 exames com corpo de leitura não cabe em tela baixa, e a
   troca certa é rolar o catálogo, não encolher a letra. O contador fica preso
   embaixo, para não sumir com a rolagem. */
.grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));
  gap:clamp(10px,1.1vw,16px);
  align-content:start;transform-style:preserve-3d;overflow:auto;flex:1;
  padding-bottom:10px;
  mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.grupos::-webkit-scrollbar{height:3px}
.grupos::-webkit-scrollbar-thumb{background:var(--linha2)}
.gr{border:1px solid var(--linha);
  padding:clamp(9px,1.5vh,14px) clamp(10px,1vw,14px) clamp(4px,.8vh,7px);
  background:rgba(255,255,255,.035);
  transition:transform .24s cubic-bezier(.2,.7,.3,1),box-shadow .24s;
  transform-style:preserve-3d;align-self:start}
.gr:hover{transform:translateZ(24px) translateY(-3px);box-shadow:var(--fundo2)}
.gr>b{display:flex;align-items:center;gap:8px;font-size:10.5px;
  letter-spacing:1.7px;text-transform:uppercase;font-weight:800;
  margin-bottom:clamp(6px,1.1vh,10px);color:var(--nevoa)}
.gr>b i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.gr.g-via>b{color:var(--via)} .gr.g-via>b i{background:var(--via)}
.gr.g-via{border-top:2px solid var(--via)}
.gr.g-pulmao>b{color:var(--pulmao)} .gr.g-pulmao>b i{background:var(--pulmao)}
.gr.g-pulmao{border-top:2px solid var(--pulmao)}
.gr.g-rim>b{color:var(--rim)} .gr.g-rim>b i{background:var(--rim)}
.gr.g-rim{border-top:2px solid var(--rim)}
.gr.g-pele>b{color:var(--pele)} .gr.g-pele>b i{background:var(--pele)}
.gr.g-pele{border-top:2px solid var(--pele)}
.gr.g-nervo>b{color:var(--nervo)} .gr.g-nervo>b i{background:var(--nervo)}
.gr.g-nervo{border-top:2px solid var(--nervo)}
.gr.g-sangue>b{color:var(--sangue)} .gr.g-sangue>b i{background:var(--sangue)}
.gr.g-sangue{border-top:2px solid var(--sangue)}
.gr.g-geral{border-top:2px solid var(--geral)}

.it{display:flex;gap:11px;align-items:flex-start;padding:clamp(5px,.85vh,9px) 0;
  border-top:1px solid rgba(255,255,255,.06);cursor:pointer;user-select:none}
.it:first-of-type{border-top:none}
.cx{width:17px;height:17px;border:1.5px solid var(--fumaca);flex:0 0 auto;
  margin-top:3px;position:relative;transition:.15s}
.it:hover .cx{border-color:var(--gelo)}
.it.on .cx{background:var(--gelo);border-color:var(--gelo)}
.it.on .cx::after{content:"";position:absolute;left:5px;top:1px;width:5px;
  height:10px;border:solid var(--preto);border-width:0 2px 2px 0;
  transform:rotate(42deg)}
/* Marcado não é certo. O verde de acerto dizia as duas coisas na mesma peça,
   e na tela do pedido de exames ele parecia aprovar a escolha. */
.it .n{font-family:var(--serifa);font-size:clamp(16.5px,2.15vh,20.5px);
  line-height:1.26;color:#d2dae2}
.it.on .n{color:var(--gelo)}
.it .d{display:block;font-family:var(--sans);
  font-size:clamp(10px,1.25vh,11.5px);color:var(--fumaca);margin-top:3px;
  line-height:1.35}

/* O item além do teto não some nem fica proibido: fica recuado e inerte. Ver
   o que se está deixando de fora é parte da decisão — e por isso ele não pode
   ser esmaecido com `opacity`, que levava o nome do exame a 2,7:1 e a
   descrição a 1,87:1 de contraste. Recuo por cor sólida, medida. */
.it.bloq{cursor:default}
.it.bloq .n{color:#7d858f}
.it.bloq .d{color:#6a727c}
.it.bloq .cx{border-color:#4b525b}
.it.bloq:hover .cx{border-color:#4b525b}
.conta{font-family:var(--sans);font-size:12.5px;color:var(--nevoa);
  letter-spacing:.3px}
.conta b{color:var(--gelo);font-size:16px;font-weight:700}

/* ───────────────────────── resultados ───────────────────────── */

/* sem overflow: numa peça página a página, o que não cabe vira outra folha */
/* Coluna, não grade. Em grade, a linha inteira ganha a altura do cartão mais
   alto: o sedimento, que traz imagem, empurrava o vizinho de 60 px para 380 e
   abria um buraco no meio da tela — e ainda jogava o sexto cartão para fora.
   Em colunas, cada cartão ocupa a altura que tem e a folha fecha. */
.res{display:block;column-width:308px;column-gap:clamp(11px,1.2vw,18px);
  flex:0 1 auto;min-height:0;margin-block:auto}
.rc{break-inside:avoid;-webkit-column-break-inside:avoid;
  margin:0 0 clamp(9px,1.3vh,16px);display:block;width:100%}
.res::-webkit-scrollbar{width:3px}
.res::-webkit-scrollbar-thumb{background:var(--linha2)}
.rc{border:1px solid var(--linha);border-left:2px solid var(--linha2);
  padding:clamp(9px,1.3vh,14px) 16px;background:rgba(255,255,255,.028);
  transition:box-shadow .22s}
.rc:hover{box-shadow:var(--fundo1)}
.rc.alt{border-left-color:var(--alerta)}
.rc>b{display:block;font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.2px;margin-bottom:6px;color:var(--gelo)}
.rc.alt>b{color:var(--alerta)}
.rc .v{font-family:var(--sans);font-size:clamp(18.5px,2.3vh,22px);
  line-height:1.42;color:var(--gelo)}
.rc .v b{color:var(--gelo)}
.rc .v .ln{display:block;padding-left:13px;position:relative;
  font-size:clamp(16.5px,2.05vh,19.5px);line-height:1.4;margin-bottom:5px}
.rc .v .ln::before{content:"";position:absolute;left:0;top:.62em;width:5px;
  height:1px;background:var(--linha2)}
.rc .rf{display:block;font-size:11px;color:var(--sombra);margin-top:6px;
  letter-spacing:.2px}
.rc figure{margin:12px -16px -14px;background:#000}
/* Medido: a foto tinha brilho médio 196 e o achado clínico ao lado, 56. Numa
   sala escura o olho vai para o mais claro — ia para uma imagem ilustrativa
   do Wikimedia enquanto o professor falava do título do ANCA. */
/* `contain`, não `cover`: radiografia cortada pelas bordas perde o seio
   costofrênico, que é metade do que se olha nela. */
.rc figure img{width:100%;height:clamp(110px,15vh,182px);object-fit:contain;
  display:block;filter:brightness(.72) contrast(1.06) saturate(.85)}
.rc figcaption{padding:8px 16px 10px;font-size:10.5px;line-height:1.4;
  color:var(--fumaca)}
.vazio{font-family:var(--serifa);font-size:19px;color:var(--nevoa);
  line-height:1.55;max-width:52ch;padding:30px 0}

/* ───────────────────────── pergunta ───────────────────────── */

/* Ler a pergunta inteira sem rolar é requisito, não conforto: numa sala, quem
   rola a página perde as alternativas de vista antes de comparar, e a última
   alternativa — que estava cortada — deixa de existir na discussão. Por isso
   tudo aqui é medido em altura de tela: o enunciado, o intervalo entre as
   alternativas e o corpo de cada uma encolhem juntos quando a tela é baixa. */
.folha.q{padding-top:clamp(74px,9vh,96px);padding-bottom:clamp(84px,10vh,96px)}
.enun{font-family:var(--serifa);font-size:clamp(23px,1.1vw + 1.78vh,38px);
  line-height:1.24;font-weight:600;max-width:46ch;margin-bottom:6px}
.qdica{font-family:var(--sans);font-size:11.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--fumaca);
  margin-bottom:clamp(10px,1.8vh,22px)}
/* Antes de confirmar, rolar é proibido: quem não vê as dez alternativas ao
   mesmo tempo não consegue comparar. Depois de confirmar, os comentários são
   texto sequencial e podem rolar — e é o que permite que eles tenham corpo de
   leitura em vez dos 9,8 px a que estavam reduzidos. */
.alts{list-style:none;margin:0;display:flex;flex-direction:column;
  gap:clamp(7px,1.1vh,15px);
  max-width:126ch;overflow:hidden;flex:1;transform-style:preserve-3d;
  padding-bottom:4px}
.alts.feita{overflow:auto;padding-right:8px}
.alts::-webkit-scrollbar{width:3px}
.alts::-webkit-scrollbar-thumb{background:var(--linha2)}
.alts li{display:grid;grid-template-columns:30px minmax(0,1fr);
  gap:clamp(10px,1.1vw,16px);align-items:start;
  border:1px solid var(--linha);
  padding:clamp(8px,1.3vh,18px) clamp(14px,1.4vw,24px);cursor:pointer;
  background:rgba(255,255,255,.035);
  transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
.alts li:hover{transform:translateZ(18px);border-color:var(--linha2);
  box-shadow:var(--fundo1)}
.alts .k{font-family:var(--sans);font-size:13px;font-weight:800;
  color:var(--fumaca);letter-spacing:1px;padding-top:2px}
.alts .tx{font-family:var(--serifa);font-size:clamp(18.5px,.46vw + 1.55vh,25px);
  line-height:1.28;color:#d2dae2}
/* Depois de confirmar, o comentário vai para uma TERCEIRA coluna, ao lado da
   alternativa, em vez de crescer por baixo dela. Empilhado, cinco comentários
   dobravam a altura da lista e devolviam a rolagem que a pergunta acabou de
   perder. */
.alts .cm{display:none;font-family:var(--sans);
  font-size:clamp(15.5px,.33vw + 1.28vh,19px);line-height:1.46;
  color:var(--nevoa)}
.alts.feita li{grid-template-columns:30px minmax(0,1fr) minmax(0,1.02fr)}
.alts.feita .tx{font-size:clamp(17.5px,.44vw + 1.45vh,23px)}
.alts.feita li{padding-block:clamp(7px,1.1vh,15px)}
.alts.feita{gap:clamp(6px,.9vh,12px)}
.alts.feita .cm{padding-left:clamp(12px,1.2vw,20px);
  border-left:1px solid var(--linha)}
.alts.feita li{cursor:default}
.alts.feita li:hover{transform:none;box-shadow:none}
.alts.feita .cm{display:block}
.alts.feita li{position:relative}
.alts.feita li.certa{border-color:var(--certo);
  background:rgba(90,168,216,.07);box-shadow:inset 3px 0 0 var(--certo)}
.alts.feita li.certa .k{color:var(--certo)}
.alts.feita li.certa .k::after{content:"certa";display:block;font-size:9px;
  letter-spacing:1.2px;margin-top:4px;font-weight:800}
.alts.feita li.errada.marcada{border-color:var(--alerta);
  box-shadow:inset 3px 0 0 var(--alerta)}
.alts.feita li.errada.marcada .k{color:var(--alerta)}
.alts.feita li.errada.marcada .k::after{content:"sua";display:block;
  font-size:9px;letter-spacing:1.2px;margin-top:4px;font-weight:800}
.alts.feita li.errada:not(.marcada) .tx{color:#a9b1bb}
.alts.feita li.errada:not(.marcada) .cm{color:#96a0ab}
/* Confirmar é um gesto à parte: marcar ainda é discussão, confirmar é a
   resposta. Enquanto não se confirma, dá para trocar de alternativa. */
.conf{align-self:flex-start;margin-top:18px;font-family:var(--sans);
  font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  background:var(--marca);border:1px solid var(--marca);color:#fff;
  padding:13px 26px;cursor:pointer;transition:.2s}
.conf:hover{background:#d4506c;border-color:#d4506c}
.conf[disabled]{background:none;border-color:var(--linha2);color:var(--fumaca);
  cursor:default}
.alts li.marcada:not(.feita){border-color:var(--nevoa)}
.alts:not(.feita) li.marcada{border-color:var(--gelo);
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03))}
.resposta{display:none;font-family:var(--serifa);font-size:20px;
  color:var(--gelo);margin:0 0 18px;padding-left:16px;
  border-left:3px solid var(--certo)}
.resposta.on{display:block}

/* ───────────────────────── bifurcação ───────────────────────── */

.cams{display:grid;gap:clamp(8px,1.3vh,16px);align-content:start;
  flex:0 1 auto;min-height:0;transform-style:preserve-3d;overflow:auto;
  max-width:118ch;margin-block:auto}
.cam{border:1px solid var(--linha);border-left:3px solid var(--marca);
  padding:clamp(11px,1.8vh,20px) clamp(16px,1.6vw,24px);cursor:pointer;
  background:rgba(255,255,255,.035);
  transition:transform .24s cubic-bezier(.2,.7,.3,1),box-shadow .24s}
.cam:hover{transform:translateZ(30px) translateX(5px);
  box-shadow:var(--fundo2)}
.cam .l{font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:1.8px;color:var(--marca);margin-bottom:5px;display:block}
.cam .r{font-family:var(--serifa);font-size:clamp(19.5px,.54vw + 1.7vh,26px);
  line-height:1.26;color:var(--gelo);display:block}
.cam .c{display:none;font-family:var(--sans);
  font-size:clamp(15.5px,.31vw + 1.28vh,18.5px);line-height:1.5;
  color:var(--nevoa);margin-top:clamp(7px,1.2vh,12px);
  padding-top:clamp(7px,1.2vh,12px);border-top:1px solid var(--linha)}
.cams.feita .cam{cursor:default}
.cams.feita .cam:hover{transform:none;box-shadow:none}
.cams.feita .cam .c{display:block}
.cams.feita .cam:not(.escolhido){border-left-color:var(--linha2);
  background:rgba(255,255,255,.018)}
.cams.feita .cam:not(.escolhido) .l{color:var(--fumaca)}
.cams.feita .cam:not(.escolhido) .r{color:#aeb6c0}
.cams.feita .cam:not(.escolhido) .c{color:#98a1ac}
.cams.feita .cam.escolhido{border-left-width:5px}
.cams.feita .cam.escolhido .l::after{content:" — escolhido"}

/* ───────────────────────── desfecho ───────────────────────── */

.fim{position:absolute;inset:0;padding:96px var(--eixo) 96px;display:flex;
  flex-direction:column;justify-content:center;transform-style:preserve-3d}
.fim .caixa{max-width:78ch}
.ress{font-family:var(--sans);font-size:clamp(9.5px,1.15vh,11px);
  line-height:1.45;color:var(--sombra);
  margin-top:clamp(10px,1.9vh,20px);padding-top:clamp(8px,1.4vh,14px);
  border-top:1px solid var(--linha);max-width:62ch}
.fim h1{border-bottom:4px solid var(--linha2);padding-bottom:20px;
  margin-bottom:22px}
.fim.melhor h1{border-bottom-color:var(--certo)}
.fim.medio h1{border-bottom-color:var(--atencao)}
.fim.pior h1{border-bottom-color:var(--alerta)}
.porque{margin:24px 0;padding:18px 0 0;border-top:1px solid var(--linha)}
.porque>b{display:block;font-family:var(--sans);font-size:10.5px;
  letter-spacing:1.8px;text-transform:uppercase;color:var(--nevoa);
  font-weight:800;margin-bottom:9px}

/* revisão do fim */
.rev{max-width:82ch;overflow:auto;flex:1;padding-top:4px}
.rev::-webkit-scrollbar{width:3px}
.rev::-webkit-scrollbar-thumb{background:var(--linha2)}
.rev .li{padding:14px 0;border-bottom:1px solid var(--linha)}
.rev .li b{font-family:var(--serifa);font-size:19px;color:var(--gelo);
  display:block;margin-bottom:5px}
.rev .li p{font-family:var(--sans);font-size:13.5px;color:var(--nevoa);
  line-height:1.5;margin:0}
.rev .ok{font-family:var(--serifa);font-size:21px;color:var(--certo);
  padding:16px 0}

/* ───────────────────────── projetor pequeno ───────────────────────── */

@media (max-width:1280px){
  .plano{width:min(52ch,52vw)}
  .lamina{width:34vw;height:52vh}
  .grupos{grid-template-columns:repeat(2,1fr)}
  .folha{padding-left:4vw;padding-right:4vw}
}

/* ───────────────────── o boneco e a figura anotada ───────────────────── */

/* O boneco não é ilustração: é o resumo espacial do exame físico. Cinco
   territórios acometidos, listados em prosa, exigem que o leitor monte o mapa
   na cabeça; desenhados, o mapa já está montado, e a pergunta seguinte — o que
   esses cinco compartilham — passa a ter uma figura para apontar. */
.corpo{display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(18px,2.4vw,34px);align-items:center;margin-top:6px}
.corpo svg{display:block;height:var(--ch,340px);width:auto}
.corpo .lg{display:flex;flex-direction:column}
.corpo .lt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;
  align-items:baseline;padding:clamp(6px,1.1vh,11px) 0;
  border-top:1px solid var(--linha)}
.corpo .lt:first-child{border-top:none}
.corpo .lt b{font-family:var(--sans);font-size:12px;font-weight:800;
  text-align:center;line-height:1.5;border-radius:50%;
  color:#0b0e12;background:var(--geral)}
.corpo .lt .nm{display:block;font-family:var(--sans);font-size:10.5px;
  letter-spacing:1.7px;text-transform:uppercase;font-weight:700;
  margin-bottom:3px}
.corpo .lt .ds{display:block;font-family:var(--serifa);
  font-size:clamp(14px,.35vw + 1vh,16.5px);line-height:1.4;color:var(--nevoa)}
.corpo .lt.t-via b{background:var(--via)}       .corpo .lt.t-via .nm{color:var(--via)}
.corpo .lt.t-pulmao b{background:var(--pulmao)} .corpo .lt.t-pulmao .nm{color:var(--pulmao)}
.corpo .lt.t-rim b{background:var(--rim)}       .corpo .lt.t-rim .nm{color:var(--rim)}
.corpo .lt.t-pele b{background:var(--pele)}     .corpo .lt.t-pele .nm{color:var(--pele)}
.corpo .lt.t-nervo b{background:var(--nervo)}   .corpo .lt.t-nervo .nm{color:var(--nervo)}
.corpo .lt.t-sangue b{background:var(--sangue)} .corpo .lt.t-sangue .nm{color:var(--sangue)}

/* A fotografia com seta substitui o esquema autoral onde a imagem real existe.
   Duas camadas em cada traço — uma escura larga por baixo, a clara fina por
   cima — porque anotação de traço único desaparece assim que passa de um campo
   claro para um escuro, e em histologia isso acontece a cada 20 pixels. */
.anot{margin:clamp(10px,1.6vh,18px) 0 0;background:#05070a;
  border:1px solid var(--linha)}
.anot svg{display:block;width:100%;height:auto;max-height:52vh}
.anot image{filter:brightness(.9) saturate(.92)}
.anot .an .fio{fill:none;stroke-linecap:round}
.anot .an .halo{stroke:#0a0c10;stroke-width:9;stroke-opacity:.8}
.anot .an .luz{stroke:#f0c260;stroke-width:3.6}
.anot .an .ponta{fill:#f0c260;stroke:#0a0c10;stroke-width:2.4;
  paint-order:stroke}
.anot .an .rot{font-family:-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:34px;font-weight:700;letter-spacing:.3px;fill:#fbeed2;
  stroke:#0a0c10;stroke-width:7;paint-order:stroke}
.anot .an{stroke-linejoin:round}
.anot figcaption{padding:11px 16px 13px;font-family:var(--sans);font-size:11.5px;
  line-height:1.5;color:var(--fumaca);border-top:1px solid var(--linha)}
.anot figcaption b{display:block;color:var(--gelo);font-size:12px;
  letter-spacing:.3px;margin-bottom:3px}
.anot figcaption .cr{display:block;margin-top:5px;color:var(--sombra);
  font-size:10.5px}

/* ───────────────────── a bifurcação, dita em voz alta ───────────────── */

/* Sem esta linha o caso ramificava sem que ninguém visse: as justificativas
   abriam, a página virava, e nada dizia que o rumo tinha mudado. */
.forca{display:flex;align-items:center;gap:12px;
  margin-top:clamp(10px,1.7vh,18px);padding-top:clamp(9px,1.5vh,16px);
  border-top:1px solid var(--linha);flex:0 0 auto}
.forca i{width:26px;height:4px;background:var(--linha2);display:block}
.forca i.on{background:var(--marca);height:6px}
.forca span{font-family:var(--sans);font-size:12.5px;line-height:1.5;
  color:var(--nevoa);max-width:82ch}

/* ─────────────────── blocos lado a lado ─────────────────── */

/* Altura é o recurso escasso de uma peça que não rola. */
.grade{display:grid;gap:clamp(9px,1.2vw,16px);align-items:start;
  margin-top:clamp(6px,1vh,12px)}
.grade.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
/* quando a primeira coluna é a figura, ela manda: microscopia lida em meia
   coluna de 370 px é decoração, não evidência */
.grade.c2:has(>div>.anot:first-child){grid-template-columns:1.3fr 1fr}
.grade.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grade>div>*:first-child{margin-top:0}
.grade .qd{margin:0 0 clamp(4px,.7vh,8px)}
.grade>div>.qd:last-child{margin-bottom:0}
.grade .anot{margin:0}
@media (max-width:900px){.grade.c2,.grade.c3{grid-template-columns:1fr}}

/* Datashow de sala de aula costuma ser 1280×720. Nessa altura a margem
   generosa vira rolagem: ela encolhe, e o conteúdo ganha a largura de volta —
   menos quebra de linha por coluna é menos altura. */
@media (max-height:820px){
  :root{--eixo:52px}
  #trilho{height:54px;padding:0 26px}
  #pe{height:64px}
  .rc figure figcaption{display:none}
}

/* ───────────────────────── a capa ───────────────────────── */

/* Título e imagem. A imagem sobe do chão: aqui ela não é textura, é a
   fotografia de abertura. */
.capa-fundo{filter:brightness(.62) saturate(.9) blur(0);transform:none;
  background-position:center right;background-size:cover}
.veu.capa-veu{background:
  linear-gradient(100deg,var(--preto) 0 26%,rgba(8,9,11,.86) 46%,
  rgba(8,9,11,.25) 70%,rgba(8,9,11,.55) 100%)}
.abertura{position:absolute;left:var(--eixo);bottom:clamp(96px,14vh,150px);
  width:min(46ch,52vw)}
.abertura h1{font-size:clamp(34px,2.1vw + 2.4vh,62px);margin-bottom:0}
.abertura .selo{margin-top:clamp(14px,2.4vh,22px);padding-top:clamp(11px,1.8vh,16px);
  border-top:1px solid var(--linha);font-family:var(--sans);font-size:11px;
  letter-spacing:2.2px;text-transform:uppercase;color:var(--sombra);
  font-weight:700}

/* ───────────────────────── a lupa ───────────────────────── */

.lupa{position:fixed;inset:0;z-index:80;background:rgba(4,5,7,.94);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(40px,7vh,72px) clamp(24px,5vw,90px);cursor:zoom-out;
  animation:surge .18s ease-out}
@keyframes surge{from{opacity:0}to{opacity:1}}
.lupa .quadro{max-width:min(1500px,94vw);max-height:88vh;overflow:auto;
  cursor:default}
.lupa figure{margin:0;background:#05070a;border:1px solid var(--linha)}
.lupa figure img{display:block;width:auto;max-width:100%;
  max-height:calc(88vh - 130px);object-fit:contain;filter:none;height:auto}
.lupa figure svg{display:block;width:auto;max-width:100%;
  max-height:calc(88vh - 130px)}
.lupa figcaption,.lupa .cap{display:block;padding:16px 22px 18px;
  font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--nevoa);
  border-top:1px solid var(--linha);max-width:none;position:static;
  background:none;transform:none;width:auto}
.lupa .cap b{display:block;color:var(--gelo);font-size:14px;margin-bottom:5px}
.lupa .cr{display:block;margin-top:7px;color:var(--sombra);font-size:11.5px}
.lupa .fechar{position:fixed;top:20px;right:26px;font-family:var(--sans);
  font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  background:none;border:1px solid var(--linha2);color:var(--nevoa);
  padding:10px 18px;cursor:pointer;transition:.18s}
.lupa .fechar:hover{border-color:var(--gelo);color:var(--gelo)}
#palco figure.amplia{cursor:zoom-in}
/* `position:relative` só onde a figura AINDA NÃO é posicionada. A regra
   anterior era `#palco figure.amplia{position:relative}` sem ressalva, e o
   seletor com id vencia por especificidade o `.lamina{position:absolute}`:
   a lâmina saía do canto direito e caía por cima da prosa, na primeira
   página do caso. */
#palco figure.amplia:not(.lamina){position:relative}
#palco figure.amplia::after{content:"⤢";position:absolute;right:9px;bottom:9px;
  width:26px;height:26px;line-height:26px;text-align:center;font-size:13px;
  background:rgba(8,9,11,.72);color:var(--nevoa);opacity:0;transition:opacity .2s;
  border:1px solid var(--linha);z-index:2}
#palco figure.amplia:hover::after{opacity:1}

/* O botão que revela o laudo. Ele fica no lugar exato onde o texto vai
   aparecer, para que a folha não pule quando o laudo abre. */
.verlaudo{margin-top:10px;font-family:var(--sans);font-size:11px;font-weight:700;
  letter-spacing:1.6px;text-transform:uppercase;background:none;
  border:1px solid var(--linha2);color:var(--nevoa);padding:9px 14px;
  cursor:pointer;transition:.18s;width:100%}
.verlaudo:hover{border-color:var(--gelo);color:var(--gelo);
  background:rgba(255,255,255,.05)}
.rc figure{margin:12px -16px 0;background:#000}

/* O exame que ainda não se justifica: visível, travado, e com o motivo. */
.it.trava{cursor:not-allowed}
.it.trava .n{color:#6f767f}
.it.trava .cx{border-color:#3c434b;background:repeating-linear-gradient(
  -45deg,transparent 0 3px,rgba(255,255,255,.07) 3px 6px)}
.it.trava .trv{color:var(--atencao);margin-top:4px;font-style:italic}

/* ───────────────────── o balanço da condução ───────────────────── */

.bal{margin-top:clamp(10px,1.6vh,18px);display:flex;flex-direction:column;
  min-height:0;flex:1}
.placar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.placar>div{padding:clamp(11px,1.8vh,18px) 22px clamp(11px,1.8vh,18px) 0;
  border-right:1px solid var(--linha)}
.placar>div:last-child{border-right:none}
.placar b{display:block;font-size:clamp(24px,3.4vh,34px);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;color:var(--gelo)}
.placar span{display:block;font-size:10.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--fumaca);margin-top:7px;font-weight:700}
.placar .ideal b{color:var(--certo)}
.cons{margin-top:clamp(10px,1.6vh,18px);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:clamp(9px,1.3vh,16px);overflow:auto;min-height:0}
.cn{border-left:3px solid var(--alerta);padding:12px 0 12px 16px}
.cn.limpo{border-left-color:var(--certo)}
.cn>b{display:block;font-family:var(--sans);font-size:12.5px;font-weight:700;
  color:var(--gelo);margin-bottom:5px;line-height:1.35}
.cn .pr{display:block;font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--alerta);
  margin-bottom:7px}
.cn p{font-size:clamp(15px,.31vw + 1.18vh,18px);line-height:1.46}
.placar .grave b{color:var(--alerta)}
.placar .grave span{color:var(--alerta)}

/* A pergunta de múltipla seleção do New England tem oito, nove, dez itens —
   e cada item é o nome de uma doença, não uma frase. Em coluna única ela não
   cabe; em duas, sobra espaço. */
.alts.muitas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  align-content:start;gap:clamp(6px,.9vh,12px) clamp(10px,1.2vw,18px)}
.alts.muitas li{grid-template-columns:26px minmax(0,1fr)}
.alts.muitas .tx{font-size:clamp(17px,.4vw + 1.4vh,22px)}
.alts.muitas.feita li{grid-template-columns:26px minmax(0,1fr)}
.alts.muitas.feita .cm{grid-column:2;padding-left:0;border-left:none;
  margin-top:7px;padding-top:7px;border-top:1px solid var(--linha);
  font-size:clamp(15px,.31vw + 1.24vh,18px);line-height:1.45}
.alts.muitas.feita li{padding-block:clamp(6px,.85vh,11px)}
.alts.muitas.feita{gap:clamp(5px,.7vh,9px) clamp(10px,1.2vw,18px)}
.alts.muitas.feita .tx{font-size:clamp(17px,.4vw + 1.4vh,22px);
  line-height:1.26}
@media (max-width:900px){.alts.muitas{grid-template-columns:1fr}}

/* Enunciado curto e dez alternativas: o cabeçalho cede altura para a lista. */
.folha.q.densa .enun{font-size:clamp(17px,.75vw + 1.1vh,26px);max-width:64ch;
  margin-bottom:4px}
.folha.q.densa .qdica{margin-bottom:clamp(7px,1.1vh,14px)}
.folha.q.densa .marca{margin-bottom:clamp(8px,1.4vh,14px)}

/* Sob a figura, só o crédito. A descrição vem no clique, com o valor. */
.rc figcaption.soc{padding:7px 16px 9px;font-size:10.5px;color:var(--sombra)}
.leglaudo{margin-top:9px;padding-top:9px;border-top:1px solid var(--linha);
  font-family:var(--sans);font-size:11.5px;line-height:1.45;color:var(--fumaca)}

/* Num caso que termina em óbito, contar dias de internação seria obsceno. */
.placar.obito{grid-template-columns:1fr;border-color:var(--alerta)}
.placar.obito .cheio{border-right:none;padding-right:0}
.placar.obito b{color:var(--alerta);font-family:var(--serifa);
  font-size:clamp(28px,4vh,42px);font-weight:600;letter-spacing:-.5px}
.placar.obito span{text-transform:none;letter-spacing:0;font-weight:400;
  font-family:var(--serifa);font-size:clamp(14px,1.7vh,17px);color:#c3ccd6;
  line-height:1.45;max-width:80ch;margin-top:10px}

/* ───────────────── sinais vitais e exame por aparelho ───────────────── */

/* Os vitais num quadro, e não diluídos na prosa: ninguém volta a um parágrafo
   para conferir a frequência respiratória discutindo o caso em pé. */
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
  margin:clamp(8px,1.4vh,16px) 0 clamp(12px,2vh,20px)}
.vit>div{padding:clamp(9px,1.5vh,14px) 18px clamp(9px,1.5vh,14px) 0;
  border-right:1px solid var(--linha)}
.vit>div:last-child{border-right:none}
.vit>div>b{display:block;font-family:var(--sans);font-size:clamp(20px,2.6vh,26px);
  font-weight:700;line-height:1;color:var(--gelo);
  font-variant-numeric:tabular-nums}
.vit>div.alt>b{color:var(--alerta)}
.vit span{display:block;font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--fumaca);margin-top:7px;font-weight:700}

.tops{display:flex;flex-direction:column}
.tops>div{padding:clamp(7px,1.2vh,11px) 0;border-top:1px solid var(--linha)}
.tops>div:first-child{border-top:none;padding-top:0}
/* Só o RÓTULO do aparelho leva o tratamento de maiúsculas. `b` solto pegava
   também o negrito de dentro da prosa, e "palidez cutâneo-mucosa acentuada"
   virava um cabeçalho no meio do parágrafo. */
.tops>div>b{display:block;font-family:var(--sans);font-size:10.5px;
  letter-spacing:1.9px;text-transform:uppercase;font-weight:800;
  color:var(--nevoa);margin-bottom:5px}
.tops p b{color:var(--gelo);font-weight:600}
.tops p{font-size:clamp(16.5px,.39vw + 1.35vh,20.5px);line-height:1.46;
  margin-bottom:0}

/* o boneco só com os marcadores, quando o achado está na lista ao lado */
.corpo.curto{grid-template-columns:auto auto;gap:clamp(14px,1.8vw,24px)}
.corpo.curto .lt{grid-template-columns:20px auto;padding:clamp(4px,.8vh,7px) 0}
.corpo.curto .lt .nm{margin-bottom:0;white-space:nowrap}

/* Sistema editorial compartilhado pelas três apresentações. */
:root{--preto:#101b22;--carvao:#16242d;--grafite:#20333e;--linha:#40545f;--linha2:#667d88;--gelo:#f4f1e8;--nevoa:#c0cbd0;--fumaca:#a7b8c0;--sombra:#9aadb7;--marca:#a8d8c5;--alerta:#f0a18f;--certo:#add2e4;--atencao:#e0bd7d;--eixo:clamp(24px,4.5vw,84px);--teto:100px;--rodape:94px;--fundo1:none;--fundo2:none}

.vit{background:#1b2e38;border:1px solid var(--linha);border-radius:12px;overflow:hidden;margin:16px 0 20px}.vit>div{padding:14px}.vit>div>b{font-size:clamp(19px,1.6vw,25px);line-height:1.15}.vit span{font-size:12px;letter-spacing:0;text-transform:none}

<script type="application/json" id="dados">{"caso": {"titulo": "Depois da travessia", "rodape": "Paciente ficcional · evoluções simuladas para ensino · versão de 23/09 08:44", "sistemas": {"via": "via aérea superior", "pulmao": "pulmão", "rim": "rim", "pele": "pele", "nervo": "nervo periférico", "sangue": "sangue", "geral": "sistêmico"}}, "etapas": [{"t": "capa", "k": "capa", "tt": "Depois da travessia", "fundo": "", "kicker": "Caso interativo", "selo": "", "proc": "Paciente ficcional. Curso autoral e simulado."}, {"t": "pagina", "k": "historia", "kicker": "Apresentação", "tt": "", "corpo": "<p>Helena, 58 anos, retorna ao hospital por seis dias de diarreia e cansaço. Fez transplante renal há quatro meses e vinha retomando as atividades da casa. Nos últimos dois dias apresentou febre de até 38,4 °C e deixou de conseguir completar as refeições.<\/p><p>Tem seis a oito evacuações aquosas por dia, inclusive durante a noite, acompanhadas de cólicas. Não observou sangue. A família acredita que algum medicamento esteja irritando o intestino.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "hda", "kicker": "História da doença atual", "tt": "", "corpo": "<p>No começo, a diarreia ocorria apenas após as refeições. Agora persiste mesmo com baixa ingestão. Não há vômitos, dor localizada no enxerto, ardor para urinar, tosse ou falta de ar. Perdeu 2 kg nesta semana e percebeu redução da diurese.<\/p><p>Ninguém em casa está doente. Nega viagens recentes, água não tratada ou alimento suspeito. Recebeu amoxicilina-clavulanato para sinusite cinco semanas antes.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "antecedentes", "kicker": "Transplante e medicações", "tt": "", "corpo": "<p>Doença renal terminal atribuída a diabetes e hipertensão, com três anos de hemodiálise antes do transplante de doador falecido. Creatinina basal após o procedimento: 1,2 mg/dL. Não houve episódio documentado de rejeição.<\/p><p>Usa tacrolimo, micofenolato mofetil e prednisona, além de insulina, anlodipino e profilaxia para pneumocistose. A profilaxia antiviral foi encerrada conforme o protocolo da equipe após três meses. A paciente era soropositiva para CMV antes do transplante. Não mudou as doses por conta própria.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "exame", "kicker": "Exame físico", "tt": "", "corpo": "<div class=\"vit\"><div><b>100/62 mmHg<\/b><span>PA<\/span><\/div><div class=alt><b>108 bpm<\/b><span>FC<\/span><\/div><div><b>18 irpm<\/b><span>FR<\/span><\/div><div class=alt><b>38,2 °C<\/b><span>Temperatura<\/span><\/div><div><b>97% em ar ambiente<\/b><span>SpO₂<\/span><\/div><\/div><div class=\"tops\"><div><b>Estado geral<\/b><p>Alerta, mucosas secas, enchimento capilar preservado.<\/p><\/div><div><b>Cardiopulmonar<\/b><p>Taquicardia regular, sem sopro; ausculta pulmonar normal.<\/p><\/div><div><b>Abdome<\/b><p>Dolorimento difuso leve, sem defesa. Enxerto na fossa ilíaca direita indolor.<\/p><\/div><div><b>Pele e neurologia<\/b><p>Sem exantema ou déficit focal. Não há edema.<\/p><\/div><\/div>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p1", "kicker": "Pergunta 1", "enunciado": "Qual estratégia inicial melhor combina o risco infeccioso com as causas medicamentosas da diarreia?", "alts": [{"t": "Suspender todos os imunossupressores e aguardar resolução", "c": "Expõe o enxerto à rejeição; mudanças devem ser individualizadas com a equipe de transplante.", "ok": 0}, {"t": "Hidratar, colher exames e investigar infecção, revisando níveis e toxicidade das medicações", "c": "As duas possibilidades podem coexistir e a desidratação altera a função renal e a exposição a fármacos.", "ok": 1}, {"t": "Atribuir o quadro ao micofenolato pela frequência desse efeito adverso", "c": "Febre e repercussão sistêmica exigem avaliar infecção antes de encerrar o raciocínio.", "ok": 0}, {"t": "Tratar rejeição com pulso de corticoide a partir da redução da diurese", "c": "Oligúria neste contexto pode decorrer de hipovolemia ou toxicidade e não confirma rejeição.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "Discussão", "nota": "", "segue": ""}, {"t": "resultados", "k": "res1", "kicker": "Investigação", "tt": "Admissão", "de": "", "fundo": "", "intro": "A equipe solicita hemoculturas, pesquisa de patógenos nas fezes e quantificação de CMV no plasma.", "nota": "", "laminas": {}, "todos": ["Hemoglobina", "Leucócitos", "Neutrófilos", "Plaquetas", "Creatinina", "Potássio", "AST / ALT", "Tacrolimo — vale"], "sobre": {"Hemoglobina": {"n": "Hemoglobina", "r": "10,1 g/dL", "ref": "12–16 g/dL", "a": 1}, "Leucócitos": {"n": "Leucócitos", "r": "2.100/mm³", "ref": "4.000–11.000/mm³", "a": 1}, "Neutrófilos": {"n": "Neutrófilos", "r": "1.200/mm³", "ref": "1.500–7.500/mm³", "a": 1}, "Plaquetas": {"n": "Plaquetas", "r": "112.000/mm³", "ref": "150.000–400.000/mm³", "a": 1}, "Creatinina": {"n": "Creatinina", "r": "2,1 mg/dL (basal 1,2)", "ref": "0,6–1,1 mg/dL", "a": 1}, "Potássio": {"n": "Potássio", "r": "4,6 mmol/L", "ref": "3,5–5,0 mmol/L", "a": 0}, "AST / ALT": {"n": "AST / ALT", "r": "62 / 71 U/L", "ref": "até 35 / 35 U/L", "a": 1}, "Tacrolimo — vale": {"n": "Tacrolimo — vale", "r": "14 ng/mL", "ref": "Alvo individual: 5–8 ng/mL", "a": 1}}, "rota": null}, {"t": "pagina", "k": "evolucao1", "kicker": "Após hidratação", "tt": "", "corpo": "<p>A pressão melhora e a creatinina cai para 1,6 mg/dL. A ultrassonografia do enxerto, realizada pela equipe, não mostra obstrução ou alteração vascular relevante. A dose do tacrolimo é revista conforme seu nível e a função renal.<\/p><p>A febre e a diarreia persistem. Hemoculturas permanecem negativas. A investigação para Clostridioides difficile e o painel de patógenos entéricos comuns são negativos.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "rx", "kicker": "Avaliação torácica", "tt": "", "corpo": "<p>A radiografia, obtida durante a investigação da febre, não mostra infiltrado. A saturação permanece normal. A avaliação se concentra na síndrome gastrointestinal com citopenias.<\/p>", "fundo": "", "lamina": {"img": "rx_torax_normal.jpg", "tt": "Radiografia de tórax", "lg": "Figura comparativa de outro paciente; não é registro de Helena.", "cr": "Mikael Häggström · Wikimedia Commons · CC0"}, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p2", "kicker": "Pergunta 2", "enunciado": "A creatinina melhorou, mas a diarreia, a febre e as citopenias persistem. Quais duas interpretações são adequadas?", "alts": [{"t": "O nível alto de tacrolimo explica necessariamente todo o quadro", "c": "Pode contribuir para a lesão renal, mas não deve encerrar a investigação da síndrome febril.", "ok": 0}, {"t": "Resultado negativo nas fezes exclui infecção gastrointestinal oportunista", "c": "Os painéis não pesquisam todos os agentes nem substituem avaliação de doença tecidual.", "ok": 0}, {"t": "A cronologia da imunossupressão e da profilaxia modifica a probabilidade de infecção oportunista", "c": "A história do transplante orienta hipóteses, sem funcionar como diagnóstico isolado.", "ok": 1}, {"t": "Endoscopia com biópsias pode distinguir lesão medicamentosa de doença infecciosa tecidual", "c": "É útil na persistência do quadro após a investigação inicial.", "ok": 1}], "escolhas": 2, "fundo": "", "tr": "Discussão", "nota": "", "segue": ""}, {"t": "pagina", "k": "virologia", "kicker": "Resultado virológico", "tt": "", "corpo": "<p>A quantificação plasmática de CMV é de 18.600 UI/mL. O exame demonstra replicação viral, mas não localiza sozinho a doença. Helena continua com sete evacuações diárias e baixa ingestão.<\/p><p>A equipe discute endoscopia com biópsias das áreas alteradas. A questão é se há lesão intestinal atribuível ao vírus, a medicamento ou a outro processo.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p3", "kicker": "Pergunta 3", "enunciado": "O que o resultado plasmático permite afirmar?", "alts": [{"t": "Há evidência de replicação; a relação com a lesão intestinal precisa de correlação e, quando viável, tecido", "c": "DNAemia e doença invasiva não são sinônimos. A biópsia pode demonstrar envolvimento tecidual.", "ok": 1}, {"t": "O valor estabelece sozinho colite invasiva e sua extensão", "c": "O sangue não mostra diretamente a localização nem a extensão da lesão.", "ok": 0}, {"t": "A presença de DNA viral exclui toxicidade pelo micofenolato", "c": "Mecanismos podem coexistir no transplantado.", "ok": 0}, {"t": "Uma segunda quantificação negativa excluiria qualquer doença gastrointestinal pelo vírus", "c": "Doença localizada pode ocorrer sem DNAemia detectável, dependendo do contexto.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "Discussão", "nota": "", "segue": ""}, {"t": "bifurcacao", "k": "b1", "kicker": "Decisão clínica", "tt": "Conduta", "enunciado": "A paciente mantém febre, diarreia importante e dificuldade para tomar medicamentos. Qual conduta você adota?", "caminhos": [{"r": "Tratar a suspeita de doença por CMV e obter biópsias, coordenando ajustes com o transplante", "vai": "endoscopia", "c": "A gravidade e a absorção duvidosa favorecem terapia intravenosa inicial; tecido esclarece a doença intestinal.", "rc": ""}, {"r": "Reduzir apenas o micofenolato e observar, atribuindo a diarreia à medicação", "vai": "atraso", "c": "A toxicidade é plausível, mas não explica com segurança a combinação de febre, citopenias e DNAemia.", "rc": ""}, {"r": "Intensificar corticoide por suspeita de rejeição do enxerto", "vai": "imunossupressao", "c": "Sem demonstrar rejeição, aumentar imunossupressão pode agravar uma infecção ativa.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "atraso", "kicker": "Quatro dias depois", "tt": "", "corpo": "<p>A diarreia não diminui. Helena passa a apresentar sangue nas fezes e a creatinina sobe para 2,3 mg/dL. O hemograma mantém citopenias.<\/p><p>A equipe revê a hipótese, indica tratamento antiviral e endoscopia. O atraso trouxe desidratação e maior comprometimento nutricional neste percurso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "endoscopia", "conforme": null, "rota": null}, {"t": "pagina", "k": "imunossupressao", "kicker": "Após a intensificação", "tt": "", "corpo": "<p>A febre aumenta e a paciente desenvolve dor abdominal mais intensa, com sinais de irritação peritoneal. Tomografia urgente demonstra perfuração intestinal. A equipe inicia abordagem cirúrgica, suporte e tratamento anti-infeccioso.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "f3", "conforme": null, "rota": null}, {"t": "pagina", "k": "endoscopia", "kicker": "Endoscopia e biópsias", "tt": "", "corpo": "<p>A colonoscopia mostra úlceras em segmentos do cólon. As amostras revelam inflamação, células aumentadas com inclusões virais e imunohistoquímica positiva para CMV. O conjunto confirma doença gastrointestinal invasiva por CMV.<\/p><p>A aparência endoscópica isolada não seria suficiente para identificar o agente. O diagnóstico se apoia na relação entre clínica e demonstração do vírus no tecido.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "tratamento", "kicker": "Tratamento inicial", "tt": "", "corpo": "<p>É iniciado ganciclovir intravenoso, com dose calculada pela função renal e revista à medida que a hidratação melhora a depuração. A equipe acompanha hemograma, creatinina, tolerância e quantificação viral seriada.<\/p><p>A revisão da imunossupressão é coordenada com o transplante. Não se suspendem todos os fármacos indiscriminadamente. A transição para valganciclovir oral depende de melhora clínica e absorção confiável.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pergunta", "k": "p4", "kicker": "Pergunta 4", "enunciado": "Após uma semana, a diarreia melhora e a carga viral diminui. Os neutrófilos caem para 700/mm³. Qual resposta é mais apropriada?", "alts": [{"t": "Reduzir automaticamente o antiviral abaixo da dose ajustada à função renal", "c": "Subdose pode comprometer eficácia; leucopenia exige revisão dos demais fármacos e medidas de suporte.", "ok": 0}, {"t": "Suspender definitivamente o tratamento porque a diarreia melhorou", "c": "A melhora clínica é importante, mas o término também depende da resposta virológica e da duração adequada.", "ok": 0}, {"t": "Rever medicamentos mielotóxicos, função renal e suporte hematológico com a equipe", "c": "Busca controlar a citopenia sem deixar a infecção inadequadamente tratada.", "ok": 1}, {"t": "Concluir resistência viral pela neutropenia", "c": "Neutropenia não é critério de resistência e pode refletir doença ou medicamentos.", "ok": 0}], "escolhas": 1, "fundo": "", "tr": "Discussão", "nota": "", "segue": ""}, {"t": "pagina", "k": "evolucao2", "kicker": "Segunda semana", "tt": "", "corpo": "<p>Após ajustes coordenados e suporte, neutrófilos sobem para 1.400/mm³. Helena está afebril, volta a se alimentar e evacua duas vezes ao dia. Creatinina é 1,3 mg/dL. O tratamento passa à via oral com dose ajustada.<\/p><p>A carga viral ainda é detectável, embora em queda. Não é correto encerrar o tratamento apenas por ter alcançado uma data fixa ou desaparecido a diarreia.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "bifurcacao", "k": "b2", "kicker": "Decisão clínica", "tt": "Conduta", "enunciado": "Como definir o término do tratamento?", "caminhos": [{"r": "Integrar resolução clínica e resposta virológica, respeitando o mínimo terapêutico e o método do laboratório", "vai": "resposta", "c": "O consenso recomenda pelo menos duas semanas e continuidade até resposta clínica e supressão virológica adequada.", "rc": ""}, {"r": "Parar imediatamente porque já não há febre nem diarreia relevante", "vai": "recaida", "c": "Sintomas podem melhorar antes do controle virológico suficiente; a decisão isolada aumenta risco de recaída.", "rc": ""}], "fundo": "", "nota": ""}, {"t": "pagina", "k": "resposta", "kicker": "Seguimento", "tt": "", "corpo": "<p>Com acompanhamento semanal, a quantificação cai abaixo do limiar utilizado pela equipe e a paciente permanece sem sintomas. O tratamento é encerrado após avaliação clínica e virológica.<\/p><p>É combinado um plano de vigilância após o término. Profilaxia secundária não é automática: a equipe considera risco individual, intensidade da imunossupressão e capacidade de monitorização.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "f1", "conforme": null, "rota": null}, {"t": "desfecho", "k": "f1", "kicker": "Desfecho", "tt": "Retorno ao ambulatório", "corpo": "<p>Helena mantém boa função do enxerto, alimentação adequada e recuperação do hemograma. Segue em acompanhamento próximo após o episódio.<\/p>", "q": "melhor", "porque": "Tratamento eficaz precisou conciliar absorção, função renal, toxicidade hematológica e resposta virológica.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "recaida", "kicker": "Duas semanas depois", "tt": "", "corpo": "<p>A paciente volta com diarreia e febre. A carga viral aumentou. A equipe revê adesão, dose, absorção e imunossupressão antes de atribuir o problema a resistência antiviral.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "f2", "conforme": null, "rota": null}, {"t": "desfecho", "k": "f2", "kicker": "Desfecho", "tt": "Reinternação", "corpo": "<p>O tratamento é retomado e a investigação reavaliada. A paciente recupera o controle da infecção após nova internação neste cenário.<\/p>", "q": "medio", "porque": "Encerrar precocemente produziu uma recaída simulada; não prova resistência nem obriga troca automática de antiviral.", "fundo": "", "fecho": "retrospectiva"}, {"t": "desfecho", "k": "f3", "kicker": "Desfecho", "tt": "Complicação grave", "corpo": "<p>Apesar da cirurgia e do suporte intensivo, Helena apresenta sepse abdominal, perda da função do enxerto e necessidade de diálise. Permanece hospitalizada ao final deste percurso.<\/p>", "q": "pior", "porque": "A evolução é hipotética: intensificar imunossupressão durante infecção não controlada pode agravar a doença. Perfuração é uma complicação possível, não inevitável.", "fundo": "", "fecho": "retrospectiva"}, {"t": "pagina", "k": "retrospectiva", "kicker": "Retrospectiva", "tt": "", "corpo": "<p>Havia mais de um mecanismo: desidratação e nível alto de tacrolimo contribuíram para a creatinina, enquanto a doença intestinal explicava a persistência da síndrome. Corrigir um problema não resolveu o outro.<\/p><p>DNAemia direcionou a investigação; tecido confirmou invasão. A decisão de terminar tratamento exigiu observar a paciente e a evolução virológica.<\/p>", "fundo": "", "lamina": null, "nota": "", "sis": "geral", "so_kicker": 1, "segue": "", "conforme": null, "rota": null}, {"t": "pagina", "k": "referencias", "kicker": "Fontes e limites", "tt": "", "corpo": "<p>Caso e trajetórias ficcionais; não reproduzem um paciente publicado.<\/p><p>Kotton et al. The Fourth International Consensus Guidelines on the Management of Cytomegalovirus in Solid Organ Transplantation. Transplantation, 2025. <a href=\"https://doi.org/10.1097/TP.0000000000005374\" target=\"_blank\" rel=\"noopener\">Abrir referência<\/a><\/p><p>Rad
