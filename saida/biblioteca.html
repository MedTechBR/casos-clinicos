<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casos para conduzir, não para ler</title>
<style>
/* A BIBLIOTECA — a mesma linguagem das apresentações.

   Ela era clara, de papel, pela ideia de "prateleira clara, reprodutor
   escuro". Na prática abrir a biblioteca e abrir um caso pareciam dois
   produtos diferentes, e o corte de luz entre as duas telas era um solavanco.
   Agora a prateleira usa o mesmo chão preto, a mesma serifa, o mesmo filete
   vermelho de marca e a mesma régua de maiúsculas espaçadas do caso.

   A cor forte de cada cartão é a do território dominante daquele caso — a
   mesma que o aluno vai reencontrar lá dentro. */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --preto:#08090b; --carvao:#0f1216; --grafite:#171b21;
  --linha:#414a57; --linha2:#5b6672;
  --gelo:#eef2f6; --nevoa:#a8b2be; --fumaca:#8d97a4; --sombra:#737d8a;
  --marca:#c2455e;
  --fundo1:0 18px 34px rgba(0,0,0,.44);
  --fundo2:0 30px 58px rgba(0,0,0,.55);
  --eixo:clamp(22px,5vw,88px);
  --serifa:"Iowan Old Style",Charter,"Palatino Linotype",Palatino,
           "Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",
         Arial,sans-serif;
}

html{-webkit-text-size-adjust:100%}
body{background:var(--preto);color:var(--gelo);font-family:var(--sans);
  min-height:100%;padding:0 var(--eixo) clamp(40px,7vh,80px)}

/* ───────────────────────── cabeçalho ───────────────────────── */

#topo{max-width:1440px;margin:0 auto;
  padding:clamp(40px,8vh,88px) 0 clamp(26px,4.5vh,44px)}
.chapeu{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.chapeu i{width:26px;height:2px;background:var(--marca);display:block}
.chapeu span{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--nevoa);font-weight:700}
#topo h1{font-family:var(--serifa);font-size:clamp(30px,1.9vw + 2.2vh,54px);
  line-height:1.06;font-weight:600;letter-spacing:-.6px;max-width:18ch}
#topo p{font-family:var(--serifa);font-size:clamp(16px,.4vw + 1.1vh,19px);
  line-height:1.5;color:#c3ccd6;max-width:62ch;margin-top:16px}

/* ───────────────────────── a prateleira ───────────────────────── */

#grade{max-width:1440px;margin:0 auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(304px,1fr));
  gap:clamp(14px,1.6vw,24px);align-items:start}

.cs{display:flex;flex-direction:column;background:rgba(255,255,255,.035);
  border:1px solid var(--linha);overflow:hidden;text-decoration:none;
  color:inherit;position:relative;
  transition:border-color .2s,transform .2s cubic-bezier(.2,.7,.3,1),
             box-shadow .2s}
a.cs:hover{border-color:var(--linha2);transform:translateY(-3px);
  box-shadow:var(--fundo1)}
a.cs:focus-visible{outline:2px solid var(--marca);outline-offset:3px}

/* A ilustração entra escurecida, como o chão de tela do caso: ela é textura
   aqui e vira imagem lá dentro. */
.cs .capa{aspect-ratio:16/10;background:#0b0e12 center/cover no-repeat;
  border-bottom:1px solid var(--linha);position:relative;
  filter:brightness(.72) saturate(.88);transition:filter .25s}
a.cs:hover .capa{filter:brightness(.92) saturate(.96)}
.cs .capa::before{content:"";position:absolute;inset:0;
  background:linear-gradient(transparent 45%,rgba(8,9,11,.85))}
.cs .capa::after{content:"";position:absolute;left:0;right:0;bottom:0;
  height:3px;background:var(--cor)}

.cs .corpo{padding:clamp(15px,1.5vw,20px);display:flex;flex-direction:column;
  flex:1}
.cs .esp{font-size:10px;letter-spacing:1.9px;text-transform:uppercase;
  font-weight:800;color:var(--cor);margin-bottom:9px}
.cs h2{font-family:var(--serifa);font-size:20px;line-height:1.22;
  font-weight:600;letter-spacing:-.2px;color:var(--gelo)}
.cs .sub{font-family:var(--serifa);font-size:15px;line-height:1.42;
  color:#b6c0cb;margin-top:9px;flex:1}
.cs .pe{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:17px;
  padding-top:13px;border-top:1px solid var(--linha)}
.cs .pe span{font-size:12px;color:var(--fumaca);display:flex;
  align-items:center;gap:6px;white-space:nowrap}
.cs .pe b{color:var(--gelo);font-weight:600;font-variant-numeric:tabular-nums}
.cs .pe svg{width:14px;height:14px;flex:0 0 auto;stroke:var(--fumaca);
  stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Em preparo: continua legível e diz por que não abre. Sem `opacity` — ela
   levava o texto a 2:1 de contraste na medição do caso. */
.cs.preparo{background:rgba(255,255,255,.014);cursor:default}
.cs.preparo .capa{background:#0d1014;filter:none}
.cs.preparo .capa::after{background:var(--linha)}
.cs.preparo h2{color:#9aa3ae}
.cs.preparo .esp{color:var(--sombra)}
.cs.preparo .sub{color:#8d97a4}
.faixa{position:absolute;top:13px;left:13px;background:rgba(8,9,11,.82);
  border:1px solid var(--linha);padding:5px 12px;font-size:10px;
  letter-spacing:1.8px;text-transform:uppercase;font-weight:800;
  color:var(--nevoa)}

/* ───────────────────────── rodapé ───────────────────────── */

#rodape{max-width:78ch;margin:clamp(40px,7vh,76px) auto 0;padding-top:26px;
  border-top:1px solid var(--linha);font-size:12.5px;line-height:1.6;
  color:var(--sombra)}
#rodape b{color:var(--nevoa);font-weight:600}

</style>
</head>
